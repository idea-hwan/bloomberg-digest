<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>블룸버그 다이제스트</title>
  <style>
    :root {
      --paper: #f3f0e8;
      --card: #fffcf7;
      --ink: #1c1915;
      --muted: #6f6a62;
      --line: #e4dfd4;
      --up: #b42318;
      --down: #1d4f91;
      --flat: #6f6a62;
      --chip: #efeae0;
      --accent: #1c1915;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      line-height: 1.45;
      overflow-wrap: break-word;
      -webkit-text-size-adjust: 100%;
    }
    button { -webkit-tap-highlight-color: transparent; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 16px;
      max-width: 980px;
      margin: 0 auto;
      padding: 28px 24px 0;
    }
    .mark {
      font-size: 13px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 4px;
    }
    h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin: 0;
    }
    nav {
      display: flex;
      gap: 6px;
    }
    nav button, .cal button, .theme-head, .expand, .fold {
      font: inherit;
      color: inherit;
      background: transparent;
      border: 0;
      cursor: pointer;
    }
    nav button {
      padding: 8px 14px;
      border-radius: 999px;
      color: var(--muted);
    }
    nav button[aria-selected="true"] {
      background: var(--ink);
      color: var(--paper);
    }
    main {
      max-width: 980px;
      margin: 0 auto;
      padding: 20px 24px 64px;
    }
    .dayhead {
      display: flex;
      align-items: stretch;
      gap: 10px;
      margin: 0 0 18px;
    }
    .leadbox, .cal {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
    }
    .leadbox {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 20px 22px;
    }
    .cal {
      width: max-content;
      margin: 0;
      padding: 14px 16px 12px;
    }
    .cal-month {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 13px;
    }
    .cal section + section { margin-top: 16px; }
    .cal-dow, .cal-grid {
      display: grid;
      grid-template-columns: repeat(5, 36px);
      gap: 4px;
    }
    .cal-dow { margin-bottom: 4px; }
    .cal-dow span {
      text-align: center;
      color: var(--muted);
      font-size: 12px;
    }
    .cal-grid button, .cal-grid span {
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 9px;
      font-size: 14px;
      font-weight: 650;
    }
    .cal-grid button.in { background: var(--chip); }
    .cal-grid button[aria-selected="true"] {
      background: var(--ink);
      color: var(--paper);
    }
    .weekhead { flex-direction: column; align-items: stretch; }
    .weekhead .cal { width: min(100%, 420px); }
    .theme-col { width: 100%; }
    .issue-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: baseline;
    }
    .issue-head strong { font-size: 18px; letter-spacing: -0.03em; }
    .board {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 8px;
      margin-top: 14px;
    }
    .board .d {
      color: var(--muted);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }
    .board .line {
      margin: 6px 0 0;
      min-height: 2.7em;
      font-size: 14px;
      line-height: 1.35;
      letter-spacing: -0.03em;
    }
    .board .quote {
      margin: 8px 0 0;
      min-height: 2.4em;
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      line-height: 1.3;
    }
    .board .quote strong { display: block; font-size: 13px; }
    .theme.issue[aria-expanded="true"] .hits { display: none; }
    .theme.issue .expand[aria-expanded="true"] + .hits { display: block; }
    .cal-grid .off { color: #c8c2b6; font-weight: 500; }
    .hook {
      font-size: 32px;
      line-height: 1.25;
      letter-spacing: -0.04em;
      margin: 0;
      font-weight: 750;
    }
    .dek {
      margin: 10px 0 0;
      font-size: 17px;
      line-height: 1.5;
      letter-spacing: -0.02em;
    }
    .markets {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 28px;
    }
    .market {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px 14px 11px;
    }
    .market .name { color: var(--muted); font-size: 12px; }
    .market .value {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      margin-top: 4px;
      font-variant-numeric: tabular-nums;
    }
    .market strong { font-size: 18px; font-weight: 700; }
    .up { color: var(--up); }
    .down { color: var(--down); }
    .flat { color: var(--flat); }
    section { margin-top: 8px; }
    section h2 {
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 650;
      margin: 22px 0 10px;
    }
    ol, .stories { list-style: none; margin: 0; padding: 0; }
    li + li { border-top: 1px solid var(--line); }
    #morning li { display: block; padding: 0; }
    #morning .fold {
      display: grid;
      grid-template-columns: 28px 1fr;
      gap: 10px;
      align-items: baseline;
      width: 100%;
      padding: 11px 0;
      text-align: left;
      font-size: 17px;
      letter-spacing: -0.02em;
    }
    #morning .summary {
      display: none;
      margin: 0 0 14px 38px;
      font-size: 17px;
      line-height: 1.5;
      letter-spacing: -0.02em;
    }
    #morning .fold[aria-expanded="true"] + .summary { display: block; }
    #commentary li { display: block; padding: 0; }
    #commentary .fold {
      display: block;
      width: 100%;
      padding: 11px 0;
      text-align: left;
      font-size: 17px;
      letter-spacing: -0.02em;
    }
    #commentary .summary {
      display: none;
      margin: 0 0 14px;
      font-size: 17px;
      line-height: 1.5;
    }
    #commentary .summary p { margin: 0 0 12px; }
    #commentary .fold[aria-expanded="true"] + .summary { display: block; }
    .stories li.note { display: block; }
    ol li, .stories li {
      display: grid;
      grid-template-columns: 28px 1fr;
      gap: 10px;
      align-items: baseline;
      padding: 11px 0;
      font-size: 17px;
      letter-spacing: -0.02em;
    }
    .num, .series {
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      font-size: 13px;
      padding-top: 4px;
    }
    .empty {
      color: var(--muted);
      padding: 12px 0 4px;
    }
    .theme {
      width: 100%;
      text-align: left;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px 16px;
      margin-bottom: 10px;
    }
    .theme-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: baseline;
      width: 100%;
      padding: 0;
    }
    .theme-head strong { font-size: 18px; letter-spacing: -0.03em; }
    .count { color: var(--muted); font-size: 13px; }
    .expand {
      display: none;
      margin-top: 12px;
      padding: 0;
      color: var(--muted);
      font-size: 13px;
    }
    .hits { display: none; margin: 8px 0 0; padding: 0; list-style: none; }
    .narrative { display: none; margin: 12px 0 0; font-size: 17px; line-height: 1.55; letter-spacing: -0.02em; }
    .narrative p { margin: 0 0 12px; }
    .narrative p:last-child { margin-bottom: 0; }
    .theme[aria-expanded="true"] .narrative,
    .theme[aria-expanded="true"] .expand { display: block; }
    .expand[aria-expanded="true"] + .hits { display: block; }
    .hits li {
      display: grid;
      grid-template-columns: 52px 52px 1fr;
      gap: 8px;
      padding: 8px 0;
      font-size: 15px;
      border-top: 1px solid var(--line);
    }
    .hits li span:first-child,
    .hits li span:last-child { color: var(--muted); }
    .hits li.cited span:first-child,
    .hits li.cited span:last-child { color: var(--ink); font-weight: 650; }
    footer {
      max-width: 980px;
      margin: 0 auto;
      padding: 0 24px 28px;
      color: var(--muted);
      font-size: 12px;
    }
    @media (max-width: 720px) {
      header, main, footer {
        padding-left: max(16px, env(safe-area-inset-left));
        padding-right: max(16px, env(safe-area-inset-right));
      }
      header {
        flex-direction: column;
        align-items: flex-start;
        gap: 14px;
        padding-top: max(18px, env(safe-area-inset-top));
      }
      h1 { font-size: 26px; }
      nav button { min-height: 44px; padding: 8px 16px; }
      main { padding-top: 16px; padding-bottom: 40px; }
      .dayhead { flex-direction: column; }
      .cal { width: 100%; }
      .cal-dow, .cal-grid { grid-template-columns: repeat(5, 1fr); }
      .cal-grid button, .cal-grid span { height: 40px; font-size: 15px; }
      .leadbox { padding: 16px; }
      .hook { font-size: 26px; line-height: 1.32; }
      .dek { font-size: 16px; }
      .markets { grid-template-columns: 1fr 1fr; gap: 8px; }
      .market { padding: 12px; }
      .market .value { display: block; }
      .market .value span { display: block; margin-top: 2px; font-size: 13px; }
      .market strong { font-size: 17px; }
      ol li, .stories li { font-size: 16px; padding: 13px 0; }
      #morning .fold, #morning .summary, #commentary .fold, #commentary .summary, .narrative { font-size: 16px; }
      .expand { min-height: 44px; }
      .board {
        grid-template-columns: repeat(5, 120px);
        overflow-x: auto;
        padding-bottom: 4px;
      }
      .hits li { display: block; padding: 10px 0; }
      .hits li span:nth-child(1),
      .hits li span:nth-child(2) { display: inline; }
      .hits li span:nth-child(2) { margin-left: 8px; }
      .hits li span:last-child { display: block; margin-top: 3px; }
      footer { padding-bottom: calc(24px + env(safe-area-inset-bottom)); }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <p class="mark">Bloomberg digest</p>
      <h1>Day</h1>
    </div>
    <nav>
      <button type="button" id="tab-day" aria-selected="true">Day</button>
      <button type="button" id="tab-themes" aria-selected="false">Weekly</button>
    </nav>
  </header>
  <main>
    <div id="view-day">
      <div class="dayhead">
        <div class="cal" id="dates"></div>
        <article class="leadbox">
          <h2 class="hook" id="hook"></h2>
          <p class="dek" id="dek" hidden></p>
        </article>
      </div>
      <div class="markets" id="markets"></div>
      <section>
        <h2>오늘 아침 5가지</h2>
        <ol id="morning"></ol>
      </section>
      <section id="five-section" hidden>
        <h2>5 things</h2>
        <ol class="brief" id="five"></ol>
      </section>
      <section id="commentary-section" hidden>
        <h2>commentary</h2>
        <ul class="stories" id="commentary"></ul>
      </section>
      <section id="daily-section">
        <h2>Markets Daily</h2>
        <ul class="stories" id="daily"></ul>
      </section>
    </div>
    <div id="view-themes" hidden>
      <div class="dayhead weekhead">
        <div class="cal" id="week-dates"></div>
        <div id="theme-list" class="theme-col"></div>
      </div>
    </div>
  </main>
  <footer>시세와 그날 목록을 보여 줍니다.</footer>
  <script>
    const DATA = {"today": "2026-11-24", "week": "2026-11-20", "dates": ["2026-11-24", "2026-11-23", "2026-11-20", "2026-11-19", "2026-11-18", "2026-11-17", "2026-11-16", "2026-11-13", "2026-11-12", "2026-11-11", "2026-11-10", "2026-11-09", "2026-11-06", "2026-11-05", "2026-11-04", "2026-11-03", "2026-11-02", "2026-10-30", "2026-10-29", "2026-10-28", "2026-10-27", "2026-10-26"], "days": {"2026-11-24": {"date": "2026-11-24", "morning": {"hook": "젠슨황 복귀, 엔비디아 31% 폭등", "line": "엔비디아의 젠슨 황 최고경영자(CEO) 전격 복귀가 시장의 극심한 과매도와 쏠림이 심했던 약세 포지션과 맞물리면서 뉴욕증시 전반에서 폭발적인 가격 재조정이 나타났다.", "markets": [{"name": "S&P 500", "value": "7,237.17", "change": "+4.7%"}, {"name": "Nasdaq 100", "value": "26,746.10", "change": "+6.9%"}, {"name": "US 10Y", "value": "4.94%", "change": "-0.00"}, {"name": "USD/KRW", "value": "₩1,341.42", "change": "+0.1%"}, {"name": "Bloomberg Dollar", "value": "1,246.79", "change": "+0.2%"}, {"name": "Brent", "value": "$89.43", "change": "-3.4%"}], "items": [{"n": 1, "headline": "황 복귀에 직접 나선 트럼프…양당서 비판", "summary": "도널드 트럼프 대통령이 젠슨 황의 복귀 과정에 직접 나선 사실이 드러나면서 정치권의 논란도 커지고 있다. 소식통에 따르면 JD 밴스 부통령까지 동원한 것으로 알려졌다. 트럼프는 엔비디아 이사회와 직·간접적으로 소통해왔으며 황 문제를 놓고 시진핑 중국 국가주석과도 장시간 논의했다고 밝혔다. 최근 증시 하락이 자신의 판단에 일부 영향을 미쳤다고 인정하면서도 장기적인 관점이 더 중요했다고 설명했다. 트럼프는 2025년 재산공개에서 최소 100만달러 상당의 엔비디아 주식을 보유하고 있다고 밝힌 바 있으며, 백악관은 해당 투자가 외부 자문가들에 의해 관리돼 이해상충에 해당하지 않는다는 입장이다."}, {"n": 2, "headline": "젠슨 황 복귀에 AI주 급등…“확실성 돌아왔다”", "summary": "젠슨 황 복귀에 AI 관련주가 급등한 가운데 시장 전문가들은 황의 리더십 복귀가 엔비디아뿐 아니라 AI 투자 테마 전반의 불확실성을 완화할 것으로 평가했다. 잭스투자운용은 황이 딜메이커이자 자본 배분 책임자로 돌아오면서 시장이 우려했던 불확실성이 줄었다고 진단했고, 인테그리티자산운용은 황의 복귀가 엔비디아와 AI 투자 테마, 시장 전반에 “명백한 호재”라며 투자심리가 다시 긍정적으로 돌아설 수 있다고 전망했다. 번스타인도 엔비디아 투자의견을 ‘시장수익률’에서 ‘시장수익률 상회’로 다시 올렸다."}, {"n": 3, "headline": "트럼프 “중국, 보잉 250대 추가 구매 예상”", "summary": "트럼프 미국 대통령은 중국 이 보잉 항공기 250대를 추가 구매할 것으로 예상한다고 밝혔다. 이는 지난 5월 중국이 대형 항공기 200대를 구매할 것이라는 발표에 이은 것으로, 성사될 경우 보잉이 거의 10년 만에 중국 시장에서 대규모 판매를 확대하는 계기가 될 수 있다. 다만 앞선 200대 역시 확정 주문이 아니라 중국 측의 구매 의향에 불과했다고 보잉이 밝힌 만큼, 이번 250대가 실제 확정 주문인지와 대상 기종은 아직 확인되지 않았다."}, {"n": 4, "headline": "WTI 80달러선 하회…이란 외교 기대·공급과잉 전망", "summary": "미국이 당분간 이란에 대해 보다 유화적인 태도를 보일 것이라는 신호가 나오면서 WTI 가 장중 거의 5% 급락해 지난 8월 이후 처음으로 배럴당 80달러선을 하회했다. 트럼프 대통령이 외교에 좀 더 시간을 주는 모습을 보이고 협상 실패시 전쟁 재개 시점을 사실상 내년으로 미루자, 투자자들은 주말 사이 미군의 공격 확대에 대비했던 헤지를 되돌렸다. 최근 호르무즈 해협에서 유조선 공격이 이어졌지만 페르시아만을 통한 원유 수송에는 아직 큰 차질이 없는 것으로 보인다."}, {"n": 5, "headline": "씨티·골드만, 증시 급락 후 美 5년물 선호", "summary": "씨티그룹과 골드만삭스는 지난주 미국 증시 급락과 비슷한 과거 사례를 분석한 결과 미국채 및 금리 파생상품 시장에서 5년물 구간이 상대적으로 강세를 보일 것으로 전망했다. 씨티는 연준의 추가 금리 인상 전망으로 단기물 금리가 상승 압력을 받는 반면 수익률 곡선의 중간 구간은 위험회피 심리에 더 민감하게 반응할 것으로 예상했다. 과거 S&P 500지수가 5% 이상 하락한 뒤에는 5년물이 2년물과 30년물 대비 상대적으로 강세를 보이는 경향이 있었다고 분석했다."}]}, "daily": null}, "2026-11-23": {"date": "2026-11-23", "morning": {"hook": "월가 ‘한계시험’·추가매도 경고", "line": "인공지능(AI) 투자 테마의 지속 가능성을 둘러싸고 수주간 이어져온 불안이 전면적인 투매로 번지면서 뉴욕증시에서 20일 S&P 500과 다우존스 지수 모두 조정 국면에 진입했다.", "markets": [{"name": "S&P 500", "value": "6,910.39", "change": "-3.7%"}, {"name": "Nasdaq 100", "value": "25,028.98", "change": "-5.6%"}, {"name": "US 10Y", "value": "4.94%", "change": "-0.10"}, {"name": "USD/KRW", "value": "₩1,346.41", "change": "+0.9%"}, {"name": "Bloomberg Dollar", "value": "1,243.78", "change": "-0.0%"}, {"name": "Brent", "value": "$92.57", "change": "+0.6%"}], "items": [{"n": 1, "headline": "골드만 증시 추가 매도 경고…패닉지수↑", "summary": "골드만삭스는 최근 증시 매도세가 시스템 기반 투자자들로 확산하면서 자체 ‘ 패닉지수 ’가 10점 만점에 9까지 치솟았다며 향후 일주일 동안 추가 매도 압력이 상당할 수 있다고 경고했다. 상품거래자문업체(CTA) 등 모멘텀 투자자들은 지난 한 달간 주식을 570억달러어치 매도해 미국 주식 순포지션이 190억달러 규모의 숏으로 전환됐다. 골드만 모델은 시장이 보합세를 보이더라도 CTA가 658억달러어치를 추가 매도하고, 하락세가 이어질 경우 그 규모가 최대 806억달러에 이를 수 있다고 추산했다."}, {"n": 2, "headline": "AI 자금조달 홍수에 월가 ‘한계 시험’", "summary": "AI 투자 테마를 둘러싼 불안이 전면적인 위험회피로 번진 가운데, 시장에 쏟아지는 막대한 신규 주식과 채권 물량이 투자자들의 소화 능력을 시험하고 있다. 끈질긴 인플레이션과 연준의 추가 금리 인상 가능성, 신용시장 불안까지 겹치면서 투자자들은 더 낮은 주가나 높은 채권금리를 요구하거나 아예 투자를 보류할 수 있는 상황이다. 본넬슨은 사상 최대 규모의 앤트로픽 IPO 이후 나타난 매도세가 내년에 자금조달을 준비하는 기업들에 경고 신호를 보냈다고 진단했다."}, {"n": 3, "headline": "VIX 40에도 “패닉 아니다”…야데니, 약세장 가능성 일축", "summary": "월가의 ‘공포지수’ 로 불리는 Cboe 변동성지수(VIX)가 20일 장중 40까지 치솟아 2025년 4월 관세 충격 이후 최고 수준을 기록한 가운데, 에드 야데니 는 S&P 500지수의 연말 목표치를 7900에서 7500으로 재차 낮췄다. VIX가 30선을 넘어서면 시장 스트레스가 높아졌다는 신호다. 다만 야데니는 경기침체가 임박했다는 신호가 없는 만큼 약세장으로 이어질 가능성은 낮다며, 7500도 현재 수준에서 8% 넘는 상승 여력이 있다고 전망했다."}, {"n": 4, "headline": "베선트, 연준 과잉긴축 경고…시장 인상베팅 후퇴", "summary": "연준 내부에서 추가 긴축 필요성을 강조하는 목소리가 이어지고 있는 가운데 스콧 베선트 미국 재무장관은 최근 금융여건이 상당히 긴축됐다며 연준이 인플레이션에 대응해 금리를 지나치게 올릴 경우 미국 경제를 위험에 빠뜨리는 정책적 실수를 저지를 수 있다고 경고했다. 앞서 크리스토퍼 월러 연준 이사는 12월 50bp 인상 가능성을 제기했고, 애나 폴슨 필라델피아 연은 총재도 연속 인상을 검토할 수 있다고 밝혔다. 다만 폴슨은 가계와 기업, 은행이 적응할 시간을 가질 수 있도록 “신중한” 속도로 움직이는 것을 선호한다고 말했다."}, {"n": 5, "headline": "USTR “글로벌 과잉생산 조사 연내 마무리”", "summary": "미국 무역대표부(USTR) 가 글로벌 산업 과잉생산에 대한 무역법 301조 조사를 연말까지 마무리할 예정이다. 제이미슨 그리어 USTR 대표는 조사 완료 시점을 묻는 질문에 연내 “확실히” 끝날 것이라고 밝혔지만 추가 관세 부과 가능성이 있는 국가는 구체적으로 언급하지 않았다. 이번 조사 대상에는 한국을 비롯해 중국과 유럽연합(EU), 일본, 멕시코 등 16개 경제권이 포함돼 있으며, 조사 결과는 관세 등 추가 무역조치의 법적 근거가 될 수 있다."}]}, "daily": {"headline": "Stocks bounce", "sections": ["‘Not going to miss it’", "Metals mayhem"], "five": ["US stock futures are surging as Wall Street strategists say the selloff opened up good buying opportunities. Selling in Asia also eased after regulators in Korea, Taiwan and China unveiled steps to stabilize markets.", "CrowdStrike reached a $44 billion deal to buy cybersecurity provider Zscaler in one of the largest-ever acquisitions in the sector. Zscaler shares are up 12%.", "Scott Bessent warned that the Federal Reserve risks jeopardizing the economy by overtightening in response to the latest inflation data.", "Some of crypto’s diehard believers are taking their money elsewhere, and investors have been pulling money from ETFs. Bitcoin has dropped for seven weeks, the longest losing stretch since 2022.", "Donald Trump said he might resume the war on Iran next year if talks fail to yield a diplomatic resolution."], "commentary": [{"heading": "‘Not going to miss it’", "summary": "After the S&P 500 fell into a correction, the talk on the street this morning is whether this is the end of the selloff or not. Morgan Stanley strategist Michael Wilson arguably has the most bullish view, and says the capitulation has served up a rare opportunity , particularly in hyperscalers and industrials. “This is the fat pitch we have patiently been waiting for, and we’re not going to miss it,” Wilson wrote on Monday. “Markets bottom on bad news and deleveraging. We have had a lot of both.”\n\nAnother prominent strategist, Ed Yardeni, cut his S&P 500 target, but is still holding onto a belief that a year-end rally is coming. He sees the index ending 2026 at 7,500 points, down from the 7,900 he projected in September. Still, that represents a recovery of more than 8% from Friday."}, {"heading": "Metals mayhem", "summary": "The metals world is reeling from a series of massive squeezes in copper, aluminum and tin that were followed last week by price crashes. Many traders saw it coming, but were still caught off guard by the magnitude of selling.\n\nWhere does that leave investors?\n\nThe spot supply crunches that sent spreads soaring remain in place, creating the prospect of more volatility to come. Across several key metals, traders are grappling with a confusing reality: the outlook for prices is weakening rapidly, even as some parts of the market are facing extreme supply squeezes.\n\n“This is not just about the physical world, this is about the financial world as well, and what’s happening with rates and the dollar and the stock market,” said Guy Wolf of Marex Group."}]}}, "2026-11-20": {"date": "2026-11-20", "morning": {"hook": "앤트로픽 데뷔, AI투심냉랭·이란", "line": "앤트로픽의 성공적인 증시 데뷔에도 인공지능(AI) 투자 열기가 살아나지 못하면서 뉴욕증시는 장초 상승분을 모두 반납하고 급락했다.", "markets": [{"name": "S&P 500", "value": "7,175.83", "change": "-2.0%"}, {"name": "Nasdaq 100", "value": "26,517.05", "change": "-2.2%"}, {"name": "US 10Y", "value": "5.05%", "change": "-0.02"}, {"name": "USD/KRW", "value": "₩1,335.50", "change": "+0.1%"}, {"name": "Bloomberg Dollar", "value": "1,243.83", "change": "+0.2%"}, {"name": "Brent", "value": "$92.59", "change": "+0.7%"}], "items": [{"n": 1, "headline": "앤트로픽 화려한 데뷔", "summary": "앤트로픽이 19일 나스닥 상장 첫 거래에서 공모가 83달러보다 34% 높은 111.50달러에 출발하며 화려하게 증시에 데뷔했다. 장중에는 115달러까지 오른 뒤 약 17% 상승한 97달러 부근에서 마감했다. 앤트로픽과 공동창업자 7명은 확대된 IPO와 사모 발행을 통해 총 1073억달러를 조달했으며, 이 가운데 IPO 규모만 813억달러로 스페이스X의 750억달러를 넘어 역대 최대 기록을 세웠다. 골드만삭스와 모간스탠리가 이끄는 주관사단은 IPO 공모액의 약 0.68%인 총 5.5억달러의 수수료 를 받게 된다."}, {"n": 2, "headline": "헌터브룩 AMD ‘숏’…중국 리스크 경고", "summary": "AMD 는 헌터브룩캐피털이 숏 포지션을 취했다고 밝히고 헌터브룩미디어가 중국 사업 관련 위험을 제기하면서 주가가 장중 최대 11% 급락했다. 헌터브룩미디어는 AMD의 중국 시장 익스포저와 광범위한 현지 공급망으로 인해 미국이 반도체 수출 규제를 추가로 강화할 경우 타격을 받을 수 있다고 지적했다. 미국 정부의 허가가 필요한 소프트웨어가 사용됐다는 정황도 제기했지만 구체적인 근거는 제시하지 않았다. AMD는 헌터브룩의 주장이 사업 관행과 관계를 왜곡하고 있다며 미국의 수출통제 법률과 규정을 준수하고 있다고 반박했다."}, {"n": 3, "headline": "美, 이란 대규모 공습 가능성↑", "summary": "미국과 이란의 무력 충돌 수위가 높아지면서 미국이 이란을 상대로 또다시 대규모 공습 에 나설 가능성이 최근 며칠 사이 커졌다고 서방 당국자들이 전했다. 도널드 트럼프 대통령은 아직 결정을 내리지 않았지만 추가 공격을 검토 중이며, 베냐민 네타냐후 이스라엘 총리는 미국에 4~7일간의 공동 공습 작전을 추진하자고 압박하고 있는 것으로 전해졌다. 이란은 최근 바레인과 쿠웨이트의 미군 시설을 공격하고 호르무즈 해협을 지나는 선박에 대한 공격을 확대했으며, 미국도 이란 케슘섬을 타격하는 등 평화협상 교착 속에 양측의 충돌이 다시 격화하고 있다."}, {"n": 4, "headline": "미·중·러 ‘역사적 회담’…글로벌 연료 공급 확대", "summary": "도널드 트럼프 미국 대통령과 시진핑 중국 국가주석, 블라디미르 푸틴 러시아 대통령은 19일 중국 선전에서 사상 첫 미·중·러 3자 정상회담 을 갖고 글로벌 석유제품 공급 확대와 유엔 개혁, 핵전쟁 방지 등에 합의했다. 약 1시간30분간 진행된 회담에서 세 정상은 “모든 국가의 이익을 위해 정제 석유제품의 생산과 공급을 확대할 계획”이라며 안정적인 에너지 공급의 중요성을 재확인했다. 국제형사재판소(ICC)의 권한을 제한하는 데도 뜻을 모았다. 시 주석은 이번 회담을 “획기적”이라고 평가했고, 트럼프 대통령은 “우리는 진정 역사를 만들고 있다”고 말했다."}, {"n": 5, "headline": "CE ‘AI조정 땐 원화 강세...내년말 1250원’", "summary": "캐피탈이코노믹스(CE)는 원화가 대부분의 평가 지표에서 여전히 저평가돼 있다며 2027년 말 달러-원 환율이 1250원까지 하락할 것으로 전망했다. AI 관련 수출 급증으로 한국의 경상수지 흑자가 GDP의 20%에 육박했지만, 대규모 해외 포트폴리오 투자와 반도체 기업들의 해외 수익 유보 등이 원화 강세를 제한해왔다는 분석이다. 원화는 올해 중반 이후 반등했지만 실질 무역가중 기준으로는 여전히 약한 수준이라고 진단했다."}]}, "daily": {"headline": "An epic AI selloff", "sections": ["‘Proof of returns’", "Metal mayhem"], "five": ["Stocks are being swept up in a broad market selloff , pushing the MSCI global index to its seventh day of losses, the longest losing streak in three years. Anthropic falls 6.4% in premarket trading after surging 17% yesterday in the biggest-ever IPO.", "A $32 billion debt deal to fund SpaceX’s access to chips carries yields above 8%, a level that reflects concern the spending won’t pay off.", "Copper sank to its lowest level since March on deepening AI worries. Treasuries gained .", "DayOne Data Centers paused its US IPO plans as AI stocks get rocked.", "Lawmakers are closing in on a deal to ban Chinese cars from the US , according to people familiar with the matter."], "commentary": [{"heading": "‘Proof of returns’", "summary": "Any year-end rally will have to wait. Even Anthropic’s blockbuster IPO can’t slow this selloff across AI stocks .\n\nYesterday, the Nasdaq 100 Index surged 2.3% in early trading, pulled along by the Anthropic enthusiasm , only to turn around and close 2.2% lower.\n\nThe gloom spread around the world:\n\nChip stocks slumped in Asia, pushing Taiwan’s Taiex down 6.2% to cap its biggest weekly drop since 1991 . South Korea’s benchmark racked up an 8% weekly decline. In Japan, the Nikkei 225 tumbled to its April level.\n\nEmerging-market stocks are heading for a bear market because of the AI selloff, concern about rising global interest rates and trade tensions.\n\nIn Europe, the Stoxx 600 has dropped five days in a row for a decline of 4.7% on the week."}, {"heading": "Metal mayhem", "summary": "The AI selloff is wreaking havoc in metals markets after a week of turmoil fueled by deepening worries about global demand.\n\nCopper prices on the London Metal Exchange tumbled as much as 4% to put the metal on track for one of its worst weeks in the past decade. The sharp selloff has numerous drivers, the most pressing of which is growing doubt about the sustainability of AI spending and copper’s role in the sector.\n\nThe red metal had soared to a record high near $15,000 a ton in September as bullish investors bet on a demand boost from data centers and other AI infrastructure. Now, prices are threatening to tip below $12,000."}]}}, "2026-11-19": {"date": "2026-11-19", "morning": {"hook": "미중러 회담, 앤트로픽 83달러", "line": "도널드 트럼프 미국 대통령과 블라디미르 푸틴 러시아 대통령이 19일 중국 선전에서 1년여 만에 별도 대면 회담을 갖는다.", "markets": [{"name": "S&P 500", "value": "7,323.63", "change": "-0.2%"}, {"name": "Nasdaq 100", "value": "27,116.26", "change": "+0.4%"}, {"name": "US 10Y", "value": "5.07%", "change": "-0.04"}, {"name": "USD/KRW", "value": "₩1,333.61", "change": "-0.1%"}, {"name": "Bloomberg Dollar", "value": "1,240.85", "change": "+0.4%"}, {"name": "Brent", "value": "$91.65", "change": "-1.6%"}], "items": [{"n": 1, "headline": "연준 거의 모두 ‘추가 인상’…월러는 50bp", "summary": "연준 내에서 추가 금리 인상 필요성에 대한 공감대가 확산되고 있다. 18일 공개된 10월 FOMC 의사록 에 따르면 거의 모든 참석자는 인플레이션을 적시에 2% 목표로 되돌리기 위해 향후 수개월 동안 추가 금리 인상이 적절할 가능성이 높다고 판단했다. 특히 참석자 2명은 향후 인플레이션 지표가 좋지 않을 경우 12월에 25bp를 넘는 인상이 필요할 수 있다고 봤다. 크리스토퍼 월러 연준 이사는 한발 더 나아가 최근 3개월간 물가 상승률이 연율 약 3.5%에 달한다며 12월 50bp 인상 을 검토해야 한다고 주장했다."}, {"n": 2, "headline": "ECB, 헤지펀드·AI 위험 경고", "summary": "유럽중앙은행 (ECB)은 글로벌 헤지펀드의 영향력이 커지면서 유럽 국채시장이 갑작스러운 가격 재조정에 더욱 취약해지고 있다고 경고했다. 헤지펀드가 국채 물량을 흡수하고 유동성을 높이는 데 기여하지만 시장이 급변할 경우 포지션을 빠르게 청산하면서 가격 변동성을 증폭시키고 국채금리를 급등시킬 수 있다는 설명이다. 보리스 부이치치 ECB 부총재는 유럽 헤지펀드 시장이 5개 대형 업체에 집중돼 있다며, 실제 스프레드가 빠르게 확대됐을 때 헤지펀드의 활동이 이를 부추긴 사례가 있었다고 지적했다."}, {"n": 3, "headline": "고금리에 신용시장 ‘공포’ 확산", "summary": "고금리 장기화로 신용시장 전반의 가격 재조정이 이어지면서 취약 차주를 중심으로 옥석 가리기가 본격화될 것이라는 경고가 나왔다. 크리스 크리샨탄 데이비슨 켐프너 파트너는 “시장에 실질적인 공포 요인이 생겼다”고 진단했고, 폴러스캐피털매니지먼트는 시장이 빠르게 돌변하면서 한때 각광받던 기업도 지표 몇 개만으로 투자심리가 급격히 악화할 수 있다며 현재가 “‘이렇게 될 줄 알았잖아’라는 단계의 초입”이라고 평가했다. 실제 코어위브의 정크등급 채권 금리는 지난달 15%를 넘어섰고, CDS에는 향후 5년 안에 디폴트할 확률이 50%를 웃돈다는 전망이 반영됐다."}, {"n": 4, "headline": "美 “연쇄 기술장애, 이란 사이버공격과 무관”", "summary": "최근 미 국가안보국(NSA)과 상업은행 등에서 잇따라 발생한 기술 장애 와 미 연방항공청(FAA)의 항공기 운항 중단은 이란의 사이버공격과 무관하다고 미 당국이 밝혔다. 제이 클레이턴 미 국가정보국장은 의회 청문회에서 최근 일련의 사태가 유지보수와 기술적 변경에 따른 개별적인 서비스 장애라며 “조직적이거나 국가가 배후에 있는 공격이 아니다”라고 밝혔다. 크리스토퍼 라이아 미 연방수사국(FBI) 부국장도 사이버 대응팀이 조사 초기부터 참여했지만 악의적인 사이버 활동이 최근 장애를 일으켰다는 증거는 전혀 발견되지 않았다고 말했다."}, {"n": 5, "headline": "씨티, 韓 내년 성장률 전망 4.1%로 대폭 상향", "summary": "씨티는 메모리 반도체 업사이클 장기화와 IT 제조업의 성장 기여 확대를 반영해 한국의 2027년 실질 GDP 성장률 전망치를 기존 3.3%에서 4.1%로 대폭 상향했다. 2026년과 2028년 전망도 각각 3.9%, 3.4%로 높였다. 반도체를 포함한 IT 제조업 부가가치가 명목 GDP에서 차지하는 비중은 2025년 9%에서 2026년 25%, 2027년 31%까지 확대될 것으로 예상했다. 반도체 수출은 2026년 203% 급증한 데 이어 2027년에도 38% 늘어 실질 GDP 성장률을 2.9%p 끌어올릴 것으로 추산했다."}]}, "daily": {"headline": "Anthropic pops", "sections": ["The case for a year-end rally", "Political risk hits the euro"], "five": ["Anthropic shares are indicated to rise 20% or more at the open after its $107.3 billion IPO and private placement broke SpaceX’s record.", "US stock futures rallied as investors bet that Anthropic’s blockbuster debut will rekindle enthusiasm for artificial intelligence.", "Nvidia’s recruiting firm approached Arm Holdings CEO Rene Haas as part of its hunt for a new leader , stepping up efforts to move on from longtime boss Jensen Huang.", "Donald Trump, Vladimir Putin and Xi Jinping agreed to boost energy supply as part of an unprecedented trilateral meeting in Shenzhen. Their discussion also spanned issues from Ukraine to denuclearization.", "Nearly all Fed policymakers agreed in October they would likely have to raise interest rates in the months ahead to return inflation to the 2% target."], "commentary": [{"heading": "The case for a year-end rally", "summary": "Anthropic’s IPO is giving a glimmer of hope to equity bulls that the painful tech stock selloff might be over. “The strong demand for the IPO is a welcome reminder that the AI theme is well and truly still alive,” said Jai Malhi at Vanda Research. “Now that we have seen the positioning de-rating in tech, this provides a compelling opportunity for dip buyers.”"}, {"heading": "Political risk hits the euro", "summary": "The euro’s tumble to an 18-month low against the dollar shows few signs of easing, as expectations mount that next year’s election in a politically divided and fiscally stressed France will weigh further on the currency .\n\nMorgan Stanley and Commerzbank predict the euro will slip to $1.08 next year, and speculative bets on a weaker currency are at the highest in more than six years. Political unrest in France, and concerns about its ability to pass a budget, pushed the euro below $1.10 this week, bringing declines since late August to 6%.\n\nTraders have shunned the euro due to worries that the two frontrunners in the election — far-right leader Marine Le Pen and hard-left Jean-Luc Mélenchon — would worsen France’s fiscal outlook. The country’s budget woes are also raising questions about how far the ECB can raise rates."}]}}, "2026-11-18": {"date": "2026-11-18", "morning": {"hook": "美연쇄기술장애, ‘AI 도취감 끝’", "line": "최근 마이크로소프트와 미 연방항공청(FAA), JP모간체이스 등에서 잇따라 대규모 기술 장애가 발생한 가운데 미 국가안보국(NSA)이 내부 통신에 쓰는 최고 기밀 네트워크가 17일 다운됐다.", "markets": [{"name": "S&P 500", "value": "7,340.53", "change": "-1.0%"}, {"name": "Nasdaq 100", "value": "27,001.79", "change": "-0.7%"}, {"name": "US 10Y", "value": "5.11%", "change": "-0.02"}, {"name": "USD/KRW", "value": "₩1,335.28", "change": "+0.0%"}, {"name": "Bloomberg Dollar", "value": "1,235.64", "change": "-0.1%"}, {"name": "Brent", "value": "$93.06", "change": "+0.7%"}], "items": [{"n": 1, "headline": "BofA “AI 도취감 끝났다”", "summary": "뱅크오브아메리카(BofA)의 11월 펀드매니저 설문 에서 기술주 비중확대 응답이 순 12%로 10월 37%에서 급락해 2006년 이후 최대폭으로 줄었다. 기업들이 AI에 과잉 투자하고 있다는 응답도 순 38%로 사상 최고치를 기록했고, 52%는 향후 6개월 내 AI 하이퍼스케일러가 자본지출 축소를 발표할 것으로 예상했다. 마이클 하트넷 BofA 전략가는 “호황과 AI를 둘러싼 도취감은 끝났다”고 진단했다."}, {"n": 2, "headline": "무살렘 ‘수차례 인상’...윌리엄스 ‘큰폭 인상 불필요’", "summary": "알베르토 무살렘 세인트루이스 연은 총재는 인플레이션을 통제하기 위해 2027년 봄까지 여러 차례 금리 인상이 필요할 가능성이 높다고 밝혔다. 그는 물가를 감안한 실질 정책금리가 내년 봄까지 약 1%p 추가 상승할 필요가 있다며, 추가 긴축이 없다면 향후 18개월 동안 인플레이션이 연준의 2% 목표를 상당폭 웃돌 것으로 전망했다. 인플레이션 하락 자체가 실질금리를 끌어올릴 수 있지만, 무살렘은 정책당국이 여기에만 의존할 수는 없다며 실제 금리 인상이 “대부분의 역할을 해야 할 수도 있다”고 경고했다."}, {"n": 3, "headline": "BofA ‘美 2년물 5%...50bp 인상 배제 못해’", "summary": "BofA는 미국 금리가 경제 활동을 억제한다는 신호가 나타날 때까지 단기 금리 상승세가 이어질 것으로 전망했다. 마크 카바나 BofA 미국 금리전략 책임자는 미국채 2년물 금리가 연말까지 5%에 이를 것으로 내다보면서, 단기 금리 상승이 장기물을 비롯한 모든 만기의 금리를 끌어올리고 글로벌 금리에도 상승 압력을 가할 수 있다고 진단했다. 인플레이션과 고용이 여전히 강한 데다 신용 스프레드와 대출 증가세에서도 뚜렷한 긴축 신호가 나타나지 않아 현재 금리가 경제를 실질적으로 제약하지 못하고 있다는 설명이다."}, {"n": 4, "headline": "美, 이란 케슘섬 공격…이란, 민간시설 보복 위협", "summary": "미국과 이란 이 종전 협상에서 돌파구를 찾지 못한 채 제한적인 공격을 주고받으며 긴장이 다시 높아지고 있다. 이란은 17일 최근 일주일도 안 돼 세 번째로 바레인을 공격해 셰이크 이사 기지의 레이더 시스템을 드론으로 겨냥했으며, 미 중부사령부는 인명이나 장비 피해는 없었다고 밝혔다. 이어 이란 메흐르통신은 미국이 페르시아만의 이란 케슘섬 여러 곳을 공격했다고 보도했다. 이란 측은 인명이나 주요 기반시설 피해는 없었다고 밝혔으며 미국은 해당 보도를 즉각 확인하지 않았다."}, {"n": 5, "headline": "AI 에이전트, 미국채 거래 첫 협상", "summary": "뱅크오브뉴욕멜론(BNY)과 마이크로소프트(MS)가 각사의 인공지능(AI) 에이전트를 이용해 미국채 거래 가격을 협상하는 업계 최초의 시험 거래를 실시했다. AI 에이전트들이 사전에 정해진 조건과 범위 안에서 가격을 놓고 서로 흥정해 합의에 도달한 뒤 사람이 최종적으로 거래를 승인하는 방식이다. 전자거래나 컴퓨터 간 정보 교환은 이미 미국채 시장에서 널리 활용되고 있지만, AI가 스스로 판단해 양측이 수용할 수 있는 절충점을 찾아냈다는 점에서 차이가 있다. BNY는 이번 거래가 AI가 알고리즘 거래를 넘어 그동안 인간의 영역으로 여겨졌던 고객과의 거래 조건 협상까지 수행할 수 있음을 보여준 사례라고 평가했다."}]}, "daily": {"headline": "Anthropic bets", "sections": ["Bullish on Anthropic", "The Bank of Nvidia"], "five": ["Anthropic is set to price its record-breaking IPO today , with trading to start tomorrow. See below for more.", "Nvidia shares are climbing in premarket trading after the chip giant boosted its sales forecast for next year and dismissed speculation that ousted CEO Jensen Huang might return.", "A four-day selloff in technology stocks came to a halt after Nvidia’s strong outlook helped soothe investors’ fears over the durability of the AI trade.", "Tencent’s sales and earnings missed estimates as aggressive spending on AI by China’s most valuable company weighs on growth.", "US warplanes hit an Iranian missile launch site on a Persian Gulf island as the two sides intensified tit-for-tat attacks in the ongoing war."], "commentary": [{"heading": "Bullish on Anthropic", "summary": "A four-day losing streak for tech stocks? Apparently not a problem for the Anthropic IPO.\n\nYes, crypto futures tied to the AI lab’s stock market debut have fallen alongside AI stocks, but they still imply a blockbuster valuation of about $1.7 trillion . That’s well above the $1.4 trillion the company would be worth at the top of its proposed IPO price range.\n\nThe perpetual futures contracts give investors an early read on speculative appetite, though those willing to place the bets aren’t necessarily the ones who will buy the shares.\n\nSpaceX’s debut in June showed the limits of that signal. Its shares opened at $150, above the $135 offer price but well below the roughly $176 indicated by crypto futures.\n\nAnthropic’s trading debut tomorrow will give investors another chance to see how close the crypto market comes to the opening price."}, {"heading": "The Bank of Nvidia", "summary": "Nvidia, in the post-Jensen Huang era, is addressing one big criticism from skeptics of the AI rally. Investors seem to be reassured.\n\nUnder the now-ousted CEO, Nvidia provided multibillion-dollar investments and financial backstops for AI startups, computing providers and model developers. Those same companies were big buyers of Nvidia’s AI chips.\n\nTo skeptics, that was unhealthy “circular financing” that was artificially inflating the AI boom and sowing the seeds for its collapse.\n\nIn a strategy shift, interim CEO Colette Kress yesterday used the terms “disciplined” and “rigorous” to describe the greater level of scrutiny Nvidia will apply to future investments across the AI supply chain.\n\nThose comments, along with Nvidia’s strong outlook, hit all the right notes for bulls: AI demand is humming along, but Nvidia is reassuring the market it will avoid financial excesses."}]}}, "2026-11-17": {"date": "2026-11-17", "morning": {"hook": "美 AI칩 규제, 연준 빅스텝론", "line": "뉴욕증시는 엔비디아 실적과 앤트로픽 기업공개(IPO)를 앞두고 기술주 중심으로 낙폭을 확대했다.", "markets": [{"name": "S&P 500", "value": "7,416.59", "change": "-1.9%"}, {"name": "Nasdaq 100", "value": "27,197.15", "change": "-2.7%"}, {"name": "US 10Y", "value": "5.13%", "change": "-0.00"}, {"name": "USD/KRW", "value": "₩1,336.05", "change": "-0.1%"}, {"name": "Bloomberg Dollar", "value": "1,237.35", "change": "+0.1%"}, {"name": "Brent", "value": "$91.88", "change": "-4.1%"}], "items": [{"n": 1, "headline": "美, AI칩 원격접속 규제", "summary": "미국 상무부가 중국 기업의 첨단 AI 칩 우회 사용을 차단하기 위해 싱가포르와 말레이시아, 태국, 인도네시아, 브라질의 데이터센터 사업자에 대한 규제를 강화했다. 이들 사업자가 엔비디아 등 미국 업체의 첨단 AI 칩을 구매하려면 미 정부의 허가를 받아야 하며, 허가는 사안별로 심사된다. 제3국 데이터센터의 컴퓨팅 자원에 원격 접속하는 방식으로 기존 수출통제를 우회하는 것을 막기 위한 조치다."}, {"n": 2, "headline": "트럼프, 젠슨 황 복귀론 지지…러트닉도 재신임", "summary": "트럼프 대통령 이 젠슨 황의 엔비디아 CEO 복귀론에 힘을 실었다. 그는 황의 복귀가 “나쁜 생각은 아니다”라며 중국 스파이로 의심받는 앨리스 황과의 관계가 미국의 국가안보를 위협했다는 우려도 일축했다. 이는 엔비디아의 “대대적인 쇄신”과 외부 인사를 대상으로 한 새 경영진 물색을 촉구한 스콧 베선트 재무장관과 배치되는 입장이다. 황은 측근들과 복귀 가능성을 논의한 것으로 전해졌으며, 일부 투자자와 일론 머스크도 그의 복귀를 지지하고 있다. 엔비디아 이사회는 황의 CEO 복귀를 검토하지 않고 있다고 CNBC가 보도했다."}, {"n": 3, "headline": "연준 해맥 “물가 악화시 빅스텝 가능”", "summary": "베스 해맥 클리블랜드 연은 총재는 점진적이고 꾸준한 금리 인상을 선호하지만 인플레이션 압력이 악화할 경우 더 빠르고 큰 폭의 인상이 필요할 수 있다고 밝혔다. 특히 기업과 소비자들이 물가가 더 오를 것이라는 전제 아래 의사결정을 내리는 조짐이 뚜렷해지고 있다며, 이런 인플레이션 심리가 고착될 경우 연준이 대응에 뒤처졌다는 의미일 수 있고 그 결과 인상 폭을 키우고 최종금리도 더 높여야 할 수 있다고 경고했다. 금리 선물시장은 12월 인상에 이어 내년 1월 추가 인상 가능성을 반영하고 있다."}, {"n": 4, "headline": "아시아 반도체 흑자는 美 증시로", "summary": "도이치뱅크는 세계 반도체 교역액이 현대사에서 처음으로 원유·가스 교역액을 넘어선 가운데, 중국을 제외한 아시아의 반도체 흑자가 달러의 글로벌 역할을 뒷받침하는 새로운 자금 흐름으로 부상했다고 진단했다. 과거 산유국의 원유 판매대금이 미 국채로 환류됐던 ‘페트로달러’와 달리 이른바 ‘칩달러’는 미국 주식과 회사채로 흘러가고 있다. 외국인의 연간 미국 주식 순매입액은 1조달러를 넘어섰으며 증가분의 대부분이 아시아에서 나왔다."}, {"n": 5, "headline": "블랙록, 증시 조정에 주식 비중 확대", "summary": "세계 최대 자산운용사 블랙록 이 최근 증시 매도세를 매수 기회로 보고 총 3000억달러 규모의 모델 포트폴리오에서 전체 주식 비중확대 폭을 기존 1%에서 3%로 높였다. 견조한 경제와 기업 이익이 주가를 계속 뒷받침할 것으로 판단해 미국과 해외 시장의 대형주 비중을 늘리는 한편, AI에 대한 투자 확신은 유지하면서 소수 종목에 집중됐던 익스포저를 보다 폭넓게 분산하고 있다."}]}, "daily": {"headline": "Nvidia’s earnings day", "sections": ["Nvidia weighs on stocks"], "five": ["Tech stocks fell further before Nvidia’s earnings , with the stakes extending beyond the chipmaker to the broader AI trade.", "JPMorgan Chase said it fixed a technical issue that caused customer transactions to take longer to process yesterday, while United Airlines resolved a widespread system outage affecting departing flights.", "Deutsche Bank shares dropped on a Financial Times report that the lender processed $582 million of suspicious payments linked to the late sex offender Jeffrey Epstein.", "Spain’s Pablo Hernandez de Cos is on track to win the European Central Bank presidency after a pivotal political deal in Berlin.", "Donald Trump is meeting the leaders of India, Australia, and Japan today, an opportunity to reassure key partners before Trump’s meetings with Xi Jinping this week."], "commentary": [{"heading": "Nvidia weighs on stocks", "summary": "Nvidia’s earnings arrive after the close today at perhaps the strangest time possible for the world’s most important AI chipmaker.\n\nInvestors already were questioning the durability of the AI boom. Then the Democrats swept to victory in the US midterm elections this month, raising the prospect of tighter regulation for the tech industry.\n\nThe scandal that led to the ouster of CEO Jensen Huang last week just added to the global upheaval in the stock market’s hottest sector. Nvidia shares have plunged 35% from their Oct. 6 record high, wiping out $2 trillion in value. A survey by Bank of America shows fund managers last week cut their allocations to tech stocks by the most in two decades ."}]}}, "2026-11-16": {"date": "2026-11-16", "morning": {"hook": "젠슨 황 복귀론, 우크라 빅딜", "line": "인공지능(AI) 시대 아이콘으로 군림해온 젠슨 황의 퇴진 이후 불확실성이 커진 가운데 시장은 엔비디아가 17일 실적 발표에서 투자자들의 우려를 진정시킬 수 있을지 주목하고 있다.", "markets": [{"name": "S&P 500", "value": "7,561.67", "change": "-0.4%"}, {"name": "Nasdaq 100", "value": "27,943.74", "change": "-1.2%"}, {"name": "US 10Y", "value": "5.14%", "change": "+0.01"}, {"name": "USD/KRW", "value": "₩1,336.82", "change": "+0.1%"}, {"name": "Bloomberg Dollar", "value": "1,235.92", "change": "+0.1%"}, {"name": "Brent", "value": "$95.84", "change": "+0.0%"}], "items": [{"n": 1, "headline": "엔비디아 쇄신론 vs 황 복귀론", "summary": "스콧 베선트 미국 재무장관은 엔비디아 경영진의 “대대적 쇄신”을 요구하며 차기 CEO를 외부에서 영입해야 한다고 주장했다. 엔비디아가 첨단 AI 반도체의 대중국 판매를 도왔다는 의혹과 관련해 베선트는 중국으로 반도체를 우회 공급하는 페이퍼컴퍼니들 관련 경고 신호를 의도적으로 무시했는지 규명해야 한다며 향후 10일 안에 이사회와 외부 법률 자문단의 답변을 요구했다. 미국의 수출통제 프로그램을 총괄하는 하워드 러트닉 미 상무장관에 대한 책임론도 커지고 있다."}, {"n": 2, "headline": "美, 우크라에 ‘돈바스-나토’ 빅딜 제안", "summary": "미국이 우크라이나 의 북대서양조약기구(NATO·나토) 가입과 돈바스 양보를 연계하는 방안을 처음으로 거론하면서 종전 협상이 새로운 국면을 맞고 있다. 볼로디미르 젤렌스키 우크라이나 대통령은 미국 특사들이 나토 가입을 대가로 돈바스 지역을 러시아에 넘길 의향이 있는지를 물었다고 밝혔다. 미국이 제시한 패키지에는 나토와 유럽연합(EU)의 구체적인 안보 보장과 함께 충분한 병력·무기·재정 지원을 통한 강력한 우크라이나군 유지, 자금원이 명확한 재건 계획 등이 포함돼 있다."}, {"n": 3, "headline": "연준 ‘추가 인상 필요’…속도 놓고 온도차", "summary": "연준 인사들이 인플레이션을 억제하기 위한 추가 금리 인상 필요성을 잇달아 강조했다. 수잔 콜린스 보스턴 연은 총재는 13일 물가 압력이 에너지를 넘어 광범위해지고 있다며 “조만간 추가 긴축이 적절하다”고 밝혔다. 다만 12월 50bp 인상이나 연속 인상 가능성에 대해서는 “얼마나 높이, 얼마나 빠르게 갈지 앞서 나가고 싶지 않다”며 구체적인 속도에는 신중한 입장을 보였다. 메리 데일리 샌프란시스코 연은 총재도 현 금리가 경제를 충분히 제약하고 있다고 말하기 어렵다며 추가 인상이 필요할 가능성이 높다고 밝혔다."}, {"n": 4, "headline": "골드만 “S&P500 1년내 14% 상승”", "summary": "골드만삭스는 최근 대형 기술주 매도세로 밸류에이션이 역사적으로 낮은 수준까지 떨어졌다며 2027년 미국 증시 에 대해 낙관적인 전망을 제시했다. 향후 12개월 S&P 500 목표치를 8700으로 제시해 현 수준에서 14% 상승할 것으로 내다봤다. 특히 최근 나스닥 100 지수가 10월 초 고점에서 9% 하락하면서 하이퍼스케일러의 밸류에이션이 과거 수준을 크게 밑돌고 있다며 기술주, 특히 하이퍼스케일러가 상대적으로 방어적이라고 평가했다."}, {"n": 5, "headline": "앤트로픽 IPO서 中·홍콩 기관투자자 청약 배제", "summary": "미·중 인공지능(AI) 경쟁이 격화하는 가운데 중국 본토와 홍콩의 기관투자자들이 앤트로픽 의 기업공개(IPO) 청약에서 배제된 것으로 알려졌다. 여러 은행이 이들의 주문 접수를 거부하거나 주식 배정 가능성이 낮은 것으로 보고 있으며, 방산 제품 거래를 통제하는 미국 국제무기거래규정(ITAR)이 일부 영향을 미친 것으로 전해졌다. 일부 중국 투자자들은 영국령 버진아일랜드(BVI) 신탁이나 특수목적회사(SPV), 스왑 등을 활용한 우회 참여 방안을 모색하고 있다."}]}, "daily": {"headline": "Anthropic’s big week", "sections": ["Anthropic takes center stage"], "five": ["Treasury Secretary Scott Bessent urged Nvidia to make a “dramatic” leadership shakeup even as ousted CEO Jensen Huang reportedly has been discussing a return to the company.", "The tech selloff carried into the new week as Nvidia fallout continues and Anthropic nears its high-stakes market debut.", "US airlines are scrambling to resurrect their networks after the longest nationwide shutdown in more than two decades upended travel .", "China’s growth weakened across the board in October , in a sign Beijing’s latest stimulus measures have yet to feed through to the economy.", "US retail diesel prices dropped below $6 a gallon for the first time since early September, taking some pressure off a key inflationary input."], "commentary": [{"heading": "Anthropic takes center stage", "summary": "The moment of truth arrives this week for Anthropic’s IPO, which could be the biggest first-time share sale ever. Bankers expect to set a price for the stock on Wednesday, with trading to begin Thursday.\n\nTo investors, the offering is about much more than one company — it’s reassurance that the entire AI trade will endure , albeit with a new leader in the form of Dario Amodei, now that Jensen Huang is out at Nvidia .\n\n“It’s extremely important because they might be the best indicator for the health of the AI ecosystem,” said Angelo Zino at research firm CFRA. “What they have to say about monetizing AI, I think that becomes now equally, if not more important, than Nvidia with Jensen no longer there.”\n\nEnthusiasm for the deal is palpable: The IPO has drawn orders for close to seven times the shares available, according to people familiar with the matter."}]}}, "2026-11-13": {"date": "2026-11-13", "morning": {"hook": "젠슨황 퇴진파장·이란종전기대↓", "line": "엔비디아의 리더십 위기가 월가의 위험자산 선호를 위축시킨 가운데 국제유가 상승으로 미국채 금리가 오르면서 뉴욕증시도 하락했다.", "markets": [{"name": "S&P 500", "value": "7,592.40", "change": "-0.4%"}, {"name": "Nasdaq 100", "value": "28,289.19", "change": "-0.3%"}, {"name": "US 10Y", "value": "5.13%", "change": "+0.14"}, {"name": "USD/KRW", "value": "₩1,335.54", "change": "-0.1%"}, {"name": "Bloomberg Dollar", "value": "1,234.47", "change": "+0.2%"}, {"name": "Brent", "value": "$95.83", "change": "+3.3%"}], "items": [{"n": 1, "headline": "젠슨 황 시대 끝난 엔비디아…AI 생태계도 흔들", "summary": "엔비디아 는 콜레트 크레스 CFO를 임시 CEO로 선임하고, 하비 존스 이사를 사상 첫 이사회 의장으로 임명했다. 젠슨 황은 앞으로 엔비디아에서 어떠한 역할도 맡지 않는다. 충격은 코어위브 등 네오클라우드와 반도체·AI 인프라 관련주까지 번진 반면 경쟁사인 AMD와 브로드컴은 상승했다. 트럼프 대통령은 황의 후임으로 팀 쿡 애플 CEO를 공개 추천했고, 중국의 엔비디아 첨단 AI 칩 확보를 막기 위한 미 상무부의 대응이 미온적이었다는 논란에도 하워드 러트닉 상무장관에 대한 전폭적인 신임을 재확인했다. 로이터는 황이 또 다른 엔비디아 직원과도 친밀한 관계를 맺었다고 보도했다."}, {"n": 2, "headline": "젠슨 황 빠진 엔비디아…불확실성은 이제 시작", "summary": "젠슨 황이 CEO에서 해임된 엔비디아를 두고 월가에서는 불확실성이 이제 시작됐다는 경고와 펀더멘털은 여전히 견조하다는 평가가 엇갈리고 있다. 번스타인은 후임 CEO가 그의 빈자리를 메울 수 있을지 상당한 불확실성이 있다며 엔비디아 투자의견을 ‘시장수익률’로 낮추고 목표주가를 200달러로 하향했다. 스톤엑스는 황이 적어도 2028년까지 실적에 영향을 주지 않을 만큼 회사를 탄탄하게 구축했지만 그 이후 성장에 대한 신뢰는 흔들렸다며 투자의견을 ‘보유’로 낮췄다. 베어드도 추가 경영진 이탈과 소송·벌금, 매출 조정 가능성 등을 거론하며 회사가 “아직 위기에서 벗어나지 못했고” 주가도 바닥에 도달하지 않았다고 진단했다."}, {"n": 3, "headline": "트럼프 “이란과 합의 필요없어”…종전 기대 약화에 유가 상승", "summary": "트럼프 대통령은 12일 트루스소셜에 “우리는 이란 과 합의할 필요가 없다. 그런 시절은 이미 오래전에 지나갔다”며 “우리는 그들의 돈 수천억달러를 확보했고, 그들의 해협도 장악하고 있다”고 밝혔다. 시장에서는 협상 중단이 원유 공급 증가 속에 유가 하락으로 이어질 가능성과 이란의 확전 위험을 높여 유가를 밀어올릴 가능성이 엇갈리고 있다. 그동안 중동산 원유 공급이 회복된 데다 미국 중간선거에서 민주당이 승리하면서 전쟁 종식이 앞당겨질 수 있다는 관측에 힘입어 브렌트유는 이달 큰 폭으로 하락했었다."}, {"n": 4, "headline": "트럼프, 멕시코에 관세 두 배 위협", "summary": "트럼프 대통령이 미국으로 향하려는 이민자 행렬을 멕시코 가 막지 않을 경우 멕시코산 제품에 대한 관세를 즉각 두 배로 올리겠다고 위협했다. 트럼프는 멕시코가 언제까지 조치를 취해야 하는지 밝히지 않았으며, 연방대법원이 올해 초 대통령의 관세 권한을 제한한 이후 어떤 법적 근거로 관세를 두 배로 올릴지도 불분명하다. 발언 이후 멕시코 페소는 하락해 장중 저점을 낮췄다."}, {"n": 5, "headline": "연준 인사들 인플레 경고…AI 수요 과열 주시", "summary": "연준 인사들 이 인공지능(AI) 투자에 따른 수요 과열과 인플레이션 위험에 잇따라 경고했다. 베스 해맥 클리블랜드 연은 총재는 물가를 2% 목표로 되돌리려면 금리를 더 높은 제약적 수준으로 가져갈 필요가 있다며, 최근 인플레이션이 오히려 목표에서 멀어지고 있다고 지적했다. 다만 큰 폭의 인상보다는 작은 폭으로 더 자주 금리를 올리는 방식을 선호한다고 밝혔다. 메리 데일리 샌프란시스코 연은 총재는 관세와 유가를 넘어 광범위한 물가 압력이 지속되고 있다며 인플레이션 억제를 위해 추가 금리 인상이 필요할 가능성이 높다고 밝혔다."}]}, "daily": {"headline": "Bond haven no more", "sections": ["‘Wild rates volatility’", "Nvidia fallout"], "five": ["Anthropic’s IPO has drawn orders for about six times the number of shares available , people familiar with the matter said.", "Microsoft is struggling to restore access to its flagship software and end an outage that’s affecting government offices, traders and businesses .", "US stocks struggled for direction before inflation data that caps a dramatic week in which traders ramped up bets on Fed rate hikes and Jensen Huang was ousted from Nvidia.", "SpaceX and Tesla are progressing in their merger negotiations and could announce what would be the biggest-ever deal as soon as December, people familiar with the matter said.", "Global oil markets will swing to a supply surplus for the first time since the start of the Iran war, the International Energy Agency said."], "commentary": [{"heading": "‘Wild rates volatility’", "summary": "Just when global bond investors were starting to believe the worst of this year’s selloff was over, surging Treasury yields are making them think again .\n\nStubborn inflation and hawkish rhetoric from Fed policymakers have traders bracing for more aggressive interest-rate hikes, while growing debt supply adds to the upward pressure on yields. The selloff persisted even as turmoil around Nvidia rattled stocks and risk sentiment, undercutting hopes that Treasuries had reclaimed their traditional haven role.\n\n“This is a tougher environment than during the Covid pandemic and the global financial crisis,” said Kellie Wood, a bond investor at Schroders who is short Treasuries. “Those were big directional moves — today it’s about rolling supply shocks and wild rates volatility. We still have to be on alert for higher yields all the way till year end.”"}, {"heading": "Nvidia fallout", "summary": "Nvidia shares are rising 2.4% in premarket trading as shockwaves from Jensen Huang’s fall reverberate around the market and the chip industry. The latest:\n\nLeo KoGuan, a billionaire investor, said he won’t increase his stake in the tech company with someone else at the helm.\n\nOrdinary investors bought aggressively after the CEO was ousted. The first 30 minutes of trading on Thursday was the biggest-ever retail opening for Nvidia, according to Vanda Research.\n\nHuang’s ouster prompted a chorus of venture capitalists and startup founders to criticize the chipmaker’s decision and express concerns about the broader impact on the industry.\n\nA Chinese company founded by Alice Huang, the woman at the center of the controversy, procured smuggled AI chips that were installed at a Shanghai data center, documents reviewed by Bloomberg News show."}]}}, "2026-11-12": {"date": "2026-11-12", "morning": {"hook": "앤트로픽 흥행, 달러강세 경계", "line": "강세장을 이끌어온 인공지능(AI) 테마가 더 이어질 여지가 있다는 기대에 대형 기술주 중심으로 뉴욕증시가 11일 상승했다.", "markets": [{"name": "S&P 500", "value": "7,619.38", "change": "+1.3%"}, {"name": "Nasdaq 100", "value": "28,374.25", "change": "+2.3%"}, {"name": "US 10Y", "value": "4.99%", "change": "+0.00"}, {"name": "USD/KRW", "value": "₩1,337.20", "change": "-0.5%"}, {"name": "Bloomberg Dollar", "value": "1,232.36", "change": "+0.4%"}, {"name": "Brent", "value": "$92.51", "change": "+1.1%"}], "items": [{"n": 1, "headline": "원화 급등 뒤 반전 경계", "summary": "최근 원화가 가파르게 강세를 보인 가운데 옵션시장에서는 원화 강세의 되돌림, 즉 달러-원 환율 반등에 대비한 수요가 빠르게 늘고 있다고 블룸버그 인텔리전스(BI)가 진단했다. 한국 원화와 브라질 헤알, 중국 위안 등 6개 신흥시장 통화에 연계된 달러 콜옵션의 명목가치는 지난해 말 이후 증가했으며, 한국과 브라질, 멕시코는 8년 만의 최고 수준을 기록했다. 특히 행사가격이 달러당 1300~1400원인 콜옵션의 명목가치는 지난해 12월 이후 세 배 넘게 늘어 현재 달러-원 상방 헤지 익스포저의 약 44%를 차지한다."}, {"n": 2, "headline": "엔비디아 강세론 균열…베어드 하향", "summary": "젠슨 황 CEO를 둘러싼 불확실성으로 월가의 엔비디아 강세론에 균열이 나타나기 시작했다. 베어드는 엔비디아 투자의견을 ‘중립’으로 낮추고 목표주가를 500달러에서 200달러로 대폭 하향했다. 미 정부의 조치와 조사 결과, 단기 매출 영향, 황 CEO의 재임 여부 등을 둘러싼 불확실성이 해소될 때까지 신중한 입장을 취하겠다고 밝혔다. 모간스탠리도 엔비디아를 ‘톱픽’에서 제외했다. 긍정적인 시각은 유지하면서도 황 CEO의 리더십이 회사의 전략적 방향에 매우 중요한 만큼 단기 불확실성이 이어질 것으로 전망했다."}, {"n": 3, "headline": "AI 신용팽창 경고음", "summary": "식스스트리트파트너스가 AI 투자 열풍에서 투기적 행태와 시장 균열의 징후가 나타나고 있다며 관련 투자에 대체로 거리를 두고 있다고 밝혔다. 앨런 왁스먼 CEO는 전례 없는 AI 자본지출과 급격한 신용 팽창 속에 은행들이 건설 대출을 매각하는 등 이상 징후가 나타나고 있다고 지적했다. 특히 AI 프로젝트에 저비용 자금을 공급해온 보험사들이 단일 차입자에 대한 대출 한도에 도달하면서 개발업체들이 연기금이나 국부펀드 등에서 더 비싼 자금을 조달해야 할 수 있다고 경고했다. 데이터센터 완공 지연으로 약 2000억달러어치의 반도체가 창고에 쌓여 있다는 점도 위험 요인으로 꼽았다."}, {"n": 4, "headline": "AI 대출 급증에 보험 활용론", "summary": "AI·데이터센터 대출이 급증하면서 은행들의 위험을 보험으로 분산하려는 움직임이 확산하고 있다. 세계 최대 보험중개업체 마시앤드맥레넌은 신용위험보험 에 가입한 대출에 대해 은행이 쌓아야 하는 규제 자본을 줄여달라고 미국 당국에 요구하고 있다. AI 관련 금융의 위험을 헤지하려는 수요가 폭발적으로 늘고 있지만, 미국에서는 보험에 가입해도 규제 자본 부담을 덜 수 없어 은행들이 다른 수단에 주로 의존해왔다. 마시는 데이터센터 관련 거래를 포함한 프로젝트 파이낸싱의 신용위험보험을 활발히 주선하고 있다."}, {"n": 5, "headline": "사우디 원유생산 26% 급증…이란전쟁 이후 최고", "summary": "사우디아라비아 의 지난달 원유 생산량이 26% 급증해 하루 1056만배럴로 이란전쟁 발발 직전인 2월 이후 최고 수준을 기록했다. 전쟁이 계속되고 이란의 유조선 공격이 이어지는 가운데서도 사우디를 비롯한 페르시아만 산유국들이 원유 수송을 빠르게 정상화하면서 공급이 늘고 있다. 이라크도 생산량을 전쟁 이후 최고인 하루 약 490만배럴로 늘렸다. 소비가 여전히 제한된 상황에서 공급 회복이 실물 원유 가격을 끌어내리고 공급 과잉 신호도 나타나면서 브렌트유는 이달 들어 약 21% 급락해 배럴당 93달러 부근으로 내려왔다."}]}, "daily": {"headline": "Nvidia in crisis", "sections": ["From unthinkable to inevitable?", "Turning less bullish"], "five": ["Nvidia shares are down almost 6% in premarket trading . The board is deciding whether to oust Jensen Huang after a report of a second affair.", "The global tech rally has come to a halt because of the leadership crisis at Nvidia. A rotation into consumer-linked shares lifted European equities.", "The UK economy grew at its fastest pace in two and a half years after the rollout of AI fueled spending by businesses.", "Siemens raised its revenue-growth target thanks to record orders. The German industrial giant is benefiting from data center construction.", "US envoys Steve Witkoff and Jared Kushner arrived in Russia for talks with Vladimir Putin , pushing for a peace deal to end the war in Ukraine."], "commentary": [{"heading": "From unthinkable to inevitable?", "summary": "Nvidia and the fate of Jensen Huang is all that matters in markets this morning , and for good reason: A big chunk of the AI trade that has propelled equity markets over the past four years depends on the company’s chips.\n\nHuang is the company’s co-founder, and under his watch the stock has returned a staggering 38% a year since its 1999 IPO. Gains have been even more stunning since OpenAI kicked off the AI boom in 2022 with ChatGPT.\n\n“He is not only the face of AI but arguably the architect of the AI infrastructure,” said Joe Gilbert of Integrity Asset Management. “It will be difficult if not impossible to replicate Jensen’s vision.”\n\nThe stock — already down almost 30% from its early-October peak — is sinking again in premarket trading. If that holds, we’re looking at a wipeout of more than $241 billion that sends Nvidia’s market value below $4 trillion.\n\nThe latest developments:"}, {"heading": "Turning less bullish", "summary": "When a stock has returned 760,000%, as Nvidia has since its IPO, analysts will do whatever they can to stay bullish on it. At the end of last week, 79 of 82 analysts tracked by Bloomberg had buys on Nvidia.\n\nBut cracks were emerging in Wall Street’s overwhelmingly bullish consensus, even before the New York Times reported yesterday that Huang had a second extramarital affair, this time with a subordinate.\n\nAnalysts at Bernstein and Oppenheimer have cut their ratings this week, while Morgan Stanley removed the stock as a top pick. Baird cut its price target to $200 from $500. Dan Ives at Yorkville Ives put the estimated fair value of Nvidia without Huang at $225, versus $300 per share if he stays as CEO."}]}}, "2026-11-11": {"date": "2026-11-11", "morning": {"hook": "연준 50bp인상? 앤트로픽 승부수", "line": "크리스토퍼 월러 연준 이사가 12월 50bp 금리 인상 가능성을 제기한 직후 미국의 10월 소비자물가(CPI)가 예상보다 뜨겁게 나오면서 연준의 ‘빅스텝’ 논쟁에 불이 붙었다.", "markets": [{"name": "S&P 500", "value": "7,520.93", "change": "-0.4%"}, {"name": "Nasdaq 100", "value": "27,740.79", "change": "-0.6%"}, {"name": "US 10Y", "value": "4.99%", "change": "+0.11"}, {"name": "USD/KRW", "value": "₩1,343.05", "change": "-0.0%"}, {"name": "Bloomberg Dollar", "value": "1,227.44", "change": "+0.5%"}, {"name": "Brent", "value": "$92.10", "change": "-0.5%"}], "items": [{"n": 1, "headline": "앤트로픽 IPO 승부수", "summary": "앤트로픽 이 기업공개(IPO)를 통해 약 1.4조달러의 기업가치를 인정받는 데 도전한다. 클로드 챗봇 개발사인 앤트로픽과 공동창업자들은 IPO와 사모 발행을 통해 최대 904억달러를 조달할 계획으로, 희망 공모가는 주당 70~78달러다. 공모가 상단 기준 시가총액은 약 1조달러, 스톡옵션 등을 포함한 완전희석 기준 기업가치는 약 1.4조달러다. 사모 발행을 포함한 IPO 규모는 스페이스X의 750억달러를 넘어 역대 최대 기록을 세울 전망이며, 초과배정옵션까지 포함하면 전체 조달액은 약 1000억달러에 이를 것으로 블룸버그는 추산했다. 딜 개시와 함께 공모 물량 전체에 대한 투자자 주문도 확보됐다."}, {"n": 2, "headline": "연준 빅스텝론 부상", "summary": "월러 연준 이사 는 CPI 지표 발표에 앞서 근원 CPI가 0.3% 이상 오를 경우 연준이 50bp의 더 큰 폭 인상을 단행해야 할 수도 있다고 밝혔다. 월러의 발언은 연준 당국자 가운데 12월 금리인상 필요성을 가장 강하게 주장한 것으로, 시장이 예상해온 25bp를 넘어 50bp 인상 가능성까지 열어뒀다. 그는 이 같은 상황에서 25bp 인상에 그칠 경우 연준의 인플레이션 대응 의지에 대한 신뢰가 훼손될 수 있다며, 지난해 단행했던 세 차례의 ‘보험성 인하’를 최소한 되돌릴 필요가 있다고 강조했다. 보우먼 이사 역시 끈질긴 인플레이션을 지적하며 다음달 금리 인상을 지지할 생각임을 시사했다."}, {"n": 3, "headline": "예상 웃돈 美근원 CPI", "summary": "미국의 10월 근원 소비자물가지수(CPI) 가 전월 대비 0.3% 상승해 예상을 웃돌고 헤드라인 CPI도 0.4% 올랐다. 블룸버그 집계 자료에 따르면 근원 CPI는 최근 3개월 연율 기준 3.7%, 6개월 기준 2.7% 상승해 물가 압력이 여전히 높은 것으로 나타났다. 식료품 가격은 0.4% 올라 4월 이후 가장 큰 폭으로 상승했고, 주택소유자의 등가임대료(OER)는 0.3%, 전기요금은 0.9%, 휘발유 가격은 1% 올랐다. 에너지와 임대료를 제외한 서비스 물가는 0.4% 올랐고, 가구와 가전제품, 장난감 등 관세 영향을 크게 받는 품목에서도 상당한 가격 상승이 나타났다."}, {"n": 4, "headline": "미국채 10년물 다시 5%", "summary": "미국채 는 지난달 초 이후 인공지능(AI) 붐의 지속 가능성에 대한 우려로 기술주가 하락하고, 미·이란 전쟁 종식 기대에 국제유가가 떨어지면서 강한 랠리를 펼쳐왔다. 지난주 중간선거에서 민주당이 압승하면서 주가가 급락하자 채권 랠리에는 더욱 힘이 실렸다. 그러나 10일에는 이 같은 재료들이 모두 밀려나고 시장의 관심이 인플레이션 압력으로 다시 쏠렸다. 주택담보대출 등 각종 대출금리의 기준이 되는 미국채 10년물 금리는 장중 5% 위로 올라섰다. 이날 실시된 420억달러 규모의 10년물 국채 입찰에서도 수요가 기대에 못 미치면서 낙찰금리는 5.020%로 결정됐다. 이번에 발행되는 10년물의 쿠폰금리는 5%로 2006년 이후 가장 높다."}, {"n": 5, "headline": "이란전쟁 종식 기대에 브렌트유 한때 90달러 아래로", "summary": "이란전쟁 종식 기대가 커지면서 브렌트유 가 한때 배럴당 90달러 아래로 떨어졌다. 브렌트유는 전일 거의 6% 하락한 데 이어 10일 장중 최대 3.7% 급락했다. 중간선거에서 공화당이 패배한 뒤 전쟁 종식 압박을 받고 있는 트럼프 대통령은 이란에 대한 추가 공격이 필요하지 않을 것이라고 밝혔고, 미·이란 협상을 중재하는 카타르 총리와 만난 뒤에는 “군사적으로 이란은 사실상 끝났다”고 말했다. 의회를 장악한 민주당은 다가오는 정부 셧다운 시한을 활용해 트럼프 대통령에게 전쟁의 출구전략을 마련하도록 압박하는 방안을 검토하고 있다."}]}, "daily": {"headline": "Getting ready for Anthropic", "sections": ["Getting ready for Anthropic", "Sticky inflation"], "five": ["Investors are shifting back into the AI trade , lifting US stock futures. The cash Treasury market is closed for Veterans Day.", "CoreWeave eased fears about its debt-laden data center business by reporting strong sales growth. Shares are up 11% in premarket trading.", "Anthropic’s bankers are weighing plans to increase the company’s IPO valuation to $1.5 trillion or more, the Financial Times reports .", "OpenAI revenue hit $10 billion in the third quarter. That’s up nearly 50% from the prior quarter and almost threefold higher than a year ago.", "Global equity hedge funds cut risk at the steepest rate in more than a decade through the first week of November, according to Morgan Stanley."], "commentary": [{"heading": "Getting ready for Anthropic", "summary": "Investors have spend the past few weeks worrying about AI. The prospect of tough regulation and moratoriums on new data centers with Democrats in charge of Congress, plus concerns over circular financing deals and billions in new debt have put a big dent in stock prices as of late. And now, here comes the Anthropic IPO . The Claude chatbot maker and its co-founders are looking to raise as much as $90.4 billion in the IPO and a private placement, at a market value of $1.4 trillion. The valuation could be hiked further, according to the FT.\n\nThe growing frenzy reflects the transformative power that many believe AI will have on a wide range of professional activity. The IPO is likely to be the biggest listing of all time, when the private placement is factored in."}, {"heading": "Sticky inflation", "summary": "Traders who joined the rush into bonds just got smacked .\n\nFresh evidence of sticky inflation and hawkish comments from Fed officials combined on Tuesday to increase the odds of rate hikes. That sent Treasuries into a tailspin. Two-year US yields soared by the most in 19 months and briefly pushed 10-year yields back over 5%.\n\nThe price data was bad enough that investors see a December rate hike as a done deal. Fed Governor Christopher Waller, speaking in London before the CPI report, warned that officials may need to raise interest rates by a half percentage point next month if there’s no progress on inflation.\n\nIt’s a reminder to investors to keep a close eye on the Fed. — Edward Bolingbroke and Paul Dobson"}]}}, "2026-11-10": {"date": "2026-11-10", "morning": {"hook": "엔비디아 파장, 유가 수개월최저", "line": "젠슨 황 최고경영자(CEO)의 외도 인정과 외도 상대를 둘러싼 중국 스파이 의혹으로 위기에 휘말린 엔비디아의 주가가 장중 최대 8.8% 급락했다.", "markets": [{"name": "S&P 500", "value": "7,549.94", "change": "+2.3%"}, {"name": "Nasdaq 100", "value": "27,907.63", "change": "+3.4%"}, {"name": "US 10Y", "value": "4.88%", "change": "+0.02"}, {"name": "USD/KRW", "value": "₩1,341.33", "change": "-0.1%"}, {"name": "Bloomberg Dollar", "value": "1,221.47", "change": "-0.5%"}, {"name": "Brent", "value": "$92.26", "change": "-6.2%"}], "items": [{"n": 1, "headline": "트럼프, 이란 확전 가능성 낮춰…유가 급락", "summary": "도널드 트럼프 미국 대통령이 이란에 대한 대규모 공격 가능성이 “매우 낮다”고 밝히면서 종전 협상 기대가 커져 국제유가가 급락했다. 브렌트유는 장중 8% 가까이 떨어져 배럴당 90.56달러로 8월말 이후 최저 수준을 기록했고, WTI도 한때 6% 넘게 하락했다. 중간선거에서 공화당이 참패한 뒤 트럼프가 외교적 해결에 나설 것이라는 기대가 커진 가운데 그는 다만 이란이 “매우 강력한 합의”에 서명하는 것을 전제로 내걸었다. 마코 루비오 미 국무장관은 이란의 요구가 일부 “터무니없고 비현실적”이라며 돌파구가 임박했다는 관측에는 선을 그었다."}, {"n": 2, "headline": "연준 바킨 추가 인상 시사…굴스비 “AI발 과열”", "summary": "톰 바킨 리치먼드 연은 총재는 견조한 수요와 끈질긴 인플레이션을 감안하면 금리를 추가로 올려야 한다는 입장을 시사했다. 그는 기업 이익과 소비가 여전히 강하다며 “통화정책이 나아갈 방향은 비교적 명확하다”고 밝혔지만, 수요 전망의 불확실성을 감안해 긴축 속도에는 신중할 필요가 있다고 강조했다. 그는 연말까지 소비지출이 견조한 흐름을 유지할 것으로 전망하면서도, 소비 강세가 얼마나 오래 지속될지는 여전히 의문이라고 말했다."}, {"n": 3, "headline": "월가, 기록적 기술주 투매에도 AI 강세론 고수", "summary": "지난주 헤지펀드들이 사상 최대 수준에 가까운 속도로 기술주를 팔아치우고 모멘텀 포지션 청산이 약 40년 만에 최대 규모를 기록했지만, 월가에서는 AI 붐 이 끝났다는 진단은 드물다. 골드만삭스에 따르면 글로벌 기술주에 대한 헤지펀드 매도는 2016년 집계 이후 최고 수준에 근접했으며, JP모간은 대규모 디레버리징 이후 투자자들의 항복 징후가 나타나면서 비관론이 정점에 가까워졌을 가능성을 제기했다. 미국 기업의 이익 전망이 여전히 견조한 데다 이번 급락이 펀더멘털 악화보다는 포지션 청산 성격이 강하다는 판단이 AI 중기 강세론을 뒷받침하고 있다."}, {"n": 4, "headline": "구글, AI칩 라인업 확대…엔비디아 추격 가속", "summary": "구글 이 인공지능(AI) 반도체 제품군을 확대하며 엔비디아 추격에 속도를 내고 있다. 구글은 자체 설계 반도체인 텐서처리장치(TPU)의 새로운 버전인 8tx와 8i Max를 선보인다. 8tx는 정부기관과 규제 산업 등 보안과 기밀성이 중요한 고객을 겨냥했으며, 8i Max는 신약 개발과 코딩 등 한 번의 요청에서 방대한 정보를 참조해야 하는 AI 애플리케이션에 특화됐다. 구글의 알파벳 주가는 장중 한때 4% 올랐다."}, {"n": 5, "headline": "앤트로픽, IPO 앞두고 새 AI 모델 공개", "summary": "앤트로픽 이 이르면 이달 기업공개(IPO)를 앞두고 AI 모델 ‘페이블’과 ‘미토스’의 새 버전을 공개하며 오픈AI 등과의 경쟁에 대응하고 있다. 페이블 5.2는 보다 복잡한 소프트웨어 엔지니어링과 로봇 제어, 장기 프로젝트를 수행하고 한 번에 1천개 이상의 AI 에이전트를 조율할 수 있도록 설계됐다. 미토스 5.2는 사이버보안과 생명과학 분야의 안전장치를 줄인 버전으로 검증된 일부 기관에 제공된다. 두 모델 모두 이전 버전보다 속도가 빨라졌으며 페이블은 가격도 낮췄다."}]}, "daily": {"headline": "Oil is driving stocks and bonds", "sections": ["Oil and bond yields", "The anti-AI trade"], "five": ["Brent crude slumped below $90 a barrel for the first time since August as traders boosted bets on a resolution to the Middle East war.", "Fed Governor Christopher Waller said he supports an interest-rate hike in December , and warned he would back a half-point increase if inflation continues to accelerate.", "A powerful rebound in US stocks ran out of steam after Waller’s comments, which come just hours before Tuesday’s inflation data.", "Anthropic is set to kick off the marketing of its blockbuster IPO as early as today. A snafu over the filing documents added a dose of drama.", "SoftBank reported its first loss in almost two years after a $3.7 billion writedown over its US data-center projects."], "commentary": [{"heading": "Oil and bond yields", "summary": "While investors have been riveted by AI stocks and the Nvidia spy drama , a couple of momentous market moves have been taking place almost below the radar.\n\nBrent crude oil, which stood near $118 as recently as Oct. 30, has dropped below $90 . That, in turn, has helped drive US Treasury bond yields lower. The 10-year has fallen to 4.89% from a 24-year high around 5.36% a month ago.\n\nToday’s consumer price report in the US could add to the optimism: Economists expect it to show that the pace of inflation moderated last month. A surprisingly weak reading, coupled with the pullback in oil, might encourage traders to pare their predictions for Fed tightening."}, {"heading": "The anti-AI trade", "summary": "Stock pickers in emerging markets have faced a daunting challenge the past couple of years — the MSCI index many of them are judged against is dominated by a handful of big AI stocks.\n\nAvoid shares of Taiwan Semiconductor, Samsung and SK Hynix, and you’re guaranteed to underperform the benchmark.\n\nBut now that those stocks are slumping, fund managers are sifting through the rest of the market, and they like what they see : Stocks selling at rock-bottom valuations with high dividend yields, in markets that by one metric are the cheapest since the global financial crisis 18 years ago.\n\nInvestors highlight South American utilities, Chinese and Taiwanese consumer-goods manufacturers, and eastern and central European financial firms as compelling alternatives to AI-exposed stocks."}]}}, "2026-11-09": {"date": "2026-11-09", "morning": {"hook": "앤트로픽 IPO, 美고용서프라이즈", "line": "AI 관련주 투매로 급락했던 뉴욕증시는 6일 반도체주를 중심으로 반등했지만, 시장에서는 이를 투자심리의 뚜렷한 전환보다는 숏커버링과 저가 매수에 따른 반등으로 보는 시각이 우세했다.", "markets": [{"name": "S&P 500", "value": "7,376.86", "change": "+0.3%"}, {"name": "Nasdaq 100", "value": "26,989.99", "change": "+1.4%"}, {"name": "US 10Y", "value": "4.86%", "change": "+0.02"}, {"name": "USD/KRW", "value": "₩1,365.29", "change": "+0.5%"}, {"name": "Bloomberg Dollar", "value": "1,227.53", "change": "+0.4%"}, {"name": "Brent", "value": "$98.32", "change": "+0.0%"}], "items": [{"n": 1, "headline": "美 10월 고용 서프라이즈", "summary": "미국의 10월 비농업 부문 고용 이 16만5000명 증가해 모든 시장 전망치를 웃돌고 실업률도 4.1%로 소폭 하락했다. 앞선 두 달의 고용 증가폭도 상향 조정됐으며 전문직·비즈니스 서비스와 보건의료, 제조업 등 광범위한 업종에서 일자리가 늘었다. TD증권은 고용이 전반적으로 강했다며 연준이 인플레이션 억제에 계속 초점을 맞출 여력이 생겼다고 진단했다. 메리 데일리 샌프란시스코 연은 총재는 물가 안정을 위해 추가 금리 인상이 필요할 가능성이 높다면서도, 금리를 얼마나 올려야 할지 불확실한 만큼 보다 신중한 접근이 적절하다고 주장했다."}, {"n": 2, "headline": "앤트로픽 IPO 기업가치 눈높이 더 낮아져", "summary": "미국 중간선거 이후 AI 관련주 투매가 이어지면서 앤트로픽 IPO 의 기업가치 눈높이가 빠르게 낮아지고 있다. IPO 마케팅을 앞두고 잠재적 투자자들은 앤트로픽의 기업가치를 1.2조∼1.3조달러 수준으로 논의하고 있으며 일부는 1.1조달러까지 낮게 평가하고 있다. 10월 초만 해도 최대 2조달러가 거론됐지만 최근 1.4조∼1.5조달러로 낮아진 데 이어 나스닥 100지수가 5일 6.4% 폭락하자 다시 하향 조정되는 모습이다. 민주당의 의회 장악에 따른 AI·데이터센터 규제 강화 우려와 경쟁사 오픈AI의 1.25조달러 기업가치 목표도 부담으로 작용하고 있다."}, {"n": 3, "headline": "미·이란 합의 한발 더…사우디 금융허브 피격", "summary": "미국과 이란 이 종전 협상에서 핵 문제를 다시 논의하기 시작하면서 돌파구 마련에 한층 가까워지고 있다. 협상 내용을 아는 외교관에 따르면 이란은 그동안 협상 테이블에서 제외했던 핵 프로그램과 관련해 핵심 중재국 카타르가 제시한 제안을 검토하고 있다. 트럼프 대통령도 카타르 국왕과 긴장 완화 방안을 논의했으며, 중간선거 이후 당장 이란을 다시 공격할 계획은 없다고 밝힌 상태다. 종전 기대가 커지면서 브렌트유는 9월 이후 처음으로 배럴당 100달러 아래로 떨어졌다."}, {"n": 4, "headline": "트럼프, 강경파 밀러 전면에…백악관 개편", "summary": "도널드 트럼프 미국 대통령 이 중간선거 참패 직후 백악관 참모진 개편에 나서 수지 와일스 비서실장을 교체하고 강경 이민정책 설계자인 스티븐 밀러를 후임으로 기용했다. 민주당이 상·하원을 모두 장악한 상황에서도 정책 기조를 완화하거나 새 의회와 타협하기보다는 기존 강경노선을 이어가겠다는 신호로 해석된다. 트럼프는 밀러에 대해 “처음부터 나와 함께했고 정치를 잘 이해한다”고 평가했으며, 중간선거 패배 이후 내각에도 “몇 가지 변화”가 있을 수 있다고 밝혀 추가 인적 개편 가능성을 시사했다."}, {"n": 5, "headline": "ECB 차기 총재 후보, 크노트·데코스 2파전", "summary": "크리스틴 라가르드 유럽중앙은행(ECB) 총재 의 후임 경쟁이 네덜란드의 클라스 크노트와 스페인의 파블로 에르난데스 데코스 간 2파전으로 좁혀지는 양상이다. 후보 추천 마감까지 네덜란드와 스페인만 각각 자국의 전 중앙은행 총재를 추천했으며, 유로존 재무장관들이 이들 후보를 9일 검토할 예정이다. 최종 결정은 각국 정상들에게 달려 있다. 다만 정치적 협상이 본격화하면 2019년 라가르드처럼 막판에 예상 밖의 후보가 등장할 가능성도 남아 있다."}]}, "daily": {"headline": "Nvidia’s spying scandal", "sections": ["The Nvidia affair", "Chart of the day"], "five": ["Nvidia shares are slumping 4.5% in premarket trading after CEO Jensen Huang admitted he had an affair with a suspected Chinese spy .", "Donald Trump struck a conciliatory tone about Iran over the weekend, saying it was “highly unlikely” he would order extensive strikes.", "US stocks look set for gains after the S&P 500’s biggest weekly drop since April 2025, with support from cheaper oil prices .", "Citigroup strategists downgraded US stocks and the global tech sector. They upgraded European equities on lower exposure to AI turbulence.", "Tesla will refund Cybertruck deposits to “a lot” of customers because it has more orders than it can process before ending production next year, according to Elon Musk."], "commentary": [{"heading": "The Nvidia affair", "summary": "The last thing tech-stock bulls needed was another obstacle to reviving the AI trade. That’s what they’re getting with Nvidia’s spy scandal.\n\nThere’s no immediate, direct impact on Nvidia’s sales and earnings. Still, the saga calls into question whether Jensen Huang will remain at the head of the company he co-founded and built into the world’s largest enterprise.\n\nMore importantly, his relentless appearances, featuring science lectures, dad jokes and his signature leather jackets, turned him into AI’s main cheerleader .\n\nNvidia was already under pressure, along with the rest of the AI trade. Investors worry that the company is involved in circular financing deals with customers, that the AI boom has turned into a bubble and, as of last week, that the newly empowered US Democratic Party will put the brakes on further development."}, {"heading": "Chart of the day", "summary": "A rising stock market and a growing economy are no consolation to many Americans who have been squeezed by years of rising costs ."}]}}, "2026-11-06": {"date": "2026-11-06", "morning": {"hook": "AI주 투매, 연준 동결베팅 등장", "line": "민주당의 미국 의회 장악이 AI 투자 붐에 제동을 걸 수 있다는 우려가 뒤늦게 본격 반영되면서 뉴욕증시가 5일 급락했다.", "markets": [{"name": "S&P 500", "value": "7,353.73", "change": "-4.4%"}, {"name": "Nasdaq 100", "value": "26,629.81", "change": "-6.4%"}, {"name": "US 10Y", "value": "4.84%", "change": "-0.05"}, {"name": "USD/KRW", "value": "₩1,358.97", "change": "+1.3%"}, {"name": "Bloomberg Dollar", "value": "1,222.27", "change": "+0.2%"}, {"name": "Brent", "value": "$98.91", "change": "+4.5%"}], "items": [{"n": 1, "headline": "AI 반도체 급락에 달러-원 50일 이평선 상향 돌파", "summary": "민주당의 ‘블루 웨이브’ 이후 AI 데이터센터 규제 우려가 커지고 미국 반도체주가 급락하면서 원화가 큰 폭으로 약세를 보였다. 달러-원 환율은 전일 대비 거의 16원 오른 1356원 부근까지 뛰어 한 달여 만에 최고 수준을 기록했으며, 7월 이후 처음으로 50일 이동평균선을 웃돌았다. 서울장에서는 코스피 급락과 외국인의 대규모 순매도에도 수출업체의 달러 매도 물량으로 환율 상승폭이 제한됐지만, 나스닥 100지수가 6% 넘게 급락하자 NDF 시장에서 원화 매도세가 거세졌다."}, {"n": 2, "headline": "AI 규제 우려, 스페이스X·코어위브 신용 직격탄", "summary": "AI 산업과 데이터센터에 대한 규제가 강화될 수 있다는 우려가 주식시장을 넘어 크레딧시장으로 확산했다. 코어위브의 한 회사채 금리는 사상 최고인 17%를 넘어섰고, 스페이스X 의 채무불이행 위험에 대비한 CDS 프리미엄도 역대 최고 수준으로 치솟았다. 미국 회사채 시장의 위험 지표들이 거의 8개월 만에 가장 큰 폭으로 악화된 가운데, 특히 스페이스X는 민주당의 의회 장악으로 일론 머스크에 대한 감독이 강화되고 테슬라와의 결합에 제동이 걸릴 수 있다는 우려까지 겹치면서 다른 하이퍼스케일러보다 CDS 상승폭이 두드러졌다."}, {"n": 3, "headline": "MS, 네오클라우드에 신중…데이터센터 지연·비용 부담", "summary": "마이크로소프트 (MS)가 데이터센터 건설 지연과 규제 문제, 비용 부담이 커지면서 네오클라우드 업체들과의 거래에 한층 신중해지고 있다. MS는 네비우스와 아이렌, 엔스케일의 일부 프로젝트에 대한 감독을 강화하고 위험하다고 판단한 사업에서는 발을 빼는 한편, 신규 네오클라우드 계약을 체결할지를 놓고 내부 논의를 벌이고 있다. 특히 아이렌의 텍사스 데이터센터는 케이블 설치 문제 등으로 완공이 수주에서 수개월 늦어질 가능성이 있으며, MS는 신규 외부 계약보다는 자체 데이터센터 확충에 초점을 맞추고 있다."}, {"n": 4, "headline": "BOE, 2023년 이후 첫 금리 인상…추가 인상 시사", "summary": "영란은행(BOE) 이 3년여 만에 처음으로 기준금리를 인상하고 향후 몇 달 안에 추가 긴축에 나설 가능성을 시사했다. 예상보다 매파적인 8대 1 표결로 기준금리를 25bp 올린 4%로 결정했으며, 캐서린 만 위원은 50bp 인상을 주장했다. 앤드류 베일리 총재는 인플레이션 위험이 완화되지 않는다면 추가 인상이 필요할 수 있다면서도 이번 결정이 장기간의 연속적인 금리 인상의 시작을 의미하는 것은 아니라고 강조했다. 시장은 12월 추가 인상 가능성을 약 50%로 반영했다."}, {"n": 5, "headline": "연준 해맥 “인플레 억제 위해 제약적 금리 필요”", "summary": "베스 해맥 클리블랜드 연은 총재는 인플레이션을 2% 목표로 되돌리기 위해 통화정책이 제약적 기조로 이동해야 한다며, 가능하면 작은 폭의 금리 조정을 보다 빈번하게 하는 방식을 선호한다고 밝혔다. 해맥은 이런 접근이 통화정책의 적기 대응에 도움이 되고 인플레이션 심리가 고착될 위험을 줄일 수 있다고 설명했다. 지난주 금리 동결에 반대한 두 명의 연준 인사 가운데 한 명인 해맥은 물가 압력이 공급과 수요 양쪽에서 광범위하게 나타나는 반면 노동시장에서는 오히려 다소 강화되는 신호가 보인다고 진단했다."}]}, "daily": {"headline": "Bull trap", "sections": ["Wrong-footed", "Bright spots"], "five": ["US stock futures are pointing higher after the Nasdaq 100 sank 6.4% on Thursday, wiping out $2.3 trillion in value in the biggest drop since 2020.", "The selling hit other markets, sending a benchmark for Asian stocks down almost 4%. UK and European stocks, which have been a relatively safe harbor, suffered smaller losses. Oil prices dipped.", "Losses at hedge funds are adding to the sense of unease as investors try to figure out whether the broad selloff is the start of a major pullback or just a temporary setback.", "ING is putting up for sale a roughly $500 million portfolio of data center loans all at once, days after a Democratic sweep of the US midterm elections raised doubts about the future of many of the projects.", "October jobs data will be released today. The report, which is expected to show nonfarm payrolls increased by 65,000, comes as expectations for additional Fed interest-rate hikes continue to fade ."], "commentary": [{"heading": "Wrong-footed", "summary": "Wall Street trading desks predicted the stocks rally would resume once the election was over. The market had other ideas .\n\nThe logic was that investors had been keeping cash on the sidelines ahead of US midterms, and with the election in the rearview mirror, they would jump back into a US stock market that’s been languishing for months.\n\nInstead, soon after the opening bell on the New York Stock Exchange, they rushed for the exits, pulling down everything from high-flying chipmakers like Nvidia to defensive fallbacks like Walmart."}, {"heading": "Bright spots", "summary": "Stock markets with relatively little exposure to the AI trade are giving investors somewhere to hide amid the AI rout. Indian stocks gained today and are heading for their biggest weekly gain in more than five years. Europe is benefitting too, just to a lesser extent.\n\nThe Stoxx Europe 600 withstood the selloff yesterday and is set for the biggest quarterly outperformance versus global stocks since early last year. The index is down today, but faring better than markets elsewhere.\n\n“Indiscriminate selling looks overdone vs likely policy outcomes given gridlock, but it may take time for the dust to settle,” said Emmanuel Cau of Barclays. “Europe may benefit relatively, particularly if oil tail risks recede.” — Charles Riley , with Michael Msika , Alex Gabriel Simon , Bhaskar Dutta , Subhadip Sircar"}]}}, "2026-11-05": {"date": "2026-11-05", "morning": {"hook": "의회 뺏긴 트럼프, 유가↓주가↑", "line": "미국 유권자들이 도널드 트럼프 대통령에게 역사적인 패배를 안기면서 민주당은 상·하원 모두에서 상당한 의석 우위를 확보했다.", "markets": [{"name": "S&P 500", "value": "7,688.62", "change": "+1.6%"}, {"name": "Nasdaq 100", "value": "28,437.17", "change": "+0.9%"}, {"name": "US 10Y", "value": "4.89%", "change": "-0.08"}, {"name": "USD/KRW", "value": "₩1,341.06", "change": "-0.3%"}, {"name": "Bloomberg Dollar", "value": "1,219.98", "change": "-0.4%"}, {"name": "Brent", "value": "$95.02", "change": "-8.3%"}], "items": [{"n": 1, "headline": "유가 폭락…‘블루 웨이브’에 이란전쟁 종식 기대", "summary": "민주당 압승으로 수개월째 이어진 이란 전쟁이 예상보다 빨리 끝날 수 있다는 기대가 커지면서 국제유가가 폭락했다. 브렌트유 는 장중 한때 10% 급락해 배럴당 93달러로 2개월 만에 최저 수준으로 내려왔고, WTI도 87달러대로 크게 떨어졌다. JD 밴스 부통령 이 공화당의 선거 패배를 해외 전쟁 탓으로 직접 돌리면서 유가는 낙폭을 확대했다. 척 슈머 상원 민주당 원내대표도 전쟁을 끝내겠다고 약속하며 일부 공화당 의원들의 동참을 예상했다. 삭소뱅크는 시장이 트럼프가 이란 문제를 털어내길 원한다는 쪽에 베팅하면서 어떤 형태로든 합의가 이뤄질 가능성이 커지고 있다고 진단했다."}, {"n": 2, "headline": "의회 뺏긴 트럼프, 관세·부채한도서 타협 가능성", "summary": "민주당이 상·하원을 모두 장악하면서 트럼프 대통령의 관세 정책 에도 변화 압력이 커질 전망이다. 민주당은 인플레이션을 부추겼다고 비판해온 트럼프 관세를 철회하는 방안을 의회 표결에 부쳐 수입관세를 낮추는 무역협정을 압박할 계획이다. 초기 타협 대상으로는 USMCA 개정이 거론되며, 트럼프 행정부는 이미 캐나다와 협상을 재개했다. 중간선거 참패 이후 관세에 반대하는 공화당 의원들이 늘어날 가능성도 있는 가운데, 관세를 낮추는 무역협정은 트럼프가 외국 정부의 양보를 성과로 내세우면서 정책을 전환할 수 있는 출구가 될 수 있다는 분석이다."}, {"n": 3, "headline": "민주당 압승에 AI·월가 규제 리스크 부상", "summary": "민주당 압승으로 트럼프 행정부에서 규제 완화의 혜택을 누려온 AI와 금융업계에 규제 강화 리스크 가 부상했다. 특히 텍사스에서 30여 년 만에 민주당 주지사로 당선된 지나 이노호사가 데이터센터 개발의 즉각적인 중단을 주장한 데 이어 조지아와 오하이오, 펜실베이니아에서도 규제 강화에 적극적인 민주당 후보들이 승리했다. 이에 따라 미국에서 계획된 AI 데이터센터 증설 물량의 절반가량이 보다 엄격한 지역사회의 심사와 반발에 노출될 수 있다. 텍사스만 해도 약 13기가와트 규모의 데이터센터 설비용량이 영향을 받을 수 있으며, 2028년 가동 예정인 미국 전체 데이터센터 용량의 약 30%가 텍사스에 집중돼 있어 사업 지연이 미국의 AI 인프라 확충 속도에도 영향을 미칠 수 있다는 분석이다."}, {"n": 4, "headline": "민주당 상원 장악…연준 독립성에 방어막", "summary": "민주당이 상원 주도권을 확보하면서 연준 을 재편하고 금리 정책에 영향력을 확대하려던 트럼프 대통령의 시도에 제동이 걸릴 전망이다. 민주당이 상원을 장악하면 백악관이 트럼프 충성파 인사를 연준 이사회에 임명하기 어려워지고, 엘리자베스 워런이 연준을 감독하는 상원 은행위원장을 맡을 가능성도 높다. 워런은 금리 결정에서 중앙은행의 독립성을 옹호해왔다. PGIM은 선거 결과로 트럼프가 연준에 행사할 수 있는 영향력이 줄면서 케빈 워시 의장이 높은 금리를 통해 인플레이션에 대응할 수 있는 재량이 넓어질 수 있다고 진단했다."}, {"n": 5, "headline": "美국채 발행 가이던스 수정…내년 장기물 축소 가능성", "summary": "미 재무부가 국채 발행 가이던스 를 수정하면서 내년 장기물 발행을 줄일 가능성을 열어뒀다. 재무부는 현재 예상되는 차입 수요를 감안해 향후 몇 분기 동안 고정금리 이표채와 변동금리채(FRN)의 입찰 규모를 유지할 것으로 예상했다. 다만 2년 넘게 사용해온 “최소 몇 분기 동안”이라는 표현에서 “최소”를 삭제했다. 재무부 차입자문위원회도 향후 20년물과 30년물 발행 조정 가능성을 논의했으며, 추가 발행이 필요할 경우 2∼10년 구간에 집중하는 것이 바람직하다는 데 대체로 의견을 같이했다."}]}, "daily": {"headline": "Strong finish", "sections": ["Finishing with a bang", "Debt ceiling looms"], "five": ["A rotation trade fueled by US elections entered a second day , with cyclical stocks outperforming at the expense of chipmakers. The Stoxx Europe 600 and the FTSE 100 were on a pace to close at all-time highs.", "Toyota shares climbed more than 16%, the most since 1987, after the automaker raised its profit forecast and stepped up shareholder returns.", "Goldman Sachs and Apollo are in talks with Wall Street investors to start selling portions of a roughly $40 billion chip financing deal for SpaceX.", "China has blocked the sale of ABB’s robotics unit to SoftBank, dealing a blow to the Japanese firm’s plans to expand into physical AI.", "The Bank of England looks ready to raise interest rates for the first time in more than three years. Consumer price inflation is seen at close to 5%."], "commentary": [{"heading": "Finishing with a bang", "summary": "Wall Street’s biggest trading desks are betting on a rally to close out 2026.\n\nWhile US stocks are poised for an underwhelming open on Thursday, the basic idea is that reduced policy uncertainty and lackluster investor positioning ahead of the midterm elections will combine to power a move higher into year-end.\n\n“With the election behind us and volatility potentially normalizing, there is considerable capacity for investors to rebuild risk,” said Citadel Securities’ Scott Rubner. “The path of least resistance for US equities is higher into year-end.”\n\nAmong the factors pointing to a potential rally:\n\nA bruising October triggered a sharp reduction in risk-taking among institutional investors. Hedge funds cut exposure to US equities. That’s now providing a favorable backdrop for stocks."}, {"heading": "Debt ceiling looms", "summary": "A divided US government means the debt ceiling is back in play .\n\nThe US is about $800 billion shy of its $41.1 trillion borrowing limit, and strategists expect the government to run out of road in the first half of next year.\n\n“The single biggest source of domestic policy uncertainty remaining in the US is the debt ceiling,” said George Saravelos of Deutsche Bank.\n\nA standoff could disrupt the bond market. During past confrontations, investors have sold Treasury bills maturing around the date the government was projected to run out of money, while buying securities maturing before or after the so-called X-date, creating a kink in the curve.\n\nThe curve shows little sign of concern right now, but that could change. — Michael MacKenzie"}]}}, "2026-11-04": {"date": "2026-11-04", "morning": {"hook": "‘블루웨이브’? 美선거후 랠리", "line": "도널드 트럼프 대통령의 남은 임기 2년을 좌우할 중간선거가 3일 미국 전역에서 실시됐다.", "markets": [{"name": "S&P 500", "value": "7,568.92", "change": "+0.4%"}, {"name": "Nasdaq 100", "value": "28,180.26", "change": "+0.7%"}, {"name": "US 10Y", "value": "4.96%", "change": "+0.05"}, {"name": "USD/KRW", "value": "₩1,345.02", "change": "+0.0%"}, {"name": "Bloomberg Dollar", "value": "1,224.77", "change": "+0.3%"}, {"name": "Brent", "value": "$104.40", "change": "-0.4%"}], "items": [{"n": 1, "headline": "美 ‘제한적’ 이란 공습에도 외교 해법 모색", "summary": "미국이 이란 을 제한적으로 공습했지만 양국은 전면전 재발을 피하기 위한 외교적 해법을 계속 모색하고 있다. 미국과 이란은 중재국들이 제시한 최신 제안을 검토 중이며, 2일 테헤란을 방문한 카타르 중재단은 양측으로부터 이틀 안에 답변을 받을 것으로 기대하고 있다. 트럼프 대통령은 이번 공습에 대해 “소규모 공격일 뿐 전쟁은 아니었다”고 밝혔고, 이란의 모하마드 바게르 갈리바프 의회 의장은 “전쟁을 막기 위한 공은 이제 미국 측에 넘어갔다”고 말했다. 다만 모흐센 레자이 이란 최고국가안보회의 사무총장은 미국의 답변이 “만족스럽지 않다”고 밝혔다."}, {"n": 2, "headline": "UBS, 美선거 이후 연말 랠리 가능성", "summary": "UBS는 증시가 연말 랠리를 펼칠 가능성이 있다고 진단했다. 역사적으로 우호적인 계절성과 낮은 헤지펀드 포지셔닝이 상승세를 증폭시킬 수 있다는 분석이다. 대형 기술기업 실적이 투자자들이 기대했던 안도감을 주지는 못했지만 “선거를 넘기는 것이 연말 숏스퀴즈 를 촉발할 촉매가 될 수 있다”고 내다봤다. S&P 500지수는 1950년 이후 11월에 평균 1.9% 올라 월별로 가장 강한 성적을 냈으며, 헤지펀드의 낮은 순익스포저까지 감안하면 선거라는 마지막 주요 변수를 넘긴 뒤 강한 랠리가 나타날 수 있는 여건이 조성됐다는 설명이다."}, {"n": 3, "headline": "ING, 민주당 의회 장악 시 달러 약세 리스크", "summary": "ING는 미국 중간선거에서 민주당이 상·하원을 모두 장악할 경우 달러가 단기적으로 약세를 보일 수 있다고 전망했다. 시장은 공화당의 하원 패배 가능성은 완전히 가격에 반영하고 있지만 민주당의 양원 장악 가능성은 일부만 반영하고 있다는 분석이다. 민주당이 압승할 경우 AI 규제가 강화되고 정부 지출 등을 둘러싼 정치적 교착 가능성이 커져 달러에 부담이 될 수 있다고 ING는 진단했다."}, {"n": 4, "headline": "주요 헤지펀드, ‘숨을 곳 없었던’ 10월 대부분 손실", "summary": "세계 주요 헤지펀드 들이 10월 코로나19 팬데믹 이후 가장 광범위한 부진 중 하나를 겪었다. 밀레니엄의 멀티스트래티지 펀드는 2.3% 손실을 냈고 마셜웨이스의 유레카 펀드는 5.4% 하락했다. 엑소더스포인트와 노스록도 각각 2.4%, 2.3% 밀렸으며, 크레딧 헤지펀드 아리니는 10월 23일까지 12.1% 급락했다. JP모간은 “10월은 대부분의 헤지펀드가 잊고 싶어 할 것“이라며 전략 전반에 걸쳐 ”사실상 숨을 곳이 없었다“고 평가했다."}, {"n": 5, "headline": "투자 불확실성에 비트코인 ETF 10억弗 순유출", "summary": "사상 최대 규모의 바이낸스 해킹과 미국 중간선거를 둘러싼 불확실성이 투자심리를 짓누르면서 미국 상장 비트코인 펀드에서 지난 2거래일간 10억달러 넘는 자금이 빠져나갔다. 블룸버그 집계에 따르면 10월 30일과 11월 2일 총 10억4천만달러가 순유출됐으며, 2일에만 블랙록의 아이셰어즈 비트코인 트러스트에서 4억500만달러가 빠져나갔다. 비트코인은 3일 7만7000달러 부근에서 거래되며 장중 100일 이동평균선을 밑돌기도 했다."}]}, "daily": {"headline": "Election reaction", "sections": ["Repricing markets", "Oil and bonds"], "five": ["Democrats swept into power in Congress, with outrage over the cost of living and the Iran war leading to a thundering rebuke of Donald Trump.", "Stocks and Treasuries gained and the dollar fell. Trump said he would accept the outcome, prompting investors to buy the recent dip in equities.", "AI chipmaker Advanced Micro Devices gave a sales forecast that soared past analysts’ projections . The stock jumped 6% in premarket trading.", "Novo Nordisk is rallying 4.1% in Copenhagen after the drugmaker again boosted its forecast on sales of the new Wegovy obesity pill.", "CVS Health plans to spin off its retail pharmacy business , according to media reports, in what would be one of the biggest-ever breakups in the healthcare industry."], "commentary": [{"heading": "Repricing markets", "summary": "Investors are waking up today to a radically different political world in the US. Here’s how they’re reacting :\n\nUS equity index futures initially slumped overnight, only to erase losses as investors bought the recent dip . Stocks had fallen ahead of the vote on disappointing tech earnings and concern the AI buildout would face greater scrutiny from Democrats.\n\nUS Treasuries are rallying on the view that the political environment may limit the Trump administration’s tax and spending plans .\n\nThe dollar sank the most in two months , emerging as the clearest knee-jerk casualty from the vote. Political gridlock and tougher regulation could damp foreign demand for US assets.\n\nShares of US data-center operators and cloud computing providers are falling after a backlash against data centers helped Democrats to their victory. Iren is down 3.9% and CoreWeave is 3.3% lower."}, {"heading": "Oil and bonds", "summary": "It was a safe bet for much of the year: higher oil prices are bad for government bonds. Now the link has been broken as money managers worry more about growth and less about inflation.\n\nBrent crude prices and yields on 10-year Treasuries shot up in tandem when the US and Israel attacked Iran and the correlation stayed tight before peaking on Sept. 15. Since then it has reversed. Similar trends have been seen in German and UK government bonds.\n\nThe break is increasing the appeal of bonds, despite the risk of a flare-up in violence that could lead to another oil price spike. Traders say interest rates can’t rise much further given the economic damage already being caused by the energy shock and higher borrowing costs."}]}}, "2026-11-03": {"date": "2026-11-03", "morning": {"hook": "나스닥100 조정, 미·이란 협상", "line": "미국 중간선거를 하루 앞두고 미·이란 협상 기대에 국제유가가 급락
