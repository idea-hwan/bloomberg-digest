<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>블룸버그 다이제스트</title>
  <style>
    :root {
      --paper: #f3f0e8;
      --card: #fffcf7;
      --ink: #1c1915;
      --muted: #6f6a62;
      --line: #e4dfd4;
      --up: #b42318;
      --down: #1d4f91;
      --flat: #6f6a62;
      --chip: #efeae0;
      --accent: #1c1915;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      line-height: 1.45;
      overflow-wrap: break-word;
      -webkit-text-size-adjust: 100%;
    }
    button { -webkit-tap-highlight-color: transparent; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 16px;
      max-width: 980px;
      margin: 0 auto;
      padding: 28px 24px 0;
    }
    .mark {
      font-size: 13px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 4px;
    }
    h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin: 0;
    }
    nav {
      display: flex;
      gap: 6px;
    }
    nav button, .cal button, .theme-head, .expand, .fold {
      font: inherit;
      color: inherit;
      background: transparent;
      border: 0;
      cursor: pointer;
    }
    nav button {
      padding: 8px 14px;
      border-radius: 999px;
      color: var(--muted);
    }
    nav button[aria-selected="true"] {
      background: var(--ink);
      color: var(--paper);
    }
    main {
      max-width: 980px;
      margin: 0 auto;
      padding: 20px 24px 64px;
    }
    .dayhead {
      display: flex;
      align-items: stretch;
      gap: 10px;
      margin: 0 0 18px;
    }
    .leadbox, .cal {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
    }
    .leadbox {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 20px 22px;
    }
    .cal {
      width: max-content;
      margin: 0;
      padding: 14px 16px 12px;
    }
    .cal-month {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 13px;
    }
    .cal section + section { margin-top: 16px; }
    .cal-dow, .cal-grid {
      display: grid;
      grid-template-columns: repeat(5, 36px);
      gap: 4px;
    }
    .cal-dow { margin-bottom: 4px; }
    .cal-dow span {
      text-align: center;
      color: var(--muted);
      font-size: 12px;
    }
    .cal-grid button, .cal-grid span {
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 9px;
      font-size: 14px;
      font-weight: 650;
    }
    .cal-grid button.in { background: var(--chip); }
    .cal-grid button[aria-selected="true"] {
      background: var(--ink);
      color: var(--paper);
    }
    .weekhead { flex-direction: column; align-items: stretch; }
    .weekhead .cal { width: min(100%, 420px); }
    .theme-col { width: 100%; }
    .issue-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: baseline;
    }
    .issue-head strong { font-size: 18px; letter-spacing: -0.03em; }
    .board {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 8px;
      margin-top: 14px;
    }
    .board .d {
      color: var(--muted);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }
    .board .line {
      margin: 6px 0 0;
      min-height: 2.7em;
      font-size: 14px;
      line-height: 1.35;
      letter-spacing: -0.03em;
    }
    .board .quote {
      margin: 8px 0 0;
      min-height: 2.4em;
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      line-height: 1.3;
    }
    .board .quote strong { display: block; font-size: 13px; }
    .theme.issue[aria-expanded="true"] .hits { display: none; }
    .theme.issue .expand[aria-expanded="true"] + .hits { display: block; }
    .cal-grid .off { color: #c8c2b6; font-weight: 500; }
    .hook {
      font-size: 32px;
      line-height: 1.25;
      letter-spacing: -0.04em;
      margin: 0;
      font-weight: 750;
    }
    .dek {
      margin: 10px 0 0;
      font-size: 17px;
      line-height: 1.5;
      letter-spacing: -0.02em;
    }
    .markets {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 28px;
    }
    .market {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px 14px 11px;
    }
    .market .name { color: var(--muted); font-size: 12px; }
    .market .value {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      margin-top: 4px;
      font-variant-numeric: tabular-nums;
    }
    .market strong { font-size: 18px; font-weight: 700; }
    .up { color: var(--up); }
    .down { color: var(--down); }
    .flat { color: var(--flat); }
    section { margin-top: 8px; }
    section h2 {
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 650;
      margin: 22px 0 10px;
    }
    ol, .stories { list-style: none; margin: 0; padding: 0; }
    li + li { border-top: 1px solid var(--line); }
    #morning li { display: block; padding: 0; }
    #morning .fold {
      display: grid;
      grid-template-columns: 28px 1fr;
      gap: 10px;
      align-items: baseline;
      width: 100%;
      padding: 11px 0;
      text-align: left;
      font-size: 17px;
      letter-spacing: -0.02em;
    }
    #morning .summary {
      display: none;
      margin: 0 0 14px 38px;
      font-size: 17px;
      line-height: 1.5;
      letter-spacing: -0.02em;
    }
    #morning .fold[aria-expanded="true"] + .summary { display: block; }
    #commentary li { display: block; padding: 0; }
    #commentary .fold {
      display: block;
      width: 100%;
      padding: 11px 0;
      text-align: left;
      font-size: 17px;
      letter-spacing: -0.02em;
    }
    #commentary .summary {
      display: none;
      margin: 0 0 14px;
      font-size: 17px;
      line-height: 1.5;
    }
    #commentary .summary p { margin: 0 0 12px; }
    #commentary .fold[aria-expanded="true"] + .summary { display: block; }
    .stories li.note { display: block; }
    ol li, .stories li {
      display: grid;
      grid-template-columns: 28px 1fr;
      gap: 10px;
      align-items: baseline;
      padding: 11px 0;
      font-size: 17px;
      letter-spacing: -0.02em;
    }
    .num, .series {
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      font-size: 13px;
      padding-top: 4px;
    }
    .empty {
      color: var(--muted);
      padding: 12px 0 4px;
    }
    .theme {
      width: 100%;
      text-align: left;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px 16px;
      margin-bottom: 10px;
    }
    .theme-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: baseline;
      width: 100%;
      padding: 0;
    }
    .theme-head strong { font-size: 18px; letter-spacing: -0.03em; }
    .count { color: var(--muted); font-size: 13px; }
    .expand {
      display: none;
      margin-top: 12px;
      padding: 0;
      color: var(--muted);
      font-size: 13px;
    }
    .hits { display: none; margin: 8px 0 0; padding: 0; list-style: none; }
    .narrative { display: none; margin: 12px 0 0; font-size: 17px; line-height: 1.55; letter-spacing: -0.02em; }
    .narrative p { margin: 0 0 12px; }
    .narrative p:last-child { margin-bottom: 0; }
    .theme[aria-expanded="true"] .narrative,
    .theme[aria-expanded="true"] .expand { display: block; }
    .expand[aria-expanded="true"] + .hits { display: block; }
    .hits li {
      display: grid;
      grid-template-columns: 52px 52px 1fr;
      gap: 8px;
      padding: 8px 0;
      font-size: 15px;
      border-top: 1px solid var(--line);
    }
    .hits li span:first-child,
    .hits li span:last-child { color: var(--muted); }
    .hits li.cited span:first-child,
    .hits li.cited span:last-child { color: var(--ink); font-weight: 650; }
    footer {
      max-width: 980px;
      margin: 0 auto;
      padding: 0 24px 28px;
      color: var(--muted);
      font-size: 12px;
    }
    @media (max-width: 720px) {
      header, main, footer {
        padding-left: max(16px, env(safe-area-inset-left));
        padding-right: max(16px, env(safe-area-inset-right));
      }
      header {
        flex-direction: column;
        align-items: flex-start;
        gap: 14px;
        padding-top: max(18px, env(safe-area-inset-top));
      }
      h1 { font-size: 26px; }
      nav button { min-height: 44px; padding: 8px 16px; }
      main { padding-top: 16px; padding-bottom: 40px; }
      .dayhead { flex-direction: column; }
      .cal { width: 100%; }
      .cal-dow, .cal-grid { grid-template-columns: repeat(5, 1fr); }
      .cal-grid button, .cal-grid span { height: 40px; font-size: 15px; }
      .leadbox { padding: 16px; }
      .hook { font-size: 26px; line-height: 1.32; }
      .dek { font-size: 16px; }
      .markets { grid-template-columns: 1fr 1fr; gap: 8px; }
      .market { padding: 12px; }
      .market .value { display: block; }
      .market .value span { display: block; margin-top: 2px; font-size: 13px; }
      .market strong { font-size: 17px; }
      ol li, .stories li { font-size: 16px; padding: 13px 0; }
      #morning .fold, #morning .summary, #commentary .fold, #commentary .summary, .narrative { font-size: 16px; }
      .expand { min-height: 44px; }
      .board {
        grid-template-columns: repeat(7, 108px);
        overflow-x: auto;
        padding-bottom: 4px;
      }
      .hits li { display: block; padding: 10px 0; }
      .hits li span:nth-child(1),
      .hits li span:nth-child(2) { display: inline; }
      .hits li span:nth-child(2) { margin-left: 8px; }
      .hits li span:last-child { display: block; margin-top: 3px; }
      footer { padding-bottom: calc(24px + env(safe-area-inset-bottom)); }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <p class="mark">Bloomberg digest</p>
      <h1>Day</h1>
    </div>
    <nav>
      <button type="button" id="tab-day" aria-selected="true">Day</button>
      <button type="button" id="tab-themes" aria-selected="false">Weekly</button>
    </nav>
  </header>
  <main>
    <div id="view-day">
      <div class="dayhead">
        <div class="cal" id="dates"></div>
        <article class="leadbox">
          <h2 class="hook" id="hook"></h2>
          <p class="dek" id="dek" hidden></p>
        </article>
      </div>
      <div class="markets" id="markets"></div>
      <section>
        <h2>오늘 아침 5가지</h2>
        <ol id="morning"></ol>
      </section>
      <section id="five-section" hidden>
        <h2>5 things</h2>
        <ol class="brief" id="five"></ol>
      </section>
      <section id="commentary-section" hidden>
        <h2>commentary</h2>
        <ul class="stories" id="commentary"></ul>
      </section>
      <section id="daily-section">
        <h2>Markets Daily</h2>
        <ul class="stories" id="daily"></ul>
      </section>
    </div>
    <div id="view-themes" hidden>
      <div class="dayhead weekhead">
        <div class="cal" id="week-dates"></div>
        <div id="theme-list" class="theme-col"></div>
      </div>
    </div>
  </main>
  <footer>시세와 그날 목록을 보여 줍니다.</footer>
  <script>
    const DATA = {"today": "2026-11-12", "dates": ["2026-11-12", "2026-11-11", "2026-11-10", "2026-11-09", "2026-11-06", "2026-11-05", "2026-11-04", "2026-11-03", "2026-11-02", "2026-10-30", "2026-10-29", "2026-10-28", "2026-10-27", "2026-10-26", "2026-10-23", "2026-10-22", "2026-10-21", "2026-10-20", "2026-10-19", "2026-10-16", "2026-10-15", "2026-10-14", "2026-10-13"], "days": {"2026-11-12": {"date": "2026-11-12", "morning": {"hook": "앤트로픽 흥행, 달러강세 경계", "line": "강세장을 이끌어온 인공지능(AI) 테마가 더 이어질 여지가 있다는 기대에 대형 기술주 중심으로 뉴욕증시가 11일 상승했다.", "markets": [{"name": "S&P 500", "value": "7,619.38", "change": "+1.3%"}, {"name": "Nasdaq 100", "value": "28,374.25", "change": "+2.3%"}, {"name": "US 10Y", "value": "4.99%", "change": "+0.00"}, {"name": "USD/KRW", "value": "₩1,337.20", "change": "-0.5%"}, {"name": "Bloomberg Dollar", "value": "1,232.36", "change": "+0.4%"}, {"name": "Brent", "value": "$92.51", "change": "+1.1%"}], "items": [{"n": 1, "headline": "원화 급등 뒤 반전 경계", "summary": "최근 원화가 가파르게 강세를 보인 가운데 옵션시장에서는 원화 강세의 되돌림, 즉 달러-원 환율 반등에 대비한 수요가 빠르게 늘고 있다고 블룸버그 인텔리전스(BI)가 진단했다. 한국 원화와 브라질 헤알, 중국 위안 등 6개 신흥시장 통화에 연계된 달러 콜옵션의 명목가치는 지난해 말 이후 증가했으며, 한국과 브라질, 멕시코는 8년 만의 최고 수준을 기록했다. 특히 행사가격이 달러당 1300~1400원인 콜옵션의 명목가치는 지난해 12월 이후 세 배 넘게 늘어 현재 달러-원 상방 헤지 익스포저의 약 44%를 차지한다."}, {"n": 2, "headline": "엔비디아 강세론 균열…베어드 하향", "summary": "젠슨 황 CEO를 둘러싼 불확실성으로 월가의 엔비디아 강세론에 균열이 나타나기 시작했다. 베어드는 엔비디아 투자의견을 ‘중립’으로 낮추고 목표주가를 500달러에서 200달러로 대폭 하향했다. 미 정부의 조치와 조사 결과, 단기 매출 영향, 황 CEO의 재임 여부 등을 둘러싼 불확실성이 해소될 때까지 신중한 입장을 취하겠다고 밝혔다. 모간스탠리도 엔비디아를 ‘톱픽’에서 제외했다. 긍정적인 시각은 유지하면서도 황 CEO의 리더십이 회사의 전략적 방향에 매우 중요한 만큼 단기 불확실성이 이어질 것으로 전망했다."}, {"n": 3, "headline": "AI 신용팽창 경고음", "summary": "식스스트리트파트너스가 AI 투자 열풍에서 투기적 행태와 시장 균열의 징후가 나타나고 있다며 관련 투자에 대체로 거리를 두고 있다고 밝혔다. 앨런 왁스먼 CEO는 전례 없는 AI 자본지출과 급격한 신용 팽창 속에 은행들이 건설 대출을 매각하는 등 이상 징후가 나타나고 있다고 지적했다. 특히 AI 프로젝트에 저비용 자금을 공급해온 보험사들이 단일 차입자에 대한 대출 한도에 도달하면서 개발업체들이 연기금이나 국부펀드 등에서 더 비싼 자금을 조달해야 할 수 있다고 경고했다. 데이터센터 완공 지연으로 약 2000억달러어치의 반도체가 창고에 쌓여 있다는 점도 위험 요인으로 꼽았다."}, {"n": 4, "headline": "AI 대출 급증에 보험 활용론", "summary": "AI·데이터센터 대출이 급증하면서 은행들의 위험을 보험으로 분산하려는 움직임이 확산하고 있다. 세계 최대 보험중개업체 마시앤드맥레넌은 신용위험보험 에 가입한 대출에 대해 은행이 쌓아야 하는 규제 자본을 줄여달라고 미국 당국에 요구하고 있다. AI 관련 금융의 위험을 헤지하려는 수요가 폭발적으로 늘고 있지만, 미국에서는 보험에 가입해도 규제 자본 부담을 덜 수 없어 은행들이 다른 수단에 주로 의존해왔다. 마시는 데이터센터 관련 거래를 포함한 프로젝트 파이낸싱의 신용위험보험을 활발히 주선하고 있다."}, {"n": 5, "headline": "사우디 원유생산 26% 급증…이란전쟁 이후 최고", "summary": "사우디아라비아 의 지난달 원유 생산량이 26% 급증해 하루 1056만배럴로 이란전쟁 발발 직전인 2월 이후 최고 수준을 기록했다. 전쟁이 계속되고 이란의 유조선 공격이 이어지는 가운데서도 사우디를 비롯한 페르시아만 산유국들이 원유 수송을 빠르게 정상화하면서 공급이 늘고 있다. 이라크도 생산량을 전쟁 이후 최고인 하루 약 490만배럴로 늘렸다. 소비가 여전히 제한된 상황에서 공급 회복이 실물 원유 가격을 끌어내리고 공급 과잉 신호도 나타나면서 브렌트유는 이달 들어 약 21% 급락해 배럴당 93달러 부근으로 내려왔다."}]}, "daily": null}, "2026-11-11": {"date": "2026-11-11", "morning": {"hook": "연준 50bp인상? 앤트로픽 승부수", "line": "크리스토퍼 월러 연준 이사가 12월 50bp 금리 인상 가능성을 제기한 직후 미국의 10월 소비자물가(CPI)가 예상보다 뜨겁게 나오면서 연준의 ‘빅스텝’ 논쟁에 불이 붙었다.", "markets": [{"name": "S&P 500", "value": "7,520.93", "change": "-0.4%"}, {"name": "Nasdaq 100", "value": "27,740.79", "change": "-0.6%"}, {"name": "US 10Y", "value": "4.99%", "change": "+0.11"}, {"name": "USD/KRW", "value": "₩1,343.05", "change": "-0.0%"}, {"name": "Bloomberg Dollar", "value": "1,227.44", "change": "+0.5%"}, {"name": "Brent", "value": "$92.10", "change": "-0.5%"}], "items": [{"n": 1, "headline": "앤트로픽 IPO 승부수", "summary": "앤트로픽 이 기업공개(IPO)를 통해 약 1.4조달러의 기업가치를 인정받는 데 도전한다. 클로드 챗봇 개발사인 앤트로픽과 공동창업자들은 IPO와 사모 발행을 통해 최대 904억달러를 조달할 계획으로, 희망 공모가는 주당 70~78달러다. 공모가 상단 기준 시가총액은 약 1조달러, 스톡옵션 등을 포함한 완전희석 기준 기업가치는 약 1.4조달러다. 사모 발행을 포함한 IPO 규모는 스페이스X의 750억달러를 넘어 역대 최대 기록을 세울 전망이며, 초과배정옵션까지 포함하면 전체 조달액은 약 1000억달러에 이를 것으로 블룸버그는 추산했다. 딜 개시와 함께 공모 물량 전체에 대한 투자자 주문도 확보됐다."}, {"n": 2, "headline": "연준 빅스텝론 부상", "summary": "월러 연준 이사 는 CPI 지표 발표에 앞서 근원 CPI가 0.3% 이상 오를 경우 연준이 50bp의 더 큰 폭 인상을 단행해야 할 수도 있다고 밝혔다. 월러의 발언은 연준 당국자 가운데 12월 금리인상 필요성을 가장 강하게 주장한 것으로, 시장이 예상해온 25bp를 넘어 50bp 인상 가능성까지 열어뒀다. 그는 이 같은 상황에서 25bp 인상에 그칠 경우 연준의 인플레이션 대응 의지에 대한 신뢰가 훼손될 수 있다며, 지난해 단행했던 세 차례의 ‘보험성 인하’를 최소한 되돌릴 필요가 있다고 강조했다. 보우먼 이사 역시 끈질긴 인플레이션을 지적하며 다음달 금리 인상을 지지할 생각임을 시사했다."}, {"n": 3, "headline": "예상 웃돈 美근원 CPI", "summary": "미국의 10월 근원 소비자물가지수(CPI) 가 전월 대비 0.3% 상승해 예상을 웃돌고 헤드라인 CPI도 0.4% 올랐다. 블룸버그 집계 자료에 따르면 근원 CPI는 최근 3개월 연율 기준 3.7%, 6개월 기준 2.7% 상승해 물가 압력이 여전히 높은 것으로 나타났다. 식료품 가격은 0.4% 올라 4월 이후 가장 큰 폭으로 상승했고, 주택소유자의 등가임대료(OER)는 0.3%, 전기요금은 0.9%, 휘발유 가격은 1% 올랐다. 에너지와 임대료를 제외한 서비스 물가는 0.4% 올랐고, 가구와 가전제품, 장난감 등 관세 영향을 크게 받는 품목에서도 상당한 가격 상승이 나타났다."}, {"n": 4, "headline": "미국채 10년물 다시 5%", "summary": "미국채 는 지난달 초 이후 인공지능(AI) 붐의 지속 가능성에 대한 우려로 기술주가 하락하고, 미·이란 전쟁 종식 기대에 국제유가가 떨어지면서 강한 랠리를 펼쳐왔다. 지난주 중간선거에서 민주당이 압승하면서 주가가 급락하자 채권 랠리에는 더욱 힘이 실렸다. 그러나 10일에는 이 같은 재료들이 모두 밀려나고 시장의 관심이 인플레이션 압력으로 다시 쏠렸다. 주택담보대출 등 각종 대출금리의 기준이 되는 미국채 10년물 금리는 장중 5% 위로 올라섰다. 이날 실시된 420억달러 규모의 10년물 국채 입찰에서도 수요가 기대에 못 미치면서 낙찰금리는 5.020%로 결정됐다. 이번에 발행되는 10년물의 쿠폰금리는 5%로 2006년 이후 가장 높다."}, {"n": 5, "headline": "이란전쟁 종식 기대에 브렌트유 한때 90달러 아래로", "summary": "이란전쟁 종식 기대가 커지면서 브렌트유 가 한때 배럴당 90달러 아래로 떨어졌다. 브렌트유는 전일 거의 6% 하락한 데 이어 10일 장중 최대 3.7% 급락했다. 중간선거에서 공화당이 패배한 뒤 전쟁 종식 압박을 받고 있는 트럼프 대통령은 이란에 대한 추가 공격이 필요하지 않을 것이라고 밝혔고, 미·이란 협상을 중재하는 카타르 총리와 만난 뒤에는 “군사적으로 이란은 사실상 끝났다”고 말했다. 의회를 장악한 민주당은 다가오는 정부 셧다운 시한을 활용해 트럼프 대통령에게 전쟁의 출구전략을 마련하도록 압박하는 방안을 검토하고 있다."}]}, "daily": {"headline": "Getting ready for Anthropic", "sections": ["Getting ready for Anthropic", "Sticky inflation"], "five": ["Investors are shifting back into the AI trade , lifting US stock futures. The cash Treasury market is closed for Veterans Day.", "CoreWeave eased fears about its debt-laden data center business by reporting strong sales growth. Shares are up 11% in premarket trading.", "Anthropic’s bankers are weighing plans to increase the company’s IPO valuation to $1.5 trillion or more, the Financial Times reports .", "OpenAI revenue hit $10 billion in the third quarter. That’s up nearly 50% from the prior quarter and almost threefold higher than a year ago.", "Global equity hedge funds cut risk at the steepest rate in more than a decade through the first week of November, according to Morgan Stanley."], "commentary": [{"heading": "Getting ready for Anthropic", "summary": "Investors have spend the past few weeks worrying about AI. The prospect of tough regulation and moratoriums on new data centers with Democrats in charge of Congress, plus concerns over circular financing deals and billions in new debt have put a big dent in stock prices as of late. And now, here comes the Anthropic IPO . The Claude chatbot maker and its co-founders are looking to raise as much as $90.4 billion in the IPO and a private placement, at a market value of $1.4 trillion. The valuation could be hiked further, according to the FT.\n\nThe growing frenzy reflects the transformative power that many believe AI will have on a wide range of professional activity. The IPO is likely to be the biggest listing of all time, when the private placement is factored in."}, {"heading": "Sticky inflation", "summary": "Traders who joined the rush into bonds just got smacked .\n\nFresh evidence of sticky inflation and hawkish comments from Fed officials combined on Tuesday to increase the odds of rate hikes. That sent Treasuries into a tailspin. Two-year US yields soared by the most in 19 months and briefly pushed 10-year yields back over 5%.\n\nThe price data was bad enough that investors see a December rate hike as a done deal. Fed Governor Christopher Waller, speaking in London before the CPI report, warned that officials may need to raise interest rates by a half percentage point next month if there’s no progress on inflation.\n\nIt’s a reminder to investors to keep a close eye on the Fed. — Edward Bolingbroke and Paul Dobson"}]}}, "2026-11-10": {"date": "2026-11-10", "morning": {"hook": "엔비디아 파장, 유가 수개월최저", "line": "젠슨 황 최고경영자(CEO)의 외도 인정과 외도 상대를 둘러싼 중국 스파이 의혹으로 위기에 휘말린 엔비디아의 주가가 장중 최대 8.8% 급락했다.", "markets": [{"name": "S&P 500", "value": "7,549.94", "change": "+2.3%"}, {"name": "Nasdaq 100", "value": "27,907.63", "change": "+3.4%"}, {"name": "US 10Y", "value": "4.88%", "change": "+0.02"}, {"name": "USD/KRW", "value": "₩1,341.33", "change": "-0.1%"}, {"name": "Bloomberg Dollar", "value": "1,221.47", "change": "-0.5%"}, {"name": "Brent", "value": "$92.26", "change": "-6.2%"}], "items": [{"n": 1, "headline": "트럼프, 이란 확전 가능성 낮춰…유가 급락", "summary": "도널드 트럼프 미국 대통령이 이란에 대한 대규모 공격 가능성이 “매우 낮다”고 밝히면서 종전 협상 기대가 커져 국제유가가 급락했다. 브렌트유는 장중 8% 가까이 떨어져 배럴당 90.56달러로 8월말 이후 최저 수준을 기록했고, WTI도 한때 6% 넘게 하락했다. 중간선거에서 공화당이 참패한 뒤 트럼프가 외교적 해결에 나설 것이라는 기대가 커진 가운데 그는 다만 이란이 “매우 강력한 합의”에 서명하는 것을 전제로 내걸었다. 마코 루비오 미 국무장관은 이란의 요구가 일부 “터무니없고 비현실적”이라며 돌파구가 임박했다는 관측에는 선을 그었다."}, {"n": 2, "headline": "연준 바킨 추가 인상 시사…굴스비 “AI발 과열”", "summary": "톰 바킨 리치먼드 연은 총재는 견조한 수요와 끈질긴 인플레이션을 감안하면 금리를 추가로 올려야 한다는 입장을 시사했다. 그는 기업 이익과 소비가 여전히 강하다며 “통화정책이 나아갈 방향은 비교적 명확하다”고 밝혔지만, 수요 전망의 불확실성을 감안해 긴축 속도에는 신중할 필요가 있다고 강조했다. 그는 연말까지 소비지출이 견조한 흐름을 유지할 것으로 전망하면서도, 소비 강세가 얼마나 오래 지속될지는 여전히 의문이라고 말했다."}, {"n": 3, "headline": "월가, 기록적 기술주 투매에도 AI 강세론 고수", "summary": "지난주 헤지펀드들이 사상 최대 수준에 가까운 속도로 기술주를 팔아치우고 모멘텀 포지션 청산이 약 40년 만에 최대 규모를 기록했지만, 월가에서는 AI 붐 이 끝났다는 진단은 드물다. 골드만삭스에 따르면 글로벌 기술주에 대한 헤지펀드 매도는 2016년 집계 이후 최고 수준에 근접했으며, JP모간은 대규모 디레버리징 이후 투자자들의 항복 징후가 나타나면서 비관론이 정점에 가까워졌을 가능성을 제기했다. 미국 기업의 이익 전망이 여전히 견조한 데다 이번 급락이 펀더멘털 악화보다는 포지션 청산 성격이 강하다는 판단이 AI 중기 강세론을 뒷받침하고 있다."}, {"n": 4, "headline": "구글, AI칩 라인업 확대…엔비디아 추격 가속", "summary": "구글 이 인공지능(AI) 반도체 제품군을 확대하며 엔비디아 추격에 속도를 내고 있다. 구글은 자체 설계 반도체인 텐서처리장치(TPU)의 새로운 버전인 8tx와 8i Max를 선보인다. 8tx는 정부기관과 규제 산업 등 보안과 기밀성이 중요한 고객을 겨냥했으며, 8i Max는 신약 개발과 코딩 등 한 번의 요청에서 방대한 정보를 참조해야 하는 AI 애플리케이션에 특화됐다. 구글의 알파벳 주가는 장중 한때 4% 올랐다."}, {"n": 5, "headline": "앤트로픽, IPO 앞두고 새 AI 모델 공개", "summary": "앤트로픽 이 이르면 이달 기업공개(IPO)를 앞두고 AI 모델 ‘페이블’과 ‘미토스’의 새 버전을 공개하며 오픈AI 등과의 경쟁에 대응하고 있다. 페이블 5.2는 보다 복잡한 소프트웨어 엔지니어링과 로봇 제어, 장기 프로젝트를 수행하고 한 번에 1천개 이상의 AI 에이전트를 조율할 수 있도록 설계됐다. 미토스 5.2는 사이버보안과 생명과학 분야의 안전장치를 줄인 버전으로 검증된 일부 기관에 제공된다. 두 모델 모두 이전 버전보다 속도가 빨라졌으며 페이블은 가격도 낮췄다."}]}, "daily": {"headline": "Oil is driving stocks and bonds", "sections": ["Oil and bond yields", "The anti-AI trade"], "five": ["Brent crude slumped below $90 a barrel for the first time since August as traders boosted bets on a resolution to the Middle East war.", "Fed Governor Christopher Waller said he supports an interest-rate hike in December , and warned he would back a half-point increase if inflation continues to accelerate.", "A powerful rebound in US stocks ran out of steam after Waller’s comments, which come just hours before Tuesday’s inflation data.", "Anthropic is set to kick off the marketing of its blockbuster IPO as early as today. A snafu over the filing documents added a dose of drama.", "SoftBank reported its first loss in almost two years after a $3.7 billion writedown over its US data-center projects."], "commentary": [{"heading": "Oil and bond yields", "summary": "While investors have been riveted by AI stocks and the Nvidia spy drama , a couple of momentous market moves have been taking place almost below the radar.\n\nBrent crude oil, which stood near $118 as recently as Oct. 30, has dropped below $90 . That, in turn, has helped drive US Treasury bond yields lower. The 10-year has fallen to 4.89% from a 24-year high around 5.36% a month ago.\n\nToday’s consumer price report in the US could add to the optimism: Economists expect it to show that the pace of inflation moderated last month. A surprisingly weak reading, coupled with the pullback in oil, might encourage traders to pare their predictions for Fed tightening."}, {"heading": "The anti-AI trade", "summary": "Stock pickers in emerging markets have faced a daunting challenge the past couple of years — the MSCI index many of them are judged against is dominated by a handful of big AI stocks.\n\nAvoid shares of Taiwan Semiconductor, Samsung and SK Hynix, and you’re guaranteed to underperform the benchmark.\n\nBut now that those stocks are slumping, fund managers are sifting through the rest of the market, and they like what they see : Stocks selling at rock-bottom valuations with high dividend yields, in markets that by one metric are the cheapest since the global financial crisis 18 years ago.\n\nInvestors highlight South American utilities, Chinese and Taiwanese consumer-goods manufacturers, and eastern and central European financial firms as compelling alternatives to AI-exposed stocks."}]}}, "2026-11-09": {"date": "2026-11-09", "morning": {"hook": "앤트로픽 IPO, 美고용서프라이즈", "line": "AI 관련주 투매로 급락했던 뉴욕증시는 6일 반도체주를 중심으로 반등했지만, 시장에서는 이를 투자심리의 뚜렷한 전환보다는 숏커버링과 저가 매수에 따른 반등으로 보는 시각이 우세했다.", "markets": [{"name": "S&P 500", "value": "7,376.86", "change": "+0.3%"}, {"name": "Nasdaq 100", "value": "26,989.99", "change": "+1.4%"}, {"name": "US 10Y", "value": "4.86%", "change": "+0.02"}, {"name": "USD/KRW", "value": "₩1,365.29", "change": "+0.5%"}, {"name": "Bloomberg Dollar", "value": "1,227.53", "change": "+0.4%"}, {"name": "Brent", "value": "$98.32", "change": "+0.0%"}], "items": [{"n": 1, "headline": "美 10월 고용 서프라이즈", "summary": "미국의 10월 비농업 부문 고용 이 16만5000명 증가해 모든 시장 전망치를 웃돌고 실업률도 4.1%로 소폭 하락했다. 앞선 두 달의 고용 증가폭도 상향 조정됐으며 전문직·비즈니스 서비스와 보건의료, 제조업 등 광범위한 업종에서 일자리가 늘었다. TD증권은 고용이 전반적으로 강했다며 연준이 인플레이션 억제에 계속 초점을 맞출 여력이 생겼다고 진단했다. 메리 데일리 샌프란시스코 연은 총재는 물가 안정을 위해 추가 금리 인상이 필요할 가능성이 높다면서도, 금리를 얼마나 올려야 할지 불확실한 만큼 보다 신중한 접근이 적절하다고 주장했다."}, {"n": 2, "headline": "앤트로픽 IPO 기업가치 눈높이 더 낮아져", "summary": "미국 중간선거 이후 AI 관련주 투매가 이어지면서 앤트로픽 IPO 의 기업가치 눈높이가 빠르게 낮아지고 있다. IPO 마케팅을 앞두고 잠재적 투자자들은 앤트로픽의 기업가치를 1.2조∼1.3조달러 수준으로 논의하고 있으며 일부는 1.1조달러까지 낮게 평가하고 있다. 10월 초만 해도 최대 2조달러가 거론됐지만 최근 1.4조∼1.5조달러로 낮아진 데 이어 나스닥 100지수가 5일 6.4% 폭락하자 다시 하향 조정되는 모습이다. 민주당의 의회 장악에 따른 AI·데이터센터 규제 강화 우려와 경쟁사 오픈AI의 1.25조달러 기업가치 목표도 부담으로 작용하고 있다."}, {"n": 3, "headline": "미·이란 합의 한발 더…사우디 금융허브 피격", "summary": "미국과 이란 이 종전 협상에서 핵 문제를 다시 논의하기 시작하면서 돌파구 마련에 한층 가까워지고 있다. 협상 내용을 아는 외교관에 따르면 이란은 그동안 협상 테이블에서 제외했던 핵 프로그램과 관련해 핵심 중재국 카타르가 제시한 제안을 검토하고 있다. 트럼프 대통령도 카타르 국왕과 긴장 완화 방안을 논의했으며, 중간선거 이후 당장 이란을 다시 공격할 계획은 없다고 밝힌 상태다. 종전 기대가 커지면서 브렌트유는 9월 이후 처음으로 배럴당 100달러 아래로 떨어졌다."}, {"n": 4, "headline": "트럼프, 강경파 밀러 전면에…백악관 개편", "summary": "도널드 트럼프 미국 대통령 이 중간선거 참패 직후 백악관 참모진 개편에 나서 수지 와일스 비서실장을 교체하고 강경 이민정책 설계자인 스티븐 밀러를 후임으로 기용했다. 민주당이 상·하원을 모두 장악한 상황에서도 정책 기조를 완화하거나 새 의회와 타협하기보다는 기존 강경노선을 이어가겠다는 신호로 해석된다. 트럼프는 밀러에 대해 “처음부터 나와 함께했고 정치를 잘 이해한다”고 평가했으며, 중간선거 패배 이후 내각에도 “몇 가지 변화”가 있을 수 있다고 밝혀 추가 인적 개편 가능성을 시사했다."}, {"n": 5, "headline": "ECB 차기 총재 후보, 크노트·데코스 2파전", "summary": "크리스틴 라가르드 유럽중앙은행(ECB) 총재 의 후임 경쟁이 네덜란드의 클라스 크노트와 스페인의 파블로 에르난데스 데코스 간 2파전으로 좁혀지는 양상이다. 후보 추천 마감까지 네덜란드와 스페인만 각각 자국의 전 중앙은행 총재를 추천했으며, 유로존 재무장관들이 이들 후보를 9일 검토할 예정이다. 최종 결정은 각국 정상들에게 달려 있다. 다만 정치적 협상이 본격화하면 2019년 라가르드처럼 막판에 예상 밖의 후보가 등장할 가능성도 남아 있다."}]}, "daily": {"headline": "Nvidia’s spying scandal", "sections": ["The Nvidia affair", "Chart of the day"], "five": ["Nvidia shares are slumping 4.5% in premarket trading after CEO Jensen Huang admitted he had an affair with a suspected Chinese spy .", "Donald Trump struck a conciliatory tone about Iran over the weekend, saying it was “highly unlikely” he would order extensive strikes.", "US stocks look set for gains after the S&P 500’s biggest weekly drop since April 2025, with support from cheaper oil prices .", "Citigroup strategists downgraded US stocks and the global tech sector. They upgraded European equities on lower exposure to AI turbulence.", "Tesla will refund Cybertruck deposits to “a lot” of customers because it has more orders than it can process before ending production next year, according to Elon Musk."], "commentary": [{"heading": "The Nvidia affair", "summary": "The last thing tech-stock bulls needed was another obstacle to reviving the AI trade. That’s what they’re getting with Nvidia’s spy scandal.\n\nThere’s no immediate, direct impact on Nvidia’s sales and earnings. Still, the saga calls into question whether Jensen Huang will remain at the head of the company he co-founded and built into the world’s largest enterprise.\n\nMore importantly, his relentless appearances, featuring science lectures, dad jokes and his signature leather jackets, turned him into AI’s main cheerleader .\n\nNvidia was already under pressure, along with the rest of the AI trade. Investors worry that the company is involved in circular financing deals with customers, that the AI boom has turned into a bubble and, as of last week, that the newly empowered US Democratic Party will put the brakes on further development."}, {"heading": "Chart of the day", "summary": "A rising stock market and a growing economy are no consolation to many Americans who have been squeezed by years of rising costs ."}]}}, "2026-11-06": {"date": "2026-11-06", "morning": {"hook": "AI주 투매, 연준 동결베팅 등장", "line": "민주당의 미국 의회 장악이 AI 투자 붐에 제동을 걸 수 있다는 우려가 뒤늦게 본격 반영되면서 뉴욕증시가 5일 급락했다.", "markets": [{"name": "S&P 500", "value": "7,353.73", "change": "-4.4%"}, {"name": "Nasdaq 100", "value": "26,629.81", "change": "-6.4%"}, {"name": "US 10Y", "value": "4.84%", "change": "-0.05"}, {"name": "USD/KRW", "value": "₩1,358.97", "change": "+1.3%"}, {"name": "Bloomberg Dollar", "value": "1,222.27", "change": "+0.2%"}, {"name": "Brent", "value": "$98.91", "change": "+4.5%"}], "items": [{"n": 1, "headline": "AI 반도체 급락에 달러-원 50일 이평선 상향 돌파", "summary": "민주당의 ‘블루 웨이브’ 이후 AI 데이터센터 규제 우려가 커지고 미국 반도체주가 급락하면서 원화가 큰 폭으로 약세를 보였다. 달러-원 환율은 전일 대비 거의 16원 오른 1356원 부근까지 뛰어 한 달여 만에 최고 수준을 기록했으며, 7월 이후 처음으로 50일 이동평균선을 웃돌았다. 서울장에서는 코스피 급락과 외국인의 대규모 순매도에도 수출업체의 달러 매도 물량으로 환율 상승폭이 제한됐지만, 나스닥 100지수가 6% 넘게 급락하자 NDF 시장에서 원화 매도세가 거세졌다."}, {"n": 2, "headline": "AI 규제 우려, 스페이스X·코어위브 신용 직격탄", "summary": "AI 산업과 데이터센터에 대한 규제가 강화될 수 있다는 우려가 주식시장을 넘어 크레딧시장으로 확산했다. 코어위브의 한 회사채 금리는 사상 최고인 17%를 넘어섰고, 스페이스X 의 채무불이행 위험에 대비한 CDS 프리미엄도 역대 최고 수준으로 치솟았다. 미국 회사채 시장의 위험 지표들이 거의 8개월 만에 가장 큰 폭으로 악화된 가운데, 특히 스페이스X는 민주당의 의회 장악으로 일론 머스크에 대한 감독이 강화되고 테슬라와의 결합에 제동이 걸릴 수 있다는 우려까지 겹치면서 다른 하이퍼스케일러보다 CDS 상승폭이 두드러졌다."}, {"n": 3, "headline": "MS, 네오클라우드에 신중…데이터센터 지연·비용 부담", "summary": "마이크로소프트 (MS)가 데이터센터 건설 지연과 규제 문제, 비용 부담이 커지면서 네오클라우드 업체들과의 거래에 한층 신중해지고 있다. MS는 네비우스와 아이렌, 엔스케일의 일부 프로젝트에 대한 감독을 강화하고 위험하다고 판단한 사업에서는 발을 빼는 한편, 신규 네오클라우드 계약을 체결할지를 놓고 내부 논의를 벌이고 있다. 특히 아이렌의 텍사스 데이터센터는 케이블 설치 문제 등으로 완공이 수주에서 수개월 늦어질 가능성이 있으며, MS는 신규 외부 계약보다는 자체 데이터센터 확충에 초점을 맞추고 있다."}, {"n": 4, "headline": "BOE, 2023년 이후 첫 금리 인상…추가 인상 시사", "summary": "영란은행(BOE) 이 3년여 만에 처음으로 기준금리를 인상하고 향후 몇 달 안에 추가 긴축에 나설 가능성을 시사했다. 예상보다 매파적인 8대 1 표결로 기준금리를 25bp 올린 4%로 결정했으며, 캐서린 만 위원은 50bp 인상을 주장했다. 앤드류 베일리 총재는 인플레이션 위험이 완화되지 않는다면 추가 인상이 필요할 수 있다면서도 이번 결정이 장기간의 연속적인 금리 인상의 시작을 의미하는 것은 아니라고 강조했다. 시장은 12월 추가 인상 가능성을 약 50%로 반영했다."}, {"n": 5, "headline": "연준 해맥 “인플레 억제 위해 제약적 금리 필요”", "summary": "베스 해맥 클리블랜드 연은 총재는 인플레이션을 2% 목표로 되돌리기 위해 통화정책이 제약적 기조로 이동해야 한다며, 가능하면 작은 폭의 금리 조정을 보다 빈번하게 하는 방식을 선호한다고 밝혔다. 해맥은 이런 접근이 통화정책의 적기 대응에 도움이 되고 인플레이션 심리가 고착될 위험을 줄일 수 있다고 설명했다. 지난주 금리 동결에 반대한 두 명의 연준 인사 가운데 한 명인 해맥은 물가 압력이 공급과 수요 양쪽에서 광범위하게 나타나는 반면 노동시장에서는 오히려 다소 강화되는 신호가 보인다고 진단했다."}]}, "daily": {"headline": "Bull trap", "sections": ["Wrong-footed", "Bright spots"], "five": ["US stock futures are pointing higher after the Nasdaq 100 sank 6.4% on Thursday, wiping out $2.3 trillion in value in the biggest drop since 2020.", "The selling hit other markets, sending a benchmark for Asian stocks down almost 4%. UK and European stocks, which have been a relatively safe harbor, suffered smaller losses. Oil prices dipped.", "Losses at hedge funds are adding to the sense of unease as investors try to figure out whether the broad selloff is the start of a major pullback or just a temporary setback.", "ING is putting up for sale a roughly $500 million portfolio of data center loans all at once, days after a Democratic sweep of the US midterm elections raised doubts about the future of many of the projects.", "October jobs data will be released today. The report, which is expected to show nonfarm payrolls increased by 65,000, comes as expectations for additional Fed interest-rate hikes continue to fade ."], "commentary": [{"heading": "Wrong-footed", "summary": "Wall Street trading desks predicted the stocks rally would resume once the election was over. The market had other ideas .\n\nThe logic was that investors had been keeping cash on the sidelines ahead of US midterms, and with the election in the rearview mirror, they would jump back into a US stock market that’s been languishing for months.\n\nInstead, soon after the opening bell on the New York Stock Exchange, they rushed for the exits, pulling down everything from high-flying chipmakers like Nvidia to defensive fallbacks like Walmart."}, {"heading": "Bright spots", "summary": "Stock markets with relatively little exposure to the AI trade are giving investors somewhere to hide amid the AI rout. Indian stocks gained today and are heading for their biggest weekly gain in more than five years. Europe is benefitting too, just to a lesser extent.\n\nThe Stoxx Europe 600 withstood the selloff yesterday and is set for the biggest quarterly outperformance versus global stocks since early last year. The index is down today, but faring better than markets elsewhere.\n\n“Indiscriminate selling looks overdone vs likely policy outcomes given gridlock, but it may take time for the dust to settle,” said Emmanuel Cau of Barclays. “Europe may benefit relatively, particularly if oil tail risks recede.” — Charles Riley , with Michael Msika , Alex Gabriel Simon , Bhaskar Dutta , Subhadip Sircar"}]}}, "2026-11-05": {"date": "2026-11-05", "morning": {"hook": "의회 뺏긴 트럼프, 유가↓주가↑", "line": "미국 유권자들이 도널드 트럼프 대통령에게 역사적인 패배를 안기면서 민주당은 상·하원 모두에서 상당한 의석 우위를 확보했다.", "markets": [{"name": "S&P 500", "value": "7,688.62", "change": "+1.6%"}, {"name": "Nasdaq 100", "value": "28,437.17", "change": "+0.9%"}, {"name": "US 10Y", "value": "4.89%", "change": "-0.08"}, {"name": "USD/KRW", "value": "₩1,341.06", "change": "-0.3%"}, {"name": "Bloomberg Dollar", "value": "1,219.98", "change": "-0.4%"}, {"name": "Brent", "value": "$95.02", "change": "-8.3%"}], "items": [{"n": 1, "headline": "유가 폭락…‘블루 웨이브’에 이란전쟁 종식 기대", "summary": "민주당 압승으로 수개월째 이어진 이란 전쟁이 예상보다 빨리 끝날 수 있다는 기대가 커지면서 국제유가가 폭락했다. 브렌트유 는 장중 한때 10% 급락해 배럴당 93달러로 2개월 만에 최저 수준으로 내려왔고, WTI도 87달러대로 크게 떨어졌다. JD 밴스 부통령 이 공화당의 선거 패배를 해외 전쟁 탓으로 직접 돌리면서 유가는 낙폭을 확대했다. 척 슈머 상원 민주당 원내대표도 전쟁을 끝내겠다고 약속하며 일부 공화당 의원들의 동참을 예상했다. 삭소뱅크는 시장이 트럼프가 이란 문제를 털어내길 원한다는 쪽에 베팅하면서 어떤 형태로든 합의가 이뤄질 가능성이 커지고 있다고 진단했다."}, {"n": 2, "headline": "의회 뺏긴 트럼프, 관세·부채한도서 타협 가능성", "summary": "민주당이 상·하원을 모두 장악하면서 트럼프 대통령의 관세 정책 에도 변화 압력이 커질 전망이다. 민주당은 인플레이션을 부추겼다고 비판해온 트럼프 관세를 철회하는 방안을 의회 표결에 부쳐 수입관세를 낮추는 무역협정을 압박할 계획이다. 초기 타협 대상으로는 USMCA 개정이 거론되며, 트럼프 행정부는 이미 캐나다와 협상을 재개했다. 중간선거 참패 이후 관세에 반대하는 공화당 의원들이 늘어날 가능성도 있는 가운데, 관세를 낮추는 무역협정은 트럼프가 외국 정부의 양보를 성과로 내세우면서 정책을 전환할 수 있는 출구가 될 수 있다는 분석이다."}, {"n": 3, "headline": "민주당 압승에 AI·월가 규제 리스크 부상", "summary": "민주당 압승으로 트럼프 행정부에서 규제 완화의 혜택을 누려온 AI와 금융업계에 규제 강화 리스크 가 부상했다. 특히 텍사스에서 30여 년 만에 민주당 주지사로 당선된 지나 이노호사가 데이터센터 개발의 즉각적인 중단을 주장한 데 이어 조지아와 오하이오, 펜실베이니아에서도 규제 강화에 적극적인 민주당 후보들이 승리했다. 이에 따라 미국에서 계획된 AI 데이터센터 증설 물량의 절반가량이 보다 엄격한 지역사회의 심사와 반발에 노출될 수 있다. 텍사스만 해도 약 13기가와트 규모의 데이터센터 설비용량이 영향을 받을 수 있으며, 2028년 가동 예정인 미국 전체 데이터센터 용량의 약 30%가 텍사스에 집중돼 있어 사업 지연이 미국의 AI 인프라 확충 속도에도 영향을 미칠 수 있다는 분석이다."}, {"n": 4, "headline": "민주당 상원 장악…연준 독립성에 방어막", "summary": "민주당이 상원 주도권을 확보하면서 연준 을 재편하고 금리 정책에 영향력을 확대하려던 트럼프 대통령의 시도에 제동이 걸릴 전망이다. 민주당이 상원을 장악하면 백악관이 트럼프 충성파 인사를 연준 이사회에 임명하기 어려워지고, 엘리자베스 워런이 연준을 감독하는 상원 은행위원장을 맡을 가능성도 높다. 워런은 금리 결정에서 중앙은행의 독립성을 옹호해왔다. PGIM은 선거 결과로 트럼프가 연준에 행사할 수 있는 영향력이 줄면서 케빈 워시 의장이 높은 금리를 통해 인플레이션에 대응할 수 있는 재량이 넓어질 수 있다고 진단했다."}, {"n": 5, "headline": "美국채 발행 가이던스 수정…내년 장기물 축소 가능성", "summary": "미 재무부가 국채 발행 가이던스 를 수정하면서 내년 장기물 발행을 줄일 가능성을 열어뒀다. 재무부는 현재 예상되는 차입 수요를 감안해 향후 몇 분기 동안 고정금리 이표채와 변동금리채(FRN)의 입찰 규모를 유지할 것으로 예상했다. 다만 2년 넘게 사용해온 “최소 몇 분기 동안”이라는 표현에서 “최소”를 삭제했다. 재무부 차입자문위원회도 향후 20년물과 30년물 발행 조정 가능성을 논의했으며, 추가 발행이 필요할 경우 2∼10년 구간에 집중하는 것이 바람직하다는 데 대체로 의견을 같이했다."}]}, "daily": {"headline": "Strong finish", "sections": ["Finishing with a bang", "Debt ceiling looms"], "five": ["A rotation trade fueled by US elections entered a second day , with cyclical stocks outperforming at the expense of chipmakers. The Stoxx Europe 600 and the FTSE 100 were on a pace to close at all-time highs.", "Toyota shares climbed more than 16%, the most since 1987, after the automaker raised its profit forecast and stepped up shareholder returns.", "Goldman Sachs and Apollo are in talks with Wall Street investors to start selling portions of a roughly $40 billion chip financing deal for SpaceX.", "China has blocked the sale of ABB’s robotics unit to SoftBank, dealing a blow to the Japanese firm’s plans to expand into physical AI.", "The Bank of England looks ready to raise interest rates for the first time in more than three years. Consumer price inflation is seen at close to 5%."], "commentary": [{"heading": "Finishing with a bang", "summary": "Wall Street’s biggest trading desks are betting on a rally to close out 2026.\n\nWhile US stocks are poised for an underwhelming open on Thursday, the basic idea is that reduced policy uncertainty and lackluster investor positioning ahead of the midterm elections will combine to power a move higher into year-end.\n\n“With the election behind us and volatility potentially normalizing, there is considerable capacity for investors to rebuild risk,” said Citadel Securities’ Scott Rubner. “The path of least resistance for US equities is higher into year-end.”\n\nAmong the factors pointing to a potential rally:\n\nA bruising October triggered a sharp reduction in risk-taking among institutional investors. Hedge funds cut exposure to US equities. That’s now providing a favorable backdrop for stocks."}, {"heading": "Debt ceiling looms", "summary": "A divided US government means the debt ceiling is back in play .\n\nThe US is about $800 billion shy of its $41.1 trillion borrowing limit, and strategists expect the government to run out of road in the first half of next year.\n\n“The single biggest source of domestic policy uncertainty remaining in the US is the debt ceiling,” said George Saravelos of Deutsche Bank.\n\nA standoff could disrupt the bond market. During past confrontations, investors have sold Treasury bills maturing around the date the government was projected to run out of money, while buying securities maturing before or after the so-called X-date, creating a kink in the curve.\n\nThe curve shows little sign of concern right now, but that could change. — Michael MacKenzie"}]}}, "2026-11-04": {"date": "2026-11-04", "morning": {"hook": "‘블루웨이브’? 美선거후 랠리", "line": "도널드 트럼프 대통령의 남은 임기 2년을 좌우할 중간선거가 3일 미국 전역에서 실시됐다.", "markets": [{"name": "S&P 500", "value": "7,568.92", "change": "+0.4%"}, {"name": "Nasdaq 100", "value": "28,180.26", "change": "+0.7%"}, {"name": "US 10Y", "value": "4.96%", "change": "+0.05"}, {"name": "USD/KRW", "value": "₩1,345.02", "change": "+0.0%"}, {"name": "Bloomberg Dollar", "value": "1,224.77", "change": "+0.3%"}, {"name": "Brent", "value": "$104.40", "change": "-0.4%"}], "items": [{"n": 1, "headline": "美 ‘제한적’ 이란 공습에도 외교 해법 모색", "summary": "미국이 이란 을 제한적으로 공습했지만 양국은 전면전 재발을 피하기 위한 외교적 해법을 계속 모색하고 있다. 미국과 이란은 중재국들이 제시한 최신 제안을 검토 중이며, 2일 테헤란을 방문한 카타르 중재단은 양측으로부터 이틀 안에 답변을 받을 것으로 기대하고 있다. 트럼프 대통령은 이번 공습에 대해 “소규모 공격일 뿐 전쟁은 아니었다”고 밝혔고, 이란의 모하마드 바게르 갈리바프 의회 의장은 “전쟁을 막기 위한 공은 이제 미국 측에 넘어갔다”고 말했다. 다만 모흐센 레자이 이란 최고국가안보회의 사무총장은 미국의 답변이 “만족스럽지 않다”고 밝혔다."}, {"n": 2, "headline": "UBS, 美선거 이후 연말 랠리 가능성", "summary": "UBS는 증시가 연말 랠리를 펼칠 가능성이 있다고 진단했다. 역사적으로 우호적인 계절성과 낮은 헤지펀드 포지셔닝이 상승세를 증폭시킬 수 있다는 분석이다. 대형 기술기업 실적이 투자자들이 기대했던 안도감을 주지는 못했지만 “선거를 넘기는 것이 연말 숏스퀴즈 를 촉발할 촉매가 될 수 있다”고 내다봤다. S&P 500지수는 1950년 이후 11월에 평균 1.9% 올라 월별로 가장 강한 성적을 냈으며, 헤지펀드의 낮은 순익스포저까지 감안하면 선거라는 마지막 주요 변수를 넘긴 뒤 강한 랠리가 나타날 수 있는 여건이 조성됐다는 설명이다."}, {"n": 3, "headline": "ING, 민주당 의회 장악 시 달러 약세 리스크", "summary": "ING는 미국 중간선거에서 민주당이 상·하원을 모두 장악할 경우 달러가 단기적으로 약세를 보일 수 있다고 전망했다. 시장은 공화당의 하원 패배 가능성은 완전히 가격에 반영하고 있지만 민주당의 양원 장악 가능성은 일부만 반영하고 있다는 분석이다. 민주당이 압승할 경우 AI 규제가 강화되고 정부 지출 등을 둘러싼 정치적 교착 가능성이 커져 달러에 부담이 될 수 있다고 ING는 진단했다."}, {"n": 4, "headline": "주요 헤지펀드, ‘숨을 곳 없었던’ 10월 대부분 손실", "summary": "세계 주요 헤지펀드 들이 10월 코로나19 팬데믹 이후 가장 광범위한 부진 중 하나를 겪었다. 밀레니엄의 멀티스트래티지 펀드는 2.3% 손실을 냈고 마셜웨이스의 유레카 펀드는 5.4% 하락했다. 엑소더스포인트와 노스록도 각각 2.4%, 2.3% 밀렸으며, 크레딧 헤지펀드 아리니는 10월 23일까지 12.1% 급락했다. JP모간은 “10월은 대부분의 헤지펀드가 잊고 싶어 할 것“이라며 전략 전반에 걸쳐 ”사실상 숨을 곳이 없었다“고 평가했다."}, {"n": 5, "headline": "투자 불확실성에 비트코인 ETF 10억弗 순유출", "summary": "사상 최대 규모의 바이낸스 해킹과 미국 중간선거를 둘러싼 불확실성이 투자심리를 짓누르면서 미국 상장 비트코인 펀드에서 지난 2거래일간 10억달러 넘는 자금이 빠져나갔다. 블룸버그 집계에 따르면 10월 30일과 11월 2일 총 10억4천만달러가 순유출됐으며, 2일에만 블랙록의 아이셰어즈 비트코인 트러스트에서 4억500만달러가 빠져나갔다. 비트코인은 3일 7만7000달러 부근에서 거래되며 장중 100일 이동평균선을 밑돌기도 했다."}]}, "daily": {"headline": "Election reaction", "sections": ["Repricing markets", "Oil and bonds"], "five": ["Democrats swept into power in Congress, with outrage over the cost of living and the Iran war leading to a thundering rebuke of Donald Trump.", "Stocks and Treasuries gained and the dollar fell. Trump said he would accept the outcome, prompting investors to buy the recent dip in equities.", "AI chipmaker Advanced Micro Devices gave a sales forecast that soared past analysts’ projections . The stock jumped 6% in premarket trading.", "Novo Nordisk is rallying 4.1% in Copenhagen after the drugmaker again boosted its forecast on sales of the new Wegovy obesity pill.", "CVS Health plans to spin off its retail pharmacy business , according to media reports, in what would be one of the biggest-ever breakups in the healthcare industry."], "commentary": [{"heading": "Repricing markets", "summary": "Investors are waking up today to a radically different political world in the US. Here’s how they’re reacting :\n\nUS equity index futures initially slumped overnight, only to erase losses as investors bought the recent dip . Stocks had fallen ahead of the vote on disappointing tech earnings and concern the AI buildout would face greater scrutiny from Democrats.\n\nUS Treasuries are rallying on the view that the political environment may limit the Trump administration’s tax and spending plans .\n\nThe dollar sank the most in two months , emerging as the clearest knee-jerk casualty from the vote. Political gridlock and tougher regulation could damp foreign demand for US assets.\n\nShares of US data-center operators and cloud computing providers are falling after a backlash against data centers helped Democrats to their victory. Iren is down 3.9% and CoreWeave is 3.3% lower."}, {"heading": "Oil and bonds", "summary": "It was a safe bet for much of the year: higher oil prices are bad for government bonds. Now the link has been broken as money managers worry more about growth and less about inflation.\n\nBrent crude prices and yields on 10-year Treasuries shot up in tandem when the US and Israel attacked Iran and the correlation stayed tight before peaking on Sept. 15. Since then it has reversed. Similar trends have been seen in German and UK government bonds.\n\nThe break is increasing the appeal of bonds, despite the risk of a flare-up in violence that could lead to another oil price spike. Traders say interest rates can’t rise much further given the economic damage already being caused by the energy shock and higher borrowing costs."}]}}, "2026-11-03": {"date": "2026-11-03", "morning": {"hook": "나스닥100 조정, 미·이란 협상", "line": "미국 중간선거를 하루 앞두고 미·이란 협상 기대에 국제유가가 급락해 WTI가 배럴당 100달러 아래로 내려갔지만, 휘발유 가격 부담에 시달려온 민심을 돌리기에는 너무 늦었다는 지적이 나온다.", "markets": [{"name": "S&P 500", "value": "7,541.40", "change": "-0.5%"}, {"name": "Nasdaq 100", "value": "27,989.82", "change": "-1.4%"}, {"name": "US 10Y", "value": "4.91%", "change": "-0.02"}, {"name": "USD/KRW", "value": "₩1,346.39", "change": "+0.9%"}, {"name": "Bloomberg Dollar", "value": "1,221.02", "change": "-0.2%"}, {"name": "Brent", "value": "$104.18", "change": "-8.2%"}], "items": [{"n": 1, "headline": "미·이란 외교 돌파구 기대…유가급락", "summary": "이란 최고지도자 모즈타바 하메네이가 정부에 평화협상을 추진할 수 있는 권한을 부여하면서 미국과 이란 간 외교적 돌파구에 대한 기대가 커지고 있다. 마수드 페제시키안 대통령은 대화를 통한 문제 해결을 위해 최고지도자가 정부에 일정한 권한을 부여했다고 밝혔고, 압바스 아라그치 외무장관은 중재국을 통한 협의가 “매우 치열하게” 진행되고 있다며 미국이 이란의 조건을 수용할 경우 호르무즈 해협을 다시 개방하고 협상을 재개할 준비가 돼 있다고 말했다."}, {"n": 2, "headline": "메타·알파벳·오라클, AI 자금조달 러시", "summary": "메타 가 AI 투자 확대를 위해 최소 200억달러 규모의 글로벌 투자등급 채권 발행을 검토하고 있다. 투자자 수요에 따라 규모가 더 커질 수 있으며, 성사되면 6개월 만의 대규모 채권 발행이자 첫 유로화 채권 발행이 된다. 알파벳 도 2∼19년 만기의 유로화 채권으로 60억유로를 조달할 예정이며, 오라클 은 채권 100억달러와 비슷한 규모의 보통주를 합쳐 200억달러의 자금조달에 나섰다. 막대한 AI 투자의 수익성에 대한 회의론이 커지면서 투자자들은 빅테크 채권에 더 높은 프리미엄을 요구하고 있다."}, {"n": 3, "headline": "앤트로픽, 매출 급증 속 8950억달러 약정 부담", "summary": "인공지능(AI) 스타트업 앤트로픽 의 3분기 매출이 약 170억달러로 전년 동기 14억달러의 12배 수준으로 급증했다. 다만 향후 컴퓨팅과 인프라 등에 투입할 계약상 약정액도 8950억달러에 달하며, 이 가운데 약 4480억달러가 2030년 말까지 집행될 예정이다. 추수감사절 이전 IPO를 목표로 하는 앤트로픽은 스페이스X가 상장 당시 조달한 862억달러에 맞먹거나 이를 웃도는 자금 조달을 추진하고 있으며, 적정 기업가치는 약 1.4조∼1.5조달러로 거론된다."}, {"n": 4, "headline": "중국, ‘느린 강세장’ 위해 증시 지원 확대", "summary": "중국 당국이 최근 증시 급락에 대응해 시장 안정과 투자심리 회복을 위한 지원책을 확대한다. 중국인민은행(PBOC)은 증권사와 펀드, 보험사를 대상으로 한 스와프 제도를 적절한 시기에 가동하고 참여 기관 확대와 수수료 인하를 추진하기로 했다. 자사주 매입과 주요 주주의 지분 확대를 지원하는 재대출 금리는 1.25%에서 1%로 낮추고 제도를 상시화한다. 중국 증권감독관리위원회(CSRC)도 수일 내 3차 스와프 오퍼레이션을 시작하고 재대출 지원 대상을 주요 지수 구성 종목과 대표 기술기업 등으로 확대할 계획이다."}, {"n": 5, "headline": "골드만삭스, 트레이더·뱅커 일부 AI 도구 사용 제한", "summary": "골드만삭스 가 생산성과 리스크에 대한 검토를 거쳐 앤트로픽의 ‘클로드 코드’와 마이크로소프트의 깃허브 등 첨단 코딩용 AI 도구 사용을 엔지니어로 제한했다. 일부 트레이더들은 고객 거래 흐름 모니터링과 시장 변화·포지션 모델링, 콘텐츠 제작 등에 AI 도구를 활용해 업무 속도를 높여왔다며 불만을 나타낸 것으로 전해졌다. 다만 트레이딩과 퀀트 리서치, 소프트웨어 엔지니어링을 아우르는 ‘스트랫’ 직원들은 이번 제한 대상에서 제외됐다."}]}, "daily": {"headline": "China stimulus falls flat", "sections": ["China tries shock and awe", "Buoyant Bitcoin"], "five": ["US stock futures fell as oil prices rebounded on worries that America and Iran remain far apart on a peace deal. Voters go to the polls in the US.", "Apple shares are dropping 3.7% in premarket trading after the company warned that profit margins would be thinner than projected .", "Walt Disney is moving toward thousands of job cuts and asking some managers to target 20% in annual cost savings.", "Iran and the US are reviewing the latest proposals from mediators on how to bridge their divides and avert another round of all-out war .", "Meta is considering a potential bond offering of at least $20 billion in the wake of financings for Oracle and Alphabet to pay for AI projects."], "commentary": [{"heading": "China tries shock and awe", "summary": "China’s top economic officials are talking up openness in Hong Kong. Back on the mainland, authorities are showing investors just how active they remain in steering markets.\n\nAs Vice Premier He Lifeng pledged support for a free and open economic environment in Hong Kong , policymakers in Beijing were deploying an array of measures aimed at influencing asset prices. The central bank moved to cool the yuan’s longest winning streak in three decades, while regulators revived stock-market rescue tools and took steps to encourage more share buybacks.\n\nThe flurry of intervention highlights the balancing act Beijing faces as it seeks to attract global capital and promote the yuan internationally while retaining firm control over markets at home."}, {"heading": "Buoyant Bitcoin", "summary": "Since the record cyber theft against the world’s largest crypto exchange last week, traders bracing for the worst have instead watched Bitcoin defy gravity .\n\nThe cryptocurrency is changing hands at almost $77,000 today. It’s down roughly 6% from Thursday’s high before Binance disclosed the $6.3 billion hack. The response from Binance, which promised from the start to cover all losses, helped cushion the decline.\n\nBitcoin was already under pressure from a selloff in risk assets, so its relative buoyancy underscores how differently traders are treating the incident than the 2022 collapse of the exchange FTX. In that episode, Bitcoin fell 19% over three days as Sam Bankman-Fried’s company tumbled into bankruptcy.\n\n“The market treated this as an operational shock, not a systemic one,” said Kelly Ye at Talos. — Suvashree Ghosh and Sidhartha Shukla"}]}}, "2026-11-02": {"date": "2026-11-02", "morning": {"hook": "무자비한 AI 매도, 이란확전우려", "line": "11월 3일 미국 중간선거를 앞두고 기술주와 암호화폐에 대규모 매도가 쏟아지면서 뉴욕증시가 30일 급락했다.", "markets": [{"name": "S&P 500", "value": "7,580.07", "change": "-1.8%"}, {"name": "Nasdaq 100", "value": "28,384.85", "change": "-3.5%"}, {"name": "US 10Y", "value": "4.93%", "change": "-0.01"}, {"name": "USD/KRW", "value": "₩1,333.98", "change": "-0.6%"}, {"name": "Bloomberg Dollar", "value": "1,223.01", "change": "-0.1%"}, {"name": "Brent", "value": "$113.43", "change": "+2.4%"}], "items": [{"n": 1, "headline": "유가 다시 들썩…이란 확전 vs 외교 돌파구", "summary": "미국과 이란의 외교적 접촉이 다시 활발해지고 있지만 군사적 긴장이 높아지면서 국제유가의 추가 상승 위험도 커지고 있다. 모즈타바 하메네이 이란 최고지도자는 미국과 이스라엘의 유·무형 자산을 타격 범위에 두고 어떤 위협에도 “지리적 제한 없이” 대응하도록 군에 지시했다. 미국은 아직 이란 공습 재개 여부를 결정하지 않았다고 밝혔지만 미 중부사령부가 트럼프 대통령에게 군사적 선택지를 보고한 가운데, 브렌트유 는 30일 장중 배럴당 118달러를 터치했고 WTI도 한때 105달러에 육박했다. 최근 호르무즈 해협에서 유조선 두 척이 공격받은 점도 공급 차질 우려를 키우고 있다."}, {"n": 2, "headline": "월가, 기술주 가차없는 매도…이익 성장 정점 우려", "summary": "월가에서 기업 실적이 시장 기대에 못 미칠 경우 주가를 가차없이 끌어내리는 흐름이 두드러지고 있다. 아마존은 실망스러운 실적에 30일 장중 급락했고, 앞서 알파벳도 사상 최대 낙폭을 기록했다. 커뮤니케이션 서비스 업종에서는 실적이 기대에 못 미친 기업들이 블룸버그가 관련 자료를 집계하기 시작한 2019년 이후 가장 혹독한 매도세 에 시달렸고 기술업종도 비슷한 흐름이다. 특히 AI 관련 기업들의 이익 성장세가 정점을 지났을 수 있다는 우려가 투자자들의 민감도를 높이고 있다."}, {"n": 3, "headline": "S&P, 메타 신용등급 전망 ‘부정적’으로 하향", "summary": "S&P 글로벌 레이팅스가 인공지능(AI) 관련 대규모 지출로 재무 부담이 커지고 있다며 메타플랫폼스 의 ‘AA-’ 신용등급 전망을 ‘부정적’으로 하향했다. S&P는 메타의 AI 투자 수익화 능력이 동종업체보다 제한적인 데다 자본지출이 얼마나 오래 높은 수준을 유지하고 잉여영업현금흐름이 마이너스를 지속할지 불확실하다고 지적했다. 이번 조치는 향후 2년 내 등급 강등 가능성을 시사하지만 당장 강등을 검토하고 있다는 의미는 아니다. 메타는 S&P의 평가에 동의하지 않는다며 AI에서 상당한 제품 및 사업 기회를 보고 있다고 반박했다."}, {"n": 4, "headline": "연준 인사들 추가 금리인상 지지…점진적 긴축 강조", "summary": "연준 인사들이 추가 금리 인상 필요성을 잇따라 강조하면서도 경제와 금융시장에 미칠 충격을 줄이기 위해 점진적으로 긴축해야 한다는 데 한목소리를 냈다. 로리 로건 댈러스 연은 총재는 현재 전망을 감안할 때 “최소 두 차례 더 25bp씩” 금리를 올려야 한다며, 한 차례 회의를 건너뛰더라도 통화정책의 최종 목적지가 달라지는 것은 아니라고 말했다. 다만 두 차례 추가 인상 이후에는 경제와 금융시장 상황을 평가하기 위해 일단 멈춰 추가 긴축 필요성을 판단해야 한다고 덧붙였다."}, {"n": 5, "headline": "美 중간선거 교착에도 달러 강세 지속 전망", "summary": "미국 중간선거가 정국 교착으로 이어지더라도 높은 금리와 AI 관련 자금 유입을 바탕으로 달러 강세 가 지속될 수 있다는 전망이 나온다. 매뉴라이프는 선거 결과의 장기적 영향을 과대평가해서는 안 된다며 외환시장은 상대적인 성장률과 인플레이션, 금리, 자본 흐름에 더 크게 좌우된다고 지적했다. 씨티그룹은 과거 중간선거 이후, 특히 분점정부가 들어설 경우 달러가 약세를 보이는 경향이 있지만 이번에는 다른 요인들이 반대 방향을 가리키고 있어 약세가 나타나더라도 단기에 그칠 것으로 내다봤다."}]}, "daily": {"headline": "Betting on a stocks bounce", "sections": ["Midterm optimists"], "five": ["Oil slumped after Axios reported that Donald Trump wants to give diplomacy with Iran more time before any move to resume strikes. US stock-index futures advanced .", "Alphabet kicked off its second sale of euro bonds this year, testing investor demand less than a week after its disappointing earnings sent the stock to a record drop.", "Shares of Japanese memory-chip maker Kioxia sank 16% after the company’s cautious outlook inflamed concerns that the explosive growth driven by AI may be leveling off.", "Trump said a US-Canada trade deal is “very close” after talks with Prime Minister Mark Carney.", "Ray-Ban heir Leonardo Maria Del Vecchio proposed buying out family members at a reported €29.6 billion valuation, in a bid to keep the EssilorLuxottica eyewear fortune away from a Czech arms billionaire."], "commentary": [{"heading": "Midterm optimists", "summary": "Tomorrow’s midterm elections look set to upend the balance of power in the US Congress, if the polls are right. Bulls on stocks and the dollar, though, are betting that any market disruption is likely to be short lived.\n\nFirst up, stocks: The conventional wisdom is that a big win for Democrats will cause a selloff. The view is that the party is likely to put roadblocks in the way of the AI industry that’s been driving gains for the better part of four years. (The S&P 500 has returned 12% this year.)\n\nBut Mike Wilson from Morgan Stanley points out that history going back to 1950 is on the side of equity investors — six to 12 months after the midterms, the market is always higher.\n\n“The track record is pretty good,” he said. “Now we may need to go down first and then up, but yeah, I’m pretty convinced that we’re going to have a pretty good at least six month period, maybe 12.”"}]}}, "2026-10-30": {"date": "2026-10-30", "morning": {"hook": "AI ‘헝거게임’, 선거앞 이란압박", "line": "뉴욕증시는 일부 빅테크의 실적 실망에 막대한 인공지능(AI) 투자가 충분한 수익을 낼지에 대한 의구심이 되살아남에 따라 기술주를 중심으로 하락했다.", "markets": [{"name": "S&P 500", "value": "7,720.39", "change": "-0.3%"}, {"name": "Nasdaq 100", "value": "29,402.51", "change": "-1.4%"}, {"name": "US 10Y", "value": "4.94%", "change": "-0.08"}, {"name": "USD/KRW", "value": "₩1,340.53", "change": "-0.1%"}, {"name": "Bloomberg Dollar", "value": "1,224.69", "change": "+0.0%"}, {"name": "Brent", "value": "$115.54", "change": "+0.2%"}], "items": [{"n": 1, "headline": "알파벳 AI 투자 리스크 눈덩이", "summary": "알파벳 의 인공지능(AI) 투자와 관련한 잠재적 부담이 당초 알려진 것보다 큰 것으로 나타났다. 29일 공개된 분기 보고서에 따르면 알파벳은 1조달러 이상의 구매 약정과 향후 리스 등 미래 의무 외에도 특정 조건에서 부담해야 할 수 있는 약 985억달러의 우발적 약정을 보유하고 있다. 이는 한 분기 전보다 약 230억달러 증가한 규모로, 데이터센터 임대료 지급 보증과 파트너의 전력 장비 구매 보증, 고객에게 판매한 AI 칩 시스템을 되사야 할 수 있는 의무 등이 포함된다."}, {"n": 2, "headline": "마이크로소프트 대규모 회사채 발행", "summary": "마이크로소프트 가 거의 10년 만에 추진하는 대규모 회사채 발행에 한때 1150억달러가 넘는 주문이 몰렸다. 최소 250억달러 규모로 예상되는 이번 발행은 만기 2~40년의 최대 10개 트랜치로 구성되며, 미국 회사채 발행 사상 가장 강한 수요를 기록한 사례 중 하나다. AI 관련 채권 공급이 급증한 가운데서도 마이크로소프트가 무디스와 S&P글로벌로부터 받은 최고 등급 AAA와 6%를 웃돌 것으로 예상되는 장기채 금리가 투자자들을 끌어들인 것으로 풀이된다."}, {"n": 3, "headline": "이란, 밴스 서한 받아…이스라엘 총선 네타냐후 진영 53석", "summary": "이란 은 JD 밴스 미국 부통령이 보낸 서한을 받았지만 종전을 위한 기존 조건에서 물러설 생각이 없음을 시사했다. 갈리바프 이란 의회 의장은 “이란의 조건은 중재국들에 반복해서 명확하게 전달됐다”며 “당근과 채찍 방식은 이란에 아무런 효과가 없다”고 밝혔다. 다만 아라그치 외무장관은 이란군이 방어 준비가 돼 있다면서도 “외교가 성공할 기회를 계속 주고 있다”고 말했다. 밴스의 이례적인 접촉은 8개월째 이어진 전쟁을 끝내기 위한 협상이 교착상태에 빠진 가운데 트럼프 대통령이 이란에 대한 공습 재개를 거듭 경고하는 상황에서 이뤄졌다."}, {"n": 4, "headline": "美 성장·물가 강세…해싯 “물가 높으면 연준 행동”", "summary": "미국 경제 가 견조한 소비와 기업투자에 힘입어 3분기에 1년 만에 가장 빠른 속도로 성장했다. 3분기 실질 GDP는 연율 3.4% 증가해 2분기 2.2%에서 가속했고 시장 예상도 웃돌았다. 기업투자는 AI 관련 지출에 힘입어 2020년 이후 최대인 12.7% 급증했으며, 가계 소비도 2개 분기 연속 연율 3.8% 증가했다. 특히 장비 투자의 성장 기여도는 팬데믹 이후 반등기를 제외하면 2011년 이후 가장 높았다."}, {"n": 5, "headline": "ECB, 금리 동결...라가르드 조기 퇴임", "summary": "유럽중앙은행 (ECB)이 29일 금리를 동결한 가운데 크리스틴 라가르드 총재는 에너지발 인플레이션이 다른 부문으로 확산될 위험을 낮게 평가했다. ECB 정책위원들은 금리 인상 방안을 논의했지만, 급등한 에너지 가격이 과도한 임금 인상 요구나 기대 인플레이션의 뚜렷한 상승으로 이어지고 있다는 증거가 부족하다고 판단했다. 다만 라가르드는 ECB가 나아갈 방향은 “분명하다”며 추가 긴축 가능성을 열어뒀고, 시장도 한때 12월 25bp 인상 확률을 88%로 높였다."}]}, "daily": {"headline": "Tech slowdown", "sections": ["Tech slowdown", "Bond revival"], "five": ["Binance suffered the cryptocurrency industry’s biggest-ever hack , with $6.3 billion of funds affected. The exchange said it will cover all losses.", "Intel shares are plummeting 25% after the chipmaker’s forecast missed analysts’ estimates, hurt by sputtering demand for PC processors and supply-chain problems.", "Amazon’s slumping too, down 6.6%, after the company reported greater capital spending than anticipated and the slowest e-commerce growth in three years.", "US stock-index futures are dropping as those disappointing earnings accelerate a shift by investors out of tech stocks . Crude oil gained on signs the US may resume military strikes against Iran .", "BP’s profit surged to the highest in 18 years thanks to soaring oil-refining margins."], "commentary": [{"heading": "Tech slowdown", "summary": "The message from this week’s Big Tech earnings is hardly reassuring for investors .\n\nThe core businesses of America’s technology giants — the advertising, consumer and retail machines propping up a collective $750 billion in AI spending this year — are starting to show signs of slowing. In some cases, they’re being cannibalized by the very technology the companies are betting the house on.\n\nGoogle owner Alphabet reported that ad sales from search and other channels — accounting for roughly half of overall revenue — grew at the slowest pace in five quarters. Amazon said yesterday that growth in e-commerce and advertising slowed last quarter. Microsoft and Meta similarly posted results that ultimately underwhelmed investors."}, {"heading": "Bond revival", "summary": "Long-dated government bonds spent much of the year punishing anyone brave enough to own them. Now yields are high enough that some investors are coming back , particularly with stocks looking rocky.\n\nThe 10-year US Treasury peaked at almost 5.4% this month, the highest since 2002, while Japanese yields reached a three-decade high of 3.14%. They’ve since fallen, rewarding investors with a return of 2.2% in October on a gauge of global government bonds maturing in 10 years or more — the first month since February in which longer bonds outperformed shorter-term securities.\n\nThere are still plenty of skeptics out there though, who point out that the dangers that sent yields so high in the first place are still looming. Energy-driven inflation, tighter monetary policy and deteriorating government finances haven’t disappeared. The price of taking those risks has simply become more attractive."}]}}, "2026-10-29": {"date": "2026-10-29", "morning": {"hook": "‘비둘기’ 연준, 대이란 공격대비", "line": "연준이 시장 예상대로 기준금리를 동결하고 인플레이션 억제에 대한 의지를 재확인했지만, 12월 차기 회의에서 금리 인상 가능성에 대한 명확한 신호는 제시하지 않았다.", "markets": [{"name": "S&P 500", "value": "7,743.98", "change": "+0.3%"}, {"name": "Nasdaq 100", "value": "29,813.16", "change": "+0.5%"}, {"name": "US 10Y", "value": "5.02%", "change": "+0.02"}, {"name": "USD/KRW", "value": "₩1,342.83", "change": "+0.0%"}, {"name": "Bloomberg Dollar", "value": "1,224.08", "change": "-0.1%"}, {"name": "Brent", "value": "$114.13", "change": "+0.2%"}], "items": [{"n": 1, "headline": "연준, 10:2로 금리 동결…워시 “필요시 행동”", "summary": "연방공개시장위원회 (FOMC)는 10대 2로 연방기금금리 목표범위를 3.75~4%로 유지하기로 결정했다. 리사 쿡 연준 이사와 베스 해맥 클리블랜드 연은 총재는 25bp 인상을 주장하며 반대표를 던졌다. 워시 연준 의장은 “상황이 요구하는 대로 행동할 준비가 돼 있다”며 필요시 금리를 올릴 가능성을 열어뒀다. 시장에서는 12월 금리 인상 전망이 유지됐지만, 2027년 추가 인상에 대한 베팅은 줄었다."}, {"n": 2, "headline": "美 이란 재공격 가능성에 유가 상승", "summary": "미국이 다음 주 중간선거 이후 이란에 대한 군사 공격을 재개할 가능성이 제기되면서 국제유가 가 상승했다. 월스트리트저널은 미국이 페르시아만의 여러 국가에 단기간의 강도 높은 군사작전에 대비하라고 통보했으며, 트럼프 대통령이 아직 최종 결정을 내리지는 않았지만 선거 이후 대규모 공격을 단행하는 쪽으로 기울고 있다고 보도했다. ING는 “시장이 재확전 가능성을 더 높게 가격에 반영하고 있다”며 미국이 중간선거 이후 어떤 행동에 나설지에 유가가 민감하게 반응할 것으로 내다봤다. 브렌트유는 한때 배럴당 116달러를 넘어섰고 WTI는 103달러를 웃돌았다."}, {"n": 3, "headline": "AI 부채 공급 한계 조짐…핌코는 일찌감치 축소", "summary": "AI 인프라 구축을 위한 부채 발행이 급증하면서 월가 신용시장 의 자금 공급 여력이 한계에 가까워지고 있다는 경고가 나오고 있다. 올해 전 세계 AI 관련 부채 조달은 사상 최대인 4600억달러에 달했고, 데이터센터 관련 채권과 대출 가운데 최소 18건의 금리가 두 자릿수로 치솟았다. 브로드컴과 스페이스X, 오라클 등의 신용부도스와프(CDS) 비용도 급등했다. 향후 수년간 수조달러의 추가 부채가 필요한 상황에서 빅테크가 원하는 자금 규모와 금융권의 공급 능력, 투자자들의 실제 수요 사이의 괴리가 커지고 있다. 은행과 보험사들의 데이터센터 익스포저도 한계에 접근하면서 기존 위험을 다른 투자자에게 넘겨 신규 대출 여력을 확보하기가 갈수록 어려워지고 있다."}, {"n": 4, "headline": "캐나다, 25bp 금리 인상…추가 인상 가능성 시사", "summary": "캐나다 중앙은행 (BOC)이 에너지 가격 상승에 따른 인플레이션 위험에 대응해 기준금리를 25bp 올린 2.5%로 인상했다. 3년여 만의 첫 인상으로, BOC는 높은 에너지 가격이 다른 상품과 서비스 가격으로 광범위하게 번질 위험을 차단하기 위한 조치라고 설명했다. 2027년 소비자물가 상승률 전망을 기존 2.0%에서 3.1%로 대폭 높이고, 물가가 2% 목표로 복귀하는 시점도 2028년 중반으로 예상했다. 추가 금리인상이 필요할 수 있다면서도 불확실성을 감안해 “신중하게 진행하겠다”고 밝혔다."}, {"n": 5, "headline": "파키스탄, 대만 항공사 영공 통과 다시 허용…전격 선회", "summary": "파키스탄 이 대만 항공사들의 자국 영공 통과를 다시 허용하며 중국의 ‘하나의 중국’ 원칙을 이유로 영공 이용을 막았던 조치에서 전격 선회했다. 파키스탄 민간항공청은 중화항공과 에바항공에 28일부터 내년 3월 27일까지 자국 영공을 이용할 수 있도록 허가했다. 불과 몇 시간 전 카와자 아시프 파키스탄 국방장관 겸 항공장관은 “하나의 중국 정책을 따르고 있다”며 중국 항공사에만 영공 통과를 허용한다고 밝힌 바 있다."}]}, "daily": {"headline": "AI credit anxiety", "sections": ["AI’s debt deluge", "Latin stock drought"], "five": ["Alphabet tumbles 10% after sales underwhelmed, reinforcing concerns that Google is losing ground to AI rivals despite pouring hundreds of billions of dollars into the technology.", "Samsung also disappointed and left investors waiting for details of a new plan to return more cash to shareholders. Nasdaq futures sink 1%.", "In what could be an AI mega deal, Marvell is in talks to buy data center optics maker Lumentum . Lumentum, backed by Nvidia, has a market value of $83 billion.", "Christine Lagarde announced she’ll leave the ECB in early 2027, kickstarting the race to replace her.", "Also on the central bank front: the ECB is set to keep interest rates on hold today. While the Fed also held, Kevin Warsh telegraphed the potential for more hikes without explicitly saying it."], "commentary": [{"heading": "AI’s debt deluge", "summary": "A new anxiety is gripping Wall Street as it bankrolls the vast network of data centers and chips behind the AI boom: Early signs suggest the credit market is approaching the limits of how much more debt it can absorb.\n\nOne after another, yields are soaring into the double digits on bonds and loans funding the buildout. Bankers are finding it more difficult to offload risk to insurers and other investors. Elon Musk himself warned the other day that hundreds of so-called neoclouds risk going under as firms get cut off from fresh financing."}, {"heading": "Latin stock drought", "summary": "Two decades into the collapse in Latin American stock markets, Scott Piper likes to joke that investing in the region has become such a lonely job that he’s the last of his breed.\n\nPiper, 58, got his first gig trading the region’s stocks in the mid-1990s, just a few years before a commodities boom would turbocharge the region’s economies and markets. Back then, Wall Street was ginning up new Latin America-dedicated funds seemingly every other day. Their numbers just kept growing, surpassing 660 by 2015.\n\nToday, after scores of mergers, sales and closures, there are just 226 such funds across the globe , according to data compiled by Bloomberg Intelligence.\n\nOne by one, “people have sort of disappeared,” says Piper, who runs about $5 billion for Itau Unibanco’s asset-management unit out of New York."}]}}, "2026-10-28": {"date": "2026-10-28", "morning": {"hook": "네타냐후 열세, 美채권시장 경고", "line": "주요 빅테크 실적 발표와 연준의 금리 결정을 앞두고 뉴욕증시에서 기술주가 랠리를 펼쳤다.", "markets": [{"name": "S&P 500", "value": "7,722.60", "change": "+0.6%"}, {"name": "Nasdaq 100", "value": "29,651.44", "change": "+1.3%"}, {"name": "US 10Y", "value": "5.00%", "change": "+0.01"}, {"name": "USD/KRW", "value": "₩1,327.00", "change": "-0.0%"}, {"name": "Bloomberg Dollar", "value": "1,225.31", "change": "+0.2%"}, {"name": "Brent", "value": "$114.07", "change": "-1.5%"}], "items": [{"n": 1, "headline": "美 의회 교착은 호재? 채권시장 ‘이번엔 다르다’", "summary": "미국 중간선거 이후 의회 교착 가능성이 커지고 있지만 채권 투자자들은 과거처럼 이를 미국채 호재로 받아들이기 어렵다고 보고 있다. 1990년대 중반 이후 백악관과 의회의 권력 구도가 엇갈린 경우 대규모 지출 법안 통과가 어려워지면서 10년물 국채 금리가 대체로 하락했지만, 이번에는 재정적자가 GDP의 약 6%에 달하고 민간 보유 연방정부 부채도 32조달러를 넘어선 상태다. 다이아몬드힐은 지출과 부채를 통제하기 위한 실질적인 정책 조치가 나오지 않는다면 부채가 계속 늘어나는 만큼 “금리가 더 오를 위험이 있다”고 진단했다."}, {"n": 2, "headline": "美 소비심리·기업투자 개선…주택시장은 부진", "summary": "미국의 소비자신뢰 가 고용시장과 기업 여건에 대한 평가 개선에 힘입어 10월 예상 밖으로 반등해 4개월 만에 상승세로 돌아섰다. 컨퍼런스보드 소비자신뢰지수는 전월보다 7.5포인트 오른 91.7로 6월 이후 최고치를 기록해 시장 전망을 모두 웃돌았고, 현재상황지수도 4월 이후 최고 수준으로 올라섰다. 일자리가 풍부하다고 답한 비율은 6개월 만에 최고치를 기록했다. 다만 높은 물가와 금리 상승에 따른 생활비 부담은 여전했다."}, {"n": 3, "headline": "노보그라츠 “신용 불안 정점 근접…AI자금조달 우려 완화”", "summary": "갤럭시디지털의 마이클 노보그라츠 최고경영자(CEO)는 인공지능(AI) 투자 확대를 둘러싼 글로벌 신용시장의 불안이 정점에 가까워졌으며 조만간 완화될 것으로 전망했다. 그는 “신용시장이 소화불량을 겪고 있다”며 “아마 불안감이 정점에 가까워진 것 같다”고 말했다. 최근 코어위브의 정크본드 금리가 부실 위험을 나타내는 수준까지 급등하면서 AI 기업들의 막대한 자금조달 수요가 신용시장을 압박할 수 있다는 우려가 커진 바 있다."}, {"n": 4, "headline": "PE업계, AI 충격에 디폴트 유예 조항 추진", "summary": "사모펀드(PE) 업계가 AI로 인한 사업 차질에 대비해 대출계약에 불가항력과 유사한 조항을 도입하고 있다. AI 충격으로 디폴트가 발생했다고 판단할 경우 채권자의 조치를 일정 기간 유예할 수 있도록 하는 내용으로, 지난 9월 이후 최소 두 건의 차입매수(LBO) 금융에서 이 같은 조항이 등장했다. H.I.G.캐피털은 독일 인프라 엔지니어링·건설 서비스 업체 테라스그룹의 지분 과반 인수를 위한 4억7000만유로 규모 대출에 해당 조항을 포함시켰다."}, {"n": 5, "headline": "이란, 美에 종전 조건 재확인…중동 외교전 분주", "summary": "이란 최고지도자 모즈타바 하메네이가 미국과의 전쟁을 끝내기 위한 기존 조건을 재확인했다. 이란은 평화협상의 전제조건으로 미국이 페르시아만의 이란 항구들에 대한 해상 봉쇄를 해제하고 대이란 제재를 철회해야 한다고 요구해왔다. 반면 미국은 이란의 핵 프로그램에 대한 양보를 요구하고 있다. 하메네이는 국가안보 책임자 모센 레자이와 호르무즈 해협에 대한 통제권을 통한 국가 및 역내 안보 문제도 논의했다. 이란은 에너지 수송의 핵심 통로인 호르무즈 해협에 대한 통제권 유지를 주장하는 반면 미국은 자유로운 통항을 요구하고 있다."}]}, "daily": {"headline": "Microsoft, Alphabet earnings", "sections": ["Seeking a payoff", "Losing buyers"], "five": ["Economists see the Fed holding interest rates steady even after surprisingly hot September inflation. Bond traders have been building up bullish bets , so a hawkish message could trigger a sharp decline.", "Memory-chip maker SK Hynix plans to return $45 billion more to shareholders after profit surged thanks to the AI infrastructure rollout. The stock jumped 11% in Seoul.", "US stock futures struggled for direction as the impact of rising oil prices offset fresh gains in the artificial intelligence trade.", "Global investors’ newfound confidence in UK assets faces a big test today as Prime Minister Andy Burnham’s government delivers its first budget.", "UBS CEO Sergio Ermotti issued an unusually clear threat to relocate the bank as he stepped up his rhetoric over Switzerland’s plans to make it hold billions of dollars in extra capital."], "commentary": [{"heading": "Seeking a payoff", "summary": "SK Hynix’s results show that the companies that make the picks and shovels for AI are raking in cash, with no slowdown in sight. But investors are still worried about the tech giants that are spending all that money on computing power. Will it pay off, and when?\n\nCase in point, Microsoft and Alphabet. The two stocks have gone in different directions since their last earnings reports. As the two prepare to report again after the bell today, recent trading indicates investors give Microsoft an edge .\n\nMicrosoft shares have soared 36% since its earnings on July 29 showed the fastest cloud growth in four years, sparking their best day since 2008. Alphabet, meanwhile, has lost 6.3% since its results on July 22 revealed that its free cash flow turned negative due to a substantial increase in AI spending. Year to date, though, both stocks are underperforming the market."}, {"heading": "Losing buyers", "summary": "Being one of Washington’s closest partners no longer means reliably funding the US deficit.\n\nCountries and regions most aligned with the US bought a net $174.3 billion of Treasuries, excluding bills, in the first eight months of 2026, according to an analysis of Treasury and State Department data . That was the lowest for the period since 2021 and down more than 60% from a year earlier.\n\nThe shift is noteworthy in Asia, where economies running large surpluses are putting less of that money into US debt. Japan, the biggest foreign holder of Treasuries, bought just $389 million in the first eight months — down 99% from a year earlier."}]}}, "2026-10-27": {"date": "2026-10-27", "morning": {"hook": "앤트로픽 IPO, 이란 해법찾기", "line": "뉴욕증시는 26일 앤스로픽의 기업공개(IPO) 신청으로 인공지능(AI) 투자 열기가 되살아나며 상승했다.", "markets": [{"name": "S&P 500", "value": "7,676.77", "change": "+0.7%"}, {"name": "Nasdaq 100", "value": "29,273.40", "change": "+1.1%"}, {"name": "US 10Y", "value": "5.00%", "change": "+0.00"}, {"name": "USD/KRW", "value": "₩1,326.00", "change": "+0.1%"}, {"name": "Bloomberg Dollar", "value": "1,222.39", "change": "+0.0%"}, {"name": "Brent", "value": "$115.47", "change": "-1.1%"}], "items": [{"n": 1, "headline": "앤트로픽 IPO 신청…“AI, 인류에 실존적 위험 초래할 수도”", "summary": "AI 기업 앤트로픽 이 기업공개(IPO)를 신청하면서 자사 기술이 충분한 안전장치와 감독 없이 개발될 경우 인류에 ‘재앙적이거나 실존적인 위험’을 초래할 수 있다고 경고했다. 클로드를 개발한 앤트로픽은 나스닥에 ‘ANT’라는 종목코드로 상장할 계획이며, 골드만삭스와 모간스탠리 등이 IPO를 주관한다. 투자설명서에는 AI가 ‘종료에 저항’하거나 ‘정보를 은폐 또는 조작’하고 인간의 의도와 어긋나거나 자율적으로 행동할 가능성 등이 주요 위험으로 제시됐다."}, {"n": 2, "headline": "메타, AI 투자 위해 최대 950억달러 주식 발행", "summary": "메타플랫폼스 가 AI 개발에 필요한 자금을 마련하기 위해 주식 발행으로 최대 950억달러를 조달할 계획이다. 먼저 약 350억달러 규모의 보통주와 우선주를 발행하고, 시장에서 수시로 주식을 매각하는 ATM 프로그램을 통해 최대 600억달러를 추가 조달한다. 엔비디아와 AMD, 브로드컴은 메타의 보통주를 총 50억달러까지 매입하기로 했다. 조달 자금은 AI 인프라와 ‘개인용 초지능’ 개발에 투입될 예정이다."}, {"n": 3, "headline": "시타델 살라메 “AI의 밀물, 일부 배 침몰시킬 것”", "summary": "시타델 의 파블로 살라메 공동 최고투자책임자(CIO)는 신용시장이 인공지능(AI) 붐에 필요한 막대한 자금 수요를 감당하는 데 한계가 있다며 일부 희생자가 나올 수 있다고 경고했다. 그는 “신용시장이 아직 위험을 넘길 좋은 방법을 찾지 못해 막히고 있다”며 “AI의 밀물은 일부 배를 침몰시킬 것“이라고 말했다. AI 성장이 대규모 설비투자에 의존하는 단계로 접어든 만큼 자금조달 제약으로 투자가 줄어들 경우 주식시장에 반영된 성장 기대도 흔들릴 수 있다는 지적이다."}, {"n": 4, "headline": "이란 재공습 우려 속 중재 외교…사우디 등 테헤란 집결", "summary": "사우디아라비아와 파키스탄, 튀르키예의 고위 안보 당국자들이 26일 테헤란에서 이란 지도부와 만나 긴장 완화와 대화 재개를 모색했다. 미국과 이스라엘의 이란 재공습을 막기 위한 중재 노력의 일환이다. 트럼프 대통령은 미국 중간선거 이후 이란에 대한 폭격을 재개할 수 있음을 거듭 시사해왔다. 전투 재개 우려에 배럴당 117달러를 넘어섰던 브렌트유는 115달러대로 내려왔다."}, {"n": 5, "headline": "호주 대형 연기금, 佛국채 저가매수…“우려 과도”", "summary": "호주 2위 연기금인 ART가 프랑스의 재정 악화와 유럽중앙은행(ECB)의 금리 인상 전망이 시장에 과도하게 반영됐다며 프랑스 국채 를 저가매수하고 있다. 약 3700억호주달러의 자산을 운용하는 ART는 프랑스 10년물 금리가 4.5%를 넘어선 9월부터 매수에 나섰으며, 정치·재정 불안으로 금리가 2002년 이후 최고인 5%까지 치솟은 10월에는 매입 규모를 더욱 늘렸다."}]}, "daily": {"headline": "Anthropic’s IPO", "sections": ["The new AI barometer", "Billions needed"], "five": ["The burst of enthusiasm for AI that followed Anthropic’s IPO filing lost some momentum, with US equity futures stalling as traders turned their attention to earnings and tomorrow’s Fed decision.", "Meta boosted a planned share sale to almost $98 billion, marking one of the largest equity offerings in history.", "Mercedes-Benz cut its profit guidance , joining peers Volkswagen and BMW after sales in China declined.", "HSBC shares fell more than 6% in London after the bank reported disappointing earnings .", "Leaders of Finland and Norway held a phone call with Russian President Vladimir Putin to discuss the prospects for a Ukraine peace deal."], "commentary": [{"heading": "The new AI barometer", "summary": "Investors have spent the past 24 hours pulling apart Anthropic’s 335-page IPO prospectus, dissecting everything from its convoluted corporate governance to its sobering list of risk factors . How the company fares when it prices its shares next month will be closely watched by Wall Street. The company is in a class of one — a giant pure-play bet on the future of frontier AI.\n\nOn the one hand, its public market performance might cement or capsize confidence in AI at a moment when investors are anxious about the borrowing binge underpinning it. But equally, you can make the case that Anthropic will be a reflection of that confidence, that the fate of its listing hangs on investors’ fickle, ever-shifting view of what may be a bubble in the making."}, {"heading": "Billions needed", "summary": "Speaking of AI’s circular investments, here’s what’s been happening:\n\nMeta sold $25 billion of common stock and $12.5 billion of preferred shares, and said it plans to raise as much as $60 billion more. The cash will be used for AI spending.\n\nBroadcom arranged a $63 billion deal with investment firms to finance the purchase of chips for Anthropic.\n\nSpaceX signed a roughly $40 billion equipment-finance lease with Apollo to pay for more chips.\n\nBulls are undeterred by the relentless demand for financing. The AI-driven debt boom is creating some of the most attractive fixed-income opportunities in years , eclipsing the appeal of long-dated US Treasuries, said Rick Rieder, BlackRock’s chief investment officer for global fixed income."}]}}, "2026-10-26": {"date": "2026-10-26", "morning": {"hook": "이란전 분수령, 골드만 코스피↓", "line": "이번 주 이스라엘 선거와 다음 주 미국 중간선거를 전후해 이란 전쟁이 다시 격화될 수 있다는 우려가 일고 있다.", "markets": [{"name": "S&P 500", "value": "7,623.68", "change": "-0.5%"}, {"name": "Nasdaq 100", "value": "28,957.53", "change": "-0.0%"}, {"name": "US 10Y", "value": "4.99%", "change": "+0.04"}, {"name": "USD/KRW", "value": "₩1,323.09", "change": "-0.2%"}, {"name": "Bloomberg Dollar", "value": "1,221.00", "change": "+0.1%"}, {"name": "Brent", "value": "$116.72", "change": "+3.1%"}], "items": [{"n": 1, "headline": "美·이스라엘 선거 후 이란 확전 우려", "summary": "트럼프 대통령은 11월 3일 미국 중간선거 이후 중동 주둔 미군이 이란에 대한 공격 을 재개할 수 있음을 거듭 시사해왔다. 소식통에 따르면 이란은 미국 중간선거를 전후한 새로운 폭격에 대비해 이스라엘과 UAE 등 중동 전역에서 보복을 준비하고 있으며, 선거 이후 새 의회가 내년 1월 출범할 때까지가 가장 어려운 시기가 될 것으로 보고 있다. UAE 정부의 입장에 정통한 소식통도 걸프 지역 일부 당국자들이 무력 충돌 재개 가능성을 매우 높게 보고 있으며, 교전이 재개될 경우 이전보다 상황이 더 악화될 수 있다고 우려하고 있다고 전했다."}, {"n": 2, "headline": "브렌트 한때 117달러 돌파", "summary": "사우디아라비아에 대한 공격이 격화하면서 중동 공급 우려가 커져 브렌트유 가 6개월 만에 최고 수준으로 치솟았다. 브렌트유는 23일 장중 배럴당 117달러를 돌파하며 주간 기준 6% 넘게 올랐고, WTI는 3.8% 상승한 103.27달러에 마감했다. 후티 반군은 사우디 홍해 연안의 얀부항을 공격했다고 주장했으며, 사우디 내 유전과 공항에서도 인명 피해를 낸 공격이 이어졌다."}, {"n": 3, "headline": "골드만, 코스피 목표 25% 하향", "summary": "골드만삭스가 AI 트레이드에 대한 우려가 커지자 코스피 12개월 목표치를 1만2000에서 9000으로 25% 낮췄다. 코스피가 6월 고점 대비 35% 넘게 급락한 데 따라 보다 보수적인 밸류에이션 가정을 반영한 것이다. 다만 골드만은 한국 증시가 크게 저평가됐다며 새 목표치도 현 수준에서 60% 넘는 상승 여력을 시사한다고 밝혔다."}, {"n": 4, "headline": "연준·ECB·BOJ ‘매파적 동결’ 전망", "summary": "이번 주 연준 을 필두로 유럽중앙은행(ECB), 일본은행(BOJ)이 기준금리를 동결하고 향후 추가 인상 가능성을 열어둔 채 상황을 지켜볼 것으로 예상된다. 에너지 가격 급등에서 인공지능(AI) 붐에 이르는 인플레이션 위험에 대응하는 가운데, 이들 중앙은행은 신중한 속도 조절과 함께 매파적 기조를 유지할 가능성이 높다. 지난달 연준은 2023년 이후 처음으로 금리를 인상하면서 올해 추가 인상이 이뤄질 가능성을 시사했다."}, {"n": 5, "headline": "연준 동결 전망 속 ‘인상 경계’...달러 지지", "summary": "이번 주 연준 금리 동결이 지배적인 전망이지만 끈질긴 인플레이션에 따른 추가 긴축 가능성도 주목받고 있다. 머니마켓이 25bp 인상 가능성을 약 10%로 반영하는 가운데 ANZ는 9월 헤드라인 CPI가 3.7%로 높아지는 등 물가 상방 위험이 커졌다며 25bp 인상 가능성이 시장 예상보다 높다고 진단했다. 포워드 가이던스를 피해온 케빈 워시 의장이 인플레이션 대응에 대한 신뢰를 확고히 하기 위해 실제 인상에 나설 수 있다는 분석이다."}]}, "daily": {"headline": "Brazil shock", "sections": ["‘Caught by surprise’"], "five": ["Brazilian markets are heading for a major rout after President Luiz Inácio Lula da Silva pulled off a stunning comeback to defeat Flávio Bolsonaro, the right-wing candidate that many investors preferred.", "Stocks elsewhere started the week on a positive note as oil retreated from a six-month high and investors awaited a busy slate of tech earnings.", "Top security officials from Saudi Arabia, Pakistan and Turkey are meeting Iran’s leaders today in an effort to breathe new life into talks aimed at preventing a broader war in the Middle East.", "Germany’s business outlook unexpectedly brightened for a sixth month in a row, underscoring the economy’s rebound from a prolonged downturn.", "Chinese automakers outsold Japanese rivals in Europe for the first time last quarter, underscoring how quickly brands like BYD and Chery are gaining ground in the region."], "commentary": [{"heading": "‘Caught by surprise’", "summary": "Rarely in recent memory have investors been so wrong-footed by a political event as they were by Sunday’s presidential election in Latin America’s
