<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>블룸버그 다이제스트</title>
  <style>
    :root {
      --paper: #f3f0e8;
      --card: #fffcf7;
      --ink: #1c1915;
      --muted: #6f6a62;
      --line: #e4dfd4;
      --up: #b42318;
      --down: #1d4f91;
      --flat: #6f6a62;
      --chip: #efeae0;
      --accent: #1c1915;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      line-height: 1.45;
      overflow-wrap: break-word;
      -webkit-text-size-adjust: 100%;
    }
    button { -webkit-tap-highlight-color: transparent; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 16px;
      max-width: 980px;
      margin: 0 auto;
      padding: 28px 24px 0;
    }
    .mark {
      font-size: 13px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 4px;
    }
    h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin: 0;
    }
    nav {
      display: flex;
      gap: 6px;
    }
    nav button, .cal button, .theme-head, .expand, .fold {
      font: inherit;
      color: inherit;
      background: transparent;
      border: 0;
      cursor: pointer;
    }
    nav button {
      padding: 8px 14px;
      border-radius: 999px;
      color: var(--muted);
    }
    nav button[aria-selected="true"] {
      background: var(--ink);
      color: var(--paper);
    }
    main {
      max-width: 980px;
      margin: 0 auto;
      padding: 20px 24px 64px;
    }
    .dayhead {
      display: flex;
      align-items: stretch;
      gap: 10px;
      margin: 0 0 18px;
    }
    .leadbox, .cal {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
    }
    .leadbox {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 20px 22px;
    }
    .cal {
      width: max-content;
      margin: 0;
      padding: 14px 16px 12px;
    }
    .cal-month {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 13px;
    }
    .cal section + section { margin-top: 16px; }
    .cal-dow, .cal-grid {
      display: grid;
      grid-template-columns: repeat(5, 36px);
      gap: 4px;
    }
    .cal-dow { margin-bottom: 4px; }
    .cal-dow span {
      text-align: center;
      color: var(--muted);
      font-size: 12px;
    }
    .cal-grid button, .cal-grid span {
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 9px;
      font-size: 14px;
      font-weight: 650;
    }
    .cal-grid button.in { background: var(--chip); }
    .cal-grid button[aria-selected="true"] {
      background: var(--ink);
      color: var(--paper);
    }
    .weekhead { align-items: flex-start; }
    .theme-col { flex: 1; min-width: 0; }
    .cal-grid .off { color: #c8c2b6; font-weight: 500; }
    .hook {
      font-size: 32px;
      line-height: 1.25;
      letter-spacing: -0.04em;
      margin: 0;
      font-weight: 750;
    }
    .dek {
      margin: 10px 0 0;
      font-size: 17px;
      line-height: 1.5;
      letter-spacing: -0.02em;
    }
    .markets {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 28px;
    }
    .market {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px 14px 11px;
    }
    .market .name { color: var(--muted); font-size: 12px; }
    .market .value {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      margin-top: 4px;
      font-variant-numeric: tabular-nums;
    }
    .market strong { font-size: 18px; font-weight: 700; }
    .up { color: var(--up); }
    .down { color: var(--down); }
    .flat { color: var(--flat); }
    section { margin-top: 8px; }
    section h2 {
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 650;
      margin: 22px 0 10px;
    }
    ol, .stories { list-style: none; margin: 0; padding: 0; }
    li + li { border-top: 1px solid var(--line); }
    #morning li { display: block; padding: 0; }
    #morning .fold {
      display: grid;
      grid-template-columns: 28px 1fr;
      gap: 10px;
      align-items: baseline;
      width: 100%;
      padding: 11px 0;
      text-align: left;
      font-size: 17px;
      letter-spacing: -0.02em;
    }
    #morning .summary {
      display: none;
      margin: 0 0 14px 38px;
      font-size: 17px;
      line-height: 1.5;
      letter-spacing: -0.02em;
    }
    #morning .fold[aria-expanded="true"] + .summary { display: block; }
    #commentary li { display: block; padding: 0; }
    #commentary .fold {
      display: block;
      width: 100%;
      padding: 11px 0;
      text-align: left;
      font-size: 17px;
      letter-spacing: -0.02em;
    }
    #commentary .summary {
      display: none;
      margin: 0 0 14px;
      font-size: 17px;
      line-height: 1.5;
    }
    #commentary .summary p { margin: 0 0 12px; }
    #commentary .fold[aria-expanded="true"] + .summary { display: block; }
    .stories li.note { display: block; }
    ol li, .stories li {
      display: grid;
      grid-template-columns: 28px 1fr;
      gap: 10px;
      align-items: baseline;
      padding: 11px 0;
      font-size: 17px;
      letter-spacing: -0.02em;
    }
    .num, .series {
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      font-size: 13px;
      padding-top: 4px;
    }
    .empty {
      color: var(--muted);
      padding: 12px 0 4px;
    }
    .theme {
      width: 100%;
      text-align: left;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px 16px;
      margin-bottom: 10px;
    }
    .theme-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: baseline;
      width: 100%;
      padding: 0;
    }
    .theme-head strong { font-size: 18px; letter-spacing: -0.03em; }
    .count { color: var(--muted); font-size: 13px; }
    .expand {
      display: none;
      margin-top: 12px;
      padding: 0;
      color: var(--muted);
      font-size: 13px;
    }
    .hits { display: none; margin: 8px 0 0; padding: 0; list-style: none; }
    .narrative { display: none; margin: 12px 0 0; font-size: 17px; line-height: 1.55; letter-spacing: -0.02em; }
    .narrative p { margin: 0 0 12px; }
    .narrative p:last-child { margin-bottom: 0; }
    .theme[aria-expanded="true"] .narrative,
    .theme[aria-expanded="true"] .expand { display: block; }
    .theme[aria-expanded="true"]:not(:has(.narrative)) .hits,
    .expand[aria-expanded="true"] + .hits { display: block; }
    .hits li {
      display: grid;
      grid-template-columns: 52px 52px 1fr;
      gap: 8px;
      padding: 8px 0;
      font-size: 15px;
      border-top: 1px solid var(--line);
    }
    .hits li span:first-child,
    .hits li span:last-child { color: var(--muted); }
    .hits li.cited span:first-child,
    .hits li.cited span:last-child { color: var(--ink); font-weight: 650; }
    footer {
      max-width: 980px;
      margin: 0 auto;
      padding: 0 24px 28px;
      color: var(--muted);
      font-size: 12px;
    }
    @media (max-width: 720px) {
      header, main, footer {
        padding-left: max(16px, env(safe-area-inset-left));
        padding-right: max(16px, env(safe-area-inset-right));
      }
      header {
        flex-direction: column;
        align-items: flex-start;
        gap: 14px;
        padding-top: max(18px, env(safe-area-inset-top));
      }
      h1 { font-size: 26px; }
      nav button { min-height: 44px; padding: 8px 16px; }
      main { padding-top: 16px; padding-bottom: 40px; }
      .dayhead { flex-direction: column; }
      .cal { width: 100%; }
      .cal-dow, .cal-grid { grid-template-columns: repeat(5, 1fr); }
      .cal-grid button, .cal-grid span { height: 40px; font-size: 15px; }
      .leadbox { padding: 16px; }
      .hook { font-size: 26px; line-height: 1.32; }
      .dek { font-size: 16px; }
      .markets { grid-template-columns: 1fr 1fr; gap: 8px; }
      .market { padding: 12px; }
      .market .value { display: block; }
      .market .value span { display: block; margin-top: 2px; font-size: 13px; }
      .market strong { font-size: 17px; }
      ol li, .stories li { font-size: 16px; padding: 13px 0; }
      #morning .fold, #morning .summary, #commentary .fold, #commentary .summary, .narrative { font-size: 16px; }
      .expand { min-height: 44px; }
      .hits li { display: block; padding: 10px 0; }
      .hits li span:nth-child(1),
      .hits li span:nth-child(2) { display: inline; }
      .hits li span:nth-child(2) { margin-left: 8px; }
      .hits li span:last-child { display: block; margin-top: 3px; }
      footer { padding-bottom: calc(24px + env(safe-area-inset-bottom)); }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <p class="mark">Bloomberg digest</p>
      <h1>Day</h1>
    </div>
    <nav>
      <button type="button" id="tab-day" aria-selected="true">Day</button>
      <button type="button" id="tab-themes" aria-selected="false">Weekly</button>
    </nav>
  </header>
  <main>
    <div id="view-day">
      <div class="dayhead">
        <div class="cal" id="dates"></div>
        <article class="leadbox">
          <h2 class="hook" id="hook"></h2>
          <p class="dek" id="dek" hidden></p>
        </article>
      </div>
      <div class="markets" id="markets"></div>
      <section>
        <h2>오늘 아침 5가지</h2>
        <ol id="morning"></ol>
      </section>
      <section id="five-section" hidden>
        <h2>5 things</h2>
        <ol class="brief" id="five"></ol>
      </section>
      <section id="commentary-section" hidden>
        <h2>commentary</h2>
        <ul class="stories" id="commentary"></ul>
      </section>
      <section id="daily-section">
        <h2>Markets Daily</h2>
        <ul class="stories" id="daily"></ul>
      </section>
    </div>
    <div id="view-themes" hidden>
      <div class="dayhead weekhead">
        <div class="cal" id="week-dates"></div>
        <div id="theme-list" class="theme-col"></div>
      </div>
    </div>
  </main>
  <footer>시세와 그날 목록을 보여 줍니다.</footer>
  <script>
    const DATA = {"dates": ["2026-10-30", "2026-10-29", "2026-10-28", "2026-10-27", "2026-10-26", "2026-10-23", "2026-10-22", "2026-10-21", "2026-10-20", "2026-10-19", "2026-10-16", "2026-10-15", "2026-10-14", "2026-10-13", "2026-10-12", "2026-10-09", "2026-10-08", "2026-10-07", "2026-10-06", "2026-10-05", "2026-10-02", "2026-10-01"], "days": {"2026-10-30": {"date": "2026-10-30", "morning": {"hook": "AI ‘헝거게임’, 선거앞 이란압박", "line": "뉴욕증시는 일부 빅테크의 실적 실망에 막대한 인공지능(AI) 투자가 충분한 수익을 낼지에 대한 의구심이 되살아남에 따라 기술주를 중심으로 하락했다.", "markets": [{"name": "S&P 500", "value": "7,720.39", "change": "-0.3%"}, {"name": "Nasdaq 100", "value": "29,402.51", "change": "-1.4%"}, {"name": "US 10Y", "value": "4.94%", "change": "-0.08"}, {"name": "USD/KRW", "value": "₩1,340.53", "change": "-0.1%"}, {"name": "Bloomberg Dollar", "value": "1,224.69", "change": "+0.0%"}, {"name": "Brent", "value": "$115.54", "change": "+0.2%"}], "items": [{"n": 1, "headline": "알파벳 AI 투자 리스크 눈덩이", "summary": "알파벳 의 인공지능(AI) 투자와 관련한 잠재적 부담이 당초 알려진 것보다 큰 것으로 나타났다. 29일 공개된 분기 보고서에 따르면 알파벳은 1조달러 이상의 구매 약정과 향후 리스 등 미래 의무 외에도 특정 조건에서 부담해야 할 수 있는 약 985억달러의 우발적 약정을 보유하고 있다. 이는 한 분기 전보다 약 230억달러 증가한 규모로, 데이터센터 임대료 지급 보증과 파트너의 전력 장비 구매 보증, 고객에게 판매한 AI 칩 시스템을 되사야 할 수 있는 의무 등이 포함된다."}, {"n": 2, "headline": "마이크로소프트 대규모 회사채 발행", "summary": "마이크로소프트 가 거의 10년 만에 추진하는 대규모 회사채 발행에 한때 1150억달러가 넘는 주문이 몰렸다. 최소 250억달러 규모로 예상되는 이번 발행은 만기 2~40년의 최대 10개 트랜치로 구성되며, 미국 회사채 발행 사상 가장 강한 수요를 기록한 사례 중 하나다. AI 관련 채권 공급이 급증한 가운데서도 마이크로소프트가 무디스와 S&P글로벌로부터 받은 최고 등급 AAA와 6%를 웃돌 것으로 예상되는 장기채 금리가 투자자들을 끌어들인 것으로 풀이된다."}, {"n": 3, "headline": "이란, 밴스 서한 받아…이스라엘 총선 네타냐후 진영 53석", "summary": "이란 은 JD 밴스 미국 부통령이 보낸 서한을 받았지만 종전을 위한 기존 조건에서 물러설 생각이 없음을 시사했다. 갈리바프 이란 의회 의장은 “이란의 조건은 중재국들에 반복해서 명확하게 전달됐다”며 “당근과 채찍 방식은 이란에 아무런 효과가 없다”고 밝혔다. 다만 아라그치 외무장관은 이란군이 방어 준비가 돼 있다면서도 “외교가 성공할 기회를 계속 주고 있다”고 말했다. 밴스의 이례적인 접촉은 8개월째 이어진 전쟁을 끝내기 위한 협상이 교착상태에 빠진 가운데 트럼프 대통령이 이란에 대한 공습 재개를 거듭 경고하는 상황에서 이뤄졌다."}, {"n": 4, "headline": "美 성장·물가 강세…해싯 “물가 높으면 연준 행동”", "summary": "미국 경제 가 견조한 소비와 기업투자에 힘입어 3분기에 1년 만에 가장 빠른 속도로 성장했다. 3분기 실질 GDP는 연율 3.4% 증가해 2분기 2.2%에서 가속했고 시장 예상도 웃돌았다. 기업투자는 AI 관련 지출에 힘입어 2020년 이후 최대인 12.7% 급증했으며, 가계 소비도 2개 분기 연속 연율 3.8% 증가했다. 특히 장비 투자의 성장 기여도는 팬데믹 이후 반등기를 제외하면 2011년 이후 가장 높았다."}, {"n": 5, "headline": "ECB, 금리 동결...라가르드 조기 퇴임", "summary": "유럽중앙은행 (ECB)이 29일 금리를 동결한 가운데 크리스틴 라가르드 총재는 에너지발 인플레이션이 다른 부문으로 확산될 위험을 낮게 평가했다. ECB 정책위원들은 금리 인상 방안을 논의했지만, 급등한 에너지 가격이 과도한 임금 인상 요구나 기대 인플레이션의 뚜렷한 상승으로 이어지고 있다는 증거가 부족하다고 판단했다. 다만 라가르드는 ECB가 나아갈 방향은 “분명하다”며 추가 긴축 가능성을 열어뒀고, 시장도 한때 12월 25bp 인상 확률을 88%로 높였다."}]}, "daily": null}, "2026-10-29": {"date": "2026-10-29", "morning": {"hook": "‘비둘기’ 연준, 대이란 공격대비", "line": "연준이 시장 예상대로 기준금리를 동결하고 인플레이션 억제에 대한 의지를 재확인했지만, 12월 차기 회의에서 금리 인상 가능성에 대한 명확한 신호는 제시하지 않았다.", "markets": [{"name": "S&P 500", "value": "7,743.98", "change": "+0.3%"}, {"name": "Nasdaq 100", "value": "29,813.16", "change": "+0.5%"}, {"name": "US 10Y", "value": "5.02%", "change": "+0.02"}, {"name": "USD/KRW", "value": "₩1,342.83", "change": "+0.0%"}, {"name": "Bloomberg Dollar", "value": "1,224.08", "change": "-0.1%"}, {"name": "Brent", "value": "$114.13", "change": "+0.2%"}], "items": [{"n": 1, "headline": "연준, 10:2로 금리 동결…워시 “필요시 행동”", "summary": "연방공개시장위원회 (FOMC)는 10대 2로 연방기금금리 목표범위를 3.75~4%로 유지하기로 결정했다. 리사 쿡 연준 이사와 베스 해맥 클리블랜드 연은 총재는 25bp 인상을 주장하며 반대표를 던졌다. 워시 연준 의장은 “상황이 요구하는 대로 행동할 준비가 돼 있다”며 필요시 금리를 올릴 가능성을 열어뒀다. 시장에서는 12월 금리 인상 전망이 유지됐지만, 2027년 추가 인상에 대한 베팅은 줄었다."}, {"n": 2, "headline": "美 이란 재공격 가능성에 유가 상승", "summary": "미국이 다음 주 중간선거 이후 이란에 대한 군사 공격을 재개할 가능성이 제기되면서 국제유가 가 상승했다. 월스트리트저널은 미국이 페르시아만의 여러 국가에 단기간의 강도 높은 군사작전에 대비하라고 통보했으며, 트럼프 대통령이 아직 최종 결정을 내리지는 않았지만 선거 이후 대규모 공격을 단행하는 쪽으로 기울고 있다고 보도했다. ING는 “시장이 재확전 가능성을 더 높게 가격에 반영하고 있다”며 미국이 중간선거 이후 어떤 행동에 나설지에 유가가 민감하게 반응할 것으로 내다봤다. 브렌트유는 한때 배럴당 116달러를 넘어섰고 WTI는 103달러를 웃돌았다."}, {"n": 3, "headline": "AI 부채 공급 한계 조짐…핌코는 일찌감치 축소", "summary": "AI 인프라 구축을 위한 부채 발행이 급증하면서 월가 신용시장 의 자금 공급 여력이 한계에 가까워지고 있다는 경고가 나오고 있다. 올해 전 세계 AI 관련 부채 조달은 사상 최대인 4600억달러에 달했고, 데이터센터 관련 채권과 대출 가운데 최소 18건의 금리가 두 자릿수로 치솟았다. 브로드컴과 스페이스X, 오라클 등의 신용부도스와프(CDS) 비용도 급등했다. 향후 수년간 수조달러의 추가 부채가 필요한 상황에서 빅테크가 원하는 자금 규모와 금융권의 공급 능력, 투자자들의 실제 수요 사이의 괴리가 커지고 있다. 은행과 보험사들의 데이터센터 익스포저도 한계에 접근하면서 기존 위험을 다른 투자자에게 넘겨 신규 대출 여력을 확보하기가 갈수록 어려워지고 있다."}, {"n": 4, "headline": "캐나다, 25bp 금리 인상…추가 인상 가능성 시사", "summary": "캐나다 중앙은행 (BOC)이 에너지 가격 상승에 따른 인플레이션 위험에 대응해 기준금리를 25bp 올린 2.5%로 인상했다. 3년여 만의 첫 인상으로, BOC는 높은 에너지 가격이 다른 상품과 서비스 가격으로 광범위하게 번질 위험을 차단하기 위한 조치라고 설명했다. 2027년 소비자물가 상승률 전망을 기존 2.0%에서 3.1%로 대폭 높이고, 물가가 2% 목표로 복귀하는 시점도 2028년 중반으로 예상했다. 추가 금리인상이 필요할 수 있다면서도 불확실성을 감안해 “신중하게 진행하겠다”고 밝혔다."}, {"n": 5, "headline": "파키스탄, 대만 항공사 영공 통과 다시 허용…전격 선회", "summary": "파키스탄 이 대만 항공사들의 자국 영공 통과를 다시 허용하며 중국의 ‘하나의 중국’ 원칙을 이유로 영공 이용을 막았던 조치에서 전격 선회했다. 파키스탄 민간항공청은 중화항공과 에바항공에 28일부터 내년 3월 27일까지 자국 영공을 이용할 수 있도록 허가했다. 불과 몇 시간 전 카와자 아시프 파키스탄 국방장관 겸 항공장관은 “하나의 중국 정책을 따르고 있다”며 중국 항공사에만 영공 통과를 허용한다고 밝힌 바 있다."}]}, "daily": {"headline": "AI credit anxiety", "sections": ["AI’s debt deluge", "Latin stock drought"], "five": ["Alphabet tumbles 10% after sales underwhelmed, reinforcing concerns that Google is losing ground to AI rivals despite pouring hundreds of billions of dollars into the technology.", "Samsung also disappointed and left investors waiting for details of a new plan to return more cash to shareholders. Nasdaq futures sink 1%.", "In what could be an AI mega deal, Marvell is in talks to buy data center optics maker Lumentum . Lumentum, backed by Nvidia, has a market value of $83 billion.", "Christine Lagarde announced she’ll leave the ECB in early 2027, kickstarting the race to replace her.", "Also on the central bank front: the ECB is set to keep interest rates on hold today. While the Fed also held, Kevin Warsh telegraphed the potential for more hikes without explicitly saying it."], "commentary": [{"heading": "AI’s debt deluge", "summary": "A new anxiety is gripping Wall Street as it bankrolls the vast network of data centers and chips behind the AI boom: Early signs suggest the credit market is approaching the limits of how much more debt it can absorb.\n\nOne after another, yields are soaring into the double digits on bonds and loans funding the buildout. Bankers are finding it more difficult to offload risk to insurers and other investors. Elon Musk himself warned the other day that hundreds of so-called neoclouds risk going under as firms get cut off from fresh financing."}, {"heading": "Latin stock drought", "summary": "Two decades into the collapse in Latin American stock markets, Scott Piper likes to joke that investing in the region has become such a lonely job that he’s the last of his breed.\n\nPiper, 58, got his first gig trading the region’s stocks in the mid-1990s, just a few years before a commodities boom would turbocharge the region’s economies and markets. Back then, Wall Street was ginning up new Latin America-dedicated funds seemingly every other day. Their numbers just kept growing, surpassing 660 by 2015.\n\nToday, after scores of mergers, sales and closures, there are just 226 such funds across the globe , according to data compiled by Bloomberg Intelligence.\n\nOne by one, “people have sort of disappeared,” says Piper, who runs about $5 billion for Itau Unibanco’s asset-management unit out of New York."}]}}, "2026-10-28": {"date": "2026-10-28", "morning": {"hook": "네타냐후 열세, 美채권시장 경고", "line": "주요 빅테크 실적 발표와 연준의 금리 결정을 앞두고 뉴욕증시에서 기술주가 랠리를 펼쳤다.", "markets": [{"name": "S&P 500", "value": "7,722.60", "change": "+0.6%"}, {"name": "Nasdaq 100", "value": "29,651.44", "change": "+1.3%"}, {"name": "US 10Y", "value": "5.00%", "change": "+0.01"}, {"name": "USD/KRW", "value": "₩1,327.00", "change": "-0.0%"}, {"name": "Bloomberg Dollar", "value": "1,225.31", "change": "+0.2%"}, {"name": "Brent", "value": "$114.07", "change": "-1.5%"}], "items": [{"n": 1, "headline": "美 의회 교착은 호재? 채권시장 ‘이번엔 다르다’", "summary": "미국 중간선거 이후 의회 교착 가능성이 커지고 있지만 채권 투자자들은 과거처럼 이를 미국채 호재로 받아들이기 어렵다고 보고 있다. 1990년대 중반 이후 백악관과 의회의 권력 구도가 엇갈린 경우 대규모 지출 법안 통과가 어려워지면서 10년물 국채 금리가 대체로 하락했지만, 이번에는 재정적자가 GDP의 약 6%에 달하고 민간 보유 연방정부 부채도 32조달러를 넘어선 상태다. 다이아몬드힐은 지출과 부채를 통제하기 위한 실질적인 정책 조치가 나오지 않는다면 부채가 계속 늘어나는 만큼 “금리가 더 오를 위험이 있다”고 진단했다."}, {"n": 2, "headline": "美 소비심리·기업투자 개선…주택시장은 부진", "summary": "미국의 소비자신뢰 가 고용시장과 기업 여건에 대한 평가 개선에 힘입어 10월 예상 밖으로 반등해 4개월 만에 상승세로 돌아섰다. 컨퍼런스보드 소비자신뢰지수는 전월보다 7.5포인트 오른 91.7로 6월 이후 최고치를 기록해 시장 전망을 모두 웃돌았고, 현재상황지수도 4월 이후 최고 수준으로 올라섰다. 일자리가 풍부하다고 답한 비율은 6개월 만에 최고치를 기록했다. 다만 높은 물가와 금리 상승에 따른 생활비 부담은 여전했다."}, {"n": 3, "headline": "노보그라츠 “신용 불안 정점 근접…AI자금조달 우려 완화”", "summary": "갤럭시디지털의 마이클 노보그라츠 최고경영자(CEO)는 인공지능(AI) 투자 확대를 둘러싼 글로벌 신용시장의 불안이 정점에 가까워졌으며 조만간 완화될 것으로 전망했다. 그는 “신용시장이 소화불량을 겪고 있다”며 “아마 불안감이 정점에 가까워진 것 같다”고 말했다. 최근 코어위브의 정크본드 금리가 부실 위험을 나타내는 수준까지 급등하면서 AI 기업들의 막대한 자금조달 수요가 신용시장을 압박할 수 있다는 우려가 커진 바 있다."}, {"n": 4, "headline": "PE업계, AI 충격에 디폴트 유예 조항 추진", "summary": "사모펀드(PE) 업계가 AI로 인한 사업 차질에 대비해 대출계약에 불가항력과 유사한 조항을 도입하고 있다. AI 충격으로 디폴트가 발생했다고 판단할 경우 채권자의 조치를 일정 기간 유예할 수 있도록 하는 내용으로, 지난 9월 이후 최소 두 건의 차입매수(LBO) 금융에서 이 같은 조항이 등장했다. H.I.G.캐피털은 독일 인프라 엔지니어링·건설 서비스 업체 테라스그룹의 지분 과반 인수를 위한 4억7000만유로 규모 대출에 해당 조항을 포함시켰다."}, {"n": 5, "headline": "이란, 美에 종전 조건 재확인…중동 외교전 분주", "summary": "이란 최고지도자 모즈타바 하메네이가 미국과의 전쟁을 끝내기 위한 기존 조건을 재확인했다. 이란은 평화협상의 전제조건으로 미국이 페르시아만의 이란 항구들에 대한 해상 봉쇄를 해제하고 대이란 제재를 철회해야 한다고 요구해왔다. 반면 미국은 이란의 핵 프로그램에 대한 양보를 요구하고 있다. 하메네이는 국가안보 책임자 모센 레자이와 호르무즈 해협에 대한 통제권을 통한 국가 및 역내 안보 문제도 논의했다. 이란은 에너지 수송의 핵심 통로인 호르무즈 해협에 대한 통제권 유지를 주장하는 반면 미국은 자유로운 통항을 요구하고 있다."}]}, "daily": {"headline": "Microsoft, Alphabet earnings", "sections": ["Seeking a payoff", "Losing buyers"], "five": ["Economists see the Fed holding interest rates steady even after surprisingly hot September inflation. Bond traders have been building up bullish bets , so a hawkish message could trigger a sharp decline.", "Memory-chip maker SK Hynix plans to return $45 billion more to shareholders after profit surged thanks to the AI infrastructure rollout. The stock jumped 11% in Seoul.", "US stock futures struggled for direction as the impact of rising oil prices offset fresh gains in the artificial intelligence trade.", "Global investors’ newfound confidence in UK assets faces a big test today as Prime Minister Andy Burnham’s government delivers its first budget.", "UBS CEO Sergio Ermotti issued an unusually clear threat to relocate the bank as he stepped up his rhetoric over Switzerland’s plans to make it hold billions of dollars in extra capital."], "commentary": [{"heading": "Seeking a payoff", "summary": "SK Hynix’s results show that the companies that make the picks and shovels for AI are raking in cash, with no slowdown in sight. But investors are still worried about the tech giants that are spending all that money on computing power. Will it pay off, and when?\n\nCase in point, Microsoft and Alphabet. The two stocks have gone in different directions since their last earnings reports. As the two prepare to report again after the bell today, recent trading indicates investors give Microsoft an edge .\n\nMicrosoft shares have soared 36% since its earnings on July 29 showed the fastest cloud growth in four years, sparking their best day since 2008. Alphabet, meanwhile, has lost 6.3% since its results on July 22 revealed that its free cash flow turned negative due to a substantial increase in AI spending. Year to date, though, both stocks are underperforming the market."}, {"heading": "Losing buyers", "summary": "Being one of Washington’s closest partners no longer means reliably funding the US deficit.\n\nCountries and regions most aligned with the US bought a net $174.3 billion of Treasuries, excluding bills, in the first eight months of 2026, according to an analysis of Treasury and State Department data . That was the lowest for the period since 2021 and down more than 60% from a year earlier.\n\nThe shift is noteworthy in Asia, where economies running large surpluses are putting less of that money into US debt. Japan, the biggest foreign holder of Treasuries, bought just $389 million in the first eight months — down 99% from a year earlier."}]}}, "2026-10-27": {"date": "2026-10-27", "morning": {"hook": "앤트로픽 IPO, 이란 해법찾기", "line": "뉴욕증시는 26일 앤스로픽의 기업공개(IPO) 신청으로 인공지능(AI) 투자 열기가 되살아나며 상승했다.", "markets": [{"name": "S&P 500", "value": "7,676.77", "change": "+0.7%"}, {"name": "Nasdaq 100", "value": "29,273.40", "change": "+1.1%"}, {"name": "US 10Y", "value": "5.00%", "change": "+0.00"}, {"name": "USD/KRW", "value": "₩1,326.00", "change": "+0.1%"}, {"name": "Bloomberg Dollar", "value": "1,222.39", "change": "+0.0%"}, {"name": "Brent", "value": "$115.47", "change": "-1.1%"}], "items": [{"n": 1, "headline": "앤트로픽 IPO 신청…“AI, 인류에 실존적 위험 초래할 수도”", "summary": "AI 기업 앤트로픽 이 기업공개(IPO)를 신청하면서 자사 기술이 충분한 안전장치와 감독 없이 개발될 경우 인류에 ‘재앙적이거나 실존적인 위험’을 초래할 수 있다고 경고했다. 클로드를 개발한 앤트로픽은 나스닥에 ‘ANT’라는 종목코드로 상장할 계획이며, 골드만삭스와 모간스탠리 등이 IPO를 주관한다. 투자설명서에는 AI가 ‘종료에 저항’하거나 ‘정보를 은폐 또는 조작’하고 인간의 의도와 어긋나거나 자율적으로 행동할 가능성 등이 주요 위험으로 제시됐다."}, {"n": 2, "headline": "메타, AI 투자 위해 최대 950억달러 주식 발행", "summary": "메타플랫폼스 가 AI 개발에 필요한 자금을 마련하기 위해 주식 발행으로 최대 950억달러를 조달할 계획이다. 먼저 약 350억달러 규모의 보통주와 우선주를 발행하고, 시장에서 수시로 주식을 매각하는 ATM 프로그램을 통해 최대 600억달러를 추가 조달한다. 엔비디아와 AMD, 브로드컴은 메타의 보통주를 총 50억달러까지 매입하기로 했다. 조달 자금은 AI 인프라와 ‘개인용 초지능’ 개발에 투입될 예정이다."}, {"n": 3, "headline": "시타델 살라메 “AI의 밀물, 일부 배 침몰시킬 것”", "summary": "시타델 의 파블로 살라메 공동 최고투자책임자(CIO)는 신용시장이 인공지능(AI) 붐에 필요한 막대한 자금 수요를 감당하는 데 한계가 있다며 일부 희생자가 나올 수 있다고 경고했다. 그는 “신용시장이 아직 위험을 넘길 좋은 방법을 찾지 못해 막히고 있다”며 “AI의 밀물은 일부 배를 침몰시킬 것“이라고 말했다. AI 성장이 대규모 설비투자에 의존하는 단계로 접어든 만큼 자금조달 제약으로 투자가 줄어들 경우 주식시장에 반영된 성장 기대도 흔들릴 수 있다는 지적이다."}, {"n": 4, "headline": "이란 재공습 우려 속 중재 외교…사우디 등 테헤란 집결", "summary": "사우디아라비아와 파키스탄, 튀르키예의 고위 안보 당국자들이 26일 테헤란에서 이란 지도부와 만나 긴장 완화와 대화 재개를 모색했다. 미국과 이스라엘의 이란 재공습을 막기 위한 중재 노력의 일환이다. 트럼프 대통령은 미국 중간선거 이후 이란에 대한 폭격을 재개할 수 있음을 거듭 시사해왔다. 전투 재개 우려에 배럴당 117달러를 넘어섰던 브렌트유는 115달러대로 내려왔다."}, {"n": 5, "headline": "호주 대형 연기금, 佛국채 저가매수…“우려 과도”", "summary": "호주 2위 연기금인 ART가 프랑스의 재정 악화와 유럽중앙은행(ECB)의 금리 인상 전망이 시장에 과도하게 반영됐다며 프랑스 국채 를 저가매수하고 있다. 약 3700억호주달러의 자산을 운용하는 ART는 프랑스 10년물 금리가 4.5%를 넘어선 9월부터 매수에 나섰으며, 정치·재정 불안으로 금리가 2002년 이후 최고인 5%까지 치솟은 10월에는 매입 규모를 더욱 늘렸다."}]}, "daily": {"headline": "Anthropic’s IPO", "sections": ["The new AI barometer", "Billions needed"], "five": ["The burst of enthusiasm for AI that followed Anthropic’s IPO filing lost some momentum, with US equity futures stalling as traders turned their attention to earnings and tomorrow’s Fed decision.", "Meta boosted a planned share sale to almost $98 billion, marking one of the largest equity offerings in history.", "Mercedes-Benz cut its profit guidance , joining peers Volkswagen and BMW after sales in China declined.", "HSBC shares fell more than 6% in London after the bank reported disappointing earnings .", "Leaders of Finland and Norway held a phone call with Russian President Vladimir Putin to discuss the prospects for a Ukraine peace deal."], "commentary": [{"heading": "The new AI barometer", "summary": "Investors have spent the past 24 hours pulling apart Anthropic’s 335-page IPO prospectus, dissecting everything from its convoluted corporate governance to its sobering list of risk factors . How the company fares when it prices its shares next month will be closely watched by Wall Street. The company is in a class of one — a giant pure-play bet on the future of frontier AI.\n\nOn the one hand, its public market performance might cement or capsize confidence in AI at a moment when investors are anxious about the borrowing binge underpinning it. But equally, you can make the case that Anthropic will be a reflection of that confidence, that the fate of its listing hangs on investors’ fickle, ever-shifting view of what may be a bubble in the making."}, {"heading": "Billions needed", "summary": "Speaking of AI’s circular investments, here’s what’s been happening:\n\nMeta sold $25 billion of common stock and $12.5 billion of preferred shares, and said it plans to raise as much as $60 billion more. The cash will be used for AI spending.\n\nBroadcom arranged a $63 billion deal with investment firms to finance the purchase of chips for Anthropic.\n\nSpaceX signed a roughly $40 billion equipment-finance lease with Apollo to pay for more chips.\n\nBulls are undeterred by the relentless demand for financing. The AI-driven debt boom is creating some of the most attractive fixed-income opportunities in years , eclipsing the appeal of long-dated US Treasuries, said Rick Rieder, BlackRock’s chief investment officer for global fixed income."}]}}, "2026-10-26": {"date": "2026-10-26", "morning": {"hook": "이란전 분수령, 골드만 코스피↓", "line": "이번 주 이스라엘 선거와 다음 주 미국 중간선거를 전후해 이란 전쟁이 다시 격화될 수 있다는 우려가 일고 있다.", "markets": [{"name": "S&P 500", "value": "7,623.68", "change": "-0.5%"}, {"name": "Nasdaq 100", "value": "28,957.53", "change": "-0.0%"}, {"name": "US 10Y", "value": "4.99%", "change": "+0.04"}, {"name": "USD/KRW", "value": "₩1,323.09", "change": "-0.2%"}, {"name": "Bloomberg Dollar", "value": "1,221.00", "change": "+0.1%"}, {"name": "Brent", "value": "$116.72", "change": "+3.1%"}], "items": [{"n": 1, "headline": "美·이스라엘 선거 후 이란 확전 우려", "summary": "트럼프 대통령은 11월 3일 미국 중간선거 이후 중동 주둔 미군이 이란에 대한 공격 을 재개할 수 있음을 거듭 시사해왔다. 소식통에 따르면 이란은 미국 중간선거를 전후한 새로운 폭격에 대비해 이스라엘과 UAE 등 중동 전역에서 보복을 준비하고 있으며, 선거 이후 새 의회가 내년 1월 출범할 때까지가 가장 어려운 시기가 될 것으로 보고 있다. UAE 정부의 입장에 정통한 소식통도 걸프 지역 일부 당국자들이 무력 충돌 재개 가능성을 매우 높게 보고 있으며, 교전이 재개될 경우 이전보다 상황이 더 악화될 수 있다고 우려하고 있다고 전했다."}, {"n": 2, "headline": "브렌트 한때 117달러 돌파", "summary": "사우디아라비아에 대한 공격이 격화하면서 중동 공급 우려가 커져 브렌트유 가 6개월 만에 최고 수준으로 치솟았다. 브렌트유는 23일 장중 배럴당 117달러를 돌파하며 주간 기준 6% 넘게 올랐고, WTI는 3.8% 상승한 103.27달러에 마감했다. 후티 반군은 사우디 홍해 연안의 얀부항을 공격했다고 주장했으며, 사우디 내 유전과 공항에서도 인명 피해를 낸 공격이 이어졌다."}, {"n": 3, "headline": "골드만, 코스피 목표 25% 하향", "summary": "골드만삭스가 AI 트레이드에 대한 우려가 커지자 코스피 12개월 목표치를 1만2000에서 9000으로 25% 낮췄다. 코스피가 6월 고점 대비 35% 넘게 급락한 데 따라 보다 보수적인 밸류에이션 가정을 반영한 것이다. 다만 골드만은 한국 증시가 크게 저평가됐다며 새 목표치도 현 수준에서 60% 넘는 상승 여력을 시사한다고 밝혔다."}, {"n": 4, "headline": "연준·ECB·BOJ ‘매파적 동결’ 전망", "summary": "이번 주 연준 을 필두로 유럽중앙은행(ECB), 일본은행(BOJ)이 기준금리를 동결하고 향후 추가 인상 가능성을 열어둔 채 상황을 지켜볼 것으로 예상된다. 에너지 가격 급등에서 인공지능(AI) 붐에 이르는 인플레이션 위험에 대응하는 가운데, 이들 중앙은행은 신중한 속도 조절과 함께 매파적 기조를 유지할 가능성이 높다. 지난달 연준은 2023년 이후 처음으로 금리를 인상하면서 올해 추가 인상이 이뤄질 가능성을 시사했다."}, {"n": 5, "headline": "연준 동결 전망 속 ‘인상 경계’...달러 지지", "summary": "이번 주 연준 금리 동결이 지배적인 전망이지만 끈질긴 인플레이션에 따른 추가 긴축 가능성도 주목받고 있다. 머니마켓이 25bp 인상 가능성을 약 10%로 반영하는 가운데 ANZ는 9월 헤드라인 CPI가 3.7%로 높아지는 등 물가 상방 위험이 커졌다며 25bp 인상 가능성이 시장 예상보다 높다고 진단했다. 포워드 가이던스를 피해온 케빈 워시 의장이 인플레이션 대응에 대한 신뢰를 확고히 하기 위해 실제 인상에 나설 수 있다는 분석이다."}]}, "daily": {"headline": "Brazil shock", "sections": ["‘Caught by surprise’"], "five": ["Brazilian markets are heading for a major rout after President Luiz Inácio Lula da Silva pulled off a stunning comeback to defeat Flávio Bolsonaro, the right-wing candidate that many investors preferred.", "Stocks elsewhere started the week on a positive note as oil retreated from a six-month high and investors awaited a busy slate of tech earnings.", "Top security officials from Saudi Arabia, Pakistan and Turkey are meeting Iran’s leaders today in an effort to breathe new life into talks aimed at preventing a broader war in the Middle East.", "Germany’s business outlook unexpectedly brightened for a sixth month in a row, underscoring the economy’s rebound from a prolonged downturn.", "Chinese automakers outsold Japanese rivals in Europe for the first time last quarter, underscoring how quickly brands like BYD and Chery are gaining ground in the region."], "commentary": [{"heading": "‘Caught by surprise’", "summary": "Rarely in recent memory have investors been so wrong-footed by a political event as they were by Sunday’s presidential election in Latin America’s largest economy.\n\nAn ETF tracking Brazilian equities is plunging 27% in US premarket trading , while shares of the country’s banks are tanking too: Banco Bradesco is down 27% and Itau Unibanco is 28% lower. Wealth manager XP is down 39%. Currency derivatives point to a more than 10% plunge in the real.\n\nBolsonaro came in first in the Oct. 4 first round, triggering a rally that drew billions of dollars into the country from foreign investors. They were betting that the right-wing politician would put in place a much-demanded fiscal tightening that would allow for lower interest rates."}]}}, "2026-10-23": {"date": "2026-10-23", "morning": {"hook": "나스닥 급락, 佛불안 전이조짐", "line": "인공지능(AI) 투자수익에 대한 우려가 다시 불거진 가운데 중동 긴장까지 고조되면서 뉴욕증시가 기술주를 중심으로 급락했다.", "markets": [{"name": "S&P 500", "value": "7,663.43", "change": "-1.2%"}, {"name": "Nasdaq 100", "value": "28,958.69", "change": "-2.9%"}, {"name": "US 10Y", "value": "4.95%", "change": "-0.17"}, {"name": "USD/KRW", "value": "₩1,326.65", "change": "+0.0%"}, {"name": "Bloomberg Dollar", "value": "1,220.22", "change": "-0.1%"}, {"name": "Brent", "value": "$113.05", "change": "+3.9%"}], "items": [{"n": 1, "headline": "블랙스톤 “AI 버블 아냐…수요 폭발적”", "summary": "존 그레이 블랙스톤 사장은 AI 붐이 버블로 이어질 것을 우려할 필요가 없다며 수요가 “거의 포물선형”으로 증가하고 있다고 진단했다. 그는 버블이란 설비를 먼저 구축한 뒤 수요가 따라오기를 기대하는 경우지만, AI는 설비를 구축하면서도 수요를 따라잡기 어려운 상황이라며 1990년대 통신 버블과는 다르다고 강조했다. 이는 최근 AI 산업이 “거의 확실하게” 버블로 향하고 있다고 경고한 켄 그리핀과 대조적인 견해다."}, {"n": 2, "headline": "중동 긴장 고조…美외교관 철수·아람코 대피", "summary": "예멘의 친이란 후티 반군이 공격을 강화하는 가운데 미국이 사우디아라비아 주재 일부 외교관과 가족들에게 철수 명령을 내렸다. 사우디아람코의 다란 본사도 원인이 확인되지 않은 경보가 울린 뒤 대피하고 직원들에게 재택근무를 지시했다. 전일 아람코 석유시설과 사우디 동부 공항에 대한 공격으로 최소 4명이 사망했다. NBC뉴스는 요르단과 쿠웨이트, 카타르의 미군 기지에서도 일부 인력이 철수할 예정이라고 보도했다."}, {"n": 3, "headline": "佛국채 불안 확산…伊로 전이 조짐", "summary": "프랑스 국채 불안 이 심화되면서 글로벌 금융시장의 취약 고리로 부각되고 있다. 프랑스 10년물 국채 금리의 독일 대비 스프레드는 장중 19bp 급등한 178bp로 2011년 말 유럽 재정위기 이후 최고 수준을 기록했다. 단기물도 매도세를 피하지 못해 2년물 금리가 장중 3.9%에 육박했고 CAC40 지수도 1% 넘게 하락했다. 글로벌 위험회피에 주말 시위 재개 우려와 막대한 국가부채, 정치권의 재정 정상화 능력에 대한 의구심이 겹치며 프랑스 자산 전반에 매도 압력이 커지고 있다."}, {"n": 4, "headline": "中규제·AI우려에 알리바바↓…홍콩 기술주 투매", "summary": "중국 당국이 전자상거래 업체들을 소집해 제품 품질 기준 강화를 주문하면서 알리바바 주가가 6.1% 급락해 두 달 만에 최대 낙폭을 기록했다. 항셍지수는 3%, 항셍테크지수는 5% 떨어졌다. 중국 전자상거래 업체들이 핵심 사업의 성장을 유지하면서 막대한 AI 투자까지 병행해야 하는 상황에서 규제 부담과 투자수익에 대한 우려가 겹쳤다. 항셍테크지수는 올해 들어 31% 하락해 2024년 9월 중국 정부의 대규모 경기부양책 이후 상승분을 거의 모두 반납할 위기에 놓였다."}, {"n": 5, "headline": "바클레이스, AI 활용해 5천명 감원", "summary": "바클레이스 가 인공지능(AI)을 활용한 비용 절감에 나서면서 전체 인력의 약 5%인 5천명을 감원한다. 감원 대상의 약 60%는 개발자를 포함한 지원 부문이며, 올해 상반기에 이미 줄인 1천명도 포함된다. 바클레이스는 향후 비용을 낮추기 위한 구조조정에 올해 약 6억파운드를 투입할 예정으로 기존 예상의 두 배 수준이다. CS 벤카타크리슈난 CEO는 “AI를 대규모로 활용할 것“이라면서도 ”AI는 케이크 자체가 아니라 케이크 위의 아이싱“이라고 말했다."}]}, "daily": {"headline": "Sifting through election scenarios", "sections": ["Election scenarios", "‘Paralyzed’ market"], "five": ["Stocks are stabilizing after yesterday’s rout in the AI trade, though further gains in oil prices are keeping sentiment cautious.", "The euro area’s private sector slowed more than expected in October , weighed down by France as the region’s No. 2 economy grapples with fiscal and political tensions .", "SK Hynix scrapped plans for a potential $10 billion US listing of its Solidigm unit as investors grow increasingly uneasy over the AI boom. More below on the IPO market’s woes.", "Kering shares plunged on disappointing sales at its Italian fashion label Gucci, with weakness in China undermining the brand’s years-long turnaround effort.", "JetBlue’s stocks and bonds plunged , signaling mounting investor doubts about the airline’s financial outlook."], "commentary": [{"heading": "Election scenarios", "summary": "The US midterm election is less than two weeks away, and the conventional wisdom on Wall Street is that stocks will fall if Democrats regain control of both houses of Congress. The reality is more nuanced than that , as our explainer lays out.\n\nA blue sweep is seen as bad for stocks in part because Democrats are viewed as more likely to support regulations that would slow down the AI boom. But Donald Trump will still wield a veto, and Democrats are unlikely to hold enough seats to override it, so they will have a hard time implementing tax increases or regulations that markets tend to disfavor.\n\nWall Street pros tend to be just fine with gridlock, and that’s what they can largely expect if Democrats take back just one chamber of Congress. It will be hard to get anything done with the House and Senate split and Trump able to veto any legislation the parties do agree on."}, {"heading": "‘Paralyzed’ market", "summary": "The debate over AI is keeping IPOs stuck on the launchpad , with October on track for the slowest month of the year by volume for US stock market listings.\n\nIt’s a marked turn away from a roaring pace that saw $162.6 billion raised through the end of September.\n\nAI infrastructure companies including Nscale and DayOne Data Centers are pitching investors on their importance to the sector’s buildout, yet with shares of peers such as CoreWeave plunging, investors’ appetite for risk-taking has evaporated.\n\nHanging over it all, of course, is Anthropic’s debut, expected next month. Companies gauging investors’ willingness to back their IPOs are clamoring for the firm behind Claude to deliver a win that would clear the decks. Billions of dollars of capital and months of preparations are hanging in the balance."}]}}, "2026-10-22": {"date": "2026-10-22", "morning": {"hook": "스페이스X 훈풍, 佛10년물 5%", "line": "뉴욕증시는 스페이스X의 블록버스터급 실적 호조에 인공지능(AI) 투자 지속 가능성에 대한 우려가 완화되면서 기술주를 중심으로 상승했다.", "markets": [{"name": "S&P 500", "value": "7,757.17", "change": "+0.6%"}, {"name": "Nasdaq 100", "value": "29,822.52", "change": "+1.1%"}, {"name": "US 10Y", "value": "5.12%", "change": "+0.01"}, {"name": "USD/KRW", "value": "₩1,327.09", "change": "+0.0%"}, {"name": "Bloomberg Dollar", "value": "1,221.12", "change": "+0.1%"}, {"name": "Brent", "value": "$109.45", "change": "+0.6%"}], "items": [{"n": 1, "headline": "佛10년물 5% 돌파…독일과 금리차 15년 최대", "summary": "프랑스 10년물 국채 금리가 2002년 이후 처음으로 5%를 돌파했다. 에너지 가격 상승이 재정 전망에 대한 우려를 키우면서 독일 10년물과의 금리차는 159.4bp로 확대돼 15년 만에 최대를 기록했다. 생활비 급등에 따른 폭력 시위와 막대한 부채 부담까지 겹치면서 프랑스가 재정적자를 줄일 예산안을 통과시킬 수 있을지에 대한 투자자들의 의구심이 커지고 있다. 프랑스발 불안에 유로화도 한때 0.2% 하락했다."}, {"n": 2, "headline": "푸틴, 美·우크라와 3자협상 재개 제안…억류 미국인 석방", "summary": "블라디미르 푸틴 러시아 대통령이 우크라이나 전쟁 종식을 위한 미국·우크라이나와의 3자 협상을 재개할 준비가 돼 있다고 밝혔다. 스티브 위트코프 미 대통령 특사와 만난 푸틴은 11월 초 3자 협상을 제안했으며, 크렘린궁은 전쟁 이후 러시아와 우크라이나의 안보 체제 구축이 주요 논의 대상이라고 밝혔다. 다만 푸틴이 우크라이나와 직접 협상할 준비가 됐다는 신호는 아직 없으며, 크렘린궁은 위트코프가 전달한 우크라이나·유럽 측 제안에 대해서도 유용한 내용이 상대적으로 적었다고 평가했다."}, {"n": 3, "headline": "금리 급등에 美·유럽 부채발행 줄줄이 연기…신용시장 냉각", "summary": "금리 상승과 인플레이션 재점화, AI 투자 붐의 균열 가능성에 대한 우려가 커지면서 이달 미국과 유럽에서 50억달러가 넘는 기업 부채 발행이 연기 됐다. 채권과 대출 발행을 미룬 기업은 적어도 7곳으로, 올해 들어 발행 연기가 가장 집중된 모습이다. 미국 정크본드 발행액도 9월 510억달러에서 이달 현재 약 70억달러로 급감했다. AVI-SPL은 6억9천만달러 규모의 레버리지론 조달을 철회했고, 프레디맥은 충분한 수요를 확보하지 못해 4억4천만달러 이상의 모기지 채권 발행을 연기했다. 유럽에서는 서켓이 30억유로 규모의 차환 계획을 미뤘다."}, {"n": 4, "headline": "고금리가 만든 회사채 기회…블랙록 “한 세대 최고 수익률”", "summary": "고금리로 기업들의 자금조달 부담이 커지는 가운데 블랙록은 회사채 투자자에게는 오히려 이례적인 기회가 열리고 있다고 진단했다. 현재 듀레이션 3년 미만, 평균 신용등급 A-인 분산 채권 포트폴리오로도 7%가 넘는 수익률을 확보할 수 있다는 분석이다. 회사채 수익률은 3년 전 잠시 나타났던 수준과 글로벌 금융위기 당시를 제외하면 보기 어려울 정도로 높아졌다. 블랙록은 이를 “한 세대에 한 번 볼 정도로 높은 수익률”이라며, 2010년대나 2020년대 초반과 달리 상대적으로 안전한 자산에서도 높은 수익을 얻을 수 있다고 설명했다."}, {"n": 5, "headline": "미국채 큰손 바뀐다…‘패스트머니’ 영향력 확대", "summary": "미국채 금리가 수십 년 만의 최고 수준으로 치솟은 가운데 미 정부가 가격에 민감한 민간 투자자들에게 갈수록 의존하고 있다. 32조달러 규모로 성장한 미국채 시장에서 민간 투자자들은 현재 연방정부 부채의 약 70%를 보유해 1990년 이후 최고 수준에 근접했다. 과거 주요 매수자였던 외국 정부와 중앙은행, 연기금 등 가격에 상대적으로 둔감한 ‘슬로 머니’의 영향력이 줄어든 반면, 원하는 수익률이 나오지 않으면 빠르게 이탈할 수 있는 헤지펀드 등 ‘패스트 머니’의 영향력이 커지고 있다. 블룸버그 이코노믹스는 연준과 외국 공공기관의 미국채 보유 감소가 한때 10년물 기간 프리미엄을 약 105bp 높인 것으로 추산했다."}]}, "daily": {"headline": "No patience for tech", "sections": ["No patience", "Nowhere to hide"]}}, "2026-10-21": {"date": "2026-10-21", "morning": {"hook": "AI 옥석가리기, 佛증시 ‘최대숏’", "line": "뉴욕증시는 기술주 변동성에도 기업 실적에 대한 기대와 유가 하락에 힘입어 상승했다.", "markets": [{"name": "S&P 500", "value": "7,712.57", "change": "+0.3%"}, {"name": "Nasdaq 100", "value": "29,490.28", "change": "-0.1%"}, {"name": "US 10Y", "value": "5.11%", "change": "-0.03"}, {"name": "USD/KRW", "value": "₩1,326.61", "change": "-0.0%"}, {"name": "Bloomberg Dollar", "value": "1,220.50", "change": "-0.2%"}, {"name": "Brent", "value": "$108.97", "change": "-0.5%"}], "items": [{"n": 1, "headline": "佛 정치·재정 불안에 자산기피…CAC40 ‘최대 숏’", "summary": "프랑스 의 정치·재정 불안이 금융시장 전반으로 번지면서 주식과 채권이 동시에 투자자들의 외면을 받고 있다. 프랑스 10년물 국채 금리의 독일 국채 대비 스프레드는 20일 150bp를 웃돌며 마감했다. 2012년 1월 이후 처음으로, 당시 그리스에서 시작해 아일랜드와 포르투갈, 스페인 등으로 확산된 유럽 재정위기 절정기에 근접한 수준이다. 생활비 급등에 항의하는 시위와 높은 국가부채·재정적자에 대한 우려가 투자심리를 압박하고 있다."}, {"n": 2, "headline": "프랭클린템플턴 ‘유로존 부채위기 2.0’ 경고", "summary": "프랑스 국채 매도세가 과거 그리스에서 시작된 위기를 능가하는 ‘유로존 부채위기 2.0’으로 번질 위험이 있다고 프랭클린템플턴이 경고했다. 소날 데사이 채권부문 글로벌 CIO는 위기가 현실화할 경우 과거보다 “훨씬 더 심각할 수 있다”며, 프랑스 부채가 당시 그리스의 10배가 넘는다고 지적했다. 그는 “단순한 구제금융은 선택지가 될 수 없다”면서 “유로존에서 상당한 변동성이 발생할 가능성을 과소평가해서는 안 된다”고 강조했다."}, {"n": 3, "headline": "AI 옥석가리기…IPO·주가 ‘휘청’", "summary": "AI 투자 열기가 옥석가리기로 전환되면서 데이터센터 컴퓨팅을 제공하는 ‘ 네오클라우드 ’에 대한 투자자들의 신뢰가 흔들리고 있다. 한국의 엘리스는 20일 상장 첫날 32% 급락했고, 호주 퍼머스 그리드는 기업가치 300억달러를 목표로 한 IPO 계획을 철회했다. 영국 엔스케일도 목표 기업가치에 대한 투자자들의 반발에 직면했으며, 코어위브는 과도한 차입 우려로 지난주 주가가 20% 넘게 떨어졌다."}, {"n": 4, "headline": "美 주택시장 한파…미결판매 사상 최저·착공 5.2%↓", "summary": "미국의 주택시장 부진이 심화되고 있다. 9월 미결주택판매지수는 전월보다 7.3% 급락한 66으로 2001년 통계 작성 이후 사상 최저를 기록했다. 하락폭은 블룸버그가 조사한 모든 이코노미스트의 예상을 넘어섰으며, 서부가 9.2%, 최대 주택판매 지역인 남부가 8.2% 감소하는 등 전 지역에서 판매가 줄었다. 전미부동산중개인협회(NAR)는 모기지 금리가 빠르게 오르면서 매수자와 매도자 모두 금리 여건이 개선되기를 기다리고 있다고 진단했다."}, {"n": 5, "headline": "AI 열풍에 헤지펀드 대출 수요 폭증…바클레이스 자본 재배분", "summary": "아시아 AI 관련주 급등으로 헤지펀드의 대출 수요가 급증하자 바클레이스 가 내부 자본까지 재배분해 대응했다. 바클레이스는 여름 동안 아시아 헤지펀드 고객에게 제공할 수 있는 금융 한도에 도달하자 내부 경매를 통해 매크로 금리 트레이딩 부문에 배정된 자본 일부를 프라임 파이낸싱 사업으로 돌렸다. 수익성이 높은 프라임 브로커리지에 대차대조표를 더 배정해 AI 투자 열풍에 따른 헤지펀드의 자금 수요를 충족하기 위해서다."}]}, "daily": {"headline": "SpaceX-Tesla talk gets real", "sections": ["Musk’s mashup dreams", "Fast money power"]}}, "2026-10-20": {"date": "2026-10-20", "morning": {"hook": "반도체 반등, 프랑스 국채불안", "line": "인공지능(AI) 투자 붐이 견조한 기업 실적을 계속 뒷받침할 것이라는 기대 속에 저가 매수세가 유입되면서 반도체주가 모처럼 반등해 뉴욕증시를 끌어올렸다.", "markets": [{"name": "S&P 500", "value": "7,690.73", "change": "+0.4%"}, {"name": "Nasdaq 100", "value": "29,529.34", "change": "+1.2%"}, {"name": "US 10Y", "value": "5.14%", "change": "+0.07"}, {"name": "USD/KRW", "value": "₩1,332.44", "change": "-0.0%"}, {"name": "Bloomberg Dollar", "value": "1,223.20", "change": "+0.1%"}, {"name": "Brent", "value": "$109.18", "change": "-0.6%"}], "items": [{"n": 1, "headline": "JP모간 “코어위브 부채 우려 과도”", "summary": "JP모간은 코어위브 의 급증하는 부채와 현금 소진에 대한 투자자들의 우려가 과도하다며 사업모델은 여전히 견조하다고 평가했다. 자금조달 수요가 개별 프로젝트의 수익성 악화가 아니라 빠른 사업 확장에서 비롯되고 있다는 분석이다. 컴퓨팅 수요가 강한 데다 신규 설비 가동 전에 고객을 확보하는 ‘최소구매 보장 장기계약(take-or-pay)’을 맺고 있으며, 통상적인 5년 계약의 차입 효과를 제외한 내부수익률(IRR)은 10%대 중반으로 가중평균자본비용(WACC) 9~11%를 웃도는 것으로 추정했다."}, {"n": 2, "headline": "프랑스 시위에 국채 불안 재점화", "summary": "프랑스 에서 생활비 부담에 항의하는 폭력 시위가 주말 동안 격화하면서 재정·정치 불안이 다시 금융시장을 압박했다. 프랑스 국채가 유럽 주요국 대비 약세를 보이면서 독일 10년물과의 금리차는 장중 최대 8bp 확대된 146bp로 2주 만에 가장 높은 수준을 기록했고, 이탈리아 국채와의 금리차도 사상 최대 수준으로 벌어졌다. CAC 40 지수는 장중 최대 1.7% 하락했고 유로화도 달러 대비 한때 0.5% 밀렸다. 투자자들이 프랑스 국채를 갈수록 위험한 자산으로 평가하면서 월초에는 독일 10년물과의 금리차가 150bp를 넘어 유로존 재정위기 이후 가장 높은 수준으로 확대된 바 있다."}, {"n": 3, "headline": "메르츠 “유럽, 러시아 위협 과소평가”", "summary": "프리드리히 메르츠 독일 총리는 유럽이 러시아의 위협을 충분히 심각하게 받아들이지 않고 있다며, 블라디미르 푸틴 대통령의 목표는 단순히 우크라이나 영토를 차지하는 데 그치지 않고 유럽의 민주주의와 정치 질서를 흔드는 것이라고 경고했다. 그는 러시아가 “민주주의와 개방된 사회, 유럽 통합의 성공을 두려워한다”며 유럽 각국이 미국에 대한 의존도를 낮추고 나토 내에서 스스로를 방어할 수 있도록 방위체계를 강화해야 한다고 강조했다."}, {"n": 4, "headline": "美, 연방기관서 中딥시크 사용 금지", "summary": "트럼프 행정부가 국가안보 우려를 이유로 미국 연방정부 민간기관의 중국 AI 스타트업 딥시크 제품과 서비스 사용을 금지했다. 미 국토안보부가 연방관보에 게시한 공고에 따르면 연방기관들은 시스템에서 딥시크 제품을 모두 제거해야 하며, 딥시크의 연방정부 계약 참여도 금지된다. 미 행정부는 딥시크가 상당한 양의 민감한 사용자 데이터를 수집하고 있으며 중국 정보보안법에 따라 해당 데이터가 중국 정부와 공유될 가능성이 있다고 경고했다."}, {"n": 5, "headline": "머스크, 美 어린이에 스페이스X 주식 1주씩", "summary": "일론 머스크 가 내년 미국의 모든 어린이에게 스페이스X 주식을 1주씩 나눠주겠다는 구상을 밝혔다. 사안에 정통한 관계자에 따르면 머스크는 이를 ‘트럼프 계좌(Trump Accounts)’를 통해 지급하는 데 원칙적으로 합의했다. 미 인구조사국 추산 약 7200만명의 어린이를 대상으로 현재 주가를 적용하면 기부 규모는 약 107억달러에 달할 전망이다. 트럼프 계좌는 2025~2028년 태어난 미국 어린이들에게 1000달러를 제공하는 제도로, 마이클·수전 델 부부와 레이 달리오 등도 후원에 참여했다."}]}, "daily": {"headline": "AI bellwether in freefall", "sections": ["‘Fear and pessimism’", "Netflix slump"]}}, "2026-10-19": {"date": "2026-10-19", "morning": {"hook": "코어위브發 AI불안, 유가 110불", "line": "코어위브를 둘러싼 우려가 인공지능(AI) 투자 지속 가능성에 대한 의구심을 키우면서 기술주 매도세 속에 뉴욕증시가 16일 하락했다.", "markets": [{"name": "S&P 500", "value": "7,659.44", "change": "-1.1%"}, {"name": "Nasdaq 100", "value": "29,187.55", "change": "-2.5%"}, {"name": "US 10Y", "value": "5.07%", "change": "+0.01"}, {"name": "USD/KRW", "value": "₩1,334.25", "change": "-0.6%"}, {"name": "Bloomberg Dollar", "value": "1,222.47", "change": "-0.2%"}, {"name": "Brent", "value": "$109.86", "change": "+3.7%"}], "items": [{"n": 1, "headline": "코어위브 불안…AI 투자 놓고 공포와 낙관론 충돌", "summary": "AI 인프라 투자 열풍의 지속 가능성을 둘러싼 우려가 커지면서 코어위브 가 시장의 시험대로 떠올랐다. 주가는 일주일 사이에 25% 급락했고 회사채도 재무적 곤경을 시사하는 수준까지 떨어졌다. 5년물 신용부도스와프(CDS)는 사상 최고치로 치솟아 향후 5년 내 디폴트 가능성을 60% 넘게 반영했다. 미국채 금리 상승과 끈질긴 인플레이션으로 자금조달 비용이 높아지는 가운데, 데이터센터 건설을 위해 하이일드 채권에 크게 의존하는 코어위브의 부채 부담이 시장 경계의 초점이 되고 있다."}, {"n": 2, "headline": "브렌트유 110달러…유라시아 ‘확전 가능성 65%’", "summary": "브렌트유 가 중동과 러시아를 둘러싼 공급 차질 우려에 16일 장중 3.9% 뛰며 5월 이후 처음으로 배럴당 110달러를 터치했다. 후티 반군의 사우디아라비아 공격과 러시아·우크라이나의 에너지 인프라 공격이 이어지는 가운데, 미 하원의원들이 러시아와의 대규모 디젤 공급 합의를 저지하는 법안까지 발의하면서 공급 확대 기대가 약해졌다. 전쟁에 따른 공급 차질로 유가는 올해 들어 70% 넘게 올랐고, 유럽 디젤 선물은 두 배 이상 뛰는 등 정제유 시장의 수급 불안은 더욱 심각한 상황이다."}, {"n": 3, "headline": "美 재정적자 1.99조달러…이자비용 사상 최대", "summary": "미국의 2026회계연도 재정적자 가 1.99조달러로 전년보다 12% 늘며 4년 연속 2조달러 안팎을 기록했다. GDP의 약 6%에 달하는 규모로, 정부 지출이 7.4조달러로 6% 증가한 반면 세입은 5.4조달러로 3% 늘어나는 데 그쳤다. 특히 미국채 금리 상승과 부채 증가로 순이자비용이 사상 최대인 1.05조달러까지 불어나며 적자 확대의 주요 요인으로 작용했다."}, {"n": 4, "headline": "美재무부, 국채 입찰 규모 변경 가능성 의견 타진", "summary": "미국 재무부가 11월4일 분기 국채 발행 계획 발표를 앞두고 프라이머리 딜러들에게 투자자 수요의 구조적 변화를 감안해 향후 국채 입찰 규모를 어떻게 조정할 필요가 있는지 의견을 요청했다. 최근 확대된 장기물 바이백이 시장 유동성과 딜러들의 거래 중개 능력에 미친 영향과 추가 개선 방안도 질문했다. 대규모 재정적자와 높은 장기금리로 국채 공급 및 이자비용 부담이 커진 가운데 재무부가 만기별 발행 구성을 조정할지 시장의 관심이 쏠리고 있다."}, {"n": 5, "headline": "中, AI 수출통제 추진", "summary": "중국 이 대규모언어모델(LLM)과 AI 에이전트, 반도체 설계 등 첨단 AI 기술의 해외 이전을 제한하는 방안을 추진한다. 중국 정부가 공개한 초안에는 컴퓨팅 클러스터를 포함한 23개 AI 기술이 수출통제 대상으로 제시됐으며, 일정 기준을 넘는 AI 모델의 가중치와 소스코드도 포함된다. 규제 대상 모델을 해외에 배치하는 것 역시 기술 수출로 간주된다. 다만 이미 공개된 오픈소스 기술과 연구는 제외하고, 오픈소스 AI 수출에는 간소화된 허가 절차를 적용할 방침이다."}]}, "daily": {"headline": "France besieged", "sections": ["No good options", "Buckle up"]}}, "2026-10-16": {"date": "2026-10-16", "morning": null, "daily": {"headline": "Tech’s rough week", "sections": ["Tough week for tech", "Irresistible rally"]}}, "2026-10-15": {"date": "2026-10-15", "morning": {"hook": "美인플레 가속, 반도체 6일째↓", "line": "지난달 미국의 소비자물가가 5개월 만에 가장 빠른 속도로 상승하고 기조적 물가 압력도 예상보다 큰 폭으로 오르면서 연준 금리 인상 베팅이 강화됐다.", "markets": [{"name": "S&P 500", "value": "7,718.94", "change": "-1.1%"}, {"name": "Nasdaq 100", "value": "29,950.82", "change": "-2.0%"}, {"name": "US 10Y", "value": "5.19%", "change": "-0.02"}, {"name": "USD/KRW", "value": "₩1,340.50", "change": "+0.0%"}, {"name": "Bloomberg Dollar", "value": "1,228.35", "change": "+0.3%"}, {"name": "Brent", "value": "$106.19", "change": "+0.5%"}], "items": [{"n": 1, "headline": "美 9월 CPI 0.6% 상승…전방위적 물가 압력", "summary": "미 노동통계국(BLS)이 14일 발표한 자료에 따르면 9월 헤드라인 소비자물가지수(CPI) 는 연료비 급등에 전월 대비 0.6% 상승했다. 식품과 에너지를 제외한 근원 CPI는 0.3% 올랐다. 전년 동월 대비로는 각각 3.7%, 2.6%로 상승세가 더 가팔라졌다. 네이비페더럴크레디트는 “미국인들의 임금이 인플레이션으로 완전히 잠식되고 있다”며 “연준 역시 인플레이션 진전을 확인하지 못하고 있고, 연료 가격 상승은 다른 분야로 번지기 시작하고 있다”고 진단했다."}, {"n": 2, "headline": "시장 전문가들, 연준 인상 10월보다 12월에 무게", "summary": "리건 캐피털은 “인플레이션이 끈질기고 잘못된 방향으로 움직이고 있다는 점이 어느 때보다 분명하다”며 “연준이 10월에는 금리를 동결할 것으로 예상하지만, 12월에는 금리 인상을 재개할 것으로 본다”고 말했다. 프랭클린 템플턴 인스티튜트는 근원 CPI가 예상보다 뜨겁게 나오면서 추가 금리 인상의 근거가 강화됐지만, 최근 연준 인사들의 비둘기파적 발언을 감안하면 즉각적인 금리 인상의 문턱은 여전히 높다고 평가했다."}, {"n": 3, "headline": "반도체주 6일째 급락…시총 1조달러 넘게 증발", "summary": "금리 상승과 높은 밸류에이션, 막대한 AI 인프라 구축 비용에 대한 우려로 반도체주 매도세가 이어졌다. 필라델피아 반도체지수(SOX)는 4.3% 하락 마감해 최근 6거래일간 낙폭이 11%를 넘어섰고, 이 기간 미국 증시에 상장된 주요 반도체주의 시가총액은 1조달러 넘게 증발했다. SOX 구성 종목의 절반 이상이 최소 10% 하락했고 Arm홀딩스는 21% 급락했다."}, {"n": 4, "headline": "코어위브 채권 ‘부실’수준…CEO ‘시장 비이성적’", "summary": "AI 클라우드 업체 코어위브 의 2032년 만기 무담보 채권 가격이 달러당 80센트 아래로 급락해 통상 재무적 곤경을 나타내는 수준에 진입했다. 채권 수익률은 15%를 넘어섰고 주가도 장중 17% 넘게 급락했다. 코어위브를 AI의 “서브프라임 트랜치”라고 비유했던 D.A. 데이비드슨의 길 루리아는 회사가 9%에 자금을 조달해 5%의 수익을 내는 구조라면 사업 규모를 아무리 키워도 가치를 파괴할 수밖에 없다고 지적했다."}, {"n": 5, "headline": "중동·러시아 긴장 고조에 유가 상승", "summary": "중동과 러시아를 둘러싼 무력 충돌이 격화하면서 원유 공급 차질 우려가 다시 커지고 있다. 예멘 후티 반군이 사우디아라비아 전역에 미사일과 드론 공격을 가해 사우디 아람코 본사까지 타격한 데다, 호르무즈 해협에서는 이란의 유조선 공격이 늘어난 가운데 화물선 한 척이 피격된 뒤 침몰 했다는 소식도 전해졌다. 브렌트유는 배럴당 106달러를 웃돌았고 WTI는 장중 2% 상승했다."}]}, "daily": {"headline": "Calm no more", "sections": ["Calm shattered", "CoreWeave’s ‘yikes’ moment"]}}, "2026-10-14": {"date": "2026-10-14", "morning": {"hook": "AI균열우려, 구원투수 윌리엄스", "line": "인공지능(AI) 투자 열풍의 지속 가능성에 대한 우려로 반도체주 매도세가 이어졌지만, 연준의 공격적인 추가 긴축 우려가 후퇴하면서 뉴욕증시는 낙폭을 대부분 만회했다.", "markets": [{"name": "S&P 500", "value": "7,805.45", "change": "-0.0%"}, {"name": "Nasdaq 100", "value": "30,569.48", "change": "-0.3%"}, {"name": "US 10Y", "value": "5.21%", "change": "-0.03"}, {"name": "USD/KRW", "value": "₩1,343.12", "change": "+0.1%"}, {"name": "Bloomberg Dollar", "value": "1,225.19", "change": "-0.2%"}, {"name": "Brent", "value": "$106.13", "change": "-0.5%"}], "items": [{"n": 1, "headline": "AI 투자 열풍 곳곳서 균열", "summary": "글로벌 AI 투자 열풍에 균열 조짐이 커지고 있다. 특히 중국 CXMT의 반도체 기술 돌파구 소식으로 메모리 반도체주에 대한 경계감이 커진 가운데, 투자자들은 AI에 쏟아붓는 막대한 자금이 그동안의 가파른 주가 상승을 정당화할 만큼 충분한 수익으로 이어질지 주시하고 있다. UBP는 메모리주에서 투자자들이 “일단 팔고 나중에 생각하자”는 분위기라고 전했고, 로터스자산운용은 중국 CXMT의 생산능력 확대가 가격 경쟁을 촉발할 수 있다고 우려했다."}, {"n": 2, "headline": "윌리엄스 “올 한차례 추가 인상…내년은 불필요”", "summary": "존 윌리엄스 뉴욕 연은 총재는 “한 차례 더 금리를 인상하는 것이 적절할 수 있다는 견해에는 변화가 없다”며 “그 이후 추가 조치가 필요하다고 믿을 만한 이유는 현재로서는 없다”고 말했다. 관세와 에너지 가격 충격이 약해지면서 인플레이션이 내년 연준의 2% 목표에 근접할 것으로 예상하기 때문이다. 이는 12월 인상에 이어 2027년 두 차례 추가 인상을 반영하고 있는 시장 전망보다 비둘기파적인 견해다. 다만 그는 전망의 불확실성이 크다며 특히 AI 인프라 투자에 따른 물가 압력을 주시하고 있다고 밝혔다."}, {"n": 3, "headline": "배스먼 “美20년물 금리 6% 넘으면 악몽”", "summary": "채권시장 변동성 지수를 고안한 할리 배스먼은 미국채 20년물 금리가 6%를 넘어설 경우 1100억달러 규모의 20년물이 발행되는 것과 맞먹는 매도 압력이 발생하는 “악몽의 시나리오”가 펼쳐질 수 있다고 경고했다. 최근 금리 급등으로 만기가 긴 채권이 국채선물의 최저가인도채권(CTD)으로 바뀌면서, 금리 상승 시 가격 하락 위험이 더 큰 장기물에 대한 익스포저가 확대되고 있다는 설명이다."}, {"n": 4, "headline": "월가 은행 실적…주식 트레이딩 호조·채권은 엇갈려", "summary": "미국 대형 은행들의 3분기 실적이 엇갈렸다. JP모간체이스 와 골드만삭스 는 주식 트레이딩에서 호조를 보인 반면 채권 부문은 기대에 못 미쳤다. JP모간의 FICC 트레이딩 수익은 전년 동기 대비 4% 감소해 2년여 만에 처음으로 줄었지만, 주식 트레이딩 수익은 49% 급증해 3분기 기준 사상 최고치를 기록했다. 올해 순이자수익(NII) 전망도 1062억달러로 상향했다. 제이미 다이먼 최고경영자(CEO)는 “대규모 재정적자와 끈질긴 인플레이션, 높은 자산가격, 금리 상승, 지정학적 여건이 계속해서 수면 아래에서 변화하고 있다”며 “광범위한 결과에 대비하고 있다”고 밝혔다."}, {"n": 5, "headline": "호르무즈 선박 공격 급증...사우디 아람코 본사 피격", "summary": "이란 이 호르무즈 해협을 통과하는 선박에 대한 공격을 늘리면서 최근 회복세를 보이던 페르시아만 원유 수출이 다시 위협받고 있다. 지난 11일 유조선 4척이 피격된 가운데 초대형 유조선 10여 척과 여러 척의 수에즈막스급 선박이 호르무즈 입구 인근 푸자이라에 접근하다 회항하거나 항로를 되돌렸다. 해운업계에서는 선박 간 환적 대기시간이 길어지는 등 운송 둔화 조짐도 나타나고 있다."}]}, "daily": {"headline": "Beating the pros", "sections": ["Garage trading", "Bond traders dethroned"]}}, "2026-10-13": {"date": "2026-10-13", "morning": {"hook": "美20년물 폐지? 에너지휴전 삐걱", "line": "뉴욕증시는 본격적인 어닝시즌 개막을 앞두고 반도체주가 4거래일 연속 약세를 보이면서 혼조세로 마감했다.", "markets": [{"name": "S&P 500", "value": "7,807.24", "change": "-0.1%"}, {"name": "Nasdaq 100", "value": "30,664.70", "change": "-0.7%"}, {"name": "USD/KRW", "value": "₩1,334.80", "change": "+0.0%"}, {"name": "Bloomberg Dollar", "value": "1,227.38", "change": "+0.1%"}, {"name": "Brent", "value": "$106.65", "change": "+1.8%"}], "items": [{"n": 1, "headline": "러-우크라 ‘에너지 휴전’ 삐걱·중동 긴장↑…유가불안", "summary": "트럼프 대통령이 발표한 러시아와의 ‘ 에너지 휴전 ’이 삐걱이고 중동에서는 사우디아라비아가 이란 전쟁 발발 이후 가장 치명적인 공격을 받으면서 브렌트유 가 장중 2% 넘게 올라 배럴당 107달러를 상회했다. 젤렌스키 우크라이나 대통령은 러시아가 자국의 에너지 인프라를 계속 공격하고 있는 만큼 우크라이나도 공격을 이어갈 것이라고 밝혔다. 그는 트럼프 대통령이 전날 트루스소셜을 통해 발표한 휴전 소식을 언론 보도를 통해 알게 됐다며 “푸틴 러시아 대통령이 트루스소셜을 읽지 않는 게 분명하다”고 말했다."}, {"n": 2, "headline": "다시 고개드는 미국채 20년물 폐지론", "summary": "월가에서 미국채 20년물 폐지론이 제기되는 가운데 11월4일 재무부의 분기 국채발행계획에 관심이 쏠리고 있다. 도이체방크는 “20년물 미국채 발행이 중단될 것이라는 이야기가 나오고 있다“고 전했고, 씨티그룹은 20년물 발행이 축소되거나 아예 중단될 가능성을 감안해 20년물이 10년물보다 강세를 보일 것에 대비하라고 권고했다. 논쟁의 중심에는 재무부의 차입비용 절감이 있다. 2020년 재무장관 재임 당시 20년물을 부활시킨 스티븐 므누신조차 2024년엔 ”납세자에게 비용만 많이 든다“며 폐지를 주장했다."}, {"n": 3, "headline": "美채권 매도세 끝나나…월가, 듀레이션 매력 주목", "summary": "미국채 금리가 수년 만의 최고 수준으로 치솟은 뒤 월가에서는 채권의 투자 매력이 높아졌다는 평가가 나오고 있다. 골드만삭스는 신용시장 불안 조짐과 기술적 위험 완화를 근거로 듀레이션이 매력적인 수준이라며 10년물 반등 가능성을 제기했다. 모간스탠리도 이례적으로 높은 성장률과 물가 압력이 지속되지 않는 한 현재 미국채 금리가 매력적이라고 평가했다. 씨티그룹은 인플레이션과 임금 상승세 둔화를 이유로 단기물을 선호했다."}, {"n": 4, "headline": "골드만, 글로벌 주식 단기 전망 ‘비중확대’", "summary": "골드만삭스 가 강한 기업 실적을 이유로 사상 최고치 부근에서 거래되고 있는 글로벌 주식에 대해 단기적으로 낙관적인 전망으로 돌아섰다. 크리스티안 뮐러-글리스만이 이끄는 전략팀은 유가와 채권금리 상승으로 최근 랠리가 주춤하면서 주식 밸류에이션 부담이 낮아진 반면 기업 이익 전망은 여전히 양호하다고 진단했다. 이에 3개월 주식 전망을 ‘중립’에서 ‘비중확대’로 상향해 기존 12개월 강세 전망과 같은 수준으로 맞췄다."}, {"n": 5, "headline": "메타, 새 AI 모델 ‘뮤즈 원더’ 공개", "summary": "메타플랫폼스 가 새로운 인공지능(AI) 모델 ‘뮤즈 원더(Muse Wonder)’를 공개하자 주가가 장중 4.7% 가까이 뛰었다. 내부 코드명 ‘워터멜론’으로 개발된 이 모델은 마크 저커버그 최고경영자(CEO)가 AI 조직을 전면 개편한 이후 내놓은 가장 강력한 모델이다. 메타는 코딩과 금융·법률 문제 해결에서 오픈AI의 챗GPT와 앤트로픽의 클로드에 필적하는 ‘프런티어급 역량’을 갖췄다고 주장했다."}]}, "daily": {"headline": "AI exposure", "sections": ["Roll of the dice", "Growth shield"]}}, "2026-10-12": {"date": "2026-10-12", "morning": {"hook": "사우디공항 피격, 미·러 디젤거래", "line": "사우디아라비아 리야드 킹칼리드 국제공항이 대규모 사상자를 낸 공격을 받은 지 하루 만에 또다시 피격됐다.", "markets": [{"name": "S&P 500", "value": "7,811.54", "change": "+0.6%"}, {"name": "Nasdaq 100", "value": "30,883.15", "change": "+0.5%"}, {"name": "US 10Y", "value": "5.24%", "change": "+0.01"}, {"name": "Bloomberg Dollar", "value": "1,225.96", "change": "+0.2%"}, {"name": "Brent", "value": "$104.72", "change": "+0.4%"}], "items": [{"n": 1, "headline": "트럼프-푸틴, 러시아산 디젤 美공급 합의", "summary": "트럼프 미국 대통령이 급등한 연료 가격을 낮추기 위해 푸틴 러시아 대통령과 손잡고 러시아산 디젤 을 글로벌 시장에 공급하기로 했다. 미국 중간선거를 앞두고 수년간 이어진 대러 제재 기조를 뒤집는 조치다. 트럼프는 이달부터 우선 총 1350만배럴 규모의 디젤을 공급한다고 발표했다. 크렘린궁도 푸틴 대통령의 발언을 인용해 러시아가 “미국과 글로벌 시장에 원유와 석유제품을 공급할 준비가 돼 있다”고 밝혔다. 미 재무부는 기존 제재 대상이었던 러시아산 연료에 대한 제재 면제도 발급했다."}, {"n": 2, "headline": "美국채 매도세에 ‘기간 프리미엄’ 급등…장기금리 상승 압력", "summary": "미국채 금리가 24년 만의 최고 수준으로 치솟은 최근 매도세의 상당 부분을 기간 프리미엄 상승이 주도한 것으로 나타나면서 장기금리가 높은 수준에 고착될 수 있다는 우려가 커지고 있다. 기간 프리미엄은 지정학적 충격이나 정부 재정위기처럼 장기채 만기까지 발생할 수 있는 예측하기 어려운 위험에 대한 일종의 보상으로, 산정 방식도 다양하고 움직임을 설명하는 요인도 복잡하지만 최근 몇 주 사이 10여 년 만의 최고 수준으로 급등했다."}, {"n": 3, "headline": "이탈리아보다 위험해진 프랑스 국채", "summary": "채권 투자자들이 이탈리아 국채보다 프랑스 국채 를 보유하는 대가로 유로화 출범 이후 가장 높은 수준의 추가 보상을 요구하고 있다. 프랑스와 이탈리아의 벤치마크 10년물 국채 금리 차이는 9일 30bp로 사상 최대를 기록했다. 지난해까지만 해도 이탈리아가 프랑스보다 위험한 국가로 여겨져 차입 비용도 더 높았다. 하지만 프랑스가 기대만큼 재정적자를 줄이지 못한 데다 국내총생산(GDP) 대비 국가부채 비율도 117.6%에서 낮아질 조짐을 보이지 않자 상황은 역전됐다."}, {"n": 4, "headline": "EU·중국, 中 하이브리드차 수출 대폭 감축 합의", "summary": "유럽연합(EU)과 중국 이 무역 갈등 완화를 위해 중국산 하이브리드 차량의 대EU 수출을 대폭 줄이는 내용의 합의에 도달했다고 EU가 밝혔다. 블룸버그가 확인한 문서에 따르면 수입 한도는 첫해 연간 35만대 로 정해지고 2년 차부터 매년 6%씩 늘어난다. 세이프가드 조치는 이르면 12월 1일부터 시행될 수 있다. 이번 합의는 4년간 적용되며 이 기간 EU와 중국은 세계무역기구(WTO) 규정을 준수하기로 했다."}, {"n": 5, "headline": "오픈AI, 연말 연환산 매출 700억달러 이상 전망", "summary": "챗GPT 개발사 오픈AI 가 기업용 사업 성장에 힘입어 2026년 말까지 연환산 매출이 700억달러에 도달하거나 이를 넘어설 것으로 전망하고 있다고 사안에 정통한 관계자들이 밝혔다. 앞서 파이낸셜타임스(FT)는 9월 말 기준 오픈AI의 연환산 매출이 일부 투자자 추정치보다 200억달러 적은 500억달러라고 보도해 8일 나스닥 100지수와 필라델피아 반도체주 지수가 급락했다. 연환산 매출은 일정 기간의 매출 실적을 토대로 1년치 매출을 추산한 수치로, 기업별로 이를 산정하는 방식에 차이가 있다."}]}, "daily": {"headline": "Bank stock vibe shift", "sections": ["Bank stocks try to escape AI scare trade"]}}, "2026-10-09": {"date": "2026-10-09", "morning": null, "daily": {"headline": "Extinction risk", "sections": ["Pricing AI risk", "China bonds become source of cheap money"]}}, "2026-10-08": {"date": "2026-10-08", "morning": {"hook": "美금리 정점? 스페이스X CDS↑", "line": "호르무즈 해협을 지나는 선박에 대한 이란의 공격이 늘고 백악관이 다음달 중간선거 전에 이란을 공격하는 방안을 검토하고 있다는 애틀랜틱 보도가 나오면서 브렌트유는 배럴당 101달러를 다시 넘어섰다.", "markets": [{"name": "S&P 500", "value": "7,801.77", "change": "-0.2%"}, {"name": "Nasdaq 100", "value": "31,160.08", "change": "-0.2%"}, {"name": "US 10Y", "value": "5.28%", "change": "+0.00"}, {"name": "USD/KRW", "value": "₩1,339.50", "change": "+0.0%"}, {"name": "Bloomberg Dollar", "value": "1,223.81", "change": "+0.3%"}, {"name": "Brent", "value": "$101.32", "change": "+0.7%"}], "items": [{"n": 1, "headline": "美국채 금리 정점 왔나…월가 전망 엇갈려", "summary": "미국채 장기물 금리 가 2002년 이후 최고 수준으로 치솟은 가운데 월가 일각에서는 채권 강세론을 고수하고 있다. 골드만삭스는 인플레이션과 정부 부채에 대한 우려가 과도하다며 10년물 금리가 연말 4.75%까지 내려갈 것으로 예상했고, 도이체방크와 모간스탠리는 각각 4.8%를 전망했다. 씨티그룹은 5%, JP모간은 5.05%를 제시했다. 특히 모간스탠리는 시장이 이미 연준의 매파적 시나리오를 상당 부분 가격에 반영한 만큼 향후 금리 위험은 상승보다 하락 쪽으로 기울어 있다고 진단했다."}, {"n": 2, "headline": "연준 의사록, 9월 금리인상에 매파적 공감대", "summary": "연준위원 19명 전원이 지난 9월 금리 인상 결정을 지지한 것으로 나타났다. 이 가운데 다수는 물가 압력이 더욱 강해질 위험에 대비하기 위해 금리 인상이 필요하다고 판단했다. 간밤 공개된 9월15~16일 연방공개시장위원회(FOMC) 의사록 에 따르면 여러 연준위원들은 경제 전망을 근거로 더 높은 금리가 필요하다고 판단해 인플레이션에 대한 우려가 더욱 큰 것으로 나타났다. 의사록은 “대부분의 참석자는 연말까지 연방기금금리 목표 범위를 한 차례 더 인상하는 것이 적절할 가능성이 높다고 판단했다”고 밝혔다."}, {"n": 3, "headline": "스페이스X, 400억달러 조달 추진에 신용위험↑", "summary": "스페이스X 가 엔비디아 칩 구매를 위해 400억달러를 조달하는 방안을 은행 및 투자자들과 논의하고 있다는 소식에 7일 신용위험 지표가 사상 최고치로 치솟고 유통시장에서 채권 가격이 급락했다. ICE 데이터서비스에 따르면 투자자들의 우려가 커질수록 상승하는 스페이스X의 5년물 신용부도스와프(CDS) 프리미엄은 한때 16.7bp 오른 197.6bp 안팎을 기록했다. 일론 머스크의 로켓·위성·AI 사업을 아우르는 스페이스X 관련 CDS가 지난 6월 활발하게 거래되기 시작한 이후 장중 최고 수준이다."}, {"n": 4, "headline": "佛혼란에 ECB 압박…물랭 총재엔 ‘반역’ 위협", "summary": "거리 시위에서 채권시장 혼란에 이르기까지 프랑스 가 위기에 휩싸이면서 유럽중앙은행(ECB)이 10여 년 전 유로존 재정위기 이후 볼 수 없었던 투자자들과의 대치 상황으로 내몰릴 위험이 커지고 있다. 정부 붕괴 가능성과 재정적자 문제가 불거진 가운데 내년 5월 에마뉘엘 마크롱 대통령의 후임을 노리는 대선 후보들은 ECB에 국채 매입이나 심지어 부채 탕감까지 요구하며 압박 수위를 높이고 있다. 극좌 성향의 장뤼크 멜랑숑은 대선에서 승리할 경우 에마뉘엘 물랭 프랑스 중앙은행 총재를 반역 혐의로 처벌하겠다고 밝혔다."}, {"n": 5, "headline": "EU, 中 하이브리드차 수입 제한 추진", "summary": "유럽연합(EU) 이 대중국 무역적자를 줄이기 위해 중국산 하이브리드 차량의 역내 수입을 제한하는 이른바 세이프가드 조치를 준비하고 있다. EU의 통상정책을 담당하는 유럽연합 집행위원회는 유럽에서 중국산 하이브리드 차량 판매가 급증함에 따라 수입 제한을 부과하는 방안을 검토하고 있다고 사안에 정통한 관계자들이 전했다. 중국산 하이브리드 차량은 현재 유럽 전체 하이브리드 판매의 4분의 1을 차지한다. 반면 이미 높은 EU 관세가 부과되고 있는 중국산 전기차의 수입 증가세는 둔화됐다."}]}, "daily": {"headline": "France as the stress bellwether", "sections": ["France, the stress bellwether", "Trying to call the top"]}}, "2026-10-07": {"date": "2026-10-07", "morning": {"hook": "美부채 회의론, AI트레이드 부활", "line": "실적 시즌을 불과 일주일 앞두고 인공지능(AI) 트레이드가 되살아나면서 S&P 500 지수가 지난 8월 이후 처음으로 사상 최고치를 경신했다.", "markets": [{"name": "S&P 500", "value": "7,818.93", "change": "+0.6%"}, {"name": "Nasdaq 100", "value": "31,224.47", "change": "+0.5%"}, {"name": "US 10Y", "value": "5.28%", "change": "-0.03"}, {"name": "USD/KRW", "value": "₩1,339.00", "change": "+0.0%"}, {"name": "Bloomberg Dollar", "value": "1,220.19", "change": "-0.2%"}, {"name": "Brent", "value": "$101.00", "change": "+0.7%"}], "items": [{"n": 1, "headline": "시장 “美부채, 성장만으론 안돼”…베선트에 회의론", "summary": "스콧 베선트 미 재무장관이 경제 성장과 지출 억제를 통해 연방정부의 부채 부담을 빠르게 낮출 수 있다고 자신했지만 시장에서는 회의론이 제기됐다. 베선트는 “중요한 것은 GDP 대비 부채 비율이며 우리는 그 곡선을 꺾어 낮추기 시작할 것”이라며 3%를 웃도는 경제성장률이 지속되면 목표 달성에 도움이 될 것이라고 말했다. BBH는 최근 미국채 10년물 금리가 2002년 이후 최고치로 치솟은 가운데 베선트가 장기 금리를 낮추기 위해 ‘구두 개입’에 나선 것으로 평가했다."}, {"n": 2, "headline": "佛르펜, 디폴트 경고…ECB 개입 촉구", "summary": "프랑스 극우 진영의 대선 후보 마린 르펜이 재정적자를 대폭 줄이는 동시에 급등한 국채 조달비용을 낮추기 위해 유럽중앙은행(ECB)이 개입해야 한다고 촉구했다. 국민연합(RN)을 이끄는 르펜은 내년 재정적자를 국내총생산(GDP)의 3.7%까지 낮추겠다면서, “프랑스 국민이 정치적 리셋을 선택하지 않는다면 프랑스는 디폴트로 향할 것”이라며 “채권자들이 터무니없이 높은 금리에만 돈을 빌려준다면 국가와 사회 모델이 무너질 것”이라고 경고했다."}, {"n": 3, "headline": "엔비디아, 시총 6조달러 눈앞…주가 사상최고", "summary": "엔비디아 주가가 다시 사상 최고치를 기록하면서 시가총액 6조달러 돌파를 눈앞에 뒀다. 올해 초 인공지능(AI) 투자에 대한 회의론으로 부진했던 주가가 견조한 매출 전망과 사상 최대 규모의 자사주 매입에 힘입어 반등하고 있다. 그럼에도 향후 12개월 예상 순이익의 18배 미만에서 거래되고 있어 S&P 500의 19배보다도 낮다. 동시에 인플레이션 위험과 연준의 금리 인상 가능성이 커지면서 초대형 기술주가 투자자들에게 상대적으로 안전한 투자처로 부각되는 양상이다."}, {"n": 4, "headline": "다이먼 “미토스 이후 AI 사이버위험 10배↑”", "summary": "제이미 다이먼 JP모간체이스 최고경영자(CEO)는 앤트로픽의 인공지능(AI) 모델 ‘미토스(Mythos)’가 등장한 이후 글로벌 사이버보안 위험이 10배 증가했다고 경고했다. 그는 “AI는 우리가 알지 못했던 취약점을 만들어냈다“며, ”에이전트와 미토스 등 문제를 일으킬 수 있는 것들에 관한 우려는 분명 정당하며 실제 존재하는 위험“이라고 말했다. 다만 ”이것이 인류 존립의 문제인지 아닌지를 놓고 과민반응하지는 않을 것“이라고 덧붙였다."}, {"n": 5, "headline": "월가 이익 900억달러 돌파 전망…보너스도 사상최대", "summary": "뉴욕 월가 의 트레이딩·투자은행들이 올해 사상 최대 이익을 거두면서 보너스도 역대 최고치를 기록할 전망이다. 토머스 디나폴리 뉴욕주 감사원장 보고서에 따르면 뉴욕증권거래소(NYSE) 회원사의 브로커딜러 부문 이익은 상반기 실적을 바탕으로 올해 900억달러를 넘어설 것으로 추산됐다. 이는 지난해 기록한 사상 최대인 651억달러를 크게 웃도는 수준이다. 시장 변동성 확대와 기업 인수·합병(M&A) 심리 회복 등에 힘입어 상반기 인수주선 관련 수입은 68%, 계좌관리·자문 수입은 16.4% 증가했다."}]}, "daily": {"headline": "Stocks fight gravity", "sections": ["Stocks versus gravity", "Taiwan’s AI opportunity"]}}, "2026-10-06": {"date": "2026-10-06", "morning": {"hook": "‘美 부채의 덫’ 경고, 유럽 불안", "line": "유가 하락이 유럽 재정 우려와 높은 채권금리에 따른 부담을 일부 상쇄하면서 뉴욕 증시는 테크주를 중심으로 상승했다.", "markets": [{"name": "S&P 500", "value": "7,773.95", "change": "+0.7%"}, {"name": "Nasdaq 100", "value": "31,076.44", "change": "+0.9%"}, {"name": "US 10Y", "value": "5.30%", "change": "+0.03"}, {"name": "USD/KRW", "value": "₩1,341.06", "change": "-0.0%"}, {"name": "Bloomberg Dollar", "value": "1,216.04", "change": "+0.3%"}, {"name": "Brent", "value": "$100.32", "change": "-1.9%"}], "items": [{"n": 1, "headline": "佛재정·스페인 정치불안에 유로화도 매도세", "summary": "프랑스 의 재정위기가 심화하고 유럽에서 새로운 정치적 혼란이 발생할 가능성이 커지면서 유로화 가 장중 최대 0.8% 하락한 1.1161달러로 2025년 5월 이후 최저 수준을 기록했다. 스페인 총리가 11월 29일 조기 총선을 실시한다고 발표하면서 프랑스 등 취약한 유럽 국채시장의 불안에 시달리던 투자자들에게 새로운 정치적 위험이 더해졌다. ING는 유로화가 1.10달러까지 추가 하락할 위험이 있다고 내다봤다."}, {"n": 2, "headline": "BMO ‘부채의 덫’ 경고...美30년물 이르면 이달 6%", "summary": "BMO글로벌자산운용의 채권·머니마켓 책임자인 얼 데이비스는 채권시장 변동성이 금리를 더욱 끌어올리는 순환을 만들고 있다며 미국채 30년물 금리가 6%를 넘어서는 것은 “불가피하다”고 전망했다. 이르면 이달 중 6%에 이를 가능성이 높다고 봤다. 이 경우 정부의 차입 비용이 명목 경제성장률을 웃돌면서 부채 비용이 계속 늘어나는 악순환이 발생해 미국이 ‘ 부채의 덫 ’에 빠질 위험이 있다고 경고했다."}, {"n": 3, "headline": "美서비스업 확장세 둔화…가격지수 4년래 최고", "summary": "미국 서비스업 이 9월에도 확장세를 이어갔지만 속도는 둔화했다. 비용 압력은 4년여 만에 가장 높은 수준으로 커졌다. 공급관리협회(ISM)가 5일 발표한 서비스업 지수는 전월보다 0.5p 하락한 54.9를 기록했다. 기준선인 50을 웃돌면 경기 확장을 의미한다. 견조한 소비지출과 안정적인 노동시장, 강한 기업 투자가 서비스 수요를 계속 뒷받침하고 있지만 기업들은 비용 상승 부담에도 직면하고 있다."}, {"n": 4, "headline": "사우디아람코 “글로벌 원유 비축량 놀랄 만큼 부족”", "summary": "전 세계가 공급 충격에 대비해 쌓아둔 원유 재고가 “놀랄 만큼 부족한” 수준으로 줄어 호르무즈 해협이 다시 열리지 않을 경우 시장 상황이 더욱 악화할 위험이 있다고 사우디아라비아 국영 석유회사 아람코의 최고경영자(CEO) 아민 나세르가 경고했다. 그는 “호르무즈 해협이 완전히 재개되고 신뢰가 회복될 때까지 원유와 정제유 양쪽의 압박이 더욱 심해질 수밖에 없는 것이 현실”이라며 “원유 수급 압박도 심각하지만 정제유 가격은 훨씬 더 가파르게 상승했다”고 말했다."}, {"n": 5, "headline": "트럼프, 디젤값 잡기…면세유 규제 완화", "summary": "트럼프 미국 대통령이 오는 11월 중간선거를 앞두고 디젤 가격 부담을 낮추기 위한 추가 조치로 면세 대상인 ‘ 적색 디젤 ’의 사용 제한을 완화할 준비를 하고 있다. 일반적으로 농업·건설 장비 등 비도로용으로 사용되는 적색 디젤을 보다 광범위하게 사용할 수 있도록 하는 내용이다. 적색 디젤은 갤런당 24센트의 연방 소비세가 면제된다. 따라서 벌금 없이 도로 주행 차량에도 사용할 수 있도록 허용할 경우 일부에서는 사실상의 감세 효과가 발생할 수 있다."}]}, "daily": {"headline": "Nvidia nears $6 trillion", "sections": ["Nvidia is back", "‘A very difficult dynamic’"]}}, "2026-10-05": {"date": "2026-10-05", "morning": null, "daily": {"headline": "Europe’s contagion risk", "sections": ["Whispers of contagion"]}}, "2026-10-02": {"date": "2026-10-02", "morning": {"hook": "美국채 반등, 佛재정우려·英6%", "line": "프랑스의 재정·정치 상황을 둘러싼 불안이 유럽 금융시장에 압력을 가하고 영국 30년물 금리가 6%를 돌파하는 등 글로벌 채권시장 불안이 이어진 가운데, 안전자산 수요가 유입되면서 미국채가 반등했다.", "markets": [{"name": "S&P 500", "value": "7,666.45", "change": "+0.2%"}, {"name": "Nasdaq 100", "value": "30,501.56", "change": "+0.3%"}, {"name": "US 10Y", "value": "5.24%", "change": "-0.04"}, {"name": "USD/KRW", "value": "₩1,360.00", "change": "+0.1%"}, {"name": "Bloomberg Dollar", "value": "1,225.00", "change": "+0.4%"}], "items": [{"n": 1, "headline": "美, 이란 인근 항모 추가 배치할 수도…공격 확대 선택지", "summary": "미 국방부가 조만간 페르시아만에 항공모함 한 척을 추가 배치할 가능성이 있다고 미 당국자가 밝혔다. 도널드 트럼프 대통령이 이란 에 대한 공격 확대를 결정할 경우 중동 지역 미군 지휘부에 더 많은 군사적 선택지를 제공할 수 있는 조치다. 당국자에 따르면 항공모함 테어도어 루스벨트함은 지난 일요일 모항인 샌디에이고를 출항했다. 최종 목적지는 아직 결정되지 않았지만, 역내 상황에 따라 미 중부사령부가 활용할 수 있는 선택지를 제공한다고 이 당국자는 설명했다."}, {"n": 2, "headline": "美 9월 제조업 확장세 지속…비용·공급망 압박은 가중", "summary": "미국 제조업 활동 이 견조한 수요에도 비용 상승과 배송 지연이 부담으로 작용하면서 9월 소폭 둔화했다. 공급관리협회(ISM)가 1일 발표한 제조업 지수는 전월보다 0.1p 하락한 54.5를 기록했다. 제조업 활동은 확장과 위축을 가르는 기준선인 50을 9개월 연속 웃돌아 2022년 이후 가장 긴 확장세를 이어갔다. 9월 지표에서는 수요가 견조한 흐름을 보였다. 신규주문 지수가 상승했고 수주잔고 지수는 2월 이후 최고 수준으로 올랐다. 생산도 증가세를 이어갔지만 확장 속도는 다소 둔화했다."}, {"n": 3, "headline": "연준부의장 “시간 필요”...카시카리 “물가안정은 연준 임무”", "summary": "필립 제퍼슨 연준 부의장은 물가 안정을 위해 추가 금리 인상이 필요한지 판단하는 데 시간이 더 필요할 수 있다고 밝혔다. 그는 인플레이션이 너무 오랫동안 지나치게 높은 수준을 유지해왔으며 앞으로도 높은 수준에 머물 위험이 있다고 경고했다. 다만 경제가 일련의 충격에 동시에 직면해 있는 만큼 새로 들어오는 지표를 신중하게 평가해야 한다고 강조했다. 채권 금리 상승에 대해서는 “투자자들이 변화하는 거시경제 환경을 재평가하고 있다는 신호”라고 해석했다."}, {"n": 4, "headline": "英30년물 6% 돌파…G7 중 유로존 위기 이후 처음", "summary": "길트 30년물 금리 가 거의 30년 만에 처음으로 6%를 돌파했다. 주요 7개국(G7) 가운데 장기 차입 비용이 6%를 넘어선 것은 유럽 재정위기가 한창이던 2012년 이후 영국이 처음이다. 영국은 에너지 수입 의존도가 높은 데다 재정 여건도 취약해 공격적인 금리 인상 우려에 채권시장이 특히 민감하다. 트레이더들은 현재 영란은행(BOE)이 2027년 말까지 네 차례 금리를 인상할 것으로 예상하고 있다."}, {"n": 5, "headline": "인플레 선제 대응국 채권 주목…호주·독일 선호", "summary": "올해 인플레이션 급등에 신속하게 대응한 국가들이 채권 투자자들 의 주목을 받고 있다. 반면 대응이 늦은 국가들은 더 높은 금리라는 대가를 치를 수 있다는 전망이 나온다. 주피터자산운용과 캔드리엄 등 자산운용사들은 호주중앙은행(RBA)이 2월 이후 네 차례 금리를 인상하면서 긴축 사이클이 막바지에 접어들었다는 판단에 호주 국채를 매수하고 있다."}]}, "daily": {"headline": "Stocks take hit from rates", "sections": ["Stocks feel the pain", "France’s crisis"]}}, "2026-10-01": {"date": "2026-10-01", "morning": {"hook": "美10년물 8% 경고, PCE물가 안도", "line": "견조한 소비지표가 미국 경제의 고금리 감내력을 뒷받침하면서 미국채 30년물 금리가 장중 5.64%를 넘어서며 2002년 이후 최고 수준을 경신했다.", "markets": [{"name": "S&P 500", "value": "7,651.54", "change": "-0.3%"}, {"name": "Nasdaq 100", "value": "30,408.50", "change": "+0.2%"}, {"name": "US 10Y", "value": "5.28%", "change": "+0.05"}, {"name": "USD/KRW", "value": "₩1,357.50", "change": "-0.0%"}, {"name": "Bloomberg Dollar", "value": "1,219.60", "change": "+0.1%"}, {"name": "Brent", "value": "$103.53", "change": "+0.9%"}], "items": [{"n": 1, "headline": "美 근원 PCE 물가상승률 예상 하회...실질소비 0.6%↑", "summary": "미 상무부 경제분석국(BEA)이 30일 발표한 자료에 따르면 물가 영향을 제거한 실질 개인소비지출은 8월 전월 대비 0.6% 늘어 2025년 3월 이후 가장 큰 폭의 증가를 기록했다. 근원 개인소비지출(PCE) 물가지수 는 전월 대비 0.2% 상승해 시장 예상치 0.3%를 밑돌았고, 전년 대비 상승률은 3.0%로 예상치 3.3%보다 낮았다. 헤드라인 PCE 물가지수는 전월 대비 0.3% 올라 예상에 부합했고, 전년 동월 대비로는 3.4% 상승해 예상치 3.7%를 하회했으나 여전히 연준의 2% 목표를 웃돌았다."}, {"n": 2, "headline": "TS롬바르드 ‘美10년물 8% 간다’...골드만 ‘연준 추가 인상 12월’", "summary": "TS롬바르드는 국채 공급 확대와 인플레이션을 억제하려는 정치적 의지 부족으로 현재의 통화·재정정책 조합이 경기 사이클을 거듭할수록 더 높은 물가와 금리를 초래할 것이라며, 미국 10년물 금리가 장기적으로 8%까지 오를 수 있다고 전망했다. 미국에서 물가 안정을 위해 성장 둔화를 감수하는 정책 전환이 빨라도 2029년은 돼야 가능할 것으로 봤으며, 그 과정에서 ‘인플레이션은 결국 2%로 돌아가고 주식·채권은 장기 보유하면 보상받는다’는 시장의 믿음이 흔들릴 수 있다고 경고했다."}, {"n": 3, "headline": "美모기지금리 7.3%…거의 3년 만에 최고", "summary": "미국 모기지 금리 가 6주 연속 상승해 거의 3년 만에 최고 수준을 기록하면서 주택 구매 희망자들의 부담이 커지고 있다. 미 모기지은행협회(MBA)가 30일 발표한 자료에 따르면 9월25일로 끝난 주간 30년 고정 모기지 계약금리는 18bp 오른 7.30%로, 2023년 11월 이후 최고치를 기록했다. 5년 변동금리 모기지는 37bp 급등한 6.47%로 2년여 만에 가장 높은 수준으로 올랐다. 모기지 금리와 밀접하게 연동되는 미국채 10년물 금리는 이날 5.29%까지 올라 2007년 이후 최고 수준을 기록했다."}, {"n": 4, "headline": "BOE “길트시장 충격 전이 위험 커져”", "summary": "영란은행(BOE)이 길트 시장에서 헤지펀드의 높은 레버리지와 인공지능(AI) 관련 자산 및 회사채 익스포저가 맞물리면서 시장 간 충격이 확산될 위험이 커지고 있다고 경고했다. BOE는 분기 금융안정보고서에서 여러 시장의 취약성이 “동시에 현실화”될 경우 금융시장이 충격에 더욱 취약해질 수 있다고 지적했다. 길트 10년물 금리는 이미 2008년 글로벌 금융위기 당시 수준에 근접해 있다."}, {"n": 5, "headline": "연준, 은행 스트레스테스트 개편 확정", "summary": "연준이 은행 스트레스테스트 제도 개편안을 최종 확정했다. 월가 대형은행들에는 상당한 성과라는 평가다. 연준은 최종 확정된 두 가지 규정이 2025년 제안했던 내용과 대체로 유사하다고 설명했다. 최종 규정에 따라 연준은 스트레스테스트 시나리오와 주요 모델 변경에 대해 외부 의견을 수렴해야 한다. 가상 시나리오의 설계 체계와 스트레스테스트 일정, 연례 테스트에 포함되는 글로벌 시장 충격 요소도 개편한다."}]}, "daily": {"headline": "Relentless bond pressure", "sections": ["Relentless rise in yields", "Political risk in France"]}}}, "weeks": {"2026-10-30": {"start": "2026-10-24", "end": "2026-10-30", "themes": [{"name": "Macro", "days": 5, "narrative": "변화없음.", "hits": [{"date": "2026-10-30", "series": "아침", "headline": "美 성장·물가 강세…해싯 “물가 높으면 연준 행동”", "cited": false}, {"date": "2026-10-30", "series": "아침", "headline": "ECB, 금리 동결...라가르드 조기 퇴임", "cited": false}, {"date": "2026-10-29", "series": "아침", "headline": "‘비둘기’ 연준, 대이란 공격대비", "cited": false}, {"date": "2026-10-29", "series": "아침", "headline": "연준, 10:2로 금리 동결…워시 “필요시 행동”", "cited": false}, {"date": "2026-10-29", "series": "아침", "headline": "AI 부채 공급 한계 조짐…핌코는 일찌감치 축소", "cited": false}, {"date": "2026-10-29", "series": "아침", "headline": "캐나다, 25bp 금리 인상…추가 인상 가능성 시사", "cited": false}, {"date": "2026-10-28", "series": "아침", "headline": "PE업계, AI 충격에 디폴트 유예 조항 추진", "cited": false}, {"date": "2026-10-27", "series": "아침", "headline": "호주 대형 연기금, 佛국채 저가매수…“우려 과도”", "cited": false}, {"date": "2026-10-2     const datesEl = document.querySelector("#dates");
    const weekDatesEl = document.querySelector("#week-dates");
    const hookEl = document.querySelector("#hook");
    const dekEl = document.querySelector("#dek");
    const marketsEl = document.querySelector("#markets");
    const morningEl = document.querySelector("#morning");
    const fiveSection = document.querySelector("#five-section");

    const commentarySection = document.querySelector("#commentary-section");
    const commentaryEl = document.querySelector("#commentary");
    const dailySection = document.querySelector("#daily-section");

    const themeList = document.querySelector("#theme-list");
    const viewDay = document.querySelector("#view-day");
    const viewThemes = document.querySelector("#view-themes");
    let selected = DATA.dates.find((day) => DATA.days[day].morning) || DATA.dates[0];
    let weekEnd = DATA.dates[0];

    function tone(change) {
      const value = String(change || "").trim();
      if (value.startsWith("+") && !value.startsWith("+0.0")) return "up";
      if (value.startsWith("-") || value.startsWith("−")) return "down";
      return "flat";
    }

    function shortDate(day) {
      const [, month, date] = day.split("-");
      return `${Number(month)}/${Number(date)}`;
    }

    function renderCalendar(el, selectedDate, rangeStart, rangeEnd) {
      const byMonth = new Map();
      for (const day of DATA.dates) {
        const key = day.slice(0, 7);
        if (!byMonth.has(key)) byMonth.set(key, []);
        byMonth.get(key).push(day);
      }
      el.innerHTML = [...byMonth.keys()].sort().reverse().map((key) => {
        const [year, month] = key.split("-").map(Number);
        const present = new Set(byMonth.get(key));
        const lastDay = Math.max(...[...present].map((day) => Number(day.slice(8))));
        const start = new Date(year, month - 1, 1).getDay();
        const lead = (start + 6) % 7;
        const cells = [];
        for (let i = 0; i < (lead > 4 ? 0 : lead); i += 1) cells.push("<span></span>");
        for (let day = 1; day <= lastDay; day += 1) {
          const dow = new Date(year, month - 1, day).getDay();
          if (dow === 0 || dow === 6) continue;
          const iso = `${key}-${String(day).padStart(2, "0")}`;
          const inRange = Boolean(rangeStart) && iso >= rangeStart && iso <= rangeEnd && iso !== selectedDate;
          cells.push(present.has(iso)
            ? `<button type="button" data-date="${iso}" class="${inRange ? "in" : ""}" aria-selected="${iso === selectedDate}" aria-label="${month}월 ${day}일">${day}</button>`
            : `<span class="off">${day}</span>`);
        }
        return `
          <section>
            <p class="cal-month">${month}월</p>
            <div class="cal-dow"><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span></div>
            <div class="cal-grid">${cells.join("")}</div>
          </section>
        `;
      }).join("");
    }

    function renderDates() {
      renderCalendar(datesEl, selected, "", "");
    }

    function renderWeekDates() {
      const week = DATA.weeks[weekEnd];
      renderCalendar(weekDatesEl, weekEnd, week.start, week.end);
    }

    function renderDay() {
      const day = DATA.days[selected];
      const morning = day.morning;
      const daily = day.daily;
      hookEl.textContent = (morning && morning.hook) || (daily && daily.headline) || "이 날의 레터";
      const line = (morning && morning.line) || "";
      dekEl.hidden = !line;
      dekEl.textContent = line;
      const markets = (morning && morning.markets) || [];
      marketsEl.innerHTML = markets.map((row) => `
        <article class="market">
          <div class="name">${row.name}</div>
          <div class="value"><strong>${row.value}</strong><span class="${tone(row.change)}">${row.change}</span></div>
        </article>
      `).join("");
      const items = (morning && morning.items) || [];
      morningEl.innerHTML = items.length
        ? items.map((item) => `
          <li>
            <button type="button" class="fold" aria-expanded="false">
              <span class="num">${item.n}</span><span>${esc(item.headline)}</span>
            </button>
            ${item.summary ? `<p class="summary">${esc(item.summary)}</p>` : ""}
          </li>
        `).join("")
        : `<p class="empty">이 날은 오늘 아침 5가지가 없습니다.</p>`;
      const brief = Boolean(daily && daily.five);
      fiveSection.hidden = !brief;
      commentarySection.hidden = !brief;
      dailySection.hidden = brief;
      if (brief) {
        const lines = daily.five;
        fiveEl.innerHTML = lines.length
          ? lines.map((line, index) => `<li><span class="num">${index + 1}</span><span>${esc(line)}</span></li>`).join("")
          : `<p class="empty">이 날은 5 things가 없습니다.</p>`;
        const notes = daily.commentary || [];
        commentaryEl.innerHTML = notes.length
          ? notes.map((note) => `
            <li>
              <button type="button" class="fold" aria-expanded="false"><span>${esc(note.heading)}</span></button>
              ${note.summary ? `<div class="summary">${note.summary.split(/\n\n/).map((part) => `<p>${esc(part)}</p>`).join("")}</div>` : ""}
            </li>
          `).join("")
          : `<p class="empty">이 날은 commentary가 없습니다.</p>`;
        return;
      }
      const sections = (daily && daily.sections) || [];
      const title = daily && daily.headline ? `<li><span class="series">제목</span><span>${esc(daily.headline)}</span></li>` : "";
      dailyEl.innerHTML = daily
        ? title + sections.map((heading) => `<li><span class="series"></span><span>${esc(heading)}</span></li>`).join("")
        : `<p class="empty">이 날은 Markets Daily가 없습니다.</p>`;
    }

    function esc(value) {
      return String(value || "").replace(/[&<>]/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[ch]));
    }

    function renderThemes() {
      const themes = DATA.weeks[weekEnd].themes;
      renderWeekDates();
      themeList.innerHTML = themes.length ? themes.map((theme) => `
        <article class="theme" aria-expanded="true">
          <button type="button" class="theme-head"><strong>${theme.name}</strong><span class="count">${theme.days}일</span></button>
          ${theme.narrative ? `<div class="narrative">${theme.narrative.split(/\n\n/).map((part) => `<p>${esc(part)}</p>`).join("")}</div>` : ""}
          ${theme.hits.length ? `<button type="button" class="expand" aria-expanded="false">펼치기</button>` : ""}
          <ul class="hits">
            ${theme.hits.map((hit) => `<li class="${hit.cited ? "cited" : ""}"><span>${shortDate(hit.date)}</span><span class="series">${hit.series}</span><span>${hit.headline}</span></li>`).join("")}
          </ul>
        </article>
      `).join("") : `<p class="empty">이 기간에 반복된 제목이 없습니다.</p>`;
    }

      const button = event.target.closest(".fold");
      if (!button) return;
      const open = button.getAttribute("aria-expanded") === "true";
      button.setAttribute("aria-expanded", open ? "false" : "true");
    }
    morningEl.addEventListener("click", toggleFold);
    commentaryEl.addEventListener("click", toggleFold);

    datesEl.addEventListener("click", (event) => {
      const button = event.target.closest("button[data-date]");
      if (!button) return;
      selected = button.dataset.date;
      renderDates();
      renderDay();
    });
    weekDatesEl.addEventListener("click", (event) => {
      const button = event.target.closest("button[data-date]");
      if (!button || !DATA.weeks[button.dataset.date]) return;
      weekEnd = button.dataset.date;
      renderThemes();
    });

    document.querySelector("#tab-day").addEventListener("click", () => {
      viewDay.hidden = false;
      viewThemes.hidden = true;
      document.querySelector("#tab-day").setAttribute("aria-selected", "true");
      document.querySelector("#tab-themes").setAttribute("aria-selected", "false");
      document.querySelector("h1").textContent = "Day";
    });
    document.querySelector("#tab-themes").addEventListener("click", () => {
      viewDay.hidden = true;
      viewThemes.hidden = false;
      document.querySelector("#tab-day").setAttribute("aria-selected", "false");
      document.querySelector("#tab-themes").setAttribute("aria-selected", "true");
      document.querySelector("h1").textContent = "Weekly";
      renderThemes();
    });
    themeList.addEventListener("click", (event) => {
      const expand = event.target.closest(".expand");
      if (expand) {
        const open = expand.getAttribute("aria-expanded") === "true";
        expand.setAttribute("aria-expanded", open ? "false" : "true");
        expand.textContent = open ? "펼치기" : "접기";
        return;
      }
      const head = event.target.closest(".theme-head");
      if (!head) return;
      const theme = head.closest(".theme");
      const open = theme.getAttribute("aria-expanded") === "true";
      theme.setAttribute("aria-expanded", open ? "false" : "true");
      const list = theme.querySelector(".expand");
      if (open && list) {
        list.setAttribute("aria-expanded", "false");
        list.textContent = "펼치기";
      }
    });

    renderDates();
    renderDay();
    renderThemes();
  </script>
</body>
</html>
