<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>블룸버그 다이제스트</title>
  <style>
    :root {
      --paper: #f3f0e8;
      --card: #fffcf7;
      --ink: #1c1915;
      --muted: #6f6a62;
      --line: #e4dfd4;
      --up: #b42318;
      --down: #1d4f91;
      --flat: #6f6a62;
      --chip: #efeae0;
      --accent: #1c1915;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      line-height: 1.45;
      overflow-wrap: break-word;
      -webkit-text-size-adjust: 100%;
    }
    button { -webkit-tap-highlight-color: transparent; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 16px;
      max-width: 980px;
      margin: 0 auto;
      padding: 28px 24px 0;
    }
    .mark {
      font-size: 13px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 4px;
    }
    h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin: 0;
    }
    nav {
      display: flex;
      gap: 6px;
    }
    nav button, .dates button, .windows button, .theme, .fold {
      font: inherit;
      color: inherit;
      background: transparent;
      border: 0;
      cursor: pointer;
    }
    nav button {
      padding: 8px 14px;
      border-radius: 999px;
      color: var(--muted);
    }
    nav button[aria-selected="true"] {
      background: var(--ink);
      color: var(--paper);
    }
    main {
      max-width: 980px;
      margin: 0 auto;
      padding: 20px 24px 64px;
    }
    .dates {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      overscroll-behavior-x: contain;
      padding-bottom: 8px;
      margin-bottom: 22px;
      scroll-snap-type: x proximity;
      scrollbar-width: none;
    }
    .dates::-webkit-scrollbar { display: none; }
    .dates button {
      flex: 0 0 auto;
      scroll-snap-align: start;
      min-width: 72px;
      padding: 8px 10px 9px;
      border-radius: 12px;
      background: var(--card);
      border: 1px solid var(--line);
      text-align: left;
    }
    .dates button[aria-selected="true"] {
      border-color: var(--ink);
      background: var(--ink);
      color: var(--paper);
    }
    .dates .d { display: block; font-weight: 700; font-size: 15px; }
    .dates .w { display: block; font-size: 12px; color: var(--muted); }
    .dates button[aria-selected="true"] .w { color: #d9d3c7; }
    .hook {
      font-size: 34px;
      line-height: 1.25;
      letter-spacing: -0.04em;
      margin: 0 0 18px;
      font-weight: 750;
    }
    .markets {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 28px;
    }
    .market {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px 14px 11px;
    }
    .market .name { color: var(--muted); font-size: 12px; }
    .market .value {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      margin-top: 4px;
      font-variant-numeric: tabular-nums;
    }
    .market strong { font-size: 18px; font-weight: 700; }
    .up { color: var(--up); }
    .down { color: var(--down); }
    .flat { color: var(--flat); }
    section { margin-top: 8px; }
    section h2 {
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 650;
      margin: 22px 0 10px;
    }
    ol, .stories { list-style: none; margin: 0; padding: 0; }
    li + li { border-top: 1px solid var(--line); }
    #morning li { display: block; padding: 0; }
    #morning .fold {
      display: grid;
      grid-template-columns: 28px 1fr;
      gap: 10px;
      align-items: baseline;
      width: 100%;
      padding: 11px 0;
      text-align: left;
      font-size: 17px;
      letter-spacing: -0.02em;
    }
    #morning .summary {
      display: none;
      margin: 0 0 14px 38px;
      font-size: 17px;
      line-height: 1.5;
      letter-spacing: -0.02em;
    }
    #morning .fold[aria-expanded="true"] + .summary { display: block; }
    .stories li.note { display: block; }
    ol li, .stories li {
      display: grid;
      grid-template-columns: 28px 1fr;
      gap: 10px;
      align-items: baseline;
      padding: 11px 0;
      font-size: 17px;
      letter-spacing: -0.02em;
    }
    .num, .series {
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      font-size: 13px;
      padding-top: 4px;
    }
    .empty {
      color: var(--muted);
      padding: 12px 0 4px;
    }
    .windows { display: flex; gap: 8px; margin-bottom: 18px; }
    .windows button {
      padding: 8px 12px;
      border-radius: 999px;
      background: var(--card);
      border: 1px solid var(--line);
      color: var(--muted);
    }
    .windows button[aria-selected="true"] {
      background: var(--ink);
      color: var(--paper);
      border-color: var(--ink);
    }
    .theme {
      width: 100%;
      text-align: left;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px 16px;
      margin-bottom: 10px;
    }
    .theme-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: baseline;
    }
    .theme-head strong { font-size: 18px; letter-spacing: -0.03em; }
    .count { color: var(--muted); font-size: 13px; }
    .hits { display: none; margin: 12px 0 0; padding: 0; list-style: none; }
    .theme[aria-expanded="true"] .hits { display: block; }
    .hits li {
      display: grid;
      grid-template-columns: 52px 52px 1fr;
      gap: 8px;
      padding: 8px 0;
      font-size: 15px;
      border-top: 1px solid var(--line);
    }
    footer {
      max-width: 980px;
      margin: 0 auto;
      padding: 0 24px 28px;
      color: var(--muted);
      font-size: 12px;
    }
    @media (max-width: 720px) {
      header, main, footer {
        padding-left: max(16px, env(safe-area-inset-left));
        padding-right: max(16px, env(safe-area-inset-right));
      }
      header {
        flex-direction: column;
        align-items: flex-start;
        gap: 14px;
        padding-top: max(18px, env(safe-area-inset-top));
      }
      h1 { font-size: 26px; }
      nav button { min-height: 44px; padding: 8px 16px; }
      main { padding-top: 16px; padding-bottom: 40px; }
      .dates button { min-height: 52px; }
      .hook { font-size: 26px; line-height: 1.32; }
      .markets { grid-template-columns: 1fr 1fr; gap: 8px; }
      .market { padding: 12px; }
      .market .value { display: block; }
      .market .value span { display: block; margin-top: 2px; font-size: 13px; }
      .market strong { font-size: 17px; }
      ol li, .stories li { font-size: 16px; padding: 13px 0; }
      #morning .fold, #morning .summary { font-size: 16px; }
      .hits li { display: block; padding: 10px 0; }
      .hits li span:nth-child(1),
      .hits li span:nth-child(2) { display: inline; }
      .hits li span:nth-child(2) { margin-left: 8px; }
      .hits li span:last-child { display: block; margin-top: 3px; }
      footer { padding-bottom: calc(24px + env(safe-area-inset-bottom)); }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <p class="mark">Bloomberg digest</p>
      <h1>그날의 레터</h1>
    </div>
    <nav>
      <button type="button" id="tab-day" aria-selected="true">그날</button>
      <button type="button" id="tab-themes" aria-selected="false">반복</button>
    </nav>
  </header>
  <main>
    <div id="view-day">
      <div class="dates" id="dates"></div>
      <h2 class="hook" id="hook"></h2>
      <div class="markets" id="markets"></div>
      <section>
        <h2>오늘 아침 5가지</h2>
        <ol id="morning"></ol>
      </section>
      <section id="five-section" hidden>
        <h2>5 things</h2>
        <ol class="brief" id="five"></ol>
      </section>
      <section id="commentary-section" hidden>
        <h2>commentary</h2>
        <ul class="stories" id="commentary"></ul>
      </section>
      <section id="daily-section">
        <h2>Markets Daily</h2>
        <ul class="stories" id="daily"></ul>
      </section>
    </div>
    <div id="view-themes" hidden>
      <div class="windows">
        <button type="button" id="win-week" aria-selected="true"></button>
        <button type="button" id="win-month" aria-selected="false"></button>
      </div>
      <div id="theme-list"></div>
    </div>
  </main>
  <footer>시세와 그날 목록을 보여 줍니다.</footer>
  <script>
    const DATA = {"dates": ["2026-10-23", "2026-10-22", "2026-10-21", "2026-10-20", "2026-10-19", "2026-10-16", "2026-10-15", "2026-10-14", "2026-10-13", "2026-10-12", "2026-10-09", "2026-10-08", "2026-10-07", "2026-10-06", "2026-10-05", "2026-10-02", "2026-10-01"], "days": {"2026-10-23": {"date": "2026-10-23", "morning": {"hook": "나스닥 급락, 佛불안 전이조짐", "markets": [{"name": "S&P 500 지수", "value": "7,663.43", "change": "-1.2%"}, {"name": "나스닥 100 지수", "value": "28,958.69", "change": "-2.9%"}, {"name": "美 국채 10년물 금리", "value": "4.95%", "change": "-0.17"}, {"name": "달러-원 환율", "value": "₩1,326.65", "change": "+0.0%"}, {"name": "블룸버그 달러 지수", "value": "1,220.22", "change": "-0.1%"}, {"name": "브렌트 원유 선물", "value": "$113.05", "change": "+3.9%"}], "items": [{"n": 1, "headline": "블랙스톤 “AI 버블 아냐…수요 폭발적”", "summary": "존 그레이 블랙스톤 사장은 AI 붐이 버블로 이어질 것을 우려할 필요가 없다며 수요가 “거의 포물선형”으로 증가하고 있다고 진단했다. 그는 버블이란 설비를 먼저 구축한 뒤 수요가 따라오기를 기대하는 경우지만, AI는 설비를 구축하면서도 수요를 따라잡기 어려운 상황이라며 1990년대 통신 버블과는 다르다고 강조했다. 이는 최근 AI 산업이 “거의 확실하게” 버블로 향하고 있다고 경고한 켄 그리핀과 대조적인 견해다."}, {"n": 2, "headline": "중동 긴장 고조…美외교관 철수·아람코 대피", "summary": "예멘의 친이란 후티 반군이 공격을 강화하는 가운데 미국이 사우디아라비아 주재 일부 외교관과 가족들에게 철수 명령을 내렸다. 사우디아람코의 다란 본사도 원인이 확인되지 않은 경보가 울린 뒤 대피하고 직원들에게 재택근무를 지시했다. 전일 아람코 석유시설과 사우디 동부 공항에 대한 공격으로 최소 4명이 사망했다. NBC뉴스는 요르단과 쿠웨이트, 카타르의 미군 기지에서도 일부 인력이 철수할 예정이라고 보도했다."}, {"n": 3, "headline": "佛국채 불안 확산…伊로 전이 조짐", "summary": "프랑스 국채 불안 이 심화되면서 글로벌 금융시장의 취약 고리로 부각되고 있다. 프랑스 10년물 국채 금리의 독일 대비 스프레드는 장중 19bp 급등한 178bp로 2011년 말 유럽 재정위기 이후 최고 수준을 기록했다. 단기물도 매도세를 피하지 못해 2년물 금리가 장중 3.9%에 육박했고 CAC40 지수도 1% 넘게 하락했다. 글로벌 위험회피에 주말 시위 재개 우려와 막대한 국가부채, 정치권의 재정 정상화 능력에 대한 의구심이 겹치며 프랑스 자산 전반에 매도 압력이 커지고 있다."}, {"n": 4, "headline": "中규제·AI우려에 알리바바↓…홍콩 기술주 투매", "summary": "중국 당국이 전자상거래 업체들을 소집해 제품 품질 기준 강화를 주문하면서 알리바바 주가가 6.1% 급락해 두 달 만에 최대 낙폭을 기록했다. 항셍지수는 3%, 항셍테크지수는 5% 떨어졌다. 중국 전자상거래 업체들이 핵심 사업의 성장을 유지하면서 막대한 AI 투자까지 병행해야 하는 상황에서 규제 부담과 투자수익에 대한 우려가 겹쳤다. 항셍테크지수는 올해 들어 31% 하락해 2024년 9월 중국 정부의 대규모 경기부양책 이후 상승분을 거의 모두 반납할 위기에 놓였다."}, {"n": 5, "headline": "바클레이스, AI 활용해 5천명 감원", "summary": "바클레이스 가 인공지능(AI)을 활용한 비용 절감에 나서면서 전체 인력의 약 5%인 5천명을 감원한다. 감원 대상의 약 60%는 개발자를 포함한 지원 부문이며, 올해 상반기에 이미 줄인 1천명도 포함된다. 바클레이스는 향후 비용을 낮추기 위한 구조조정에 올해 약 6억파운드를 투입할 예정으로 기존 예상의 두 배 수준이다. CS 벤카타크리슈난 CEO는 “AI를 대규모로 활용할 것“이라면서도 ”AI는 케이크 자체가 아니라 케이크 위의 아이싱“이라고 말했다."}]}, "daily": {"headline": "Sifting through election scenarios", "sections": ["Election scenarios", "‘Paralyzed’ market"], "five": ["Stocks are stabilizing after yesterday’s rout in the AI trade, though further gains in oil prices are keeping sentiment cautious.", "The euro area’s private sector slowed more than expected in October , weighed down by France as the region’s No. 2 economy grapples with fiscal and political tensions .", "SK Hynix scrapped plans for a potential $10 billion US listing of its Solidigm unit as investors grow increasingly uneasy over the AI boom. More below on the IPO market’s woes.", "Kering shares plunged on disappointing sales at its Italian fashion label Gucci, with weakness in China undermining the brand’s years-long turnaround effort.", "JetBlue’s stocks and bonds plunged , signaling mounting investor doubts about the airline’s financial outlook."], "commentary": ["Election scenarios", "‘Paralyzed’ market"]}}, "2026-10-22": {"date": "2026-10-22", "morning": {"hook": "스페이스X 훈풍, 佛10년물 5%", "markets": [{"name": "S&P 500 지수", "value": "7,757.17", "change": "+0.6%"}, {"name": "나스닥 100 지수", "value": "29,822.52", "change": "+1.1%"}, {"name": "美 국채 10년물 금리", "value": "5.12%", "change": "+0.01"}, {"name": "달러-원 환율", "value": "₩1,327.09", "change": "+0.0%"}, {"name": "블룸버그 달러 지수", "value": "1,221.12", "change": "+0.1%"}, {"name": "브렌트 원유 선물", "value": "$109.45", "change": "+0.6%"}], "items": [{"n": 1, "headline": "佛10년물 5% 돌파…독일과 금리차 15년 최대", "summary": "프랑스 10년물 국채 금리가 2002년 이후 처음으로 5%를 돌파했다. 에너지 가격 상승이 재정 전망에 대한 우려를 키우면서 독일 10년물과의 금리차는 159.4bp로 확대돼 15년 만에 최대를 기록했다. 생활비 급등에 따른 폭력 시위와 막대한 부채 부담까지 겹치면서 프랑스가 재정적자를 줄일 예산안을 통과시킬 수 있을지에 대한 투자자들의 의구심이 커지고 있다. 프랑스발 불안에 유로화도 한때 0.2% 하락했다."}, {"n": 2, "headline": "푸틴, 美·우크라와 3자협상 재개 제안…억류 미국인 석방", "summary": "블라디미르 푸틴 러시아 대통령이 우크라이나 전쟁 종식을 위한 미국·우크라이나와의 3자 협상을 재개할 준비가 돼 있다고 밝혔다. 스티브 위트코프 미 대통령 특사와 만난 푸틴은 11월 초 3자 협상을 제안했으며, 크렘린궁은 전쟁 이후 러시아와 우크라이나의 안보 체제 구축이 주요 논의 대상이라고 밝혔다. 다만 푸틴이 우크라이나와 직접 협상할 준비가 됐다는 신호는 아직 없으며, 크렘린궁은 위트코프가 전달한 우크라이나·유럽 측 제안에 대해서도 유용한 내용이 상대적으로 적었다고 평가했다."}, {"n": 3, "headline": "금리 급등에 美·유럽 부채발행 줄줄이 연기…신용시장 냉각", "summary": "금리 상승과 인플레이션 재점화, AI 투자 붐의 균열 가능성에 대한 우려가 커지면서 이달 미국과 유럽에서 50억달러가 넘는 기업 부채 발행이 연기 됐다. 채권과 대출 발행을 미룬 기업은 적어도 7곳으로, 올해 들어 발행 연기가 가장 집중된 모습이다. 미국 정크본드 발행액도 9월 510억달러에서 이달 현재 약 70억달러로 급감했다. AVI-SPL은 6억9천만달러 규모의 레버리지론 조달을 철회했고, 프레디맥은 충분한 수요를 확보하지 못해 4억4천만달러 이상의 모기지 채권 발행을 연기했다. 유럽에서는 서켓이 30억유로 규모의 차환 계획을 미뤘다."}, {"n": 4, "headline": "고금리가 만든 회사채 기회…블랙록 “한 세대 최고 수익률”", "summary": "고금리로 기업들의 자금조달 부담이 커지는 가운데 블랙록은 회사채 투자자에게는 오히려 이례적인 기회가 열리고 있다고 진단했다. 현재 듀레이션 3년 미만, 평균 신용등급 A-인 분산 채권 포트폴리오로도 7%가 넘는 수익률을 확보할 수 있다는 분석이다. 회사채 수익률은 3년 전 잠시 나타났던 수준과 글로벌 금융위기 당시를 제외하면 보기 어려울 정도로 높아졌다. 블랙록은 이를 “한 세대에 한 번 볼 정도로 높은 수익률”이라며, 2010년대나 2020년대 초반과 달리 상대적으로 안전한 자산에서도 높은 수익을 얻을 수 있다고 설명했다."}, {"n": 5, "headline": "미국채 큰손 바뀐다…‘패스트머니’ 영향력 확대", "summary": "미국채 금리가 수십 년 만의 최고 수준으로 치솟은 가운데 미 정부가 가격에 민감한 민간 투자자들에게 갈수록 의존하고 있다. 32조달러 규모로 성장한 미국채 시장에서 민간 투자자들은 현재 연방정부 부채의 약 70%를 보유해 1990년 이후 최고 수준에 근접했다. 과거 주요 매수자였던 외국 정부와 중앙은행, 연기금 등 가격에 상대적으로 둔감한 ‘슬로 머니’의 영향력이 줄어든 반면, 원하는 수익률이 나오지 않으면 빠르게 이탈할 수 있는 헤지펀드 등 ‘패스트 머니’의 영향력이 커지고 있다. 블룸버그 이코노믹스는 연준과 외국 공공기관의 미국채 보유 감소가 한때 10년물 기간 프리미엄을 약 105bp 높인 것으로 추산했다."}]}, "daily": {"headline": "No patience for tech", "sections": ["No patience", "Nowhere to hide"]}}, "2026-10-21": {"date": "2026-10-21", "morning": {"hook": "AI 옥석가리기, 佛증시 ‘최대숏’", "markets": [{"name": "S&P 500 지수", "value": "7,712.57", "change": "+0.3%"}, {"name": "나스닥 100 지수", "value": "29,490.28", "change": "-0.1%"}, {"name": "美 국채 10년물 금리", "value": "5.11%", "change": "-0.03"}, {"name": "달러-원 환율", "value": "₩1,326.61", "change": "-0.0%"}, {"name": "블룸버그 달러 지수", "value": "1,220.50", "change": "-0.2%"}, {"name": "브렌트 원유 선물", "value": "$108.97", "change": "-0.5%"}], "items": [{"n": 1, "headline": "佛 정치·재정 불안에 자산기피…CAC40 ‘최대 숏’", "summary": "프랑스 의 정치·재정 불안이 금융시장 전반으로 번지면서 주식과 채권이 동시에 투자자들의 외면을 받고 있다. 프랑스 10년물 국채 금리의 독일 국채 대비 스프레드는 20일 150bp를 웃돌며 마감했다. 2012년 1월 이후 처음으로, 당시 그리스에서 시작해 아일랜드와 포르투갈, 스페인 등으로 확산된 유럽 재정위기 절정기에 근접한 수준이다. 생활비 급등에 항의하는 시위와 높은 국가부채·재정적자에 대한 우려가 투자심리를 압박하고 있다."}, {"n": 2, "headline": "프랭클린템플턴 ‘유로존 부채위기 2.0’ 경고", "summary": "프랑스 국채 매도세가 과거 그리스에서 시작된 위기를 능가하는 ‘유로존 부채위기 2.0’으로 번질 위험이 있다고 프랭클린템플턴이 경고했다. 소날 데사이 채권부문 글로벌 CIO는 위기가 현실화할 경우 과거보다 “훨씬 더 심각할 수 있다”며, 프랑스 부채가 당시 그리스의 10배가 넘는다고 지적했다. 그는 “단순한 구제금융은 선택지가 될 수 없다”면서 “유로존에서 상당한 변동성이 발생할 가능성을 과소평가해서는 안 된다”고 강조했다."}, {"n": 3, "headline": "AI 옥석가리기…IPO·주가 ‘휘청’", "summary": "AI 투자 열기가 옥석가리기로 전환되면서 데이터센터 컴퓨팅을 제공하는 ‘ 네오클라우드 ’에 대한 투자자들의 신뢰가 흔들리고 있다. 한국의 엘리스는 20일 상장 첫날 32% 급락했고, 호주 퍼머스 그리드는 기업가치 300억달러를 목표로 한 IPO 계획을 철회했다. 영국 엔스케일도 목표 기업가치에 대한 투자자들의 반발에 직면했으며, 코어위브는 과도한 차입 우려로 지난주 주가가 20% 넘게 떨어졌다."}, {"n": 4, "headline": "美 주택시장 한파…미결판매 사상 최저·착공 5.2%↓", "summary": "미국의 주택시장 부진이 심화되고 있다. 9월 미결주택판매지수는 전월보다 7.3% 급락한 66으로 2001년 통계 작성 이후 사상 최저를 기록했다. 하락폭은 블룸버그가 조사한 모든 이코노미스트의 예상을 넘어섰으며, 서부가 9.2%, 최대 주택판매 지역인 남부가 8.2% 감소하는 등 전 지역에서 판매가 줄었다. 전미부동산중개인협회(NAR)는 모기지 금리가 빠르게 오르면서 매수자와 매도자 모두 금리 여건이 개선되기를 기다리고 있다고 진단했다."}, {"n": 5, "headline": "AI 열풍에 헤지펀드 대출 수요 폭증…바클레이스 자본 재배분", "summary": "아시아 AI 관련주 급등으로 헤지펀드의 대출 수요가 급증하자 바클레이스 가 내부 자본까지 재배분해 대응했다. 바클레이스는 여름 동안 아시아 헤지펀드 고객에게 제공할 수 있는 금융 한도에 도달하자 내부 경매를 통해 매크로 금리 트레이딩 부문에 배정된 자본 일부를 프라임 파이낸싱 사업으로 돌렸다. 수익성이 높은 프라임 브로커리지에 대차대조표를 더 배정해 AI 투자 열풍에 따른 헤지펀드의 자금 수요를 충족하기 위해서다."}]}, "daily": {"headline": "SpaceX-Tesla talk gets real", "sections": ["Musk’s mashup dreams", "Fast money power"]}}, "2026-10-20": {"date": "2026-10-20", "morning": {"hook": "반도체 반등, 프랑스 국채불안", "markets": [{"name": "S&P 500 지수", "value": "7,690.73", "change": "+0.4%"}, {"name": "나스닥 100 지수", "value": "29,529.34", "change": "+1.2%"}, {"name": "美 국채 10년물 금리", "value": "5.14%", "change": "+0.07"}, {"name": "달러-원 환율", "value": "₩1,332.44", "change": "-0.0%"}, {"name": "블룸버그 달러 지수", "value": "1,223.20", "change": "+0.1%"}, {"name": "브렌트 원유 선물", "value": "$109.18", "change": "-0.6%"}], "items": [{"n": 1, "headline": "JP모간 “코어위브 부채 우려 과도”", "summary": "JP모간은 코어위브 의 급증하는 부채와 현금 소진에 대한 투자자들의 우려가 과도하다며 사업모델은 여전히 견조하다고 평가했다. 자금조달 수요가 개별 프로젝트의 수익성 악화가 아니라 빠른 사업 확장에서 비롯되고 있다는 분석이다. 컴퓨팅 수요가 강한 데다 신규 설비 가동 전에 고객을 확보하는 ‘최소구매 보장 장기계약(take-or-pay)’을 맺고 있으며, 통상적인 5년 계약의 차입 효과를 제외한 내부수익률(IRR)은 10%대 중반으로 가중평균자본비용(WACC) 9~11%를 웃도는 것으로 추정했다."}, {"n": 2, "headline": "프랑스 시위에 국채 불안 재점화", "summary": "프랑스 에서 생활비 부담에 항의하는 폭력 시위가 주말 동안 격화하면서 재정·정치 불안이 다시 금융시장을 압박했다. 프랑스 국채가 유럽 주요국 대비 약세를 보이면서 독일 10년물과의 금리차는 장중 최대 8bp 확대된 146bp로 2주 만에 가장 높은 수준을 기록했고, 이탈리아 국채와의 금리차도 사상 최대 수준으로 벌어졌다. CAC 40 지수는 장중 최대 1.7% 하락했고 유로화도 달러 대비 한때 0.5% 밀렸다. 투자자들이 프랑스 국채를 갈수록 위험한 자산으로 평가하면서 월초에는 독일 10년물과의 금리차가 150bp를 넘어 유로존 재정위기 이후 가장 높은 수준으로 확대된 바 있다."}, {"n": 3, "headline": "메르츠 “유럽, 러시아 위협 과소평가”", "summary": "프리드리히 메르츠 독일 총리는 유럽이 러시아의 위협을 충분히 심각하게 받아들이지 않고 있다며, 블라디미르 푸틴 대통령의 목표는 단순히 우크라이나 영토를 차지하는 데 그치지 않고 유럽의 민주주의와 정치 질서를 흔드는 것이라고 경고했다. 그는 러시아가 “민주주의와 개방된 사회, 유럽 통합의 성공을 두려워한다”며 유럽 각국이 미국에 대한 의존도를 낮추고 나토 내에서 스스로를 방어할 수 있도록 방위체계를 강화해야 한다고 강조했다."}, {"n": 4, "headline": "美, 연방기관서 中딥시크 사용 금지", "summary": "트럼프 행정부가 국가안보 우려를 이유로 미국 연방정부 민간기관의 중국 AI 스타트업 딥시크 제품과 서비스 사용을 금지했다. 미 국토안보부가 연방관보에 게시한 공고에 따르면 연방기관들은 시스템에서 딥시크 제품을 모두 제거해야 하며, 딥시크의 연방정부 계약 참여도 금지된다. 미 행정부는 딥시크가 상당한 양의 민감한 사용자 데이터를 수집하고 있으며 중국 정보보안법에 따라 해당 데이터가 중국 정부와 공유될 가능성이 있다고 경고했다."}, {"n": 5, "headline": "머스크, 美 어린이에 스페이스X 주식 1주씩", "summary": "일론 머스크 가 내년 미국의 모든 어린이에게 스페이스X 주식을 1주씩 나눠주겠다는 구상을 밝혔다. 사안에 정통한 관계자에 따르면 머스크는 이를 ‘트럼프 계좌(Trump Accounts)’를 통해 지급하는 데 원칙적으로 합의했다. 미 인구조사국 추산 약 7200만명의 어린이를 대상으로 현재 주가를 적용하면 기부 규모는 약 107억달러에 달할 전망이다. 트럼프 계좌는 2025~2028년 태어난 미국 어린이들에게 1000달러를 제공하는 제도로, 마이클·수전 델 부부와 레이 달리오 등도 후원에 참여했다."}]}, "daily": {"headline": "AI bellwether in freefall", "sections": ["‘Fear and pessimism’", "Netflix slump"]}}, "2026-10-19": {"date": "2026-10-19", "morning": {"hook": "코어위브發 AI불안, 유가 110불", "markets": [{"name": "S&P 500 지수", "value": "7,659.44", "change": "-1.1%"}, {"name": "나스닥 100 지수", "value": "29,187.55", "change": "-2.5%"}, {"name": "美 국채 10년물 금리", "value": "5.07%", "change": "+0.01"}, {"name": "달러-원 환율", "value": "₩1,334.25", "change": "-0.6%"}, {"name": "블룸버그 달러 지수", "value": "1,222.47", "change": "-0.2%"}, {"name": "브렌트 원유 선물", "value": "$109.86", "change": "+3.7%"}], "items": [{"n": 1, "headline": "코어위브 불안…AI 투자 놓고 공포와 낙관론 충돌", "summary": "AI 인프라 투자 열풍의 지속 가능성을 둘러싼 우려가 커지면서 코어위브 가 시장의 시험대로 떠올랐다. 주가는 일주일 사이에 25% 급락했고 회사채도 재무적 곤경을 시사하는 수준까지 떨어졌다. 5년물 신용부도스와프(CDS)는 사상 최고치로 치솟아 향후 5년 내 디폴트 가능성을 60% 넘게 반영했다. 미국채 금리 상승과 끈질긴 인플레이션으로 자금조달 비용이 높아지는 가운데, 데이터센터 건설을 위해 하이일드 채권에 크게 의존하는 코어위브의 부채 부담이 시장 경계의 초점이 되고 있다."}, {"n": 2, "headline": "브렌트유 110달러…유라시아 ‘확전 가능성 65%’", "summary": "브렌트유 가 중동과 러시아를 둘러싼 공급 차질 우려에 16일 장중 3.9% 뛰며 5월 이후 처음으로 배럴당 110달러를 터치했다. 후티 반군의 사우디아라비아 공격과 러시아·우크라이나의 에너지 인프라 공격이 이어지는 가운데, 미 하원의원들이 러시아와의 대규모 디젤 공급 합의를 저지하는 법안까지 발의하면서 공급 확대 기대가 약해졌다. 전쟁에 따른 공급 차질로 유가는 올해 들어 70% 넘게 올랐고, 유럽 디젤 선물은 두 배 이상 뛰는 등 정제유 시장의 수급 불안은 더욱 심각한 상황이다."}, {"n": 3, "headline": "美 재정적자 1.99조달러…이자비용 사상 최대", "summary": "미국의 2026회계연도 재정적자 가 1.99조달러로 전년보다 12% 늘며 4년 연속 2조달러 안팎을 기록했다. GDP의 약 6%에 달하는 규모로, 정부 지출이 7.4조달러로 6% 증가한 반면 세입은 5.4조달러로 3% 늘어나는 데 그쳤다. 특히 미국채 금리 상승과 부채 증가로 순이자비용이 사상 최대인 1.05조달러까지 불어나며 적자 확대의 주요 요인으로 작용했다."}, {"n": 4, "headline": "美재무부, 국채 입찰 규모 변경 가능성 의견 타진", "summary": "미국 재무부가 11월4일 분기 국채 발행 계획 발표를 앞두고 프라이머리 딜러들에게 투자자 수요의 구조적 변화를 감안해 향후 국채 입찰 규모를 어떻게 조정할 필요가 있는지 의견을 요청했다. 최근 확대된 장기물 바이백이 시장 유동성과 딜러들의 거래 중개 능력에 미친 영향과 추가 개선 방안도 질문했다. 대규모 재정적자와 높은 장기금리로 국채 공급 및 이자비용 부담이 커진 가운데 재무부가 만기별 발행 구성을 조정할지 시장의 관심이 쏠리고 있다."}, {"n": 5, "headline": "中, AI 수출통제 추진", "summary": "중국 이 대규모언어모델(LLM)과 AI 에이전트, 반도체 설계 등 첨단 AI 기술의 해외 이전을 제한하는 방안을 추진한다. 중국 정부가 공개한 초안에는 컴퓨팅 클러스터를 포함한 23개 AI 기술이 수출통제 대상으로 제시됐으며, 일정 기준을 넘는 AI 모델의 가중치와 소스코드도 포함된다. 규제 대상 모델을 해외에 배치하는 것 역시 기술 수출로 간주된다. 다만 이미 공개된 오픈소스 기술과 연구는 제외하고, 오픈소스 AI 수출에는 간소화된 허가 절차를 적용할 방침이다."}]}, "daily": {"headline": "France besieged", "sections": ["No good options", "Buckle up"]}}, "2026-10-16": {"date": "2026-10-16", "morning": null, "daily": {"headline": "Tech’s rough week", "sections": ["Tough week for tech", "Irresistible rally"]}}, "2026-10-15": {"date": "2026-10-15", "morning": {"hook": "美인플레 가속, 반도체 6일째↓", "markets": [{"name": "S&P 500 지수", "value": "7,718.94", "change": "-1.1%"}, {"name": "나스닥 100 지수", "value": "29,950.82", "change": "-2.0%"}, {"name": "美 국채 10년물 금리", "value": "5.19%", "change": "-0.02"}, {"name": "달러-원 환율", "value": "₩1,340.50", "change": "+0.0%"}, {"name": "블룸버그 달러 지수", "value": "1,228.35", "change": "+0.3%"}, {"name": "브렌트 원유 선물", "value": "$106.19", "change": "+0.5%"}], "items": [{"n": 1, "headline": "美 9월 CPI 0.6% 상승…전방위적 물가 압력", "summary": "미 노동통계국(BLS)이 14일 발표한 자료에 따르면 9월 헤드라인 소비자물가지수(CPI) 는 연료비 급등에 전월 대비 0.6% 상승했다. 식품과 에너지를 제외한 근원 CPI는 0.3% 올랐다. 전년 동월 대비로는 각각 3.7%, 2.6%로 상승세가 더 가팔라졌다. 네이비페더럴크레디트는 “미국인들의 임금이 인플레이션으로 완전히 잠식되고 있다”며 “연준 역시 인플레이션 진전을 확인하지 못하고 있고, 연료 가격 상승은 다른 분야로 번지기 시작하고 있다”고 진단했다."}, {"n": 2, "headline": "시장 전문가들, 연준 인상 10월보다 12월에 무게", "summary": "리건 캐피털은 “인플레이션이 끈질기고 잘못된 방향으로 움직이고 있다는 점이 어느 때보다 분명하다”며 “연준이 10월에는 금리를 동결할 것으로 예상하지만, 12월에는 금리 인상을 재개할 것으로 본다”고 말했다. 프랭클린 템플턴 인스티튜트는 근원 CPI가 예상보다 뜨겁게 나오면서 추가 금리 인상의 근거가 강화됐지만, 최근 연준 인사들의 비둘기파적 발언을 감안하면 즉각적인 금리 인상의 문턱은 여전히 높다고 평가했다."}, {"n": 3, "headline": "반도체주 6일째 급락…시총 1조달러 넘게 증발", "summary": "금리 상승과 높은 밸류에이션, 막대한 AI 인프라 구축 비용에 대한 우려로 반도체주 매도세가 이어졌다. 필라델피아 반도체지수(SOX)는 4.3% 하락 마감해 최근 6거래일간 낙폭이 11%를 넘어섰고, 이 기간 미국 증시에 상장된 주요 반도체주의 시가총액은 1조달러 넘게 증발했다. SOX 구성 종목의 절반 이상이 최소 10% 하락했고 Arm홀딩스는 21% 급락했다."}, {"n": 4, "headline": "코어위브 채권 ‘부실’수준…CEO ‘시장 비이성적’", "summary": "AI 클라우드 업체 코어위브 의 2032년 만기 무담보 채권 가격이 달러당 80센트 아래로 급락해 통상 재무적 곤경을 나타내는 수준에 진입했다. 채권 수익률은 15%를 넘어섰고 주가도 장중 17% 넘게 급락했다. 코어위브를 AI의 “서브프라임 트랜치”라고 비유했던 D.A. 데이비드슨의 길 루리아는 회사가 9%에 자금을 조달해 5%의 수익을 내는 구조라면 사업 규모를 아무리 키워도 가치를 파괴할 수밖에 없다고 지적했다."}, {"n": 5, "headline": "중동·러시아 긴장 고조에 유가 상승", "summary": "중동과 러시아를 둘러싼 무력 충돌이 격화하면서 원유 공급 차질 우려가 다시 커지고 있다. 예멘 후티 반군이 사우디아라비아 전역에 미사일과 드론 공격을 가해 사우디 아람코 본사까지 타격한 데다, 호르무즈 해협에서는 이란의 유조선 공격이 늘어난 가운데 화물선 한 척이 피격된 뒤 침몰 했다는 소식도 전해졌다. 브렌트유는 배럴당 106달러를 웃돌았고 WTI는 장중 2% 상승했다."}]}, "daily": {"headline": "Calm no more", "sections": ["Calm shattered", "CoreWeave’s ‘yikes’ moment"]}}, "2026-10-14": {"date": "2026-10-14", "morning": {"hook": "AI균열우려, 구원투수 윌리엄스", "markets": [{"name": "S&P 500 지수", "value": "7,805.45", "change": "-0.0%"}, {"name": "나스닥 100 지수", "value": "30,569.48", "change": "-0.3%"}, {"name": "美 국채 10년물 금리", "value": "5.21%", "change": "-0.03"}, {"name": "달러-원 환율", "value": "₩1,343.12", "change": "+0.1%"}, {"name": "블룸버그 달러 지수", "value": "1,225.19", "change": "-0.2%"}, {"name": "브렌트 원유 선물", "value": "$106.13", "change": "-0.5%"}], "items": [{"n": 1, "headline": "AI 투자 열풍 곳곳서 균열", "summary": "글로벌 AI 투자 열풍에 균열 조짐이 커지고 있다. 특히 중국 CXMT의 반도체 기술 돌파구 소식으로 메모리 반도체주에 대한 경계감이 커진 가운데, 투자자들은 AI에 쏟아붓는 막대한 자금이 그동안의 가파른 주가 상승을 정당화할 만큼 충분한 수익으로 이어질지 주시하고 있다. UBP는 메모리주에서 투자자들이 “일단 팔고 나중에 생각하자”는 분위기라고 전했고, 로터스자산운용은 중국 CXMT의 생산능력 확대가 가격 경쟁을 촉발할 수 있다고 우려했다."}, {"n": 2, "headline": "윌리엄스 “올 한차례 추가 인상…내년은 불필요”", "summary": "존 윌리엄스 뉴욕 연은 총재는 “한 차례 더 금리를 인상하는 것이 적절할 수 있다는 견해에는 변화가 없다”며 “그 이후 추가 조치가 필요하다고 믿을 만한 이유는 현재로서는 없다”고 말했다. 관세와 에너지 가격 충격이 약해지면서 인플레이션이 내년 연준의 2% 목표에 근접할 것으로 예상하기 때문이다. 이는 12월 인상에 이어 2027년 두 차례 추가 인상을 반영하고 있는 시장 전망보다 비둘기파적인 견해다. 다만 그는 전망의 불확실성이 크다며 특히 AI 인프라 투자에 따른 물가 압력을 주시하고 있다고 밝혔다."}, {"n": 3, "headline": "배스먼 “美20년물 금리 6% 넘으면 악몽”", "summary": "채권시장 변동성 지수를 고안한 할리 배스먼은 미국채 20년물 금리가 6%를 넘어설 경우 1100억달러 규모의 20년물이 발행되는 것과 맞먹는 매도 압력이 발생하는 “악몽의 시나리오”가 펼쳐질 수 있다고 경고했다. 최근 금리 급등으로 만기가 긴 채권이 국채선물의 최저가인도채권(CTD)으로 바뀌면서, 금리 상승 시 가격 하락 위험이 더 큰 장기물에 대한 익스포저가 확대되고 있다는 설명이다."}, {"n": 4, "headline": "월가 은행 실적…주식 트레이딩 호조·채권은 엇갈려", "summary": "미국 대형 은행들의 3분기 실적이 엇갈렸다. JP모간체이스 와 골드만삭스 는 주식 트레이딩에서 호조를 보인 반면 채권 부문은 기대에 못 미쳤다. JP모간의 FICC 트레이딩 수익은 전년 동기 대비 4% 감소해 2년여 만에 처음으로 줄었지만, 주식 트레이딩 수익은 49% 급증해 3분기 기준 사상 최고치를 기록했다. 올해 순이자수익(NII) 전망도 1062억달러로 상향했다. 제이미 다이먼 최고경영자(CEO)는 “대규모 재정적자와 끈질긴 인플레이션, 높은 자산가격, 금리 상승, 지정학적 여건이 계속해서 수면 아래에서 변화하고 있다”며 “광범위한 결과에 대비하고 있다”고 밝혔다."}, {"n": 5, "headline": "호르무즈 선박 공격 급증...사우디 아람코 본사 피격", "summary": "이란 이 호르무즈 해협을 통과하는 선박에 대한 공격을 늘리면서 최근 회복세를 보이던 페르시아만 원유 수출이 다시 위협받고 있다. 지난 11일 유조선 4척이 피격된 가운데 초대형 유조선 10여 척과 여러 척의 수에즈막스급 선박이 호르무즈 입구 인근 푸자이라에 접근하다 회항하거나 항로를 되돌렸다. 해운업계에서는 선박 간 환적 대기시간이 길어지는 등 운송 둔화 조짐도 나타나고 있다."}]}, "daily": {"headline": "Beating the pros", "sections": ["Garage trading", "Bond traders dethroned"]}}, "2026-10-13": {"date": "2026-10-13", "morning": {"hook": "美20년물 폐지? 에너지휴전 삐걱", "markets": [{"name": "S&P 500 지수", "value": "7,807.24", "change": "-0.1%"}, {"name": "나스닥 100 지수", "value": "30,664.70", "change": "-0.7%"}, {"name": "달러-원 환율", "value": "₩1,334.80", "change": "+0.0%"}, {"name": "블룸버그 달러 지수", "value": "1,227.38", "change": "+0.1%"}, {"name": "브렌트 원유 선물", "value": "$106.65", "change": "+1.8%"}], "items": [{"n": 1, "headline": "러-우크라 ‘에너지 휴전’ 삐걱·중동 긴장↑…유가불안", "summary": "트럼프 대통령이 발표한 러시아와의 ‘ 에너지 휴전 ’이 삐걱이고 중동에서는 사우디아라비아가 이란 전쟁 발발 이후 가장 치명적인 공격을 받으면서 브렌트유 가 장중 2% 넘게 올라 배럴당 107달러를 상회했다. 젤렌스키 우크라이나 대통령은 러시아가 자국의 에너지 인프라를 계속 공격하고 있는 만큼 우크라이나도 공격을 이어갈 것이라고 밝혔다. 그는 트럼프 대통령이 전날 트루스소셜을 통해 발표한 휴전 소식을 언론 보도를 통해 알게 됐다며 “푸틴 러시아 대통령이 트루스소셜을 읽지 않는 게 분명하다”고 말했다."}, {"n": 2, "headline": "다시 고개드는 미국채 20년물 폐지론", "summary": "월가에서 미국채 20년물 폐지론이 제기되는 가운데 11월4일 재무부의 분기 국채발행계획에 관심이 쏠리고 있다. 도이체방크는 “20년물 미국채 발행이 중단될 것이라는 이야기가 나오고 있다“고 전했고, 씨티그룹은 20년물 발행이 축소되거나 아예 중단될 가능성을 감안해 20년물이 10년물보다 강세를 보일 것에 대비하라고 권고했다. 논쟁의 중심에는 재무부의 차입비용 절감이 있다. 2020년 재무장관 재임 당시 20년물을 부활시킨 스티븐 므누신조차 2024년엔 ”납세자에게 비용만 많이 든다“며 폐지를 주장했다."}, {"n": 3, "headline": "美채권 매도세 끝나나…월가, 듀레이션 매력 주목", "summary": "미국채 금리가 수년 만의 최고 수준으로 치솟은 뒤 월가에서는 채권의 투자 매력이 높아졌다는 평가가 나오고 있다. 골드만삭스는 신용시장 불안 조짐과 기술적 위험 완화를 근거로 듀레이션이 매력적인 수준이라며 10년물 반등 가능성을 제기했다. 모간스탠리도 이례적으로 높은 성장률과 물가 압력이 지속되지 않는 한 현재 미국채 금리가 매력적이라고 평가했다. 씨티그룹은 인플레이션과 임금 상승세 둔화를 이유로 단기물을 선호했다."}, {"n": 4, "headline": "골드만, 글로벌 주식 단기 전망 ‘비중확대’", "summary": "골드만삭스 가 강한 기업 실적을 이유로 사상 최고치 부근에서 거래되고 있는 글로벌 주식에 대해 단기적으로 낙관적인 전망으로 돌아섰다. 크리스티안 뮐러-글리스만이 이끄는 전략팀은 유가와 채권금리 상승으로 최근 랠리가 주춤하면서 주식 밸류에이션 부담이 낮아진 반면 기업 이익 전망은 여전히 양호하다고 진단했다. 이에 3개월 주식 전망을 ‘중립’에서 ‘비중확대’로 상향해 기존 12개월 강세 전망과 같은 수준으로 맞췄다."}, {"n": 5, "headline": "메타, 새 AI 모델 ‘뮤즈 원더’ 공개", "summary": "메타플랫폼스 가 새로운 인공지능(AI) 모델 ‘뮤즈 원더(Muse Wonder)’를 공개하자 주가가 장중 4.7% 가까이 뛰었다. 내부 코드명 ‘워터멜론’으로 개발된 이 모델은 마크 저커버그 최고경영자(CEO)가 AI 조직을 전면 개편한 이후 내놓은 가장 강력한 모델이다. 메타는 코딩과 금융·법률 문제 해결에서 오픈AI의 챗GPT와 앤트로픽의 클로드에 필적하는 ‘프런티어급 역량’을 갖췄다고 주장했다."}]}, "daily": {"headline": "AI exposure", "sections": ["Roll of the dice", "Growth shield"]}}, "2026-10-12": {"date": "2026-10-12", "morning": {"hook": "사우디공항 피격, 미·러 디젤거래", "markets": [{"name": "S&P 500 지수", "value": "7,811.54", "change": "+0.6%"}, {"name": "나스닥 100 지수", "value": "30,883.15", "change": "+0.5%"}, {"name": "美 국채 10년물 금리", "value": "5.24%", "change": "+0.01"}, {"name": "블룸버그 달러 지수", "value": "1,225.96", "change": "+0.2%"}, {"name": "브렌트 원유 선물", "value": "$104.72", "change": "+0.4%"}], "items": [{"n": 1, "headline": "트럼프-푸틴, 러시아산 디젤 美공급 합의", "summary": "트럼프 미국 대통령이 급등한 연료 가격을 낮추기 위해 푸틴 러시아 대통령과 손잡고 러시아산 디젤 을 글로벌 시장에 공급하기로 했다. 미국 중간선거를 앞두고 수년간 이어진 대러 제재 기조를 뒤집는 조치다. 트럼프는 이달부터 우선 총 1350만배럴 규모의 디젤을 공급한다고 발표했다. 크렘린궁도 푸틴 대통령의 발언을 인용해 러시아가 “미국과 글로벌 시장에 원유와 석유제품을 공급할 준비가 돼 있다”고 밝혔다. 미 재무부는 기존 제재 대상이었던 러시아산 연료에 대한 제재 면제도 발급했다."}, {"n": 2, "headline": "美국채 매도세에 ‘기간 프리미엄’ 급등…장기금리 상승 압력", "summary": "미국채 금리가 24년 만의 최고 수준으로 치솟은 최근 매도세의 상당 부분을 기간 프리미엄 상승이 주도한 것으로 나타나면서 장기금리가 높은 수준에 고착될 수 있다는 우려가 커지고 있다. 기간 프리미엄은 지정학적 충격이나 정부 재정위기처럼 장기채 만기까지 발생할 수 있는 예측하기 어려운 위험에 대한 일종의 보상으로, 산정 방식도 다양하고 움직임을 설명하는 요인도 복잡하지만 최근 몇 주 사이 10여 년 만의 최고 수준으로 급등했다."}, {"n": 3, "headline": "이탈리아보다 위험해진 프랑스 국채", "summary": "채권 투자자들이 이탈리아 국채보다 프랑스 국채 를 보유하는 대가로 유로화 출범 이후 가장 높은 수준의 추가 보상을 요구하고 있다. 프랑스와 이탈리아의 벤치마크 10년물 국채 금리 차이는 9일 30bp로 사상 최대를 기록했다. 지난해까지만 해도 이탈리아가 프랑스보다 위험한 국가로 여겨져 차입 비용도 더 높았다. 하지만 프랑스가 기대만큼 재정적자를 줄이지 못한 데다 국내총생산(GDP) 대비 국가부채 비율도 117.6%에서 낮아질 조짐을 보이지 않자 상황은 역전됐다."}, {"n": 4, "headline": "EU·중국, 中 하이브리드차 수출 대폭 감축 합의", "summary": "유럽연합(EU)과 중국 이 무역 갈등 완화를 위해 중국산 하이브리드 차량의 대EU 수출을 대폭 줄이는 내용의 합의에 도달했다고 EU가 밝혔다. 블룸버그가 확인한 문서에 따르면 수입 한도는 첫해 연간 35만대 로 정해지고 2년 차부터 매년 6%씩 늘어난다. 세이프가드 조치는 이르면 12월 1일부터 시행될 수 있다. 이번 합의는 4년간 적용되며 이 기간 EU와 중국은 세계무역기구(WTO) 규정을 준수하기로 했다."}, {"n": 5, "headline": "오픈AI, 연말 연환산 매출 700억달러 이상 전망", "summary": "챗GPT 개발사 오픈AI 가 기업용 사업 성장에 힘입어 2026년 말까지 연환산 매출이 700억달러에 도달하거나 이를 넘어설 것으로 전망하고 있다고 사안에 정통한 관계자들이 밝혔다. 앞서 파이낸셜타임스(FT)는 9월 말 기준 오픈AI의 연환산 매출이 일부 투자자 추정치보다 200억달러 적은 500억달러라고 보도해 8일 나스닥 100지수와 필라델피아 반도체주 지수가 급락했다. 연환산 매출은 일정 기간의 매출 실적을 토대로 1년치 매출을 추산한 수치로, 기업별로 이를 산정하는 방식에 차이가 있다."}]}, "daily": {"headline": "Bank stock vibe shift", "sections": ["Bank stocks try to escape AI scare trade"]}}, "2026-10-09": {"date": "2026-10-09", "morning": null, "daily": {"headline": "Extinction risk", "sections": ["Pricing AI risk", "China bonds become source of cheap money"]}}, "2026-10-08": {"date": "2026-10-08", "morning": {"hook": "美금리 정점? 스페이스X CDS↑", "markets": [{"name": "S&P 500 지수", "value": "7,801.77", "change": "-0.2%"}, {"name": "나스닥 100 지수", "value": "31,160.08", "change": "-0.2%"}, {"name": "美 국채 10년물 금리", "value": "5.28%", "change": "+0.00"}, {"name": "달러-원 환율", "value": "₩1,339.50", "change": "+0.0%"}, {"name": "블룸버그 달러 지수", "value": "1,223.81", "change": "+0.3%"}, {"name": "브렌트 원유 선물", "value": "$101.32", "change": "+0.7%"}], "items": [{"n": 1, "headline": "美국채 금리 정점 왔나…월가 전망 엇갈려", "summary": "미국채 장기물 금리 가 2002년 이후 최고 수준으로 치솟은 가운데 월가 일각에서는 채권 강세론을 고수하고 있다. 골드만삭스는 인플레이션과 정부 부채에 대한 우려가 과도하다며 10년물 금리가 연말 4.75%까지 내려갈 것으로 예상했고, 도이체방크와 모간스탠리는 각각 4.8%를 전망했다. 씨티그룹은 5%, JP모간은 5.05%를 제시했다. 특히 모간스탠리는 시장이 이미 연준의 매파적 시나리오를 상당 부분 가격에 반영한 만큼 향후 금리 위험은 상승보다 하락 쪽으로 기울어 있다고 진단했다."}, {"n": 2, "headline": "연준 의사록, 9월 금리인상에 매파적 공감대", "summary": "연준위원 19명 전원이 지난 9월 금리 인상 결정을 지지한 것으로 나타났다. 이 가운데 다수는 물가 압력이 더욱 강해질 위험에 대비하기 위해 금리 인상이 필요하다고 판단했다. 간밤 공개된 9월15~16일 연방공개시장위원회(FOMC) 의사록 에 따르면 여러 연준위원들은 경제 전망을 근거로 더 높은 금리가 필요하다고 판단해 인플레이션에 대한 우려가 더욱 큰 것으로 나타났다. 의사록은 “대부분의 참석자는 연말까지 연방기금금리 목표 범위를 한 차례 더 인상하는 것이 적절할 가능성이 높다고 판단했다”고 밝혔다."}, {"n": 3, "headline": "스페이스X, 400억달러 조달 추진에 신용위험↑", "summary": "스페이스X 가 엔비디아 칩 구매를 위해 400억달러를 조달하는 방안을 은행 및 투자자들과 논의하고 있다는 소식에 7일 신용위험 지표가 사상 최고치로 치솟고 유통시장에서 채권 가격이 급락했다. ICE 데이터서비스에 따르면 투자자들의 우려가 커질수록 상승하는 스페이스X의 5년물 신용부도스와프(CDS) 프리미엄은 한때 16.7bp 오른 197.6bp 안팎을 기록했다. 일론 머스크의 로켓·위성·AI 사업을 아우르는 스페이스X 관련 CDS가 지난 6월 활발하게 거래되기 시작한 이후 장중 최고 수준이다."}, {"n": 4, "headline": "佛혼란에 ECB 압박…물랭 총재엔 ‘반역’ 위협", "summary": "거리 시위에서 채권시장 혼란에 이르기까지 프랑스 가 위기에 휩싸이면서 유럽중앙은행(ECB)이 10여 년 전 유로존 재정위기 이후 볼 수 없었던 투자자들과의 대치 상황으로 내몰릴 위험이 커지고 있다. 정부 붕괴 가능성과 재정적자 문제가 불거진 가운데 내년 5월 에마뉘엘 마크롱 대통령의 후임을 노리는 대선 후보들은 ECB에 국채 매입이나 심지어 부채 탕감까지 요구하며 압박 수위를 높이고 있다. 극좌 성향의 장뤼크 멜랑숑은 대선에서 승리할 경우 에마뉘엘 물랭 프랑스 중앙은행 총재를 반역 혐의로 처벌하겠다고 밝혔다."}, {"n": 5, "headline": "EU, 中 하이브리드차 수입 제한 추진", "summary": "유럽연합(EU) 이 대중국 무역적자를 줄이기 위해 중국산 하이브리드 차량의 역내 수입을 제한하는 이른바 세이프가드 조치를 준비하고 있다. EU의 통상정책을 담당하는 유럽연합 집행위원회는 유럽에서 중국산 하이브리드 차량 판매가 급증함에 따라 수입 제한을 부과하는 방안을 검토하고 있다고 사안에 정통한 관계자들이 전했다. 중국산 하이브리드 차량은 현재 유럽 전체 하이브리드 판매의 4분의 1을 차지한다. 반면 이미 높은 EU 관세가 부과되고 있는 중국산 전기차의 수입 증가세는 둔화됐다."}]}, "daily": {"headline": "France as the stress bellwether", "sections": ["France, the stress bellwether", "Trying to call the top"]}}, "2026-10-07": {"date": "2026-10-07", "morning": {"hook": "美부채 회의론, AI트레이드 부활", "markets": [{"name": "S&P 500 지수", "value": "7,818.93", "change": "+0.6%"}, {"name": "나스닥 100 지수", "value": "31,224.47", "change": "+0.5%"}, {"name": "美 국채 10년물 금리", "value": "5.28%", "change": "-0.03"}, {"name": "달러-원 환율", "value": "₩1,339.00", "change": "+0.0%"}, {"name": "블룸버그 달러 지수", "value": "1,220.19", "change": "-0.2%"}, {"name": "브렌트 원유 선물", "value": "$101.00", "change": "+0.7%"}], "items": [{"n": 1, "headline": "시장 “美부채, 성장만으론 안돼”…베선트에 회의론", "summary": "스콧 베선트 미 재무장관이 경제 성장과 지출 억제를 통해 연방정부의 부채 부담을 빠르게 낮출 수 있다고 자신했지만 시장에서는 회의론이 제기됐다. 베선트는 “중요한 것은 GDP 대비 부채 비율이며 우리는 그 곡선을 꺾어 낮추기 시작할 것”이라며 3%를 웃도는 경제성장률이 지속되면 목표 달성에 도움이 될 것이라고 말했다. BBH는 최근 미국채 10년물 금리가 2002년 이후 최고치로 치솟은 가운데 베선트가 장기 금리를 낮추기 위해 ‘구두 개입’에 나선 것으로 평가했다."}, {"n": 2, "headline": "佛르펜, 디폴트 경고…ECB 개입 촉구", "summary": "프랑스 극우 진영의 대선 후보 마린 르펜이 재정적자를 대폭 줄이는 동시에 급등한 국채 조달비용을 낮추기 위해 유럽중앙은행(ECB)이 개입해야 한다고 촉구했다. 국민연합(RN)을 이끄는 르펜은 내년 재정적자를 국내총생산(GDP)의 3.7%까지 낮추겠다면서, “프랑스 국민이 정치적 리셋을 선택하지 않는다면 프랑스는 디폴트로 향할 것”이라며 “채권자들이 터무니없이 높은 금리에만 돈을 빌려준다면 국가와 사회 모델이 무너질 것”이라고 경고했다."}, {"n": 3, "headline": "엔비디아, 시총 6조달러 눈앞…주가 사상최고", "summary": "엔비디아 주가가 다시 사상 최고치를 기록하면서 시가총액 6조달러 돌파를 눈앞에 뒀다. 올해 초 인공지능(AI) 투자에 대한 회의론으로 부진했던 주가가 견조한 매출 전망과 사상 최대 규모의 자사주 매입에 힘입어 반등하고 있다. 그럼에도 향후 12개월 예상 순이익의 18배 미만에서 거래되고 있어 S&P 500의 19배보다도 낮다. 동시에 인플레이션 위험과 연준의 금리 인상 가능성이 커지면서 초대형 기술주가 투자자들에게 상대적으로 안전한 투자처로 부각되는 양상이다."}, {"n": 4, "headline": "다이먼 “미토스 이후 AI 사이버위험 10배↑”", "summary": "제이미 다이먼 JP모간체이스 최고경영자(CEO)는 앤트로픽의 인공지능(AI) 모델 ‘미토스(Mythos)’가 등장한 이후 글로벌 사이버보안 위험이 10배 증가했다고 경고했다. 그는 “AI는 우리가 알지 못했던 취약점을 만들어냈다“며, ”에이전트와 미토스 등 문제를 일으킬 수 있는 것들에 관한 우려는 분명 정당하며 실제 존재하는 위험“이라고 말했다. 다만 ”이것이 인류 존립의 문제인지 아닌지를 놓고 과민반응하지는 않을 것“이라고 덧붙였다."}, {"n": 5, "headline": "월가 이익 900억달러 돌파 전망…보너스도 사상최대", "summary": "뉴욕 월가 의 트레이딩·투자은행들이 올해 사상 최대 이익을 거두면서 보너스도 역대 최고치를 기록할 전망이다. 토머스 디나폴리 뉴욕주 감사원장 보고서에 따르면 뉴욕증권거래소(NYSE) 회원사의 브로커딜러 부문 이익은 상반기 실적을 바탕으로 올해 900억달러를 넘어설 것으로 추산됐다. 이는 지난해 기록한 사상 최대인 651억달러를 크게 웃도는 수준이다. 시장 변동성 확대와 기업 인수·합병(M&A) 심리 회복 등에 힘입어 상반기 인수주선 관련 수입은 68%, 계좌관리·자문 수입은 16.4% 증가했다."}]}, "daily": {"headline": "Stocks fight gravity", "sections": ["Stocks versus gravity", "Taiwan’s AI opportunity"]}}, "2026-10-06": {"date": "2026-10-06", "morning": {"hook": "‘美 부채의 덫’ 경고, 유럽 불안", "markets": [{"name": "S&P 500 지수", "value": "7,773.95", "change": "+0.7%"}, {"name": "나스닥 100 지수", "value": "31,076.44", "change": "+0.9%"}, {"name": "美 국채 10년물 금리", "value": "5.30%", "change": "+0.03"}, {"name": "달러-원 환율", "value": "₩1,341.06", "change": "-0.0%"}, {"name": "블룸버그 달러 지수", "value": "1,216.04", "change": "+0.3%"}, {"name": "브렌트 원유 선물", "value": "$100.32", "change": "-1.9%"}], "items": [{"n": 1, "headline": "佛재정·스페인 정치불안에 유로화도 매도세", "summary": "프랑스 의 재정위기가 심화하고 유럽에서 새로운 정치적 혼란이 발생할 가능성이 커지면서 유로화 가 장중 최대 0.8% 하락한 1.1161달러로 2025년 5월 이후 최저 수준을 기록했다. 스페인 총리가 11월 29일 조기 총선을 실시한다고 발표하면서 프랑스 등 취약한 유럽 국채시장의 불안에 시달리던 투자자들에게 새로운 정치적 위험이 더해졌다. ING는 유로화가 1.10달러까지 추가 하락할 위험이 있다고 내다봤다."}, {"n": 2, "headline": "BMO ‘부채의 덫’ 경고...美30년물 이르면 이달 6%", "summary": "BMO글로벌자산운용의 채권·머니마켓 책임자인 얼 데이비스는 채권시장 변동성이 금리를 더욱 끌어올리는 순환을 만들고 있다며 미국채 30년물 금리가 6%를 넘어서는 것은 “불가피하다”고 전망했다. 이르면 이달 중 6%에 이를 가능성이 높다고 봤다. 이 경우 정부의 차입 비용이 명목 경제성장률을 웃돌면서 부채 비용이 계속 늘어나는 악순환이 발생해 미국이 ‘ 부채의 덫 ’에 빠질 위험이 있다고 경고했다."}, {"n": 3, "headline": "美서비스업 확장세 둔화…가격지수 4년래 최고", "summary": "미국 서비스업 이 9월에도 확장세를 이어갔지만 속도는 둔화했다. 비용 압력은 4년여 만에 가장 높은 수준으로 커졌다. 공급관리협회(ISM)가 5일 발표한 서비스업 지수는 전월보다 0.5p 하락한 54.9를 기록했다. 기준선인 50을 웃돌면 경기 확장을 의미한다. 견조한 소비지출과 안정적인 노동시장, 강한 기업 투자가 서비스 수요를 계속 뒷받침하고 있지만 기업들은 비용 상승 부담에도 직면하고 있다."}, {"n": 4, "headline": "사우디아람코 “글로벌 원유 비축량 놀랄 만큼 부족”", "summary": "전 세계가 공급 충격에 대비해 쌓아둔 원유 재고가 “놀랄 만큼 부족한” 수준으로 줄어 호르무즈 해협이 다시 열리지 않을 경우 시장 상황이 더욱 악화할 위험이 있다고 사우디아라비아 국영 석유회사 아람코의 최고경영자(CEO) 아민 나세르가 경고했다. 그는 “호르무즈 해협이 완전히 재개되고 신뢰가 회복될 때까지 원유와 정제유 양쪽의 압박이 더욱 심해질 수밖에 없는 것이 현실”이라며 “원유 수급 압박도 심각하지만 정제유 가격은 훨씬 더 가파르게 상승했다”고 말했다."}, {"n": 5, "headline": "트럼프, 디젤값 잡기…면세유 규제 완화", "summary": "트럼프 미국 대통령이 오는 11월 중간선거를 앞두고 디젤 가격 부담을 낮추기 위한 추가 조치로 면세 대상인 ‘ 적색 디젤 ’의 사용 제한을 완화할 준비를 하고 있다. 일반적으로 농업·건설 장비 등 비도로용으로 사용되는 적색 디젤을 보다 광범위하게 사용할 수 있도록 하는 내용이다. 적색 디젤은 갤런당 24센트의 연방 소비세가 면제된다. 따라서 벌금 없이 도로 주행 차량에도 사용할 수 있도록 허용할 경우 일부에서는 사실상의 감세 효과가 발생할 수 있다."}]}, "daily": {"headline": "Nvidia nears $6 trillion", "sections": ["Nvidia is back", "‘A very difficult dynamic’"]}}, "2026-10-05": {"date": "2026-10-05", "morning": null, "daily": {"headline": "Europe’s contagion risk", "sections": ["Whispers of contagion"]}}, "2026-10-02": {"date": "2026-10-02", "morning": {"hook": "美국채 반등, 佛재정우려·英6%", "markets": [{"name": "S&P 500 지수", "value": "7,666.45", "change": "+0.2%"}, {"name": "나스닥 100 지수", "value": "30,501.56", "change": "+0.3%"}, {"name": "美 국채 10년물 금리", "value": "5.24%", "change": "-0.04"}, {"name": "달러-원 환율", "value": "₩1,360.00", "change": "+0.1%"}, {"name": "블룸버그 달러 지수", "value": "1,225.00", "change": "+0.4%"}], "items": [{"n": 1, "headline": "美, 이란 인근 항모 추가 배치할 수도…공격 확대 선택지", "summary": "미 국방부가 조만간 페르시아만에 항공모함 한 척을 추가 배치할 가능성이 있다고 미 당국자가 밝혔다. 도널드 트럼프 대통령이 이란 에 대한 공격 확대를 결정할 경우 중동 지역 미군 지휘부에 더 많은 군사적 선택지를 제공할 수 있는 조치다. 당국자에 따르면 항공모함 테어도어 루스벨트함은 지난 일요일 모항인 샌디에이고를 출항했다. 최종 목적지는 아직 결정되지 않았지만, 역내 상황에 따라 미 중부사령부가 활용할 수 있는 선택지를 제공한다고 이 당국자는 설명했다."}, {"n": 2, "headline": "美 9월 제조업 확장세 지속…비용·공급망 압박은 가중", "summary": "미국 제조업 활동 이 견조한 수요에도 비용 상승과 배송 지연이 부담으로 작용하면서 9월 소폭 둔화했다. 공급관리협회(ISM)가 1일 발표한 제조업 지수는 전월보다 0.1p 하락한 54.5를 기록했다. 제조업 활동은 확장과 위축을 가르는 기준선인 50을 9개월 연속 웃돌아 2022년 이후 가장 긴 확장세를 이어갔다. 9월 지표에서는 수요가 견조한 흐름을 보였다. 신규주문 지수가 상승했고 수주잔고 지수는 2월 이후 최고 수준으로 올랐다. 생산도 증가세를 이어갔지만 확장 속도는 다소 둔화했다."}, {"n": 3, "headline": "연준부의장 “시간 필요”...카시카리 “물가안정은 연준 임무”", "summary": "필립 제퍼슨 연준 부의장은 물가 안정을 위해 추가 금리 인상이 필요한지 판단하는 데 시간이 더 필요할 수 있다고 밝혔다. 그는 인플레이션이 너무 오랫동안 지나치게 높은 수준을 유지해왔으며 앞으로도 높은 수준에 머물 위험이 있다고 경고했다. 다만 경제가 일련의 충격에 동시에 직면해 있는 만큼 새로 들어오는 지표를 신중하게 평가해야 한다고 강조했다. 채권 금리 상승에 대해서는 “투자자들이 변화하는 거시경제 환경을 재평가하고 있다는 신호”라고 해석했다."}, {"n": 4, "headline": "英30년물 6% 돌파…G7 중 유로존 위기 이후 처음", "summary": "길트 30년물 금리 가 거의 30년 만에 처음으로 6%를 돌파했다. 주요 7개국(G7) 가운데 장기 차입 비용이 6%를 넘어선 것은 유럽 재정위기가 한창이던 2012년 이후 영국이 처음이다. 영국은 에너지 수입 의존도가 높은 데다 재정 여건도 취약해 공격적인 금리 인상 우려에 채권시장이 특히 민감하다. 트레이더들은 현재 영란은행(BOE)이 2027년 말까지 네 차례 금리를 인상할 것으로 예상하고 있다."}, {"n": 5, "headline": "인플레 선제 대응국 채권 주목…호주·독일 선호", "summary": "올해 인플레이션 급등에 신속하게 대응한 국가들이 채권 투자자들 의 주목을 받고 있다. 반면 대응이 늦은 국가들은 더 높은 금리라는 대가를 치를 수 있다는 전망이 나온다. 주피터자산운용과 캔드리엄 등 자산운용사들은 호주중앙은행(RBA)이 2월 이후 네 차례 금리를 인상하면서 긴축 사이클이 막바지에 접어들었다는 판단에 호주 국채를 매수하고 있다."}]}, "daily": {"headline": "Stocks take hit from rates", "sections": ["Stocks feel the pain", "France’s crisis"]}}, "2026-10-01": {"date": "2026-10-01", "morning": {"hook": "美10년물 8% 경고, PCE물가 안도", "markets": [{"name": "S&P 500 지수", "value": "7,651.54", "change": "-0.3%"}, {"name": "나스닥 100 지수", "value": "30,408.50", "change": "+0.2%"}, {"name": "美 국채 10년물 금리", "value": "5.28%", "change": "+0.05"}, {"name": "달러-원 환율", "value": "₩1,357.50", "change": "-0.0%"}, {"name": "블룸버그 달러 지수", "value": "1,219.60", "change": "+0.1%"}, {"name": "브렌트 원유 선물", "value": "$103.53", "change": "+0.9%"}], "items": [{"n": 1, "headline": "美 근원 PCE 물가상승률 예상 하회...실질소비 0.6%↑", "summary": "미 상무부 경제분석국(BEA)이 30일 발표한 자료에 따르면 물가 영향을 제거한 실질 개인소비지출은 8월 전월 대비 0.6% 늘어 2025년 3월 이후 가장 큰 폭의 증가를 기록했다. 근원 개인소비지출(PCE) 물가지수 는 전월 대비 0.2% 상승해 시장 예상치 0.3%를 밑돌았고, 전년 대비 상승률은 3.0%로 예상치 3.3%보다 낮았다. 헤드라인 PCE 물가지수는 전월 대비 0.3% 올라 예상에 부합했고, 전년 동월 대비로는 3.4% 상승해 예상치 3.7%를 하회했으나 여전히 연준의 2% 목표를 웃돌았다."}, {"n": 2, "headline": "TS롬바르드 ‘美10년물 8% 간다’...골드만 ‘연준 추가 인상 12월’", "summary": "TS롬바르드는 국채 공급 확대와 인플레이션을 억제하려는 정치적 의지 부족으로 현재의 통화·재정정책 조합이 경기 사이클을 거듭할수록 더 높은 물가와 금리를 초래할 것이라며, 미국 10년물 금리가 장기적으로 8%까지 오를 수 있다고 전망했다. 미국에서 물가 안정을 위해 성장 둔화를 감수하는 정책 전환이 빨라도 2029년은 돼야 가능할 것으로 봤으며, 그 과정에서 ‘인플레이션은 결국 2%로 돌아가고 주식·채권은 장기 보유하면 보상받는다’는 시장의 믿음이 흔들릴 수 있다고 경고했다."}, {"n": 3, "headline": "美모기지금리 7.3%…거의 3년 만에 최고", "summary": "미국 모기지 금리 가 6주 연속 상승해 거의 3년 만에 최고 수준을 기록하면서 주택 구매 희망자들의 부담이 커지고 있다. 미 모기지은행협회(MBA)가 30일 발표한 자료에 따르면 9월25일로 끝난 주간 30년 고정 모기지 계약금리는 18bp 오른 7.30%로, 2023년 11월 이후 최고치를 기록했다. 5년 변동금리 모기지는 37bp 급등한 6.47%로 2년여 만에 가장 높은 수준으로 올랐다. 모기지 금리와 밀접하게 연동되는 미국채 10년물 금리는 이날 5.29%까지 올라 2007년 이후 최고 수준을 기록했다."}, {"n": 4, "headline": "BOE “길트시장 충격 전이 위험 커져”", "summary": "영란은행(BOE)이 길트 시장에서 헤지펀드의 높은 레버리지와 인공지능(AI) 관련 자산 및 회사채 익스포저가 맞물리면서 시장 간 충격이 확산될 위험이 커지고 있다고 경고했다. BOE는 분기 금융안정보고서에서 여러 시장의 취약성이 “동시에 현실화”될 경우 금융시장이 충격에 더욱 취약해질 수 있다고 지적했다. 길트 10년물 금리는 이미 2008년 글로벌 금융위기 당시 수준에 근접해 있다."}, {"n": 5, "headline": "연준, 은행 스트레스테스트 개편 확정", "summary": "연준이 은행 스트레스테스트 제도 개편안을 최종 확정했다. 월가 대형은행들에는 상당한 성과라는 평가다. 연준은 최종 확정된 두 가지 규정이 2025년 제안했던 내용과 대체로 유사하다고 설명했다. 최종 규정에 따라 연준은 스트레스테스트 시나리오와 주요 모델 변경에 대해 외부 의견을 수렴해야 한다. 가상 시나리오의 설계 체계와 스트레스테스트 일정, 연례 테스트에 포함되는 글로벌 시장 충격 요소도 개편한다."}]}, "       renderThemes();
    });
    themeList.addEventListener("click", (event) => {
      const theme = event.target.closest(".theme");
      if (!theme) return;
      theme.setAttribute("aria-expanded", theme.getAttribute("aria-expanded") !== "true");
    });

    renderDates();
    renderDay();
    renderThemes();
  </script>
</body>
</html>
