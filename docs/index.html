와 막대한 국가부채, 정치권의 재정 정상화 능력에 대한 의구심이 겹치며 프랑스 자산 전반에 매도 압력이 커지고 있다."}, {"n": 4, "headline": "中규제·AI우려에 알리바바↓…홍콩 기술주 투매", "summary": "중국 당국이 전자상거래 업체들을 소집해 제품 품질 기준 강화를 주문하면서 알리바바 주가가 6.1% 급락해 두 달 만에 최대 낙폭을 기록했다. 항셍지수는 3%, 항셍테크지수는 5% 떨어졌다. 중국 전자상거래 업체들이 핵심 사업의 성장을 유지하면서 막대한 AI 투자까지 병행해야 하는 상황에서 규제 부담과 투자수익에 대한 우려가 겹쳤다. 항셍테크지수는 올해 들어 31% 하락해 2024년 9월 중국 정부의 대규모 경기부양책 이후 상승분을 거의 모두 반납할 위기에 놓였다."}, {"n": 5, "headline": "바클레이스, AI 활용해 5천명 감원", "summary": "바클레이스 가 인공지능(AI)을 활용한 비용 절감에 나서면서 전체 인력의 약 5%인 5천명을 감원한다. 감원 대상의 약 60%는 개발자를 포함한 지원 부문이며, 올해 상반기에 이미 줄인 1천명도 포함된다. 바클레이스는 향후 비용을 낮추기 위한 구조조정에 올해 약 6억파운드를 투입할 예정으로 기존 예상의 두 배 수준이다. CS 벤카타크리슈난 CEO는 “AI를 대규모로 활용할 것“이라면서도 ”AI는 케이크 자체가 아니라 케이크 위의 아이싱“이라고 말했다."}]}, "daily": {"headline": "Sifting through election scenarios", "sections": ["Election scenarios", "‘Paralyzed’ market"], "five": ["Stocks are stabilizing after yesterday’s rout in the AI trade, though further gains in oil prices are keeping sentiment cautious.", "The euro area’s private sector slowed more than expected in October , weighed down by France as the region’s No. 2 economy grapples with fiscal and political tensions .", "SK Hynix scrapped plans for a potential $10 billion US listing of its Solidigm unit as investors grow increasingly uneasy over the AI boom. More below on the IPO market’s woes.", "Kering shares plunged on disappointing sales at its Italian fashion label Gucci, with weakness in China undermining the brand’s years-long turnaround effort.", "JetBlue’s stocks and bonds plunged , signaling mounting investor doubts about the airline’s financial outlook."], "commentary": [{"heading": "Election scenarios", "summary": "The US midterm election is less than two weeks away, and the conventional wisdom on Wall Street is that stocks will fall if Democrats regain control of both houses of Congress. The reality is more nuanced than that , as our explainer lays out.\n\nA blue sweep is seen as bad for stocks in part because Democrats are viewed as more likely to support regulations that would slow down the AI boom. But Donald Trump will still wield a veto, and Democrats are unlikely to hold enough seats to override it, so they will have a hard time implementing tax increases or regulations that markets tend to disfavor.\n\nWall Street pros tend to be just fine with gridlock, and that’s what they can largely expect if Democrats take back just one chamber of Congress. It will be hard to get anything done with the House and Senate split and Trump able to veto any legislation the parties do agree on."}, {"heading": "‘Paralyzed’ market", "summary": "The debate over AI is keeping IPOs stuck on the launchpad , with October on track for the slowest month of the year by volume for US stock market listings.\n\nIt’s a marked turn away from a roaring pace that saw $162.6 billion raised through the end of September.\n\nAI infrastructure companies including Nscale and DayOne Data Centers are pitching investors on their importance to the sector’s buildout, yet with shares of peers such as CoreWeave plunging, investors’ appetite for risk-taking has evaporated.\n\nHanging over it all, of course, is Anthropic’s debut, expected next month. Companies gauging investors’ willingness to back their IPOs are clamoring for the firm behind Claude to deliver a win that would clear the decks. Billions of dollars of capital and months of preparations are hanging in the balance."}]}}, "2026-10-22": {"date": "2026-10-22", "morning": {"hook": "스페이스X 훈풍, 佛10년물 5%", "line": "뉴욕증시는 스페이스X의 블록버스터급 실적 호조에 인공지능(AI) 투자 지속 가능성에 대한 우려가 완화되면서 기술주를 중심으로 상승했다.", "markets": [{"name": "S&P 500", "value": "7,757.17", "change": "+0.6%"}, {"name": "Nasdaq 100", "value": "29,822.52", "change": "+1.1%"}, {"name": "US 10Y", "value": "5.12%", "change": "+0.01"}, {"name": "USD/KRW", "value": "₩1,327.09", "change": "+0.0%"}, {"name": "Bloomberg Dollar", "value": "1,221.12", "change": "+0.1%"}, {"name": "Brent", "value": "$109.45", "change": "+0.6%"}], "items": [{"n": 1, "headline": "佛10년물 5% 돌파…독일과 금리차 15년 최대", "summary": "프랑스 10년물 국채 금리가 2002년 이후 처음으로 5%를 돌파했다. 에너지 가격 상승이 재정 전망에 대한 우려를 키우면서 독일 10년물과의 금리차는 159.4bp로 확대돼 15년 만에 최대를 기록했다. 생활비 급등에 따른 폭력 시위와 막대한 부채 부담까지 겹치면서 프랑스가 재정적자를 줄일 예산안을 통과시킬 수 있을지에 대한 투자자들의 의구심이 커지고 있다. 프랑스발 불안에 유로화도 한때 0.2% 하락했다."}, {"n": 2, "headline": "푸틴, 美·우크라와 3자협상 재개 제안…억류 미국인 석방", "summary": "블라디미르 푸틴 러시아 대통령이 우크라이나 전쟁 종식을 위한 미국·우크라이나와의 3자 협상을 재개할 준비가 돼 있다고 밝혔다. 스티브 위트코프 미 대통령 특사와 만난 푸틴은 11월 초 3자 협상을 제안했으며, 크렘린궁은 전쟁 이후 러시아와 우크라이나의 안보 체제 구축이 주요 논의 대상이라고 밝혔다. 다만 푸틴이 우크라이나와 직접 협상할 준비가 됐다는 신호는 아직 없으며, 크렘린궁은 위트코프가 전달한 우크라이나·유럽 측 제안에 대해서도 유용한 내용이 상대적으로 적었다고 평가했다."}, {"n": 3, "headline": "금리 급등에 美·유럽 부채발행 줄줄이 연기…신용시장 냉각", "summary": "금리 상승과 인플레이션 재점화, AI 투자 붐의 균열 가능성에 대한 우려가 커지면서 이달 미국과 유럽에서 50억달러가 넘는 기업 부채 발행이 연기 됐다. 채권과 대출 발행을 미룬 기업은 적어도 7곳으로, 올해 들어 발행 연기가 가장 집중된 모습이다. 미국 정크본드 발행액도 9월 510억달러에서 이달 현재 약 70억달러로 급감했다. AVI-SPL은 6억9천만달러 규모의 레버리지론 조달을 철회했고, 프레디맥은 충분한 수요를 확보하지 못해 4억4천만달러 이상의 모기지 채권 발행을 연기했다. 유럽에서는 서켓이 30억유로 규모의 차환 계획을 미뤘다."}, {"n": 4, "headline": "고금리가 만든 회사채 기회…블랙록 “한 세대 최고 수익률”", "summary": "고금리로 기업들의 자금조달 부담이 커지는 가운데 블랙록은 회사채 투자자에게는 오히려 이례적인 기회가 열리고 있다고 진단했다. 현재 듀레이션 3년 미만, 평균 신용등급 A-인 분산 채권 포트폴리오로도 7%가 넘는 수익률을 확보할 수 있다는 분석이다. 회사채 수익률은 3년 전 잠시 나타났던 수준과 글로벌 금융위기 당시를 제외하면 보기 어려울 정도로 높아졌다. 블랙록은 이를 “한 세대에 한 번 볼 정도로 높은 수익률”이라며, 2010년대나 2020년대 초반과 달리 상대적으로 안전한 자산에서도 높은 수익을 얻을 수 있다고 설명했다."}, {"n": 5, "headline": "미국채 큰손 바뀐다…‘패스트머니’ 영향력 확대", "summary": "미국채 금리가 수십 년 만의 최고 수준으로 치솟은 가운데 미 정부가 가격에 민감한 민간 투자자들에게 갈수록 의존하고 있다. 32조달러 규모로 성장한 미국채 시장에서 민간 투자자들은 현재 연방정부 부채의 약 70%를 보유해 1990년 이후 최고 수준에 근접했다. 과거 주요 매수자였던 외국 정부와 중앙은행, 연기금 등 가격에 상대적으로 둔감한 ‘슬로 머니’의 영향력이 줄어든 반면, 원하는 수익률이 나오지 않으면 빠르게 이탈할 수 있는 헤지펀드 등 ‘패스트 머니’의 영향력이 커지고 있다. 블룸버그 이코노믹스는 연준과 외국 공공기관의 미국채 보유 감소가 한때 10년물 기간 프리미엄을 약 105bp 높인 것으로 추산했다."}]}, "daily": {"headline": "No patience for tech", "sections": ["No patience", "Nowhere to hide"]}}, "2026-10-21": {"date": "2026-10-21", "morning": {"hook": "AI 옥석가리기, 佛증시 ‘최대숏’", "line": "뉴욕증시는 기술주 변동성에도 기업 실적에 대한 기대와 유가 하락에 힘입어 상승했다.", "markets": [{"name": "S&P 500", "value": "7,712.57", "change": "+0.3%"}, {"name": "Nasdaq 100", "value": "29,490.28", "change": "-0.1%"}, {"name": "US 10Y", "value": "5.11%", "change": "-0.03"}, {"name": "USD/KRW", "value": "₩1,326.61", "change": "-0.0%"}, {"name": "Bloomberg Dollar", "value": "1,220.50", "change": "-0.2%"}, {"name": "Brent", "value": "$108.97", "change": "-0.5%"}], "items": [{"n": 1, "headline": "佛 정치·재정 불안에 자산기피…CAC40 ‘최대 숏’", "summary": "프랑스 의 정치·재정 불안이 금융시장 전반으로 번지면서 주식과 채권이 동시에 투자자들의 외면을 받고 있다. 프랑스 10년물 국채 금리의 독일 국채 대비 스프레드는 20일 150bp를 웃돌며 마감했다. 2012년 1월 이후 처음으로, 당시 그리스에서 시작해 아일랜드와 포르투갈, 스페인 등으로 확산된 유럽 재정위기 절정기에 근접한 수준이다. 생활비 급등에 항의하는 시위와 높은 국가부채·재정적자에 대한 우려가 투자심리를 압박하고 있다."}, {"n": 2, "headline": "프랭클린템플턴 ‘유로존 부채위기 2.0’ 경고", "summary": "프랑스 국채 매도세가 과거 그리스에서 시작된 위기를 능가하는 ‘유로존 부채위기 2.0’으로 번질 위험이 있다고 프랭클린템플턴이 경고했다. 소날 데사이 채권부문 글로벌 CIO는 위기가 현실화할 경우 과거보다 “훨씬 더 심각할 수 있다”며, 프랑스 부채가 당시 그리스의 10배가 넘는다고 지적했다. 그는 “단순한 구제금융은 선택지가 될 수 없다”면서 “유로존에서 상당한 변동성이 발생할 가능성을 과소평가해서는 안 된다”고 강조했다."}, {"n": 3, "headline": "AI 옥석가리기…IPO·주가 ‘휘청’", "summary": "AI 투자 열기가 옥석가리기로 전환되면서 데이터센터 컴퓨팅을 제공하는 ‘ 네오클라우드 ’에 대한 투자자들의 신뢰가 흔들리고 있다. 한국의 엘리스는 20일 상장 첫날 32% 급락했고, 호주 퍼머스 그리드는 기업가치 300억달러를 목표로 한 IPO 계획을 철회했다. 영국 엔스케일도 목표 기업가치에 대한 투자자들의 반발에 직면했으며, 코어위브는 과도한 차입 우려로 지난주 주가가 20% 넘게 떨어졌다."}, {"n": 4, "headline": "美 주택시장 한파…미결판매 사상 최저·착공 5.2%↓", "summary": "미국의 주택시장 부진이 심화되고 있다. 9월 미결주택판매지수는 전월보다 7.3% 급락한 66으로 2001년 통계 작성 이후 사상 최저를 기록했다. 하락폭은 블룸버그가 조사한 모든 이코노미스트의 예상을 넘어섰으며, 서부가 9.2%, 최대 주택판매 지역인 남부가 8.2% 감소하는 등 전 지역에서 판매가 줄었다. 전미부동산중개인협회(NAR)는 모기지 금리가 빠르게 오르면서 매수자와 매도자 모두 금리 여건이 개선되기를 기다리고 있다고 진단했다."}, {"n": 5, "headline": "AI 열풍에 헤지펀드 대출 수요 폭증…바클레이스 자본 재배분", "summary": "아시아 AI 관련주 급등으로 헤지펀드의 대출 수요가 급증하자 바클레이스 가 내부 자본까지 재배분해 대응했다. 바클레이스는 여름 동안 아시아 헤지펀드 고객에게 제공할 수 있는 금융 한도에 도달하자 내부 경매를 통해 매크로 금리 트레이딩 부문에 배정된 자본 일부를 프라임 파이낸싱 사업으로 돌렸다. 수익성이 높은 프라임 브로커리지에 대차대조표를 더 배정해 AI 투자 열풍에 따른 헤지펀드의 자금 수요를 충족하기 위해서다."}]}, "daily": {"headline": "SpaceX-Tesla talk gets real", "sections": ["Musk’s mashup dreams", "Fast money power"]}}, "2026-10-20": {"date": "2026-10-20", "morning": {"hook": "반도체 반등, 프랑스 국채불안", "line": "인공지능(AI) 투자 붐이 견조한 기업 실적을 계속 뒷받침할 것이라는 기대 속에 저가 매수세가 유입되면서 반도체주가 모처럼 반등해 뉴욕증시를 끌어올렸다.", "markets": [{"name": "S&P 500", "value": "7,690.73", "change": "+0.4%"}, {"name": "Nasdaq 100", "value": "29,529.34", "change": "+1.2%"}, {"name": "US 10Y", "value": "5.14%", "change": "+0.07"}, {"name": "USD/KRW", "value": "₩1,332.44", "change": "-0.0%"}, {"name": "Bloomberg Dollar", "value": "1,223.20", "change": "+0.1%"}, {"name": "Brent", "value": "$109.18", "change": "-0.6%"}], "items": [{"n": 1, "headline": "JP모간 “코어위브 부채 우려 과도”", "summary": "JP모간은 코어위브 의 급증하는 부채와 현금 소진에 대한 투자자들의 우려가 과도하다며 사업모델은 여전히 견조하다고 평가했다. 자금조달 수요가 개별 프로젝트의 수익성 악화가 아니라 빠른 사업 확장에서 비롯되고 있다는 분석이다. 컴퓨팅 수요가 강한 데다 신규 설비 가동 전에 고객을 확보하는 ‘최소구매 보장 장기계약(take-or-pay)’을 맺고 있으며, 통상적인 5년 계약의 차입 효과를 제외한 내부수익률(IRR)은 10%대 중반으로 가중평균자본비용(WACC) 9~11%를 웃도는 것으로 추정했다."}, {"n": 2, "headline": "프랑스 시위에 국채 불안 재점화", "summary": "프랑스 에서 생활비 부담에 항의하는 폭력 시위가 주말 동안 격화하면서 재정·정치 불안이 다시 금융시장을 압박했다. 프랑스 국채가 유럽 주요국 대비 약세를 보이면서 독일 10년물과의 금리차는 장중 최대 8bp 확대된 146bp로 2주 만에 가장 높은 수준을 기록했고, 이탈리아 국채와의 금리차도 사상 최대 수준으로 벌어졌다. CAC 40 지수는 장중 최대 1.7% 하락했고 유로화도 달러 대비 한때 0.5% 밀렸다. 투자자들이 프랑스 국채를 갈수록 위험한 자산으로 평가하면서 월초에는 독일 10년물과의 금리차가 150bp를 넘어 유로존 재정위기 이후 가장 높은 수준으로 확대된 바 있다."}, {"n": 3, "headline": "메르츠 “유럽, 러시아 위협 과소평가”", "summary": "프리드리히 메르츠 독일 총리는 유럽이 러시아의 위협을 충분히 심각하게 받아들이지 않고 있다며, 블라디미르 푸틴 대통령의 목표는 단순히 우크라이나 영토를 차지하는 데 그치지 않고 유럽의 민주주의와 정치 질서를 흔드는 것이라고 경고했다. 그는 러시아가 “민주주의와 개방된 사회, 유럽 통합의 성공을 두려워한다”며 유럽 각국이 미국에 대한 의존도를 낮추고 나토 내에서 스스로를 방어할 수 있도록 방위체계를 강화해야 한다고 강조했다."}, {"n": 4, "headline": "美, 연방기관서 中딥시크 사용 금지", "summary": "트럼프 행정부가 국가안보 우려를 이유로 미국 연방정부 민간기관의 중국 AI 스타트업 딥시크 제품과 서비스 사용을 금지했다. 미 국토안보부가 연방관보에 게시한 공고에 따르면 연방기관들은 시스템에서 딥시크 제품을 모두 제거해야 하며, 딥시크의 연방정부 계약 참여도 금지된다. 미 행정부는 딥시크가 상당한 양의 민감한 사용자 데이터를 수집하고 있으며 중국 정보보안법에 따라 해당 데이터가 중국 정부와 공유될 가능성이 있다고 경고했다."}, {"n": 5, "headline": "머스크, 美 어린이에 스페이스X 주식 1주씩", "summary": "일론 머스크 가 내년 미국의 모든 어린이에게 스페이스X 주식을 1주씩 나눠주겠다는 구상을 밝혔다. 사안에 정통한 관계자에 따르면 머스크는 이를 ‘트럼프 계좌(Trump Accounts)’를 통해 지급하는 데 원칙적으로 합의했다. 미 인구조사국 추산 약 7200만명의 어린이를 대상으로 현재 주가를 적용하면 기부 규모는 약 107억달러에 달할 전망이다. 트럼프 계좌는 2025~2028년 태어난 미국 어린이들에게 1000달러를 제공하는 제도로, 마이클·수전 델 부부와 레이 달리오 등도 후원에 참여했다."}]}, "daily": {"headline": "AI bellwether in freefall", "sections": ["‘Fear and pessimism’", "Netflix slump"]}}, "2026-10-19": {"date": "2026-10-19", "morning": {"hook": "코어위브發 AI불안, 유가 110불", "line": "코어위브를 둘러싼 우려가 인공지능(AI) 투자 지속 가능성에 대한 의구심을 키우면서 기술주 매도세 속에 뉴욕증시가 16일 하락했다.", "markets": [{"name": "S&P 500", "value": "7,659.44", "change": "-1.1%"}, {"name": "Nasdaq 100", "value": "29,187.55", "change": "-2.5%"}, {"name": "US 10Y", "value": "5.07%", "change": "+0.01"}, {"name": "USD/KRW", "value": "₩1,334.25", "change": "-0.6%"}, {"name": "Bloomberg Dollar", "value": "1,222.47", "change": "-0.2%"}, {"name": "Brent", "value": "$109.86", "change": "+3.7%"}], "items": [{"n": 1, "headline": "코어위브 불안…AI 투자 놓고 공포와 낙관론 충돌", "summary": "AI 인프라 투자 열풍의 지속 가능성을 둘러싼 우려가 커지면서 코어위브 가 시장의 시험대로 떠올랐다. 주가는 일주일 사이에 25% 급락했고 회사채도 재무적 곤경을 시사하는 수준까지 떨어졌다. 5년물 신용부도스와프(CDS)는 사상 최고치로 치솟아 향후 5년 내 디폴트 가능성을 60% 넘게 반영했다. 미국채 금리 상승과 끈질긴 인플레이션으로 자금조달 비용이 높아지는 가운데, 데이터센터 건설을 위해 하이일드 채권에 크게 의존하는 코어위브의 부채 부담이 시장 경계의 초점이 되고 있다."}, {"n": 2, "headline": "브렌트유 110달러…유라시아 ‘확전 가능성 65%’", "summary": "브렌트유 가 중동과 러시아를 둘러싼 공급 차질 우려에 16일 장중 3.9% 뛰며 5월 이후 처음으로 배럴당 110달러를 터치했다. 후티 반군의 사우디아라비아 공격과 러시아·우크라이나의 에너지 인프라 공격이 이어지는 가운데, 미 하원의원들이 러시아와의 대규모 디젤 공급 합의를 저지하는 법안까지 발의하면서 공급 확대 기대가 약해졌다. 전쟁에 따른 공급 차질로 유가는 올해 들어 70% 넘게 올랐고, 유럽 디젤 선물은 두 배 이상 뛰는 등 정제유 시장의 수급 불안은 더욱 심각한 상황이다."}, {"n": 3, "headline": "美 재정적자 1.99조달러…이자비용 사상 최대", "summary": "미국의 2026회계연도 재정적자 가 1.99조달러로 전년보다 12% 늘며 4년 연속 2조달러 안팎을 기록했다. GDP의 약 6%에 달하는 규모로, 정부 지출이 7.4조달러로 6% 증가한 반면 세입은 5.4조달러로 3% 늘어나는 데 그쳤다. 특히 미국채 금리 상승과 부채 증가로 순이자비용이 사상 최대인 1.05조달러까지 불어나며 적자 확대의 주요 요인으로 작용했다."}, {"n": 4, "headline": "美재무부, 국채 입찰 규모 변경 가능성 의견 타진", "summary": "미국 재무부가 11월4일 분기 국채 발행 계획 발표를 앞두고 프라이머리 딜러들에게 투자자 수요의 구조적 변화를 감안해 향후 국채 입찰 규모를 어떻게 조정할 필요가 있는지 의견을 요청했다. 최근 확대된 장기물 바이백이 시장 유동성과 딜러들의 거래 중개 능력에 미친 영향과 추가 개선 방안도 질문했다. 대규모 재정적자와 높은 장기금리로 국채 공급 및 이자비용 부담이 커진 가운데 재무부가 만기별 발행 구성을 조정할지 시장의 관심이 쏠리고 있다."}, {"n": 5, "headline": "中, AI 수출통제 추진", "summary": "중국 이 대규모언어모델(LLM)과 AI 에이전트, 반도체 설계 등 첨단 AI 기술의 해외 이전을 제한하는 방안을 추진한다. 중국 정부가 공개한 초안에는 컴퓨팅 클러스터를 포함한 23개 AI 기술이 수출통제 대상으로 제시됐으며, 일정 기준을 넘는 AI 모델의 가중치와 소스코드도 포함된다. 규제 대상 모델을 해외에 배치하는 것 역시 기술 수출로 간주된다. 다만 이미 공개된 오픈소스 기술과 연구는 제외하고, 오픈소스 AI 수출에는 간소화된 허가 절차를 적용할 방침이다."}]}, "daily": {"headline": "France besieged", "sections": ["No good options", "Buckle up"]}}, "2026-10-16": {"date": "2026-10-16", "morning": null, "daily": {"headline": "Tech’s rough week", "sections": ["Tough week for tech", "Irresistible rally"]}}, "2026-10-15": {"date": "2026-10-15", "morning": {"hook": "美인플레 가속, 반도체 6일째↓", "line": "지난달 미국의 소비자물가가 5개월 만에 가장 빠른 속도로 상승하고 기조적 물가 압력도 예상보다 큰 폭으로 오르면서 연준 금리 인상 베팅이 강화됐다.", "markets": [{"name": "S&P 500", "value": "7,718.94", "change": "-1.1%"}, {"name": "Nasdaq 100", "value": "29,950.82", "change": "-2.0%"}, {"name": "US 10Y", "value": "5.19%", "change": "-0.02"}, {"name": "USD/KRW", "value": "₩1,340.50", "change": "+0.0%"}, {"name": "Bloomberg Dollar", "value": "1,228.35", "change": "+0.3%"}, {"name": "Brent", "value": "$106.19", "change": "+0.5%"}], "items": [{"n": 1, "headline": "美 9월 CPI 0.6% 상승…전방위적 물가 압력", "summary": "미 노동통계국(BLS)이 14일 발표한 자료에 따르면 9월 헤드라인 소비자물가지수(CPI) 는 연료비 급등에 전월 대비 0.6% 상승했다. 식품과 에너지를 제외한 근원 CPI는 0.3% 올랐다. 전년 동월 대비로는 각각 3.7%, 2.6%로 상승세가 더 가팔라졌다. 네이비페더럴크레디트는 “미국인들의 임금이 인플레이션으로 완전히 잠식되고 있다”며 “연준 역시 인플레이션 진전을 확인하지 못하고 있고, 연료 가격 상승은 다른 분야로 번지기 시작하고 있다”고 진단했다."}, {"n": 2, "headline": "시장 전문가들, 연준 인상 10월보다 12월에 무게", "summary": "리건 캐피털은 “인플레이션이 끈질기고 잘못된 방향으로 움직이고 있다는 점이 어느 때보다 분명하다”며 “연준이 10월에는 금리를 동결할 것으로 예상하지만, 12월에는 금리 인상을 재개할 것으로 본다”고 말했다. 프랭클린 템플턴 인스티튜트는 근원 CPI가 예상보다 뜨겁게 나오면서 추가 금리 인상의 근거가 강화됐지만, 최근 연준 인사들의 비둘기파적 발언을 감안하면 즉각적인 금리 인상의 문턱은 여전히 높다고 평가했다."}, {"n": 3, "headline": "반도체주 6일째 급락…시총 1조달러 넘게 증발", "summary": "금리 상승과 높은 밸류에이션, 막대한 AI 인프라 구축 비용에 대한 우려로 반도체주 매도세가 이어졌다. 필라델피아 반도체지수(SOX)는 4.3% 하락 마감해 최근 6거래일간 낙폭이 11%를 넘어섰고, 이 기간 미국 증시에 상장된 주요 반도체주의 시가총액은 1조달러 넘게 증발했다. SOX 구성 종목의 절반 이상이 최소 10% 하락했고 Arm홀딩스는 21% 급락했다."}, {"n": 4, "headline": "코어위브 채권 ‘부실’수준…CEO ‘시장 비이성적’", "summary": "AI 클라우드 업체 코어위브 의 2032년 만기 무담보 채권 가격이 달러당 80센트 아래로 급락해 통상 재무적 곤경을 나타내는 수준에 진입했다. 채권 수익률은 15%를 넘어섰고 주가도 장중 17% 넘게 급락했다. 코어위브를 AI의 “서브프라임 트랜치”라고 비유했던 D.A. 데이비드슨의 길 루리아는 회사가 9%에 자금을 조달해 5%의 수익을 내는 구조라면 사업 규모를 아무리 키워도 가치를 파괴할 수밖에 없다고 지적했다."}, {"n": 5, "headline": "중동·러시아 긴장 고조에 유가 상승", "summary": "중동과 러시아를 둘러싼 무력 충돌이 격화하면서 원유 공급 차질 우려가 다시 커지고 있다. 예멘 후티 반군이 사우디아라비아 전역에 미사일과 드론 공격을 가해 사우디 아람코 본사까지 타격한 데다, 호르무즈 해협에서는 이란의 유조선 공격이 늘어난 가운데 화물선 한 척이 피격된 뒤 침몰 했다는 소식도 전해졌다. 브렌트유는 배럴당 106달러를 웃돌았고 WTI는 장중 2% 상승했다."}]}, "daily": {"headline": "Calm no more", "sections": ["Calm shattered", "CoreWeave’s ‘yikes’ moment"]}}, "2026-10-14": {"date": "2026-10-14", "morning": {"hook": "AI균열우려, 구원투수 윌리엄스", "line": "인공지능(AI) 투자 열풍의 지속 가능성에 대한 우려로 반도체주 매도세가 이어졌지만, 연준의 공격적인 추가 긴축 우려가 후퇴하면서 뉴욕증시는 낙폭을 대부분 만회했다.", "markets": [{"name": "S&P 500", "value": "7,805.45", "change": "-0.0%"}, {"name": "Nasdaq 100", "value": "30,569.48", "change": "-0.3%"}, {"name": "US 10Y", "value": "5.21%", "change": "-0.03"}, {"name": "USD/KRW", "value": "₩1,343.12", "change": "+0.1%"}, {"name": "Bloomberg Dollar", "value": "1,225.19", "change": "-0.2%"}, {"name": "Brent", "value": "$106.13", "change": "-0.5%"}], "items": [{"n": 1, "headline": "AI 투자 열풍 곳곳서 균열", "summary": "글로벌 AI 투자 열풍에 균열 조짐이 커지고 있다. 특히 중국 CXMT의 반도체 기술 돌파구 소식으로 메모리 반도체주에 대한 경계감이 커진 가운데, 투자자들은 AI에 쏟아붓는 막대한 자금이 그동안의 가파른 주가 상승을 정당화할 만큼 충분한 수익으로 이어질지 주시하고 있다. UBP는 메모리주에서 투자자들이 “일단 팔고 나중에 생각하자”는 분위기라고 전했고, 로터스자산운용은 중국 CXMT의 생산능력 확대가 가격 경쟁을 촉발할 수 있다고 우려했다."}, {"n": 2, "headline": "윌리엄스 “올 한차례 추가 인상…내년은 불필요”", "summary": "존 윌리엄스 뉴욕 연은 총재는 “한 차례 더 금리를 인상하는 것이 적절할 수 있다는 견해에는 변화가 없다”며 “그 이후 추가 조치가 필요하다고 믿을 만한 이유는 현재로서는 없다”고 말했다. 관세와 에너지 가격 충격이 약해지면서 인플레이션이 내년 연준의 2% 목표에 근접할 것으로 예상하기 때문이다. 이는 12월 인상에 이어 2027년 두 차례 추가 인상을 반영하고 있는 시장 전망보다 비둘기파적인 견해다. 다만 그는 전망의 불확실성이 크다며 특히 AI 인프라 투자에 따른 물가 압력을 주시하고 있다고 밝혔다."}, {"n": 3, "headline": "배스먼 “美20년물 금리 6% 넘으면 악몽”", "summary": "채권시장 변동성 지수를 고안한 할리 배스먼은 미국채 20년물 금리가 6%를 넘어설 경우 1100억달러 규모의 20년물이 발행되는 것과 맞먹는 매도 압력이 발생하는 “악몽의 시나리오”가 펼쳐질 수 있다고 경고했다. 최근 금리 급등으로 만기가 긴 채권이 국채선물의 최저가인도채권(CTD)으로 바뀌면서, 금리 상승 시 가격 하락 위험이 더 큰 장기물에 대한 익스포저가 확대되고 있다는 설명이다."}, {"n": 4, "headline": "월가 은행 실적…주식 트레이딩 호조·채권은 엇갈려", "summary": "미국 대형 은행들의 3분기 실적이 엇갈렸다. JP모간체이스 와 골드만삭스 는 주식 트레이딩에서 호조를 보인 반면 채권 부문은 기대에 못 미쳤다. JP모간의 FICC 트레이딩 수익은 전년 동기 대비 4% 감소해 2년여 만에 처음으로 줄었지만, 주식 트레이딩 수익은 49% 급증해 3분기 기준 사상 최고치를 기록했다. 올해 순이자수익(NII) 전망도 1062억달러로 상향했다. 제이미 다이먼 최고경영자(CEO)는 “대규모 재정적자와 끈질긴 인플레이션, 높은 자산가격, 금리 상승, 지정학적 여건이 계속해서 수면 아래에서 변화하고 있다”며 “광범위한 결과에 대비하고 있다”고 밝혔다."}, {"n": 5, "headline": "호르무즈 선박 공격 급증...사우디 아람코 본사 피격", "summary": "이란 이 호르무즈 해협을 통과하는 선박에 대한 공격을 늘리면서 최근 회복세를 보이던 페르시아만 원유 수출이 다시 위협받고 있다. 지난 11일 유조선 4척이 피격된 가운데 초대형 유조선 10여 척과 여러 척의 수에즈막스급 선박이 호르무즈 입구 인근 푸자이라에 접근하다 회항하거나 항로를 되돌렸다. 해운업계에서는 선박 간 환적 대기시간이 길어지는 등 운송 둔화 조짐도 나타나고 있다."}]}, "daily": {"headline": "Beating the pros", "sections": ["Garage trading", "Bond traders dethroned"]}}, "2026-10-13": {"date": "2026-10-13", "morning": {"hook": "美20년물 폐지? 에너지휴전 삐걱", "line": "뉴욕증시는 본격적인 어닝시즌 개막을 앞두고 반도체주가 4거래일 연속 약세를 보이면서 혼조세로 마감했다.", "markets": [{"name": "S&P 500", "value": "7,807.24", "change": "-0.1%"}, {"name": "Nasdaq 100", "value": "30,664.70", "change": "-0.7%"}, {"name": "USD/KRW", "value": "₩1,334.80", "change": "+0.0%"}, {"name": "Bloomberg Dollar", "value": "1,227.38", "change": "+0.1%"}, {"name": "Brent", "value": "$106.65", "change": "+1.8%"}], "items": [{"n": 1, "headline": "러-우크라 ‘에너지 휴전’ 삐걱·중동 긴장↑…유가불안", "summary": "트럼프 대통령이 발표한 러시아와의 ‘ 에너지 휴전 ’이 삐걱이고 중동에서는 사우디아라비아가 이란 전쟁 발발 이후 가장 치명적인 공격을 받으면서 브렌트유 가 장중 2% 넘게 올라 배럴당 107달러를 상회했다. 젤렌스키 우크라이나 대통령은 러시아가 자국의 에너지 인프라를 계속 공격하고 있는 만큼 우크라이나도 공격을 이어갈 것이라고 밝혔다. 그는 트럼프 대통령이 전날 트루스소셜을 통해 발표한 휴전 소식을 언론 보도를 통해 알게 됐다며 “푸틴 러시아 대통령이 트루스소셜을 읽지 않는 게 분명하다”고 말했다."}, {"n": 2, "headline": "다시 고개드는 미국채 20년물 폐지론", "summary": "월가에서 미국채 20년물 폐지론이 제기되는 가운데 11월4일 재무부의 분기 국채발행계획에 관심이 쏠리고 있다. 도이체방크는 “20년물 미국채 발행이 중단될 것이라는 이야기가 나오고 있다“고 전했고, 씨티그룹은 20년물 발행이 축소되거나 아예 중단될 가능성을 감안해 20년물이 10년물보다 강세를 보일 것에 대비하라고 권고했다. 논쟁의 중심에는 재무부의 차입비용 절감이 있다. 2020년 재무장관 재임 당시 20년물을 부활시킨 스티븐 므누신조차 2024년엔 ”납세자에게 비용만 많이 든다“며 폐지를 주장했다."}, {"n": 3, "headline": "美채권 매도세 끝나나…월가, 듀레이션 매력 주목", "summary": "미국채 금리가 수년 만의 최고 수준으로 치솟은 뒤 월가에서는 채권의 투자 매력이 높아졌다는 평가가 나오고 있다. 골드만삭스는 신용시장 불안 조짐과 기술적 위험 완화를 근거로 듀레이션이 매력적인 수준이라며 10년물 반등 가능성을 제기했다. 모간스탠리도 이례적으로 높은 성장률과 물가 압력이 지속되지 않는 한 현재 미국채 금리가 매력적이라고 평가했다. 씨티그룹은 인플레이션과 임금 상승세 둔화를 이유로 단기물을 선호했다."}, {"n": 4, "headline": "골드만, 글로벌 주식 단기 전망 ‘비중확대’", "summary": "골드만삭스 가 강한 기업 실적을 이유로 사상 최고치 부근에서 거래되고 있는 글로벌 주식에 대해 단기적으로 낙관적인 전망으로 돌아섰다. 크리스티안 뮐러-글리스만이 이끄는 전략팀은 유가와 채권금리 상승으로 최근 랠리가 주춤하면서 주식 밸류에이션 부담이 낮아진 반면 기업 이익 전망은 여전히 양호하다고 진단했다. 이에 3개월 주식 전망을 ‘중립’에서 ‘비중확대’로 상향해 기존 12개월 강세 전망과 같은 수준으로 맞췄다."}, {"n": 5, "headline": "메타, 새 AI 모델 ‘뮤즈 원더’ 공개", "summary": "메타플랫폼스 가 새로운 인공지능(AI) 모델 ‘뮤즈 원더(Muse Wonder)’를 공개하자 주가가 장중 4.7% 가까이 뛰었다. 내부 코드명 ‘워터멜론’으로 개발된 이 모델은 마크 저커버그 최고경영자(CEO)가 AI 조직을 전면 개편한 이후 내놓은 가장 강력한 모델이다. 메타는 코딩과 금융·법률 문제 해결에서 오픈AI의 챗GPT와 앤트로픽의 클로드에 필적하는 ‘프런티어급 역량’을 갖췄다고 주장했다."}]}, "daily": {"headline": "AI exposure", "sections": ["Roll of the dice", "Growth shield"]}}}, "weeks": {"2026-11-12": {"start": "2026-11-06", "end": "2026-11-12", "span": ["2026-11-06", "2026-11-07", "2026-11-08", "2026-11-09", "2026-11-10", "2026-11-11", "2026-11-12"], "issues": [], "themes": [{"name": "Macro", "days": 4, "narrative": "변화없음.", "hits": [{"date": "2026-11-11", "series": "아침", "headline": "연준 50bp인상? 앤트로픽 승부수", "cited": false}, {"date": "2026-11-11", "series": "아침", "headline": "연준 빅스텝론 부상", "cited": false}, {"date": "2026-11-11", "series": "아침", "headline": "예상 웃돈 美근원 CPI", "cited": false}, {"date": "2026-11-11", "series": "아침", "headline": "미국채 10년물 다시 5%", "cited": false}, {"date": "202     const datesEl = document.querySelector("#dates");
    const weekDatesEl = document.querySelector("#week-dates");
    const hookEl = document.querySelector("#hook");
    const dekEl = document.querySelector("#dek");
    const marketsEl = document.querySelector("#markets");
    const morningEl = document.querySelector("#morning");
    const fiveSection = document.querySelector("#five-section");
    const fiveEl = document.querySelector("#five");
    const commentarySection = document.querySelector("#commentary-section");
    const commentaryEl = document.querySelector("#commentary");
    const dailySection = document.querySelector("#daily-section");
    const dailyEl = document.querySelector("#daily");
    const themeList = document.querySelector("#theme-list");
    const viewDay = document.querySelector("#view-day");
    const viewThemes = document.querySelector("#view-themes");
    let selected = DATA.dates.find((day) => DATA.days[day].morning) || DATA.dates[0];
    let weekEnd = DATA.today && DATA.weeks[DATA.today] ? DATA.today : DATA.dates[0];

    function tone(change) {
      const value = String(change || "").trim();
      if (value.startsWith("+") && !value.startsWith("+0.0")) return "up";
      if (value.startsWith("-") || value.startsWith("−")) return "down";
      return "flat";
    }

    function shortDate(day) {
      const [, month, date] = day.split("-");
      return `${Number(month)}/${Number(date)}`;
    }

    function renderCalendar(el, selectedDate, rangeStart, rangeEnd) {
      const byMonth = new Map();
      for (const day of DATA.dates) {
        const key = day.slice(0, 7);
        if (!byMonth.has(key)) byMonth.set(key, []);
        byMonth.get(key).push(day);
      }
      el.innerHTML = [...byMonth.keys()].sort().reverse().map((key) => {
        const [year, month] = key.split("-").map(Number);
        const present = new Set(byMonth.get(key));
        const lastDay = Math.max(...[...present].map((day) => Number(day.slice(8))));
        const start = new Date(year, month - 1, 1).getDay();
        const lead = (start + 6) % 7;
        const cells = [];
        for (let i = 0; i < (lead > 4 ? 0 : lead); i += 1) cells.push("<span></span>");
        for (let day = 1; day <= lastDay; day += 1) {
          const dow = new Date(year, month - 1, day).getDay();
          if (dow === 0 || dow === 6) continue;
          const iso = `${key}-${String(day).padStart(2, "0")}`;
          const inRange = Boolean(rangeStart) && iso >= rangeStart && iso <= rangeEnd && iso !== selectedDate;
          cells.push(present.has(iso)
            ? `<button type="button" data-date="${iso}" class="${inRange ? "in" : ""}" aria-selected="${iso === selectedDate}" aria-label="${month}월 ${day}일">${day}</button>`
            : `<span class="off">${day}</span>`);
        }
        return `
          <section>
            <p class="cal-month">${month}월</p>
            <div class="cal-dow"><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span></div>
            <div class="cal-grid">${cells.join("")}</div>
          </section>
        `;
      }).join("");
    }

    function renderDates() {
      renderCalendar(datesEl, selected, "", "");
    }

    function renderWeekDates() {
      const week = DATA.weeks[weekEnd];
      renderCalendar(weekDatesEl, weekEnd, week.start, week.end);
    }

    function renderDay() {
      const day = DATA.days[selected];
      const morning = day.morning;
      const daily = day.daily;
      hookEl.textContent = (morning && morning.hook) || (daily && daily.headline) || "이 날의 레터";
      const line = (morning && morning.line) || "";
      dekEl.hidden = !line;
      dekEl.textContent = line;
      const markets = (morning && morning.markets) || [];
      marketsEl.innerHTML = markets.map((row) => `
        <article class="market">
          <div class="name">${row.name}</div>
          <div class="value"><strong>${row.value}</strong><span class="${tone(row.change)}">${row.change}</span></div>
        </article>
      `).join("");
      const items = (morning && morning.items) || [];
      morningEl.innerHTML = items.length
        ? items.map((item) => `
          <li>
            <button type="button" class="fold" aria-expanded="false">
              <span class="num">${item.n}</span><span>${esc(item.headline)}</span>
            </button>
            ${item.summary ? `<p class="summary">${esc(item.summary)}</p>` : ""}
          </li>
        `).join("")
        : `<p class="empty">이 날은 오늘 아침 5가지가 없습니다.</p>`;
      const brief = Boolean(daily && daily.five);
      fiveSection.hidden = !brief;
      commentarySection.hidden = !brief;
      dailySection.hidden = brief;
      if (brief) {
        const lines = daily.five;
        fiveEl.innerHTML = lines.length
          ? lines.map((line, index) => `<li><span class="num">${index + 1}</span><span>${esc(line)}</span></li>`).join("")
          : `<p class="empty">이 날은 5 things가 없습니다.</p>`;
        const notes = daily.commentary || [];
        commentaryEl.innerHTML = notes.length
          ? notes.map((note) => `
            <li>
              <button type="button" class="fold" aria-expanded="false"><span>${esc(note.heading)}</span></button>
              ${note.summary ? `<div class="summary">${note.summary.split(/\n\n/).map((part) => `<p>${esc(part)}</p>`).join("")}</div>` : ""}
            </li>
          `).join("")
          : `<p class="empty">이 날은 commentary가 없습니다.</p>`;
        return;
      }
      const sections = (daily && daily.sections) || [];
      const title = daily && daily.headline ? `<li><span class="series">제목</span><span>${esc(daily.headline)}</span></li>` : "";
      dailyEl.innerHTML = daily
        ? title + sections.map((heading) => `<li><span class="series"></span><span>${esc(heading)}</span></li>`).join("")
        : `<p class="empty">이 날은 Markets Daily가 없습니다.</p>`;
    }

    function esc(value) {
      return String(value || "").replace(/[&<>]/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[ch]));
    }

    function renderThemes() {
      const week = DATA.weeks[weekEnd];
      const issues = week.issues || [];
      renderWeekDates();
      themeList.innerHTML = issues.length ? issues.map((issue) => `
        <article class="theme issue" aria-expanded="true">
          <div class="issue-head"><strong>${esc(issue.name)}</strong><span class="count">${issue.days}일${issue.metric ? ` · ${esc(issue.metric.name)}` : ""}</span></div>
          <div class="board">
            ${week.span.map((day) => {
              const point = issue.metric && issue.metric.points[day];
              const quote = issue.metric
                ? (point ? `<p class="quote ${tone(point.change)}"><strong>${esc(point.value)}</strong><span>${esc(point.change)}</span></p>` : `<p class="quote"></p>`)
                : "";
              return `<div class="cell"><span class="d">${shortDate(day)}</span><p class="line">${esc(issue.cells[day] || "")}</p>${quote}</div>`;
            }).join("")}
          </div>
          ${issue.hits.length ? `<button type="button" class="expand" aria-expanded="false">펼치기</button>` : ""}
          <ul class="hits">
            ${issue.hits.map((hit) => `<li><span>${shortDate(hit.date)}</span><span class="series">${esc(hit.series)}</span><span>${esc(hit.headline)}</span></li>`).join("")}
          </ul>
        </article>
      `).join("") : `<p class="empty">이 7일에는 이틀 이상 이어진 이슈가 없습니다.</p>`;
    }

    function toggleFold(event) {
      const button = event.target.closest(".fold");
      if (!button) return;
      const open = button.getAttribute("aria-expanded") === "true";
      button.setAttribute("aria-expanded", open ? "false" : "true");
    }
    morningEl.addEventListener("click", toggleFold);
    commentaryEl.addEventListener("click", toggleFold);

    datesEl.addEventListener("click", (event) => {
      const button = event.target.closest("button[data-date]");
      if (!button) return;
      selected = button.dataset.date;
      renderDates();
      renderDay();
    });
    weekDatesEl.addEventListener("click", (event) => {
      const button = event.target.closest("button[data-date]");
      if (!button || !DATA.weeks[button.dataset.date]) return;
      weekEnd = button.dataset.date;
      renderThemes();
    });

    document.querySelector("#tab-day").addEventListener("click", () => {
      viewDay.hidden = false;
      viewThemes.hidden = true;
      document.querySelector("#tab-day").setAttribute("aria-selected", "true");
      document.querySelector("#tab-themes").setAttribute("aria-selected", "false");
      document.querySelector("h1").textContent = "Day";
    });
    document.querySelector("#tab-themes").addEventListener("click", () => {
      viewDay.hidden = true;
      viewThemes.hidden = false;
      document.querySelector("#tab-day").setAttribute("aria-selected", "false");
      document.querySelector("#tab-themes").setAttribute("aria-selected", "true");
      document.querySelector("h1").textContent = "Weekly";
      renderThemes();
    });
    themeList.addEventListener("click", (event) => {
      const expand = event.target.closest(".expand");
      if (expand) {
        const open = expand.getAttribute("aria-expanded") === "true";
        expand.setAttribute("aria-expanded", open ? "false" : "true");
        expand.textContent = open ? "펼치기" : "접기";
        return;
      }
      const head = event.target.closest(".theme-head");
      if (!head) return;
      const theme = head.closest(".theme");
      const open = theme.getAttribute("aria-expanded") === "true";
      theme.setAttribute("aria-expanded", open ? "false" : "true");
      const list = theme.querySelector(".expand");
      if (open && list) {
        list.setAttribute("aria-expanded", "false");
        list.textContent = "펼치기";
      }
    });

    renderDates();
    renderDay();
    renderThemes();
    if (location.hash === "#weekly") document.querySelector("#tab-themes").click();
  </script>
</body>
</html>
