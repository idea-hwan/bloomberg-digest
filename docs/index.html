해 WTI가 배럴당 100달러 아래로 내려갔지만, 휘발유 가격 부담에 시달려온 민심을 돌리기에는 너무 늦었다는 지적이 나온다.", "markets": [{"name": "S&P 500", "value": "7,541.40", "change": "-0.5%"}, {"name": "Nasdaq 100", "value": "27,989.82", "change": "-1.4%"}, {"name": "US 10Y", "value": "4.91%", "change": "-0.02"}, {"name": "USD/KRW", "value": "₩1,346.39", "change": "+0.9%"}, {"name": "Bloomberg Dollar", "value": "1,221.02", "change": "-0.2%"}, {"name": "Brent", "value": "$104.18", "change": "-8.2%"}], "items": [{"n": 1, "headline": "미·이란 외교 돌파구 기대…유가급락", "summary": "이란 최고지도자 모즈타바 하메네이가 정부에 평화협상을 추진할 수 있는 권한을 부여하면서 미국과 이란 간 외교적 돌파구에 대한 기대가 커지고 있다. 마수드 페제시키안 대통령은 대화를 통한 문제 해결을 위해 최고지도자가 정부에 일정한 권한을 부여했다고 밝혔고, 압바스 아라그치 외무장관은 중재국을 통한 협의가 “매우 치열하게” 진행되고 있다며 미국이 이란의 조건을 수용할 경우 호르무즈 해협을 다시 개방하고 협상을 재개할 준비가 돼 있다고 말했다."}, {"n": 2, "headline": "메타·알파벳·오라클, AI 자금조달 러시", "summary": "메타 가 AI 투자 확대를 위해 최소 200억달러 규모의 글로벌 투자등급 채권 발행을 검토하고 있다. 투자자 수요에 따라 규모가 더 커질 수 있으며, 성사되면 6개월 만의 대규모 채권 발행이자 첫 유로화 채권 발행이 된다. 알파벳 도 2∼19년 만기의 유로화 채권으로 60억유로를 조달할 예정이며, 오라클 은 채권 100억달러와 비슷한 규모의 보통주를 합쳐 200억달러의 자금조달에 나섰다. 막대한 AI 투자의 수익성에 대한 회의론이 커지면서 투자자들은 빅테크 채권에 더 높은 프리미엄을 요구하고 있다."}, {"n": 3, "headline": "앤트로픽, 매출 급증 속 8950억달러 약정 부담", "summary": "인공지능(AI) 스타트업 앤트로픽 의 3분기 매출이 약 170억달러로 전년 동기 14억달러의 12배 수준으로 급증했다. 다만 향후 컴퓨팅과 인프라 등에 투입할 계약상 약정액도 8950억달러에 달하며, 이 가운데 약 4480억달러가 2030년 말까지 집행될 예정이다. 추수감사절 이전 IPO를 목표로 하는 앤트로픽은 스페이스X가 상장 당시 조달한 862억달러에 맞먹거나 이를 웃도는 자금 조달을 추진하고 있으며, 적정 기업가치는 약 1.4조∼1.5조달러로 거론된다."}, {"n": 4, "headline": "중국, ‘느린 강세장’ 위해 증시 지원 확대", "summary": "중국 당국이 최근 증시 급락에 대응해 시장 안정과 투자심리 회복을 위한 지원책을 확대한다. 중국인민은행(PBOC)은 증권사와 펀드, 보험사를 대상으로 한 스와프 제도를 적절한 시기에 가동하고 참여 기관 확대와 수수료 인하를 추진하기로 했다. 자사주 매입과 주요 주주의 지분 확대를 지원하는 재대출 금리는 1.25%에서 1%로 낮추고 제도를 상시화한다. 중국 증권감독관리위원회(CSRC)도 수일 내 3차 스와프 오퍼레이션을 시작하고 재대출 지원 대상을 주요 지수 구성 종목과 대표 기술기업 등으로 확대할 계획이다."}, {"n": 5, "headline": "골드만삭스, 트레이더·뱅커 일부 AI 도구 사용 제한", "summary": "골드만삭스 가 생산성과 리스크에 대한 검토를 거쳐 앤트로픽의 ‘클로드 코드’와 마이크로소프트의 깃허브 등 첨단 코딩용 AI 도구 사용을 엔지니어로 제한했다. 일부 트레이더들은 고객 거래 흐름 모니터링과 시장 변화·포지션 모델링, 콘텐츠 제작 등에 AI 도구를 활용해 업무 속도를 높여왔다며 불만을 나타낸 것으로 전해졌다. 다만 트레이딩과 퀀트 리서치, 소프트웨어 엔지니어링을 아우르는 ‘스트랫’ 직원들은 이번 제한 대상에서 제외됐다."}]}, "daily": {"headline": "China stimulus falls flat", "sections": ["China tries shock and awe", "Buoyant Bitcoin"], "five": ["US stock futures fell as oil prices rebounded on worries that America and Iran remain far apart on a peace deal. Voters go to the polls in the US.", "Apple shares are dropping 3.7% in premarket trading after the company warned that profit margins would be thinner than projected .", "Walt Disney is moving toward thousands of job cuts and asking some managers to target 20% in annual cost savings.", "Iran and the US are reviewing the latest proposals from mediators on how to bridge their divides and avert another round of all-out war .", "Meta is considering a potential bond offering of at least $20 billion in the wake of financings for Oracle and Alphabet to pay for AI projects."], "commentary": [{"heading": "China tries shock and awe", "summary": "China’s top economic officials are talking up openness in Hong Kong. Back on the mainland, authorities are showing investors just how active they remain in steering markets.\n\nAs Vice Premier He Lifeng pledged support for a free and open economic environment in Hong Kong , policymakers in Beijing were deploying an array of measures aimed at influencing asset prices. The central bank moved to cool the yuan’s longest winning streak in three decades, while regulators revived stock-market rescue tools and took steps to encourage more share buybacks.\n\nThe flurry of intervention highlights the balancing act Beijing faces as it seeks to attract global capital and promote the yuan internationally while retaining firm control over markets at home."}, {"heading": "Buoyant Bitcoin", "summary": "Since the record cyber theft against the world’s largest crypto exchange last week, traders bracing for the worst have instead watched Bitcoin defy gravity .\n\nThe cryptocurrency is changing hands at almost $77,000 today. It’s down roughly 6% from Thursday’s high before Binance disclosed the $6.3 billion hack. The response from Binance, which promised from the start to cover all losses, helped cushion the decline.\n\nBitcoin was already under pressure from a selloff in risk assets, so its relative buoyancy underscores how differently traders are treating the incident than the 2022 collapse of the exchange FTX. In that episode, Bitcoin fell 19% over three days as Sam Bankman-Fried’s company tumbled into bankruptcy.\n\n“The market treated this as an operational shock, not a systemic one,” said Kelly Ye at Talos. — Suvashree Ghosh and Sidhartha Shukla"}]}}, "2026-11-02": {"date": "2026-11-02", "morning": {"hook": "무자비한 AI 매도, 이란확전우려", "line": "11월 3일 미국 중간선거를 앞두고 기술주와 암호화폐에 대규모 매도가 쏟아지면서 뉴욕증시가 30일 급락했다.", "markets": [{"name": "S&P 500", "value": "7,580.07", "change": "-1.8%"}, {"name": "Nasdaq 100", "value": "28,384.85", "change": "-3.5%"}, {"name": "US 10Y", "value": "4.93%", "change": "-0.01"}, {"name": "USD/KRW", "value": "₩1,333.98", "change": "-0.6%"}, {"name": "Bloomberg Dollar", "value": "1,223.01", "change": "-0.1%"}, {"name": "Brent", "value": "$113.43", "change": "+2.4%"}], "items": [{"n": 1, "headline": "유가 다시 들썩…이란 확전 vs 외교 돌파구", "summary": "미국과 이란의 외교적 접촉이 다시 활발해지고 있지만 군사적 긴장이 높아지면서 국제유가의 추가 상승 위험도 커지고 있다. 모즈타바 하메네이 이란 최고지도자는 미국과 이스라엘의 유·무형 자산을 타격 범위에 두고 어떤 위협에도 “지리적 제한 없이” 대응하도록 군에 지시했다. 미국은 아직 이란 공습 재개 여부를 결정하지 않았다고 밝혔지만 미 중부사령부가 트럼프 대통령에게 군사적 선택지를 보고한 가운데, 브렌트유 는 30일 장중 배럴당 118달러를 터치했고 WTI도 한때 105달러에 육박했다. 최근 호르무즈 해협에서 유조선 두 척이 공격받은 점도 공급 차질 우려를 키우고 있다."}, {"n": 2, "headline": "월가, 기술주 가차없는 매도…이익 성장 정점 우려", "summary": "월가에서 기업 실적이 시장 기대에 못 미칠 경우 주가를 가차없이 끌어내리는 흐름이 두드러지고 있다. 아마존은 실망스러운 실적에 30일 장중 급락했고, 앞서 알파벳도 사상 최대 낙폭을 기록했다. 커뮤니케이션 서비스 업종에서는 실적이 기대에 못 미친 기업들이 블룸버그가 관련 자료를 집계하기 시작한 2019년 이후 가장 혹독한 매도세 에 시달렸고 기술업종도 비슷한 흐름이다. 특히 AI 관련 기업들의 이익 성장세가 정점을 지났을 수 있다는 우려가 투자자들의 민감도를 높이고 있다."}, {"n": 3, "headline": "S&P, 메타 신용등급 전망 ‘부정적’으로 하향", "summary": "S&P 글로벌 레이팅스가 인공지능(AI) 관련 대규모 지출로 재무 부담이 커지고 있다며 메타플랫폼스 의 ‘AA-’ 신용등급 전망을 ‘부정적’으로 하향했다. S&P는 메타의 AI 투자 수익화 능력이 동종업체보다 제한적인 데다 자본지출이 얼마나 오래 높은 수준을 유지하고 잉여영업현금흐름이 마이너스를 지속할지 불확실하다고 지적했다. 이번 조치는 향후 2년 내 등급 강등 가능성을 시사하지만 당장 강등을 검토하고 있다는 의미는 아니다. 메타는 S&P의 평가에 동의하지 않는다며 AI에서 상당한 제품 및 사업 기회를 보고 있다고 반박했다."}, {"n": 4, "headline": "연준 인사들 추가 금리인상 지지…점진적 긴축 강조", "summary": "연준 인사들이 추가 금리 인상 필요성을 잇따라 강조하면서도 경제와 금융시장에 미칠 충격을 줄이기 위해 점진적으로 긴축해야 한다는 데 한목소리를 냈다. 로리 로건 댈러스 연은 총재는 현재 전망을 감안할 때 “최소 두 차례 더 25bp씩” 금리를 올려야 한다며, 한 차례 회의를 건너뛰더라도 통화정책의 최종 목적지가 달라지는 것은 아니라고 말했다. 다만 두 차례 추가 인상 이후에는 경제와 금융시장 상황을 평가하기 위해 일단 멈춰 추가 긴축 필요성을 판단해야 한다고 덧붙였다."}, {"n": 5, "headline": "美 중간선거 교착에도 달러 강세 지속 전망", "summary": "미국 중간선거가 정국 교착으로 이어지더라도 높은 금리와 AI 관련 자금 유입을 바탕으로 달러 강세 가 지속될 수 있다는 전망이 나온다. 매뉴라이프는 선거 결과의 장기적 영향을 과대평가해서는 안 된다며 외환시장은 상대적인 성장률과 인플레이션, 금리, 자본 흐름에 더 크게 좌우된다고 지적했다. 씨티그룹은 과거 중간선거 이후, 특히 분점정부가 들어설 경우 달러가 약세를 보이는 경향이 있지만 이번에는 다른 요인들이 반대 방향을 가리키고 있어 약세가 나타나더라도 단기에 그칠 것으로 내다봤다."}]}, "daily": {"headline": "Betting on a stocks bounce", "sections": ["Midterm optimists"], "five": ["Oil slumped after Axios reported that Donald Trump wants to give diplomacy with Iran more time before any move to resume strikes. US stock-index futures advanced .", "Alphabet kicked off its second sale of euro bonds this year, testing investor demand less than a week after its disappointing earnings sent the stock to a record drop.", "Shares of Japanese memory-chip maker Kioxia sank 16% after the company’s cautious outlook inflamed concerns that the explosive growth driven by AI may be leveling off.", "Trump said a US-Canada trade deal is “very close” after talks with Prime Minister Mark Carney.", "Ray-Ban heir Leonardo Maria Del Vecchio proposed buying out family members at a reported €29.6 billion valuation, in a bid to keep the EssilorLuxottica eyewear fortune away from a Czech arms billionaire."], "commentary": [{"heading": "Midterm optimists", "summary": "Tomorrow’s midterm elections look set to upend the balance of power in the US Congress, if the polls are right. Bulls on stocks and the dollar, though, are betting that any market disruption is likely to be short lived.\n\nFirst up, stocks: The conventional wisdom is that a big win for Democrats will cause a selloff. The view is that the party is likely to put roadblocks in the way of the AI industry that’s been driving gains for the better part of four years. (The S&P 500 has returned 12% this year.)\n\nBut Mike Wilson from Morgan Stanley points out that history going back to 1950 is on the side of equity investors — six to 12 months after the midterms, the market is always higher.\n\n“The track record is pretty good,” he said. “Now we may need to go down first and then up, but yeah, I’m pretty convinced that we’re going to have a pretty good at least six month period, maybe 12.”"}]}}, "2026-10-30": {"date": "2026-10-30", "morning": {"hook": "AI ‘헝거게임’, 선거앞 이란압박", "line": "뉴욕증시는 일부 빅테크의 실적 실망에 막대한 인공지능(AI) 투자가 충분한 수익을 낼지에 대한 의구심이 되살아남에 따라 기술주를 중심으로 하락했다.", "markets": [{"name": "S&P 500", "value": "7,720.39", "change": "-0.3%"}, {"name": "Nasdaq 100", "value": "29,402.51", "change": "-1.4%"}, {"name": "US 10Y", "value": "4.94%", "change": "-0.08"}, {"name": "USD/KRW", "value": "₩1,340.53", "change": "-0.1%"}, {"name": "Bloomberg Dollar", "value": "1,224.69", "change": "+0.0%"}, {"name": "Brent", "value": "$115.54", "change": "+0.2%"}], "items": [{"n": 1, "headline": "알파벳 AI 투자 리스크 눈덩이", "summary": "알파벳 의 인공지능(AI) 투자와 관련한 잠재적 부담이 당초 알려진 것보다 큰 것으로 나타났다. 29일 공개된 분기 보고서에 따르면 알파벳은 1조달러 이상의 구매 약정과 향후 리스 등 미래 의무 외에도 특정 조건에서 부담해야 할 수 있는 약 985억달러의 우발적 약정을 보유하고 있다. 이는 한 분기 전보다 약 230억달러 증가한 규모로, 데이터센터 임대료 지급 보증과 파트너의 전력 장비 구매 보증, 고객에게 판매한 AI 칩 시스템을 되사야 할 수 있는 의무 등이 포함된다."}, {"n": 2, "headline": "마이크로소프트 대규모 회사채 발행", "summary": "마이크로소프트 가 거의 10년 만에 추진하는 대규모 회사채 발행에 한때 1150억달러가 넘는 주문이 몰렸다. 최소 250억달러 규모로 예상되는 이번 발행은 만기 2~40년의 최대 10개 트랜치로 구성되며, 미국 회사채 발행 사상 가장 강한 수요를 기록한 사례 중 하나다. AI 관련 채권 공급이 급증한 가운데서도 마이크로소프트가 무디스와 S&P글로벌로부터 받은 최고 등급 AAA와 6%를 웃돌 것으로 예상되는 장기채 금리가 투자자들을 끌어들인 것으로 풀이된다."}, {"n": 3, "headline": "이란, 밴스 서한 받아…이스라엘 총선 네타냐후 진영 53석", "summary": "이란 은 JD 밴스 미국 부통령이 보낸 서한을 받았지만 종전을 위한 기존 조건에서 물러설 생각이 없음을 시사했다. 갈리바프 이란 의회 의장은 “이란의 조건은 중재국들에 반복해서 명확하게 전달됐다”며 “당근과 채찍 방식은 이란에 아무런 효과가 없다”고 밝혔다. 다만 아라그치 외무장관은 이란군이 방어 준비가 돼 있다면서도 “외교가 성공할 기회를 계속 주고 있다”고 말했다. 밴스의 이례적인 접촉은 8개월째 이어진 전쟁을 끝내기 위한 협상이 교착상태에 빠진 가운데 트럼프 대통령이 이란에 대한 공습 재개를 거듭 경고하는 상황에서 이뤄졌다."}, {"n": 4, "headline": "美 성장·물가 강세…해싯 “물가 높으면 연준 행동”", "summary": "미국 경제 가 견조한 소비와 기업투자에 힘입어 3분기에 1년 만에 가장 빠른 속도로 성장했다. 3분기 실질 GDP는 연율 3.4% 증가해 2분기 2.2%에서 가속했고 시장 예상도 웃돌았다. 기업투자는 AI 관련 지출에 힘입어 2020년 이후 최대인 12.7% 급증했으며, 가계 소비도 2개 분기 연속 연율 3.8% 증가했다. 특히 장비 투자의 성장 기여도는 팬데믹 이후 반등기를 제외하면 2011년 이후 가장 높았다."}, {"n": 5, "headline": "ECB, 금리 동결...라가르드 조기 퇴임", "summary": "유럽중앙은행 (ECB)이 29일 금리를 동결한 가운데 크리스틴 라가르드 총재는 에너지발 인플레이션이 다른 부문으로 확산될 위험을 낮게 평가했다. ECB 정책위원들은 금리 인상 방안을 논의했지만, 급등한 에너지 가격이 과도한 임금 인상 요구나 기대 인플레이션의 뚜렷한 상승으로 이어지고 있다는 증거가 부족하다고 판단했다. 다만 라가르드는 ECB가 나아갈 방향은 “분명하다”며 추가 긴축 가능성을 열어뒀고, 시장도 한때 12월 25bp 인상 확률을 88%로 높였다."}]}, "daily": {"headline": "Tech slowdown", "sections": ["Tech slowdown", "Bond revival"], "five": ["Binance suffered the cryptocurrency industry’s biggest-ever hack , with $6.3 billion of funds affected. The exchange said it will cover all losses.", "Intel shares are plummeting 25% after the chipmaker’s forecast missed analysts’ estimates, hurt by sputtering demand for PC processors and supply-chain problems.", "Amazon’s slumping too, down 6.6%, after the company reported greater capital spending than anticipated and the slowest e-commerce growth in three years.", "US stock-index futures are dropping as those disappointing earnings accelerate a shift by investors out of tech stocks . Crude oil gained on signs the US may resume military strikes against Iran .", "BP’s profit surged to the highest in 18 years thanks to soaring oil-refining margins."], "commentary": [{"heading": "Tech slowdown", "summary": "The message from this week’s Big Tech earnings is hardly reassuring for investors .\n\nThe core businesses of America’s technology giants — the advertising, consumer and retail machines propping up a collective $750 billion in AI spending this year — are starting to show signs of slowing. In some cases, they’re being cannibalized by the very technology the companies are betting the house on.\n\nGoogle owner Alphabet reported that ad sales from search and other channels — accounting for roughly half of overall revenue — grew at the slowest pace in five quarters. Amazon said yesterday that growth in e-commerce and advertising slowed last quarter. Microsoft and Meta similarly posted results that ultimately underwhelmed investors."}, {"heading": "Bond revival", "summary": "Long-dated government bonds spent much of the year punishing anyone brave enough to own them. Now yields are high enough that some investors are coming back , particularly with stocks looking rocky.\n\nThe 10-year US Treasury peaked at almost 5.4% this month, the highest since 2002, while Japanese yields reached a three-decade high of 3.14%. They’ve since fallen, rewarding investors with a return of 2.2% in October on a gauge of global government bonds maturing in 10 years or more — the first month since February in which longer bonds outperformed shorter-term securities.\n\nThere are still plenty of skeptics out there though, who point out that the dangers that sent yields so high in the first place are still looming. Energy-driven inflation, tighter monetary policy and deteriorating government finances haven’t disappeared. The price of taking those risks has simply become more attractive."}]}}, "2026-10-29": {"date": "2026-10-29", "morning": {"hook": "‘비둘기’ 연준, 대이란 공격대비", "line": "연준이 시장 예상대로 기준금리를 동결하고 인플레이션 억제에 대한 의지를 재확인했지만, 12월 차기 회의에서 금리 인상 가능성에 대한 명확한 신호는 제시하지 않았다.", "markets": [{"name": "S&P 500", "value": "7,743.98", "change": "+0.3%"}, {"name": "Nasdaq 100", "value": "29,813.16", "change": "+0.5%"}, {"name": "US 10Y", "value": "5.02%", "change": "+0.02"}, {"name": "USD/KRW", "value": "₩1,342.83", "change": "+0.0%"}, {"name": "Bloomberg Dollar", "value": "1,224.08", "change": "-0.1%"}, {"name": "Brent", "value": "$114.13", "change": "+0.2%"}], "items": [{"n": 1, "headline": "연준, 10:2로 금리 동결…워시 “필요시 행동”", "summary": "연방공개시장위원회 (FOMC)는 10대 2로 연방기금금리 목표범위를 3.75~4%로 유지하기로 결정했다. 리사 쿡 연준 이사와 베스 해맥 클리블랜드 연은 총재는 25bp 인상을 주장하며 반대표를 던졌다. 워시 연준 의장은 “상황이 요구하는 대로 행동할 준비가 돼 있다”며 필요시 금리를 올릴 가능성을 열어뒀다. 시장에서는 12월 금리 인상 전망이 유지됐지만, 2027년 추가 인상에 대한 베팅은 줄었다."}, {"n": 2, "headline": "美 이란 재공격 가능성에 유가 상승", "summary": "미국이 다음 주 중간선거 이후 이란에 대한 군사 공격을 재개할 가능성이 제기되면서 국제유가 가 상승했다. 월스트리트저널은 미국이 페르시아만의 여러 국가에 단기간의 강도 높은 군사작전에 대비하라고 통보했으며, 트럼프 대통령이 아직 최종 결정을 내리지는 않았지만 선거 이후 대규모 공격을 단행하는 쪽으로 기울고 있다고 보도했다. ING는 “시장이 재확전 가능성을 더 높게 가격에 반영하고 있다”며 미국이 중간선거 이후 어떤 행동에 나설지에 유가가 민감하게 반응할 것으로 내다봤다. 브렌트유는 한때 배럴당 116달러를 넘어섰고 WTI는 103달러를 웃돌았다."}, {"n": 3, "headline": "AI 부채 공급 한계 조짐…핌코는 일찌감치 축소", "summary": "AI 인프라 구축을 위한 부채 발행이 급증하면서 월가 신용시장 의 자금 공급 여력이 한계에 가까워지고 있다는 경고가 나오고 있다. 올해 전 세계 AI 관련 부채 조달은 사상 최대인 4600억달러에 달했고, 데이터센터 관련 채권과 대출 가운데 최소 18건의 금리가 두 자릿수로 치솟았다. 브로드컴과 스페이스X, 오라클 등의 신용부도스와프(CDS) 비용도 급등했다. 향후 수년간 수조달러의 추가 부채가 필요한 상황에서 빅테크가 원하는 자금 규모와 금융권의 공급 능력, 투자자들의 실제 수요 사이의 괴리가 커지고 있다. 은행과 보험사들의 데이터센터 익스포저도 한계에 접근하면서 기존 위험을 다른 투자자에게 넘겨 신규 대출 여력을 확보하기가 갈수록 어려워지고 있다."}, {"n": 4, "headline": "캐나다, 25bp 금리 인상…추가 인상 가능성 시사", "summary": "캐나다 중앙은행 (BOC)이 에너지 가격 상승에 따른 인플레이션 위험에 대응해 기준금리를 25bp 올린 2.5%로 인상했다. 3년여 만의 첫 인상으로, BOC는 높은 에너지 가격이 다른 상품과 서비스 가격으로 광범위하게 번질 위험을 차단하기 위한 조치라고 설명했다. 2027년 소비자물가 상승률 전망을 기존 2.0%에서 3.1%로 대폭 높이고, 물가가 2% 목표로 복귀하는 시점도 2028년 중반으로 예상했다. 추가 금리인상이 필요할 수 있다면서도 불확실성을 감안해 “신중하게 진행하겠다”고 밝혔다."}, {"n": 5, "headline": "파키스탄, 대만 항공사 영공 통과 다시 허용…전격 선회", "summary": "파키스탄 이 대만 항공사들의 자국 영공 통과를 다시 허용하며 중국의 ‘하나의 중국’ 원칙을 이유로 영공 이용을 막았던 조치에서 전격 선회했다. 파키스탄 민간항공청은 중화항공과 에바항공에 28일부터 내년 3월 27일까지 자국 영공을 이용할 수 있도록 허가했다. 불과 몇 시간 전 카와자 아시프 파키스탄 국방장관 겸 항공장관은 “하나의 중국 정책을 따르고 있다”며 중국 항공사에만 영공 통과를 허용한다고 밝힌 바 있다."}]}, "daily": {"headline": "AI credit anxiety", "sections": ["AI’s debt deluge", "Latin stock drought"], "five": ["Alphabet tumbles 10% after sales underwhelmed, reinforcing concerns that Google is losing ground to AI rivals despite pouring hundreds of billions of dollars into the technology.", "Samsung also disappointed and left investors waiting for details of a new plan to return more cash to shareholders. Nasdaq futures sink 1%.", "In what could be an AI mega deal, Marvell is in talks to buy data center optics maker Lumentum . Lumentum, backed by Nvidia, has a market value of $83 billion.", "Christine Lagarde announced she’ll leave the ECB in early 2027, kickstarting the race to replace her.", "Also on the central bank front: the ECB is set to keep interest rates on hold today. While the Fed also held, Kevin Warsh telegraphed the potential for more hikes without explicitly saying it."], "commentary": [{"heading": "AI’s debt deluge", "summary": "A new anxiety is gripping Wall Street as it bankrolls the vast network of data centers and chips behind the AI boom: Early signs suggest the credit market is approaching the limits of how much more debt it can absorb.\n\nOne after another, yields are soaring into the double digits on bonds and loans funding the buildout. Bankers are finding it more difficult to offload risk to insurers and other investors. Elon Musk himself warned the other day that hundreds of so-called neoclouds risk going under as firms get cut off from fresh financing."}, {"heading": "Latin stock drought", "summary": "Two decades into the collapse in Latin American stock markets, Scott Piper likes to joke that investing in the region has become such a lonely job that he’s the last of his breed.\n\nPiper, 58, got his first gig trading the region’s stocks in the mid-1990s, just a few years before a commodities boom would turbocharge the region’s economies and markets. Back then, Wall Street was ginning up new Latin America-dedicated funds seemingly every other day. Their numbers just kept growing, surpassing 660 by 2015.\n\nToday, after scores of mergers, sales and closures, there are just 226 such funds across the globe , according to data compiled by Bloomberg Intelligence.\n\nOne by one, “people have sort of disappeared,” says Piper, who runs about $5 billion for Itau Unibanco’s asset-management unit out of New York."}]}}, "2026-10-28": {"date": "2026-10-28", "morning": {"hook": "네타냐후 열세, 美채권시장 경고", "line": "주요 빅테크 실적 발표와 연준의 금리 결정을 앞두고 뉴욕증시에서 기술주가 랠리를 펼쳤다.", "markets": [{"name": "S&P 500", "value": "7,722.60", "change": "+0.6%"}, {"name": "Nasdaq 100", "value": "29,651.44", "change": "+1.3%"}, {"name": "US 10Y", "value": "5.00%", "change": "+0.01"}, {"name": "USD/KRW", "value": "₩1,327.00", "change": "-0.0%"}, {"name": "Bloomberg Dollar", "value": "1,225.31", "change": "+0.2%"}, {"name": "Brent", "value": "$114.07", "change": "-1.5%"}], "items": [{"n": 1, "headline": "美 의회 교착은 호재? 채권시장 ‘이번엔 다르다’", "summary": "미국 중간선거 이후 의회 교착 가능성이 커지고 있지만 채권 투자자들은 과거처럼 이를 미국채 호재로 받아들이기 어렵다고 보고 있다. 1990년대 중반 이후 백악관과 의회의 권력 구도가 엇갈린 경우 대규모 지출 법안 통과가 어려워지면서 10년물 국채 금리가 대체로 하락했지만, 이번에는 재정적자가 GDP의 약 6%에 달하고 민간 보유 연방정부 부채도 32조달러를 넘어선 상태다. 다이아몬드힐은 지출과 부채를 통제하기 위한 실질적인 정책 조치가 나오지 않는다면 부채가 계속 늘어나는 만큼 “금리가 더 오를 위험이 있다”고 진단했다."}, {"n": 2, "headline": "美 소비심리·기업투자 개선…주택시장은 부진", "summary": "미국의 소비자신뢰 가 고용시장과 기업 여건에 대한 평가 개선에 힘입어 10월 예상 밖으로 반등해 4개월 만에 상승세로 돌아섰다. 컨퍼런스보드 소비자신뢰지수는 전월보다 7.5포인트 오른 91.7로 6월 이후 최고치를 기록해 시장 전망을 모두 웃돌았고, 현재상황지수도 4월 이후 최고 수준으로 올라섰다. 일자리가 풍부하다고 답한 비율은 6개월 만에 최고치를 기록했다. 다만 높은 물가와 금리 상승에 따른 생활비 부담은 여전했다."}, {"n": 3, "headline": "노보그라츠 “신용 불안 정점 근접…AI자금조달 우려 완화”", "summary": "갤럭시디지털의 마이클 노보그라츠 최고경영자(CEO)는 인공지능(AI) 투자 확대를 둘러싼 글로벌 신용시장의 불안이 정점에 가까워졌으며 조만간 완화될 것으로 전망했다. 그는 “신용시장이 소화불량을 겪고 있다”며 “아마 불안감이 정점에 가까워진 것 같다”고 말했다. 최근 코어위브의 정크본드 금리가 부실 위험을 나타내는 수준까지 급등하면서 AI 기업들의 막대한 자금조달 수요가 신용시장을 압박할 수 있다는 우려가 커진 바 있다."}, {"n": 4, "headline": "PE업계, AI 충격에 디폴트 유예 조항 추진", "summary": "사모펀드(PE) 업계가 AI로 인한 사업 차질에 대비해 대출계약에 불가항력과 유사한 조항을 도입하고 있다. AI 충격으로 디폴트가 발생했다고 판단할 경우 채권자의 조치를 일정 기간 유예할 수 있도록 하는 내용으로, 지난 9월 이후 최소 두 건의 차입매수(LBO) 금융에서 이 같은 조항이 등장했다. H.I.G.캐피털은 독일 인프라 엔지니어링·건설 서비스 업체 테라스그룹의 지분 과반 인수를 위한 4억7000만유로 규모 대출에 해당 조항을 포함시켰다."}, {"n": 5, "headline": "이란, 美에 종전 조건 재확인…중동 외교전 분주", "summary": "이란 최고지도자 모즈타바 하메네이가 미국과의 전쟁을 끝내기 위한 기존 조건을 재확인했다. 이란은 평화협상의 전제조건으로 미국이 페르시아만의 이란 항구들에 대한 해상 봉쇄를 해제하고 대이란 제재를 철회해야 한다고 요구해왔다. 반면 미국은 이란의 핵 프로그램에 대한 양보를 요구하고 있다. 하메네이는 국가안보 책임자 모센 레자이와 호르무즈 해협에 대한 통제권을 통한 국가 및 역내 안보 문제도 논의했다. 이란은 에너지 수송의 핵심 통로인 호르무즈 해협에 대한 통제권 유지를 주장하는 반면 미국은 자유로운 통항을 요구하고 있다."}]}, "daily": {"headline": "Microsoft, Alphabet earnings", "sections": ["Seeking a payoff", "Losing buyers"], "five": ["Economists see the Fed holding interest rates steady even after surprisingly hot September inflation. Bond traders have been building up bullish bets , so a hawkish message could trigger a sharp decline.", "Memory-chip maker SK Hynix plans to return $45 billion more to shareholders after profit surged thanks to the AI infrastructure rollout. The stock jumped 11% in Seoul.", "US stock futures struggled for direction as the impact of rising oil prices offset fresh gains in the artificial intelligence trade.", "Global investors’ newfound confidence in UK assets faces a big test today as Prime Minister Andy Burnham’s government delivers its first budget.", "UBS CEO Sergio Ermotti issued an unusually clear threat to relocate the bank as he stepped up his rhetoric over Switzerland’s plans to make it hold billions of dollars in extra capital."], "commentary": [{"heading": "Seeking a payoff", "summary": "SK Hynix’s results show that the companies that make the picks and shovels for AI are raking in cash, with no slowdown in sight. But investors are still worried about the tech giants that are spending all that money on computing power. Will it pay off, and when?\n\nCase in point, Microsoft and Alphabet. The two stocks have gone in different directions since their last earnings reports. As the two prepare to report again after the bell today, recent trading indicates investors give Microsoft an edge .\n\nMicrosoft shares have soared 36% since its earnings on July 29 showed the fastest cloud growth in four years, sparking their best day since 2008. Alphabet, meanwhile, has lost 6.3% since its results on July 22 revealed that its free cash flow turned negative due to a substantial increase in AI spending. Year to date, though, both stocks are underperforming the market."}, {"heading": "Losing buyers", "summary": "Being one of Washington’s closest partners no longer means reliably funding the US deficit.\n\nCountries and regions most aligned with the US bought a net $174.3 billion of Treasuries, excluding bills, in the first eight months of 2026, according to an analysis of Treasury and State Department data . That was the lowest for the period since 2021 and down more than 60% from a year earlier.\n\nThe shift is noteworthy in Asia, where economies running large surpluses are putting less of that money into US debt. Japan, the biggest foreign holder of Treasuries, bought just $389 million in the first eight months — down 99% from a year earlier."}]}}, "2026-10-27": {"date": "2026-10-27", "morning": {"hook": "앤트로픽 IPO, 이란 해법찾기", "line": "뉴욕증시는 26일 앤스로픽의 기업공개(IPO) 신청으로 인공지능(AI) 투자 열기가 되살아나며 상승했다.", "markets": [{"name": "S&P 500", "value": "7,676.77", "change": "+0.7%"}, {"name": "Nasdaq 100", "value": "29,273.40", "change": "+1.1%"}, {"name": "US 10Y", "value": "5.00%", "change": "+0.00"}, {"name": "USD/KRW", "value": "₩1,326.00", "change": "+0.1%"}, {"name": "Bloomberg Dollar", "value": "1,222.39", "change": "+0.0%"}, {"name": "Brent", "value": "$115.47", "change": "-1.1%"}], "items": [{"n": 1, "headline": "앤트로픽 IPO 신청…“AI, 인류에 실존적 위험 초래할 수도”", "summary": "AI 기업 앤트로픽 이 기업공개(IPO)를 신청하면서 자사 기술이 충분한 안전장치와 감독 없이 개발될 경우 인류에 ‘재앙적이거나 실존적인 위험’을 초래할 수 있다고 경고했다. 클로드를 개발한 앤트로픽은 나스닥에 ‘ANT’라는 종목코드로 상장할 계획이며, 골드만삭스와 모간스탠리 등이 IPO를 주관한다. 투자설명서에는 AI가 ‘종료에 저항’하거나 ‘정보를 은폐 또는 조작’하고 인간의 의도와 어긋나거나 자율적으로 행동할 가능성 등이 주요 위험으로 제시됐다."}, {"n": 2, "headline": "메타, AI 투자 위해 최대 950억달러 주식 발행", "summary": "메타플랫폼스 가 AI 개발에 필요한 자금을 마련하기 위해 주식 발행으로 최대 950억달러를 조달할 계획이다. 먼저 약 350억달러 규모의 보통주와 우선주를 발행하고, 시장에서 수시로 주식을 매각하는 ATM 프로그램을 통해 최대 600억달러를 추가 조달한다. 엔비디아와 AMD, 브로드컴은 메타의 보통주를 총 50억달러까지 매입하기로 했다. 조달 자금은 AI 인프라와 ‘개인용 초지능’ 개발에 투입될 예정이다."}, {"n": 3, "headline": "시타델 살라메 “AI의 밀물, 일부 배 침몰시킬 것”", "summary": "시타델 의 파블로 살라메 공동 최고투자책임자(CIO)는 신용시장이 인공지능(AI) 붐에 필요한 막대한 자금 수요를 감당하는 데 한계가 있다며 일부 희생자가 나올 수 있다고 경고했다. 그는 “신용시장이 아직 위험을 넘길 좋은 방법을 찾지 못해 막히고 있다”며 “AI의 밀물은 일부 배를 침몰시킬 것“이라고 말했다. AI 성장이 대규모 설비투자에 의존하는 단계로 접어든 만큼 자금조달 제약으로 투자가 줄어들 경우 주식시장에 반영된 성장 기대도 흔들릴 수 있다는 지적이다."}, {"n": 4, "headline": "이란 재공습 우려 속 중재 외교…사우디 등 테헤란 집결", "summary": "사우디아라비아와 파키스탄, 튀르키예의 고위 안보 당국자들이 26일 테헤란에서 이란 지도부와 만나 긴장 완화와 대화 재개를 모색했다. 미국과 이스라엘의 이란 재공습을 막기 위한 중재 노력의 일환이다. 트럼프 대통령은 미국 중간선거 이후 이란에 대한 폭격을 재개할 수 있음을 거듭 시사해왔다. 전투 재개 우려에 배럴당 117달러를 넘어섰던 브렌트유는 115달러대로 내려왔다."}, {"n": 5, "headline": "호주 대형 연기금, 佛국채 저가매수…“우려 과도”", "summary": "호주 2위 연기금인 ART가 프랑스의 재정 악화와 유럽중앙은행(ECB)의 금리 인상 전망이 시장에 과도하게 반영됐다며 프랑스 국채 를 저가매수하고 있다. 약 3700억호주달러의 자산을 운용하는 ART는 프랑스 10년물 금리가 4.5%를 넘어선 9월부터 매수에 나섰으며, 정치·재정 불안으로 금리가 2002년 이후 최고인 5%까지 치솟은 10월에는 매입 규모를 더욱 늘렸다."}]}, "daily": {"headline": "Anthropic’s IPO", "sections": ["The new AI barometer", "Billions needed"], "five": ["The burst of enthusiasm for AI that followed Anthropic’s IPO filing lost some momentum, with US equity futures stalling as traders turned their attention to earnings and tomorrow’s Fed decision.", "Meta boosted a planned share sale to almost $98 billion, marking one of the largest equity offerings in history.", "Mercedes-Benz cut its profit guidance , joining peers Volkswagen and BMW after sales in China declined.", "HSBC shares fell more than 6% in London after the bank reported disappointing earnings .", "Leaders of Finland and Norway held a phone call with Russian President Vladimir Putin to discuss the prospects for a Ukraine peace deal."], "commentary": [{"heading": "The new AI barometer", "summary": "Investors have spent the past 24 hours pulling apart Anthropic’s 335-page IPO prospectus, dissecting everything from its convoluted corporate governance to its sobering list of risk factors . How the company fares when it prices its shares next month will be closely watched by Wall Street. The company is in a class of one — a giant pure-play bet on the future of frontier AI.\n\nOn the one hand, its public market performance might cement or capsize confidence in AI at a moment when investors are anxious about the borrowing binge underpinning it. But equally, you can make the case that Anthropic will be a reflection of that confidence, that the fate of its listing hangs on investors’ fickle, ever-shifting view of what may be a bubble in the making."}, {"heading": "Billions needed", "summary": "Speaking of AI’s circular investments, here’s what’s been happening:\n\nMeta sold $25 billion of common stock and $12.5 billion of preferred shares, and said it plans to raise as much as $60 billion more. The cash will be used for AI spending.\n\nBroadcom arranged a $63 billion deal with investment firms to finance the purchase of chips for Anthropic.\n\nSpaceX signed a roughly $40 billion equipment-finance lease with Apollo to pay for more chips.\n\nBulls are undeterred by the relentless demand for financing. The AI-driven debt boom is creating some of the most attractive fixed-income opportunities in years , eclipsing the appeal of long-dated US Treasuries, said Rick Rieder, BlackRock’s chief investment officer for global fixed income."}]}}, "2026-10-26": {"date": "2026-10-26", "morning": {"hook": "이란전 분수령, 골드만 코스피↓", "line": "이번 주 이스라엘 선거와 다음 주 미국 중간선거를 전후해 이란 전쟁이 다시 격화될 수 있다는 우려가 일고 있다.", "markets": [{"name": "S&P 500", "value": "7,623.68", "change": "-0.5%"}, {"name": "Nasdaq 100", "value": "28,957.53", "change": "-0.0%"}, {"name": "US 10Y", "value": "4.99%", "change": "+0.04"}, {"name": "USD/KRW", "value": "₩1,323.09", "change": "-0.2%"}, {"name": "Bloomberg Dollar", "value": "1,221.00", "change": "+0.1%"}, {"name": "Brent", "value": "$116.72", "change": "+3.1%"}], "items": [{"n": 1, "headline": "美·이스라엘 선거 후 이란 확전 우려", "summary": "트럼프 대통령은 11월 3일 미국 중간선거 이후 중동 주둔 미군이 이란에 대한 공격 을 재개할 수 있음을 거듭 시사해왔다. 소식통에 따르면 이란은 미국 중간선거를 전후한 새로운 폭격에 대비해 이스라엘과 UAE 등 중동 전역에서 보복을 준비하고 있으며, 선거 이후 새 의회가 내년 1월 출범할 때까지가 가장 어려운 시기가 될 것으로 보고 있다. UAE 정부의 입장에 정통한 소식통도 걸프 지역 일부 당국자들이 무력 충돌 재개 가능성을 매우 높게 보고 있으며, 교전이 재개될 경우 이전보다 상황이 더 악화될 수 있다고 우려하고 있다고 전했다."}, {"n": 2, "headline": "브렌트 한때 117달러 돌파", "summary": "사우디아라비아에 대한 공격이 격화하면서 중동 공급 우려가 커져 브렌트유 가 6개월 만에 최고 수준으로 치솟았다. 브렌트유는 23일 장중 배럴당 117달러를 돌파하며 주간 기준 6% 넘게 올랐고, WTI는 3.8% 상승한 103.27달러에 마감했다. 후티 반군은 사우디 홍해 연안의 얀부항을 공격했다고 주장했으며, 사우디 내 유전과 공항에서도 인명 피해를 낸 공격이 이어졌다."}, {"n": 3, "headline": "골드만, 코스피 목표 25% 하향", "summary": "골드만삭스가 AI 트레이드에 대한 우려가 커지자 코스피 12개월 목표치를 1만2000에서 9000으로 25% 낮췄다. 코스피가 6월 고점 대비 35% 넘게 급락한 데 따라 보다 보수적인 밸류에이션 가정을 반영한 것이다. 다만 골드만은 한국 증시가 크게 저평가됐다며 새 목표치도 현 수준에서 60% 넘는 상승 여력을 시사한다고 밝혔다."}, {"n": 4, "headline": "연준·ECB·BOJ ‘매파적 동결’ 전망", "summary": "이번 주 연준 을 필두로 유럽중앙은행(ECB), 일본은행(BOJ)이 기준금리를 동결하고 향후 추가 인상 가능성을 열어둔 채 상황을 지켜볼 것으로 예상된다. 에너지 가격 급등에서 인공지능(AI) 붐에 이르는 인플레이션 위험에 대응하는 가운데, 이들 중앙은행은 신중한 속도 조절과 함께 매파적 기조를 유지할 가능성이 높다. 지난달 연준은 2023년 이후 처음으로 금리를 인상하면서 올해 추가 인상이 이뤄질 가능성을 시사했다."}, {"n": 5, "headline": "연준 동결 전망 속 ‘인상 경계’...달러 지지", "summary": "이번 주 연준 금리 동결이 지배적인 전망이지만 끈질긴 인플레이션에 따른 추가 긴축 가능성도 주목받고 있다. 머니마켓이 25bp 인상 가능성을 약 10%로 반영하는 가운데 ANZ는 9월 헤드라인 CPI가 3.7%로 높아지는 등 물가 상방 위험이 커졌다며 25bp 인상 가능성이 시장 예상보다 높다고 진단했다. 포워드 가이던스를 피해온 케빈 워시 의장이 인플레이션 대응에 대한 신뢰를 확고히 하기 위해 실제 인상에 나설 수 있다는 분석이다."}]}, "daily": {"headline": "Brazil shock", "sections": ["‘Caught by surprise’"], "five": ["Brazilian markets are heading for a major rout after President Luiz Inácio Lula da Silva pulled off a stunning comeback to defeat Flávio Bolsonaro, the right-wing candidate that many investors preferred.", "Stocks elsewhere started the week on a positive note as oil retreated from a six-month high and investors awaited a busy slate of tech earnings.", "Top security officials from Saudi Arabia, Pakistan and Turkey are meeting Iran’s leaders today in an effort to breathe new life into talks aimed at preventing a broader war in the Middle East.", "Germany’s business outlook unexpectedly brightened for a sixth month in a row, underscoring the economy’s rebound from a prolonged downturn.", "Chinese automakers outsold Japanese rivals in Europe for the first time last quarter, underscoring how quickly brands like BYD and Chery are gaining ground in the region."], "commentary": [{"heading": "‘Caught by surprise’", "summary": "Rarely in recent memory have investors been so wrong-footed by a political event as they were by Sunday’s presidential election in Latin America’s largest economy.\n\nAn ETF tracking Brazilian equities is plunging 27% in US premarket trading , while shares of the country’s banks are tanking too: Banco Bradesco is down 27% and Itau Unibanco is 28% lower. Wealth manager XP is down 39%. Currency derivatives point to a more than 10% plunge in the real.\n\nBolsonaro came in first in the Oct. 4 first round, triggering a rally that drew billions of dollars into the country from foreign investors. They were betting that the right-wing politician would put in place a much-demanded fiscal tightening that would allow for lower interest rates."}]}}}, "weeks": {"2026-11-24": {"start": "2026-11-23", "end": "2026-11-27", "span": ["2026-11-23", "2026-11-24", "2026-11-25", "2026-11-26", "2026-11-27"], "issues": []}, "2026-11-23": {"start": "2026-11-23", "end": "2026-11-27", "span": ["2026-11-23", "2026-11-24", "2026-11-25", "2026-11-26", "2026-11-27"], "issues": []}, "2026-11-20": {"start": "2026-11-16", "end": "2026-11-20", "span": ["2026-11-16", "2026-11-17", "2026-11-18", "2026-11-19", "2026-11-20"], "issues": [{"name": "금리", "days": 5, "mentions": 9, "cells": {"2026-11-16": "연준 ‘추가 인상 필요’…속도 놓고 온도차", "2026-11-17": "연준 해맥 “물가 악화시 빅스텝 가능”", "2026-11-18": "AI 에이전트, 미국채 거래 첫         byMonth.get(key).push(day);

      el.innerHTML = [...byMonth.keys()].sort().reverse().map((key) => {

            </li>
          `).join("")
          : `<p class="empty">이 날은 commentary가 없습니다.</p>`;
        return;
      }
      const sections = (daily && daily.sections) || [];
      const title = daily && daily.headline ? `<li><span class="series">제목</span><span>${esc(daily.headline)}</span></li>` : "";
      dailyEl.innerHTML = daily
        ? title + sections.map((heading) => `<li><span class="series"></span><span>${esc(heading)}</span></li>`).join("")
        : `<p class="empty">이 날은 Markets Daily가 없습니다.</p>`;
    }

    function esc(value) {
      return String(value || "").replace(/[&<>]/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[ch]));
    }

    function renderThemes() {
      const week = DATA.weeks[weekEnd];
      const issues = week.issues || [];
      renderWeekDates();
      themeList.innerHTML = issues.length ? issues.map((issue) => `
        <article class="theme issue" aria-expanded="true">
          <div class="issue-head"><strong>${esc(issue.name)}</strong><span class="count">${issue.mentions}건${issue.metric ? ` · ${esc(issue.metric.name)}` : ""}</span></div>
          <div class="board">
            ${week.span.map((day) => {
              const point = issue.metric && issue.metric.points[day];
              const quote = issue.metric
                ? (point ? `<p class="quote ${tone(point.change)}"><strong>${esc(point.value)}</strong><span>${esc(point.change)}</span></p>` : `<p class="quote"></p>`)
                : "";
              return `<div class="cell"><span class="d">${shortDate(day)}</span><p class="line">${esc(issue.cells[day] || "")}</p>${quote}</div>`;
            }).join("")}
          </div>
          ${issue.hits.length ? `<button type="button" class="expand" aria-expanded="false">펼치기</button>` : ""}
          <ul class="hits">
            ${issue.hits.map((hit) => `<li><span>${shortDate(hit.date)}</span><span class="series">${esc(hit.series)}</span><span>${esc(hit.headline)}</span></li>`).join("")}
          </ul>
        </article>
      `).join("") : `<p class="empty">이 주에는 두 번 이상 나온 주제가 없습니다.</p>`;
    }

    function toggleFold(event) {
      const button = event.target.closest(".fold");
      if (!button) return;
      const open = button.getAttribute("aria-expanded") === "true";
      button.setAttribute("aria-expanded", open ? "false" : "true");
    }
    morningEl.addEventListener("click", toggleFold);
    commentaryEl.addEventListener("click", toggleFold);

    datesEl.addEventListener("click", (event) => {
      const button = event.target.closest("button[data-date]");
      if (!button) return;
      selected = button.dataset.date;
      renderDates();
      renderDay();
    });
    weekDatesEl.addEventListener("click", (event) => {
      const button = event.target.closest("button[data-date]");
      if (!button || !DATA.weeks[button.dataset.date]) return;
      const chosen = DATA.weeks[button.dataset.date].end;
      if (DATA.week && chosen > DATA.week) return;
      weekEnd = chosen;
      renderThemes();
    });

    document.querySelector("#tab-day").addEventListener("click", () => {
      viewDay.hidden = false;
      viewThemes.hidden = true;
      document.querySelector("#tab-day").setAttribute("aria-selected", "true");
      document.querySelector("#tab-themes").setAttribute("aria-selected", "false");
      document.querySelector("h1").textContent = "Day";
    });
    document.querySelector("#tab-themes").addEventListener("click", () => {
      viewDay.hidden = true;
      viewThemes.hidden = false;
      document.querySelector("#tab-day").setAttribute("aria-selected", "false");
      document.querySelector("#tab-themes").setAttribute("aria-selected", "true");
      document.querySelector("h1").textContent = "Weekly";
      renderThemes();
    });
    themeList.addEventListener("click", (event) => {
      const expand = event.target.closest(".expand");
      if (expand) {
        const open = expand.getAttribute("aria-expanded") === "true";
        expand.setAttribute("aria-expanded", open ? "false" : "true");
        expand.textContent = open ? "펼치기" : "접기";
        return;
      }
      const head = event.target.closest(".theme-head");
      if (!head) return;
      const theme = head.closest(".theme");
      const open = theme.getAttribute("aria-expanded") === "true";
      theme.setAttribute("aria-expanded", open ? "false" : "true");
      const list = theme.querySelector(".expand");
      if (open && list) {
        list.setAttribute("aria-expanded", "false");
        list.textContent = "펼치기";
      }
    });

    renderDates();
    renderDay();
    renderThemes();
    if (location.hash === "#weekly") document.querySelector("#tab-themes").click();
  </script>
</body>
</html>
